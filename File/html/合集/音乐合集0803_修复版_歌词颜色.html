/* ============================================================
   § 7. 详情页（歌单 / 排行榜） + 歌曲列表渲染
   ============================================================ */
function renderDetail(params){
  var v = $("#view-detail");
  v.innerHTML = '<div class="skeleton" style="height:180px;border-radius:24px;margin-top:16px"></div>';
  function paint(res){
    var info = res.info || {};
    var cover = info.cover || info.frontPicUrl || params.cover || "";
    var title = info.title || info.topTitle || params.title || "";
    var songs = res.songs || [];
    v.innerHTML =
      '<div class="sec-head" style="margin-top:8px;align-items:center">'+
        '<button type="button" id="detailBackBtn" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px;font-weight:500">‹ 返回</button>'+
      '</div>'+
      '<div class="detail-header">'+
      '<div class="detail-cover">'+safeImg(cover)+'</div>'+
      '<div class="detail-meta">'+
        '<div class="detail-title">'+esc(title)+'</div>'+
        '<div class="detail-sub">'+esc(info.creator||"")+(info.playCount?(' · '+fmtCount(info.playCount)+'次播放'):'')+' · 共'+songs.length+'首</div>'+
        (info.desc?'<div class="detail-desc">'+esc(info.desc)+'</div>':'')+
      '</div>'+
      '<button class="hero-play detail-play-all" id="playAllDetail"><svg><use href="#i-play"/></svg>播放</button></div>'+
      '<div class="song-list" id="detailSongs" style="margin-top:8px"></div>';
    renderSongList($("#detailSongs"), songs);
    $("#playAllDetail").onclick = function(){ playQueue(songs, 0); };
    var db = $("#detailBackBtn");
    if (db) db.onclick = function(){ handleBack(); };
  }
  // 专辑：优先用预载歌曲，否则按 albumMid 拉取
  if (params.type === "album"){
    if (params.songs && params.songs.length){
      paint({ info: { title: params.title || "", cover: params.cover || coverUrl(params.id) }, songs: params.songs });
      return;
    }
    API.albumSongs(params.id).then(function(res){
      paint({ info: { title: params.title || "", cover: (res.info && res.info.cover) || coverUrl(params.id) }, songs: res.songs || [] });
    }).catch(function(){ paint({ info:{}, songs:[] }); });
    return;
  }
  // 非 QQ 音源歌手页：按歌手名在对应源搜索歌曲
  if (params.type === "artist"){
    var aname = params.title || params.name || params.id || "";
    var asource = params.source || state.source || "qq";
    if (params.songs && params.songs.length){
      paint({ info: { title: aname, cover: params.cover || "", creator: ({kugou:"酷狗",kuwo:"酷我",netease:"网易",ytmusic:"YTM",qq:"QQ"}[asource]||asource)+" · 歌手" }, songs: params.songs });
      return;
    }
    var searchFn = asource === "kuwo" ? API.kuwoSearch
      : asource === "ytmusic" ? API.ytmusicSearch
      : null;
    function afterSearch(res){
      var list = (res && res.list) || [];
      var cover = params.cover || "";
      if (!cover && res && res.singers && res.singers[0] && res.singers[0].cover) cover = res.singers[0].cover;
      if (!cover && list[0] && list[0].cover) cover = list[0].cover;
      // 歌手名匹配优先
      list = list.slice().sort(function(a,b){
        var sa = (a.singer && aname && a.singer.indexOf(aname) >= 0) ? 1 : 0;
        var sb = (b.singer && aname && b.singer.indexOf(aname) >= 0) ? 1 : 0;
        return sb - sa;
      });
      paint({ info: { title: aname, cover: cover, creator: ({kugou:"酷狗",kuwo:"酷我",netease:"网易",ytmusic:"YTM",qq:"QQ"}[asource]||asource)+" · 歌手" }, songs: list });
    }
    if (searchFn){
      searchFn(aname, 1).then(afterSearch).catch(function(){ paint({ info: { title: aname }, songs: [] }); });
    } else {
      API.search(aname, 1).then(afterSearch).catch(function(){ paint({ info: { title: aname }, songs: [] }); });
    }
    return;
  }
  // 排行榜：一次拉完；歌单：分页 + 滚动加载更多
  if (params.type === "toplist"){
    API.toplistDetail(params.id).then(paint).catch(function(){ paint({ info:{}, songs:[] }); });
    return;
  }

  // ---- 歌单详情分页 ----
  var PAGE = 50;
  var detailState = {
    songs: [],
    page: 0,
    hasMore: true,
    loading: false,
    info: {},
    cdAll: null, // cdlist 全量缓存
    dissid: params.id
  };
  // 挂到全局，避免滚动监听闭包指向旧歌单
  window._qqmDetailState = detailState;
  function paintDetail(){
    var info = detailState.info || {};
    var cover = info.cover || params.cover || "";
    var title = info.title || params.title || "";
    var songs = detailState.songs;
    var totalShow = info.songCount || songs.length;
    v.innerHTML =
      '<div class="sec-head" style="margin-top:8px;align-items:center">'+
        '<button type="button" id="detailBackBtn" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px;font-weight:500">‹ 返回</button>'+
      '</div>'+
      '<div class="detail-header">'+
      '<div class="detail-cover">'+safeImg(cover)+'</div>'+
      '<div class="detail-meta">'+
        '<div class="detail-title">'+esc(title)+'</div>'+
        '<div class="detail-sub" id="detailSub">'+esc(info.creator||"")+(info.playCount?(' · '+fmtCount(info.playCount)+'次播放'):'')+' · 共'+totalShow+'首</div>'+
        (info.desc?'<div class="detail-desc">'+esc(info.desc)+'</div>':'')+
      '</div>'+
      '<button class="hero-play detail-play-all" id="playAllDetail"><svg><use href="#i-play"/></svg>播放</button></div>'+
      '<div class="song-list" id="detailSongs" style="margin-top:8px"></div>'+
      '<div id="detailLoadMore" style="text-align:center;padding:16px 0 8px;font-size:12px;color:var(--text-2)">'+(detailState.hasMore?"上拉加载更多":"")+'</div>';
    renderSongList($("#detailSongs"), songs);
    $("#playAllDetail").onclick = function(){ playQueue(detailState.songs, 0); };
    var db = $("#detailBackBtn");
    if (db) db.onclick = function(){ handleBack(); };
    bindDetailScroll();
  }
  function appendDetailSongs(more){
    if (!more || !more.length) return;
    var wrap = $("#detailSongs");
    if (!wrap) return;
    var start = detailState.songs.length - more.length;
    var html = more.map(function(s, j){
      var i = start + j;
      var isCur = state.queue[state.queueIndex] && state.queue[state.queueIndex].songmid === s.songmid;
      return '<div class="song-row'+(isCur?" playing":"")+'" data-i="'+i+'">'+
        '<div class="song-idx">'+(isCur?'<svg style="width:13px;height:13px;color:var(--green)"><use href="#i-play"/></svg>':(i+1))+'</div>'+
        '<div class="song-meta"><div class="song-title">'+esc(s.name)+(s.isVip?'<span class="tag-vip">VIP</span>':'')+'</div>'+
        '<div class="song-sub">'+esc(s.singer)+(s.albumname?(' - '+esc(s.albumname)):'')+'</div></div>'+
        '<div class="song-dur">'+fmtTime(s.interval)+'</div></div>';
    }).join("");
    wrap.insertAdjacentHTML("beforeend", html);
    // 重新绑定整表点击（用最新 songs）
    $all(".song-row", wrap).forEach(function(row){
      row.onclick = function(){
        var i = +row.dataset.i;
        playQueue(detailState.songs, i);
      };
    });
    var tip = $("#detailLoadMore");
    if (tip) tip.textContent = detailState.hasMore ? "上拉加载更多" : "已加载全部 "+detailState.songs.length+" 首";
    var sub = $("#detailSub");
    if (sub && detailState.info){
      var info = detailState.info;
      var totalShow = info.songCount || detailState.songs.length;
      sub.textContent = (info.creator||"")+(info.playCount?(' · '+fmtCount(info.playCount)+'次播放'):'')+' · 已加载'+detailState.songs.length+'/'+totalShow+'首';
    }
  }
  function loadDetailPage(isFirst){
    if (detailState.loading) return Promise.resolve();
    if (!isFirst && !detailState.hasMore) return Promise.resolve();
    detailState.loading = true;
    var tip = $("#detailLoadMore");
    if (tip && !isFirst) tip.textContent = "加载中…";

    // 若首页 cdlist 已给全量，后续本地切片
    if (!isFirst && detailState.cdAll && detailState.cdAll.length){
      var start = detailState.page * PAGE;
      var slice = detailState.cdAll.slice(start, start + PAGE);
      detailState.songs = detailState.songs.concat(slice);
      detailState.page++;
      detailState.hasMore = start + slice.length < detailState.cdAll.length;
      detailState.loading = false;
      appendDetailSongs(slice);
      return Promise.resolve();
    }

    return API.playlistDetail(detailState.dissid, detailState.page, PAGE).then(function(res){
      detailState.loading = false;
      if (!res) res = { songs: [], info: {}, hasMore: false };
      if (isFirst){
        detailState.info = res.info || {};
        detailState.songs = res.songs || [];
        detailState.cdAll = res._cdAll || null;
        detailState.hasMore = !!res.hasMore || !!(detailState.cdAll && detailState.cdAll.length > detailState.songs.length);
        detailState.page = 1;
        paintDetail();
        // 若首页已用 cdAll 切了第一页，标记
        if (detailState.cdAll && detailState.cdAll.length > detailState.songs.length){
          detailState.hasMore = true;
        }
        var tip2 = $("#detailLoadMore");
        if (tip2) tip2.textContent = detailState.hasMore ? "上拉加载更多" : (detailState.songs.length ? "已加载全部" : "");
      } else {
        var more = res.songs || [];
        // 去重
        var seen = {};
        detailState.songs.forEach(function(x){ if (x.songmid) seen[x.songmid]=1; });
        more = more.filter(function(x){ return x.songmid && !seen[x.songmid]; });
        detailState.songs = detailState.songs.concat(more);
        detailState.page++;
        detailState.hasMore = !!res.hasMore && more.length > 0;
        if (res.info && res.info.songCount) detailState.info.songCount = res.info.songCount;
        appendDetailSongs(more);
        if (!more.length) detailState.hasMore = false;
      }
    }).catch(function(){
      detailState.loading = false;
      if (isFirst) paint({ info:{}, songs:[] });
      else {
        var tip3 = $("#detailLoadMore");
        if (tip3) tip3.textContent = "加载失败，上拉重试";
        detailState.hasMore = true;
      }
    });
  }
  function bindDetailScroll(){
    var scroller = v; // .view 自身可滚动
    if (!scroller) return;
    if (scroller._detailScrollBound) return;
    scroller._detailScrollBound = true;
    scroller.addEventListener("scroll", function(){
      if (state.view !== "detail") return;
      var st = window._qqmDetailState;
      if (!st || st.loading || !st.hasMore) return;
      var remain = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight;
      if (remain < 160){
        // 触发当前详情的加载（通过全局状态识别 dissid 一致时由闭包 loadDetailPage 处理）
        try { scroller._qqmLoadMore && scroller._qqmLoadMore(); } catch(e) {}
      }
    }, { passive: true });
  }
  v._qqmLoadMore = function(){ loadDetailPage(false); };
  loadDetailPage(true);
}

/** 收藏项统一取 songmid */
function favMidOf(item){
  if (!item) return "";
  if (typeof item === "string") return item;
  return item.songmid || item.mid || "";
}
function isFavorite(mid){
  if (!mid) return false;
  for (var i=0;i<state.favorites.length;i++){
    if (favMidOf(state.favorites[i]) === mid) return true;
  }
  return false;
}
function favIndexOf(mid){
  if (!mid) return -1;
  for (var i=0;i<state.favorites.length;i++){
    if (favMidOf(state.favorites[i]) === mid) return i;
  }
  return -1;
}
/** 从完整 song 抽可持久化字段 */
function slimSong(song){
  if (!song) return null;
  var mid = song.songmid || song.mid || "";
  if (!mid) return null;
  return {
    songmid: mid,
    media_mid: song.media_mid || song.strMediaMid || song.mediaMid || "",
    name: song.name || song.title || mid,
    singer: song.singer || "",
    albummid: song.albummid || song.album_mid || "",
    albumname: song.albumname || "",
    cover: song.cover || "",
    interval: song.interval || 0,
    source: song.source || "qq",
    isVip: !!song.isVip,
    isSQ: !!song.isSQ,
    rid: song.rid || "",
    neteaseId: song.neteaseId || "",
    videoId: song.videoId || "",
    hash: song.hash || ""
  };
}
/** 解析收藏列表为可播放 song 对象（旧版纯 mid 会先占位再补全） */
function resolveFavoriteSongs(){
  return (state.favorites || []).map(function(item){
    if (typeof item === "string"){
      return { songmid: item, name: item, singer: "", interval: 0, source: "qq", _needHydrate: true };
    }
    var s = slimSong(item) || { songmid: favMidOf(item), name: favMidOf(item), singer: "", interval: 0 };
    if (!s.name || s.name === s.songmid) s._needHydrate = true;
    return s;
  });
}
/** 用 QQ 接口补全歌名/歌手（仅 qq 源 mid） */
API.hydrateSongs = function(songs){
  var list = (songs || []).filter(function(s){
    return s && s.songmid && (!s.source || s.source === "qq") &&
      (s._needHydrate || !s.name || s.name === s.songmid || !s.singer);
  });
  if (!list.length) return Promise.resolve(songs || []);
  var mids = [];
  var seen = {};
  list.forEach(function(s){
    if (!seen[s.songmid]){ seen[s.songmid] = 1; mids.push(s.songmid); }
  });
  mids = mids.slice(0, 40);
  // 逐首 get_song_detail_yqq（兼容性最好）
  var chain = Promise.resolve({});
  var byMid = {};
  mids.forEach(function(mid){
    chain = chain.then(function(){
      var body = JSON.stringify({
        comm: { ct: 24, cv: 0, uin: String((state.user && state.user.uin) || "0") },
        songinfo: {
          module: "music.pf_song_detail_svr",
          method: "get_song_detail_yqq",
          param: { song_mid: mid }
        }
      });
      return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
        method: "POST",
        headers: withCookie({ "Content-Type": "application/json", "Referer": "https://y.qq.com/" }),
        body: body
      }).then(function(txt){
        var d = jsonp_safeParse(txt);
        var info = d && d.songinfo && d.songinfo.data && (d.songinfo.data.track_info || d.songinfo.data);
        if (!info) return;
        var n = null;
        try { n = normalizeSongFromSearch(info); } catch(eN) {}
        if (!n || !n.songmid){
          var name = info.name || info.title || "";
          var singers = info.singer || [];
          var singer = Array.isArray(singers) ? singers.map(function(a){ return a.name || ""; }).filter(Boolean).join("/") : (info.singer_name || "");
          var amid = (info.album && (info.album.mid || info.album.pmid)) || info.albummid || "";
          var mediaMid = (info.file && (info.file.media_mid || info.file.mediaMid)) || info.media_mid || mid;
          n = {
            songmid: info.mid || info.songmid || mid,
            media_mid: mediaMid,
            name: name || mid,
            singer: singer,
            albummid: amid,
            albumname: (info.album && info.album.name) || "",
            cover: "",
            interval: info.interval || 0,
            source: "qq"
          };
        }
        n.source = "qq";
        byMid[mid] = n;
        byMid[n.songmid] = n;
      }).catch(function(){});
    });
  });
  return chain.then(function(){
    var changed = false;
    (songs || []).forEach(function(s){
      var info = byMid[s.songmid];
      if (!info) return;
      s.name = info.name || s.name;
      s.singer = info.singer || s.singer;
      s.albummid = info.albummid || s.albummid;
      s.media_mid = info.media_mid || s.media_mid;
      s.interval = info.interval || s.interval;
      s.cover = info.cover || s.cover;
      s.albumname = info.albumname || s.albumname;
      s.source = s.source || "qq";
      delete s._needHydrate;
      var idx = favIndexOf(s.songmid);
      if (idx > -1){
        state.favorites[idx] = slimSong(s);
        changed = true;
      }
    });
    if (changed) storeSet("favorites", state.favorites);
    return songs;
  }).catch(function(){ return songs || []; });
};

function toggleFavorite(song){
  if (!song || !song.songmid) return;
  var i = favIndexOf(song.songmid);
  if (i > -1){
    state.favorites.splice(i, 1);
    toast("已取消收藏");
  } else {
    var slim = slimSong(song);
    if (slim) state.favorites.push(slim);
    toast("已收藏");
  }
  storeSet("favorites", state.favorites);
  syncLikeButtons();
}
function syncLikeButtons(){
  var cur = state.queue[state.queueIndex];
  var on = cur && isFavorite(cur.songmid);
  var icon = on ? "#i-heart-fill" : "#i-heart";
  ["#pbLike", "#fpLike"].forEach(function(sel){
    var btn = $(sel);
    if (!btn) return;
    btn.classList.toggle("on", !!on);
    var use = btn.querySelector("use");
    if (use) use.setAttribute("href", icon);
  });
}

var searchTimer = null;
var _searchSeq = 0;

function unlockAllSources(silent){
  if (state.sourceUnlocked) return;

  storeSet("sourceUnlocked", true);
}
function setMusicSource(src){
  if (!state.sourceUnlocked && src !== "qq") return;
  // 酷狗 / 网易已下线（公共洛雪 kg/wy 不可用）
  if (src === "kugou" || src === "netease" || src === "qishui") src = "qq";

  var allowed = { qq:1, kuwo:1, ytmusic:1 };
  state.source = allowed[src] ? src : "qq";
  storeSet("musicSource", state.source);
  try {
    if (state.source === "kuwo") applyTheme("kuwo", true);
    else if (state.source === "ytmusic") applyTheme("ytmusic", true);
    else if (state.source === "qq") applyTheme("qq", true);
  } catch(e) {}
  var si = $("#searchInput");
  if (si){
    si.placeholder = ({
      kuwo: "酷我：搜索歌曲 / 歌手",
      ytmusic: "YTM：歌名 / 歌手",
      qq: "搜索歌曲 / 歌手 / 歌单"
    })[state.source] || "搜索歌曲 / 歌手 / 歌单";
  }
}
function renderSourceSwitch(){
  if (!state.sourceUnlocked) return "";
  var src = state.source || "qq";
  var tabs = [
    ["qq","QQ"],
    ["kuwo","酷我"],
    ["ytmusic","YTM"]
  ];
  return '<div class="sr-tabs" id="sourceTabs">'+
    tabs.map(function(t){
      return '<div class="sr-tab'+(src===t[0]?" active":"")+'" data-src="'+t[0]+'">'+t[1]+'</div>';
    }).join("")+
  '</div>';
}
function bindSourceTabs(root){
  $all("#sourceTabs .sr-tab", root || document).forEach(function(t){
    t.onclick = function(){
      setMusicSource(t.dataset.src);
      $all("#sourceTabs .sr-tab").forEach(function(x){ x.classList.toggle("active", x.dataset.src === state.source); });
      if (state.view === "search"){
        var kw = ($("#searchInput") && $("#searchInput").value.trim()) || (state.viewParams && state.viewParams.kw) || "";

/* ---- WebAudio 真实频谱 + 播放同步模拟兜底 ----
   设计目标：既要有声音，又要频谱随音乐跳动。
   - createMediaElementSource 一旦创建不可撤销，且部分 WebView 会抢走扬声器输出；
     因此默认「尝试」建图，失败或判定静音数据时改用时间驱动的模拟频谱（不影响出声）。
   - 模拟频谱按 audio.currentTime 多频段合成，播放中持续跳动，暂停时回落。
*/
var _audioCtx = null, _analyser = null, _freqData = null, _vizRaf = 0, _vizLive = false;
var _mediaSourceNode = null;
var _audioGraphTried = false;
var _audioGraphOk = false;       // 成功建图且能读到非全零数据
var _audioGraphMutedOut = false; // 建图后疑似无扬声器输出（保留标记，避免反复折腾）
var _simFreq = null;
var _zeroBinStreak = 0;

function ensureAudioGraph(){
  /* 不创建 MediaElementSource：
     一旦创建不可撤销，fongmi/部分 Android WebView 会抢走 <audio> 扬声器输出导致静音。
     频谱由 fillSimulatedFreq 按 currentTime 驱动，保证「有声 + 会跳」。 */
  try { if (_audioCtx && _audioCtx.state === "suspended") _audioCtx.resume(); } catch(e0){}
  if (!_simFreq) _simFreq = new Uint8Array(128);
  _audioGraphTried = true;
  _audioGraphOk = false;
  _vizLive = false;
  return false;
}

function resumeAudioCtx(){
  try {
    if (_audioCtx && _audioCtx.state === "suspended") _audioCtx.resume();
  } catch(e) {}
}

/** 多频段时间驱动模拟频谱：播放中随 currentTime 跳动，不依赖 WebAudio */
function fillSimulatedFreq(out, t, playing){
  if (!out || !out.length) return 0;
  var n = out.length;
  if (!playing){
    for (var z = 0; z < n; z++) out[z] = Math.max(0, (out[z] || 0) * 0.82);
    return 0;
  }
  // 节拍感：约 2.1Hz 底鼓 + 多层谐波，低频更强
  var kick = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2.15)), 10);
  var hat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 8.4 + 0.4)), 4);
  var sum = 0;
  for (var i = 0; i < n; i++){
    var band = i / n;
    var bass = 0.55 + 0.45 * Math.sin(t * 3.7 + band * 1.8);
    var mid = 0.5 + 0.5 * Math.sin(t * 6.9 + band * 4.6 + 1.2);
    var high = 0.45 + 0.55 * Math.sin(t * 12.5 + band * 9.1 + 0.6);
    var flutter = 0.5 + 0.5 * Math.sin(t * 21 + i * 0.73);
    var energy = (1 - band * 0.62) * (0.22 + bass * 0.42 + mid * 0.28 + high * 0.14);
    energy += kick * (1 - band) * 0.55;
    energy += hat * band * 0.22;
    energy *= 0.75 + flutter * 0.35;
    energy = Math.max(0.04, Math.min(1, energy));
    var v = (energy * 255) | 0;
    out[i] = v;
    sum += v;
  }
  return sum / (n * 255);
}

var _vizAvgSmooth = 0.18;
var _vizFakeState = null;

function updateFpVisualizer(){
  var art = $("#fpArt");
  if (!art) return;
  var style = art.getAttribute("data-style") || "vinyl";
  var need = (style === "spectrum" || style === "wave" || style === "pulse" || style === "ring");
  if (!need) return;

  var playing = !!(audio && !audio.paused);
  var live = false;
  var avg = 0.18;
  var data = null;
  var len = 0;

  if (_analyser && _freqData && playing){
    try {
      _analyser.getByteFrequencyData(_freqData);
      var sum = 0, n = _freqData.length, nonZero = 0;
      for (var i = 0; i < n; i++){
        sum += _freqData[i];
        if (_freqData[i] > 2) nonZero++;
      }
      avg = sum / (n * 255);
      // 连续全零：跨域/静音数据 → 用模拟；偶发有数据则认真实
      if (nonZero > 4 && avg > 0.01){
        live = true;
        _audioGraphOk = true;
        _zeroBinStreak = 0;
        data = _freqData;
        len = n;
      } else {
        _zeroBinStreak++;
        // 播放中连续约 45 帧全零，判定 analyser 读不到有效 PCM
        if (_zeroBinStreak > 45) _audioGraphOk = false;
      }
    } catch(e) { live = false; }
  }

  if (!live){
    if (!_simFreq) _simFreq = new Uint8Array(128);
    var t = 0;
    try { t = audio && isFinite(audio.currentTime) ? audio.currentTime : (Date.now() / 1000); } catch(eT){ t = Date.now() / 1000; }
    avg = fillSimulatedFreq(_simFreq, t, playing);
    data = _simFreq;
    len = _simFreq.length;
  }

  // 平滑能量，避免柱子/光环抖闪
  _vizAvgSmooth = _vizAvgSmooth * 0.82 + avg * 0.18;
  avg = _vizAvgSmooth;
  if (_vizFakeState !== !live){
    _vizFakeState = !live;
    art.classList.toggle("is-fake", !live);
  }
  if (!data || !len) return;

  if (style === "spectrum"){
    var bars = art.querySelectorAll("#fpSpectrum i");
    var bn = bars.length;
    if (!bn) return;
    // 环形声波：对称镜像 + 平滑邻域
    var levels = [];
    var half = Math.max(1, Math.floor(bn / 2));
    for (var j = 0; j < bn; j++){
      var idx = Math.min(len - 1, Math.floor((j % half) / half * len * 0.55) + 1);
      levels[j] = data[idx] / 255;
    }
    for (var p = 0; p < 2; p++){
      var next = levels.slice();
      for (var j2 = 0; j2 < bn; j2++){
        var a = levels[(j2 - 1 + bn) % bn], b = levels[j2], c = levels[(j2 + 1) % bn];
        next[j2] = a * 0.2 + b * 0.6 + c * 0.2;
      }
      levels = next;
    }
    var peak = 0;
    for (var j3 = 0; j3 < bn; j3++){
      var v = levels[j3];
      if (v > peak) peak = v;
      var scale = playing ? (0.22 + v * 1.65) : 0.12;
      bars[j3].style.transform = "var(--tr) scaleY(" + scale.toFixed(3) + ")";
      bars[j3].style.opacity = String(playing ? (0.35 + v * 0.65) : 0.2);
    }
    var glow = $("#fpSpectrumGlow");
    if (glow){
      var g = 1 + peak * 0.08;
      glow.style.transform = "scale(" + g.toFixed(3) + ")";
      glow.style.opacity = String(playing ? (0.35 + peak * 0.5) : 0.15);
    }
  } else if (style === "wave"){
    // 粒子扩散：从封面【外缘】向外扩散（edgeR≈封面半径，避免被封面挡住）
    ensureFpArtDecor();
    var waveEl = $("#fpWave");
    var pool = waveEl && waveEl._particlePool;
    if (!pool) return;
    var stageEl = art.querySelector(".fp-art-stage");
    var half = stageEl && stageEl.offsetWidth ? stageEl.offsetWidth / 2 : 130;
    // 关键点必须在圆形封面外侧，否则会被封面盖住看不见
    var edgeR = half * 1.02;
    if (playing){
      _waveSpawnAcc += 4.5 + avg * 10;
      var burst = Math.min(16, Math.floor(_waveSpawnAcc));
      _waveSpawnAcc -= burst;
      for (var bi = 0; bi < burst; bi++){
        for (var pi = 0; pi < pool.length; pi++){
          if (pool[pi].active) continue;
          var p = pool[pi];
          p.active = true;
          p.ang = Math.random() * Math.PI * 2;
          var near = Math.random() < 0.65;
          // 贴边 / 略外一圈，全部在封面外
          p.r = edgeR * (near ? (1.0 + Math.random() * 0.04) : (1.06 + Math.random() * 0.12));
          if (near){
            p.vr = 0.25 + avg * 0.9 + Math.random() * 0.5;
            p.maxLife = 36 + Math.random() * 44;
            p.size = 0.9 + Math.random() * 1.1 + avg * 0.5;
          } else {
            p.vr = 0.7 + avg * 2.2 + Math.random() * 1.2;
            p.maxLife = 28 + Math.random() * 36 + avg * 14;
            p.size = 0.7 + Math.random() * 0.9 + avg * 0.4;
          }
          p.life = 0;
          break;
        }
      }
    } else {
      _waveSpawnAcc += 0.8;
      if (_waveSpawnAcc >= 1){
        _waveSpawnAcc -= 1;
        for (var pi2 = 0; pi2 < pool.length; pi2++){
          if (pool[pi2].active) continue;
          var p2 = pool[pi2];
          p2.active = true;
          p2.ang = Math.random() * Math.PI * 2;
          p2.r = edgeR * (1.0 + Math.random() * 0.05);
          p2.vr = 0.15 + Math.random() * 0.25;
          p2.maxLife = 45 + Math.random() * 40;
          p2.size = 0.8 + Math.random() * 1.0;
          p2.life = 0;
          break;
        }
      }
    }
    for (var wi = 0; wi < pool.length; wi++){
      var wp = pool[wi];
      if (!wp.active){
        if (wp.el.style.opacity !== "0") wp.el.style.opacity = "0";
        continue;
      }
      wp.life++;
      wp.r += wp.vr;
      wp.vr *= 0.99;
      var wt = wp.life / wp.maxLife;
      if (wt >= 1 || wp.r > half * 1.55){
        wp.active = false;
        wp.el.style.opacity = "0";
        continue;
      }
      var radial = 1 - Math.max(0, (wp.r - edgeR) / (half * 0.6));
      var wop = (wt < 0.08 ? (wt / 0.08) : (1 - (wt - 0.08) / 0.92));
      // 提高可见度：最低也要能看清
      wop *= (0.5 + radial * 0.5) * (playing ? (0.7 + avg * 0.3) : 0.45);
      var wx = Math.cos(wp.ang) * wp.r;
      var wy = Math.sin(wp.ang) * wp.r;
      var wsc = wp.size * (1 - wt * 0.35);
      wp.el.style.opacity = String(Math.max(0, Math.min(1, wop)).toFixed(3));
      wp.el.style.transform = "translate(" + wx.toFixed(1) + "px," + wy.toFixed(1) + "px) scale(" + Math.max(0.25, wsc).toFixed(2) + ")";
    }
  } else if (style === "pulse"){
    var rings = art.querySelectorAll(".fp-pulse-ring");
    var sc = 0.92 + avg * 0.22;
    for (var r = 0; r < rings.length; r++){
      rings[r].style.transform = "scale(" + (sc + r * 0.04).toFixed(3) + ")";
      rings[r].style.opacity = String(Math.max(0.12, (playing ? 0.55 : 0.2) - avg * 0.2 - r * 0.1));
    }
  } else if (style === "ring"){
    // 光环交给纯 CSS 动画，避免每帧改 style 触发闪烁
  }
}

/** 与 loadCurrent 同源解析逻辑，供预取下一首直链（息屏/后台切歌关键） */
function resolvePlayUrlForSong(s){
  if (!s) return Promise.resolve(null);
  if (s.playUrl) return Promise.resolve(s.playUrl);
  if (s.source === "kuwo"){
    return API.kuwoUrl(s).catch(function(){ return null; })
      .then(function(url){ return url || API.lxUrlMulti(s); })
      .then(function(url){ return url || API.fallbackViaQQ(s); });
  }
  if (s.source === "netease"){
    return API.neteaseUrl(s).then(function(url){ return url || null; }).catch(function(){ return null; })
      .then(function(url){ return url || API.lxUrlMulti(s); })
      .then(function(url){ return url || API.fallbackViaQQ(s); });
  }
  if (s.source === "kugou"){
    return API.kugouUrl(s).catch(function(){ return null; })
      .then(function(url){ return url || API.lxUrlMulti(s); })
      .then(function(url){ return url || API.fallbackViaQQ(s); });
  }
  if (s.source === "ytmusic"){
    return API.ytmusicUrl(s).catch(function(){ return null; })
      .then(function(url){
        if (url) return url;
        var clean = API.ytCleanTitle(s);
        var singer = ((s.singer || "").split(/[\/、,&]/)[0] || "").replace(/Joker\s*Xue/ig, "").trim();
        var proxy = { name: clean || s.name, singer: singer || s.singer || "", source: "qq" };
        return Promise.all([
          API.fallbackViaQQ(proxy).catch(function(){ return null; }),
          API.lxUrlMulti(proxy).catch(function(){ return null; })
        ]).then(function(arr){ return arr[0] || arr[1] || null; });
      });
  }
  return API.songUrl(s);
}

function peekNextQueueIndex(){
  if (!state.queue.length) return -1;
  if (state.playMode === "single") return state.queueIndex;
  if (state.playMode === "shuffle"){
    if (state.queue.length === 1) return 0;
    var n = Math.floor(Math.random() * state.queue.length);
    if (n === state.queueIndex) n = (n + 1) % state.queue.length;
    return n;
  }
  return (state.queueIndex + 1) % state.queue.length;
}

/** 当前曲开播后预取下一首 playUrl，避免息屏时才去拉链导致无法连播 */
var _prefetchGen = 0;
function prefetchNextPlayUrl(){
  var idx = peekNextQueueIndex();
  if (idx < 0) return;
  var s = state.queue[idx];
  if (!s || s.playUrl) return;
  var gen = ++_prefetchGen;
  var songmid = s.songmid;
  resolvePlayUrlForSong(s).then(function(url){
    if (gen !== _prefetchGen) return;
    if (!url) return;
    // 队列项可能被替换，按 songmid 回写
    var t = state.queue[idx];
    if (t && t.songmid === songmid && !t.playUrl) t.playUrl = url;
  }).catch(function(){});
}

function tryResumeAfterBackground(){
  if (!state.queue.length) return;
  try { unlockAudioFromGesture(); } catch(e0) {}
  var d = 0;
  try {
    d = audio.duration;
    if (!d || !isFinite(d) || d <= 0){
      d = (state.queue[state.queueIndex] && state.queue[state.queueIndex].interval) || 0;
    }
  } catch(e1) { d = 0; }
  var cur = 0;
  try { cur = audio.currentTime || 0; } catch(e2) {}
  var endedLike = false;
  try {
    endedLike = !!audio.ended || (d > 1 && cur >= d - 0.4);
  } catch(e3) {}
  // 息屏期间 ended 未处理完 / 卡在曲末：补切下一首
  if (endedLike){
    nextTrack(true);
    return;
  }
  // 进入后台前在播，回来被系统暂停：尝试续播
  if (_wasPlayingBeforeHide && audio.paused){
    var p = audio.play();
    if (p && typeof p.then === "function"){
      p.then(function(){ setPlayingUI(true); }).catch(function(){
        // src 可能失效，强制重载当前
        var s = state.queue[state.queueIndex];
        if (s){ try { s.playUrl = null; } catch(e4){} loadCurrent(); }
      });
    }
  }
}

function startBgWatch(){
  stopBgWatch();
  _bgWatchTimer = setInterval(function(){
    try {
      if (!state.queue.length) return;
      if (audio.paused && !audio.ended) return;
      var d = audio.duration;
      if (!d || !isFinite(d) || d <= 0){
        d = (state.queue[state.queueIndex] && state.queue[state.queueIndex].interval) || 0;
      }
      var cur = audio.currentTime || 0;
      // WebView 息屏时有时不派发 ended，用曲末探测补刀
      if (d > 2 && cur >= d - 0.35){
        if (!audio._qqmEndGuard || (Date.now() - audio._qqmEndGuard) > 2500){
          audio._qqmEndGuard = Date.now();
          nextTrack(true);
        }
      }
    } catch(e) {}
  }, 2000);
}
function stopBgWatch(){
  if (_bgWatchTimer){ clearInterval(_bgWatchTimer); _bgWatchTimer = null; }
}

function loadCurrent(){
  var s = state.queue[state.queueIndex];
  if (!s) return;
  var gen = ++_loadGen;
  ensurePlayerBarVisible();
  try { unlockAudioFromGesture(); } catch(eU) {}
  // 切歌不再重跑 initFpArtStyle（会重建 80 根频谱柱，整页闪）

  // 切歌立刻停旧音频、清进度，避免进度条停在上一首
  try {
    audio.pause();
    // 不要 removeAttribute+load 清空：部分 WebView 会白闪；仅 pause，等新 src 再设
    try { audio.currentTime = 0; } catch(eT) {}
  } catch(e0) {}
  var knownDur = Number(s.interval) || 0;
  updateProgressUI(0, knownDur);
  lastLyricIdx = -1;
  _lyricRenderGen++; // 作废进行中的歌词渲染

  updatePlayerMeta(s);
  syncLikeButtons();
  setPlayingUI(false);
  highlightPlayingRow();
  // renderPlaylistPanel 已在 updatePlayerMeta 内调用，此处不重复

  var urlPromise = resolvePlayUrlForSong(s);
  urlPromise.then(function(url){
    // 已切到下一首：丢弃过期回调，防止进度/音频串歌
    if (gen !== _loadGen) return;
    if (!url){
      if (s.source === "kugou") toast("酷狗与备用音源均无地址，换一首试试", 2800);
      else if (s.source === "kuwo") toast("酷我与备用音源均无地址，换一首试试", 2800);
      else if (s.source === "netease") toast("网易与备用音源均无地址", 3200);
      else if (s.source === "ytmusic") toast("YT 直链不可用，跨源匹配也失败。可配置代理或换源播放", 3200);
      else toast((s.isVip ? "VIP 曲目，" : "") + "官方与备用音源均无地址。可登录 Cookie 或稍后再试", 3200);
      setPlayingUI(false);
      return;
    }
    // 缓存直链（拒绝试听链）；VIP 未登录时提示走洛雪
    try {
      if (url && !s.playUrl){
        var _u = String(url);
        if (!/C400|try[_-]?url|preview|RS02/i.test(_u)) s.playUrl = url;
      }
    } catch(eCache) {}
    try{
      if (gen !== _loadGen) return;
      updateProgressUI(0, knownDur);

      var ref = s.source === "kugou" ? "https://www.kugou.com/"
        : s.source === "kuwo" ? "https://www.kuwo.cn/"
        : s.source === "netease" ? "https://music.163.com/"
        : s.source === "ytmusic" ? "https://music.youtube.com/"
        : "https://y.qq.com/";
      var hdrs = withCookie({ "Referer": ref, "User-Agent": QQ_HEADERS["User-Agent"] });

      // 仅页面 <audio> 播放，不调用 fm.play
      var candidates = [url];
      try {
        if (window.fm && typeof window.fm.res === "function"){
          var proxied = window.fm.res(url, { headers: hdrs, credentials: "include" });
          if (proxied && proxied !== url) candidates.push(proxied);
        }
      } catch(eP) {}

      function tryPlayAt(i){
        if (gen !== _loadGen) return;
        if (i >= candidates.length){
          // 最后再走一次 QQ 兜底
          if (s.source && s.source !== "qq" && !s._fbTried){
            s._fbTried = 1;
            API.fallbackViaQQ(s).then(function(fb){
              if (gen !== _loadGen) return;
              if (!fb){ toast("播放失败：无可用音频地址"); setPlayingUI(false); return; }
              s.playUrl = fb;
              candidates = [fb];
              try {
                if (window.fm && typeof window.fm.res === "function"){
                  var p2 = window.fm.res(fb, { headers: withCookie({ "Referer": "https://y.qq.com/" }), credentials: "include" });
                  if (p2 && p2 !== fb) candidates.push(p2);
                }
              } catch(e3) {}
              tryPlayAt(0);
            });
            return;
          }
          toast("播放失败，请检查网络或换一首");
          setPlayingUI(false);
          return;
        }
        var src = candidates[i];
        try {
          audio.muted = false;
          var vol = (typeof state.volume === "number" && state.volume > 0) ? state.volume : 0.8;
          audio.volume = vol;
          try { audio.removeAttribute("crossorigin"); } catch(eC) {}
          audio.src = src;
          try { audio.load(); } catch(eL) {}
          var p = audio.play();
          if (p && typeof p.then === "function"){
            p.then(function(){
              if (gen !== _loadGen) return;
              audio.muted = false;
              if (!(audio.volume > 0.05)) audio.volume = vol;
              setPlayingUI(true);
              try { resumeAudioCtx(); } catch(eR) {}
              updateProgressUI(audio.currentTime || 0, audio.duration || knownDur);
              try { startBgWatch(); } catch(eW) {}
              // 开播后预取下一首直链，并装入 standby 实现无缝联播
              setTimeout(function(){
                try { prefetchNextPlayUrl(); } catch(ePf) {}
              }, 600);
              // 卡住 0 秒则换下一条候选地址
              setTimeout(function(){
                if (gen !== _loadGen) return;
                if (!audio.paused && (audio.currentTime || 0) < 0.05 && (i + 1) < candidates.length){
                  console.warn("[qqm] stuck at 0, try next");
                  tryPlayAt(i + 1);
                }
              }, 1200);
            }).catch(function(err){
              console.warn("audio.play fail", i, err);
              tryPlayAt(i + 1);
            });
          } else {
            setPlayingUI(true);
          }
        } catch(eTry){
          tryPlayAt(i + 1);
        }
      }
      tryPlayAt(0);
    }catch(e){
      if (gen !== _loadGen) return;
      console.warn("loadCurrent play error", e);
      toast("播放失败");
      setPlayingUI(false);
    }
  });
  // 非 QQ 源不要走 QQ 歌词接口（会把已加载歌词盖成空）
  var lyricGen = _loadGen;
  function applyLyrics(lyric, trans){
    if (lyricGen !== _loadGen) return; // 已切歌，丢弃
    state.currentLyrics = parseLrc(lyric || "", trans || "");
    renderLyrics();
  }
  if (!s.source || s.source === "qq"){
    API.lyric(s.songmid).then(function(res){
      applyLyrics(res && res.lyric, res && res.trans);
    });
  } else if (s.source === "netease"){
    var neId = s.neteaseId || String(s.songmid || "").replace(/^ne_/, "");
    API.neteaseLyric(neId).then(function(ly){
      applyLyrics(ly && ly.lyric, ly && ly.trans);
    });
  } else if (s.source === "kuwo"){
    if (s.lyricText) applyLyrics(s.lyricText, "");
    API.kuwoLyric(s).then(function(ly){
      var text = (ly && ly.lyric) || "";
      if (text){
        s.lyricText = text;
        applyLyrics(text, ly && ly.trans);
      } else if (!s.lyricText){
        applyLyrics("", "");
      }
    }).catch(function(){
      if (!s.lyricText) applyLyrics("", "");
    });
  } else if (s.source === "ytmusic"){
    var yid = s.videoId || String(s.songmid || "").replace(/^yt_/, "");
    var cleanName = (typeof API.ytCleanTitle === "function") ? API.ytCleanTitle(s) : (s.name || "");
    API.ytmusicLyric(yid).then(function(ly){
      var text = (ly && ly.lyric) || "";
      if (text && text.replace(/\s+/g,"").length > 8){
        applyLyrics(text, ly && ly.trans);
        return;
      }
      return API.lyricByMeta(cleanName || s.name, s.singer).then(function(ly2){
        applyLyrics(ly2 && ly2.lyric, ly2 && ly2.trans);
      });
    }).catch(function(){
      API.lyricByMeta(cleanName || s.name, s.singer).then(function(ly2){
        applyLyrics(ly2 && ly2.lyric, ly2 && ly2.trans);
      });
    });
  } else if (s.source === "kugou"){
    API.kugouLyric(s).then(function(ly){
      applyLyrics(ly && ly.lyric, ly && ly.trans);
    });
  } else {
    applyLyrics("", "");
  }
  highlightPlayingRow();
}

/* ============================================================
   Media Session：系统状态栏 / 锁屏 / 通知中心接管
   （页面 audio 播放时生效；fm.play 原生通道由宿主自行接管）
   ============================================================ */
var _mediaSessionBound = false;
function updateMediaSession(s){
  try {
    if (!("mediaSession" in navigator)) return;
    s = s || (state.queue && state.queue[state.queueIndex]) || null;
    if (!s){
      try { navigator.mediaSession.metadata = null; } catch(e0){}
      return;
    }
    var cover = "";
    try {
      var raw = typeof songCoverUrl === "function" ? songCoverUrl(s) : (s.cover || "");
      // 状态栏封面尽量用原站 https 图，避免 blob/代理地址失效
      cover = (raw || "").replace(/^http:/, "https:");
      if (cover && cover.indexOf("//") === 0) cover = "https:" + cover;
    } catch(e1){}
    var artwork = [];
    if (cover && /^https?:\/\//i.test(cover)){
      [96, 128, 192, 256, 384, 512].forEach(function(sz){
        artwork.push({ src: cover, sizes: sz + "x" + sz, type: "image/jpeg" });
      });
    }
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.name || "QQ音乐",
      artist: s.singer || "",
      album: s.albumname || s.album || "",
      artwork: artwork
    });
    bindMediaSessionHandlers();
    try {
      navigator.mediaSession.playbackState = (audio && !audio.paused) ? "playing" : "paused";
    } catch(e2){}
    try { syncMediaSessionPosition(); } catch(e3){}
  } catch(e){
    console.warn("[mediaSession] update fail", e);
  }
}
function syncMediaSessionPosition(){
  try {
    if (!("mediaSession" in navigator) || typeof navigator.mediaSession.setPositionState !== "function") return;
    var dur = Number(audio.duration) || 0;
    var cur = Number(audio.currentTime) || 0;
    if (!isFinite(dur) || dur <= 0){
      var s = state.queue && state.queue[state.queueIndex];
      dur = Number(s && s.interval) || 0;
    }
    if (!isFinite(dur) || dur <= 0) return;
    navigator.mediaSession.setPositionState({
      duration: dur,
      playbackRate: audio.playbackRate || 1,
      position: Math.max(0, Math.min(cur, dur))
    });
  } catch(e){}
}
function bindMediaSessionHandlers(){
  if (_mediaSessionBound || !("mediaSession" in navigator)) return;
  _mediaSessionBound = true;
  var ms = navigator.mediaSession;
  try {
    ms.setActionHandler("play", function(){
      try {
        audio.muted = false;
        var p = audio.play();
        if (p && p.catch) p.catch(function(){});
        setPlayingUI(true);
        ms.playbackState = "playing";
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("pause", function(){
      try {
        audio.pause();
        setPlayingUI(false);
        ms.playbackState = "paused";
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("previoustrack", function(){ prevTrack(); });
  } catch(e){}
  try {
    ms.setActionHandler("nexttrack", function(){ nextTrack(false); });
  } catch(e){}
  try {
    ms.setActionHandler("stop", function(){
      try {
        audio.pause();
        audio.currentTime = 0;
        setPlayingUI(false);
        ms.playbackState = "none";
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("seekto", function(details){
      try {
        if (details && typeof details.seekTime === "number" && isFinite(details.seekTime)){
          audio.currentTime = details.seekTime;
          syncMediaSessionPosition();
        }
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("seekbackward", function(details){
      try {
        var off = (details && details.seekOffset) || 10;
        audio.currentTime = Math.max(0, (audio.currentTime || 0) - off);
        syncMediaSessionPosition();
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("seekforward", function(details){
      try {
        var off = (details && details.seekOffset) || 10;
        var dur = audio.duration || 0;
        audio.currentTime = Math.min(dur || 1e9, (audio.currentTime || 0) + off);
        syncMediaSessionPosition();
      } catch(e){}
    });
  } catch(e){}
}

function updatePlayerMeta(s){
  var rawCover = songCoverUrl(s);
  var cover = rawCover ? mediaUrl(rawCover) : "";
  $("#pbTitle").textContent = s.name;
  $("#pbArtist").textContent = s.singer;
  setImgSrc($("#pbCoverImg"), rawCover);

  $("#fpArtist").textContent = s.singer;
  setImgSrc($("#fpCoverImg"), rawCover);
  // 已关闭封面取色同步：切歌改色是闪烁主因

/* 全屏封面视觉样式：黑胶 / 频谱 / 脉冲 / 方封 / 波形 / 光环 */
var FP_ART_STYLES = [
  { id: "vinyl", name: "黑胶" },
  { id: "spectrum", name: "频谱" },
  { id: "pulse", name: "脉冲" },
  { id: "square", name: "方封" },
  { id: "wave", name: "粒子扩散" },
  { id: "ring", name: "光环" }
];
function ensureFpArtDecor(){
  var art = $("#fpArt");
  var stage = art && art.querySelector(".fp-art-stage");
  var spec = $("#fpSpectrum");
  // 半径：封面外一圈（舞台宽度的一半略大一点）
  var radius = 100;
  if (stage && stage.offsetWidth) radius = Math.round(stage.offsetWidth * 0.46);
  if (spec && !spec.childNodes.length){
    var n = 80, html = "";
    for (var i = 0; i < n; i++){
      var rot = (i / n) * 360;
      var delay = (i % 12) * 0.04;
      html += '<i style="--tr:rotate('+rot+'deg) translateY(-'+radius+'px);transform:var(--tr) scaleY(.3);animation-delay:'+delay+'s"></i>';
    }
    spec.innerHTML = html;
  }
  var wave = $("#fpWave");
  if (wave && !wave._particlePool){
    // 粒子扩散：预建密集粒子池，模拟星尘环
    wave.innerHTML = "";
    var pool = [];
    for (var pi = 0; pi < 140; pi++){
      var el = document.createElement("i");
      el.className = "fp-particle";
      wave.appendChild(el);
      pool.push({ el: el, active: false, ang: 0, r: 0, vr: 0, life: 0, maxLife: 1, size: 1 });
    }
    wave._particlePool = pool;
  }
}
var _waveSpawnAcc = 0;

      img.style.height = "100%";

var _fpArtInited = false;
function initFpArtStyle(){

/* ---------- 歌词解析与滚动同步 ---------- */
function parseLrc(lrc, trans){
  if (!lrc) return [];
  var transMap = {};
  (trans||"").split("\n").forEach(function(line){
    var m = /\[(\d{2}):(\d{2})[.:](\d{2,3})\]([\s\S]*)/.exec(line);
    if (m) transMap[(+m[1]*60+ +m[2]).toFixed(0)] = m[4].trim();
  });
  var out = [];
  lrc.split("\n").forEach(function(line){
    var m = /\[(\d{2}):(\d{2})[.:](\d{2,3})\]([\s\S]*)/.exec(line);
    if (!m) return;
    var t = +m[1]*60 + +m[2] + (+m[3]/(m[3].length===3?1000:100));
    var text = m[4].trim();
    if (!text) return;
    out.push({ time:t, text:text, tr: transMap[Math.round(+m[1]*60+ +m[2])] || "" });
  });
  return out.sort(function(a,b){ return a.time-b.time; });
}

function syncLyricsScroll(t, force){

/* ---------- 专辑色彩提取 → 呼吸背景（signature element） ---------- */
var _colorCanvas = document.createElement("canvas"); _colorCanvas.width=16; _colorCanvas.height=16;
var _colorCtx = _colorCanvas.getContext("2d", {willReadFrequently:true});
/** 取色后压到中低亮度，保持饱和但不刺眼 */
function _boostColor(r, g, b){
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var mid = (max + min) / 2;
  var sat = max === min ? 0 : (max - min) / (255 - Math.abs(2*mid - 255) || 1);
  var targetSat = Math.min(0.85, sat * 1.2 + 0.12);
  // 抬高亮度，让氛围光更接近 Apple Music 流动光晕
  var targetLum = Math.max(72, Math.min(160, mid * 0.9 + 36));
  function ch(c){
    var v = mid + (c - mid) * (targetSat / (sat || 0.01));
    v = v * (targetLum / (mid || 1));
    return Math.max(0, Math.min(255, Math.round(v)));
  }
  return "rgb("+ch(r)+","+ch(g)+","+ch(b)+")";
}
/** 浅色播放页用：粉彩高亮，饱和度适中，避免发脏发灰 */
function _boostLightColor(r, g, b){
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var mid = (max + min) / 2;
  var sat = max === min ? 0 : (max - min) / (255 - Math.abs(2*mid - 255) || 1);
  var targetSat = Math.min(0.55, sat * 0.85 + 0.18);
  var targetLum = Math.max(175, Math.min(230, mid * 0.35 + 175));
  function ch(c){
    var v = mid + (c - mid) * (targetSat / (sat || 0.01));
    v = v * (targetLum / (mid || 1));
    return Math.max(0, Math.min(255, Math.round(v)));
  }
  return "rgb("+ch(r)+","+ch(g)+","+ch(b)+")";
}

  var t = state.theme || "apple";
  if (t === "qq") return ["#b8f0d4", "#b0e8f0", "#c4d4f8"];
  if (t === "kuwo") return ["#ffe2a8", "#ffd4a0", "#d8c8f0"];
  if (t === "kugou") return ["#b8e4ff", "#b0d0f0", "#c8d4f0"];
  if (t === "ytmusic") return ["#ffc0cc", "#f0b0c8", "#d4c0f0"];

function themeAmbientColors(){
  var t = state.theme || "apple";
  // 更亮、更饱和，配合 screen 混合形成流动光
  if (t === "qq") return ["#2ecf8a", "#2aa8c4", "#4a6fe0"];
  if (t === "kuwo") return ["#ffc04a", "#e09030", "#7a5ad0"];

function extractAmbientColor(url){
  if (!url){ applyAmbient(themeAmbientColors(), themeLightAmbientColors()); return; }
  var img = new Image();
  img.crossOrigin = "anonymous";
  var fallback = true;
  // 不再 900ms 强制回落主题色（会与封面取色打架导致闪一下）
  var tm = null;
  img.onload = function(){
    fallback = false; if (tm) clearTimeout(tm);
    try{
      if (!_colorCtx){ applyAmbient(themeAmbientColors(), themeLightAmbientColors()); return; }
      _colorCtx.drawImage(img,0,0,16,16);
      var data = _colorCtx.getImageData(0,0,16,16).data;
      var buckets = {};
      for (var i=0;i<data.length;i+=4){
        var r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
        if (a < 200) continue;
        if (r+g+b < 50 || r+g+b > 700) continue;
        var key = (r>>4)+","+(g>>4)+","+(b>>4);
        buckets[key] = (buckets[key]||0)+1;
      }
      var sorted = Object.keys(buckets).sort(function(a,b){ return buckets[b]-buckets[a]; });
      var top = sorted.slice(0,3).map(function(k){
        var p = k.split(",").map(function(n){ return (+n)<<4; });
        return _boostColor(p[0], p[1], p[2]);
      });
      var topLight = sorted.slice(0,3).map(function(k){
        var p = k.split(",").map(function(n){ return (+n)<<4; });
        return _boostLightColor(p[0], p[1], p[2]);
      });
      var defaults = themeAmbientColors();
      var defaultsL = themeLightAmbientColors();
      while (top.length<3) top.push(defaults[top.length] || defaults[0]);
      while (topLight.length<3) topLight.push(defaultsL[topLight.length] || defaultsL[0]);
      applyAmbient(top, topLight);
    }catch(e){ applyAmbient(themeAmbientColors(), themeLightAmbientColors()); }
  };
  img.onerror = function(){ fallback=false; if (tm) clearTimeout(tm); /* 失败保留上一套氛围色，不闪回主题色 */ };
  img.src = url;
}

/* ============================================================
   § 11. 登录
   ------------------------------------------------------------
   三种方式：
   1) 账号密码 —— 腾讯对第三方密码登录有滑块/设备风控，
      此处按标准 ptlogin 流程发起请求，若被拦截会提示改用其它方式。
   2) 扫码登录 —— 标准 QQ 互联二维码轮询流程（ptqrshow / ptqrlogin），
      依赖原生端保持同一 Cookie 会话，真机联调时请重点验证这一步。
   3) Cookie 登录 —— 最稳妥，用户从已登录的浏览器会话粘贴 Cookie。
   ============================================================ */
function parseCookieStr(str){
  var map = {};
  str.split(/;\s*/).forEach(function(kv){
    var idx = kv.indexOf("=");
    if (idx<0) return;
    map[kv.slice(0,idx).trim()] = kv.slice(idx+1).trim();
  });
  return map;
}
function applyLogin(cookieStr, uinOverride){
  var map = parseCookieStr(cookieStr);
  var uin = uinOverride || map.uin || map.p_uin || "";
  uin = uin.replace(/^o0*/,"");
  if (!uin || !(map.qqmusic_key || map.qm_keyst || map.skey)){
    toast("Cookie 中未识别到有效登录态（需包含 uin 与 qqmusic_key/qm_keyst）");
    return false;
  }
  // 规范化 Cookie：保证含 uin=oXXXX 形式（部分接口依赖）
  var ck = cookieStr;
  if (uin && !/(?:^|;\s*)uin=/.test(ck)){
    ck = "uin=o" + uin + "; " + ck;
  }
  state.user = {
    uin: uin,
    cookie: ck,
    nickname: "QQ音乐用户 "+uin,
    avatar: avatarUrl(uin),
    vip: false,
    qqmusic_key: map.qqmusic_key || "",
    qm_keyst: map.qm_keyst || ""
  };
  storeSet("user", state.user);
  toast("登录成功");
  closeLoginView(false);
  syncUserAvatar();
  renderMine();
  fetchUserVipStatus();
  fetchUserProfile();
  return true;
}
function fetchUserVipStatus(){

  var url = "https://c.y.qq.com/v8/fcg-bin/fcg_v8_grocery_svip_getprivilegeindex_out.fcg?loginUin="+(state.user&&state.user.uin)+"&format=json";

    if (d && d.data && (d.data.is_vip===1 || d.data.svip===1)){

/** 拉取昵称 / 头像（接口失败时仍用 qlogo 兜底） */
function fetchUserProfile(){
  if (!state.user || !state.user.uin) return;
  var uin = String(state.user.uin).replace(/^o0*/,"");
  var url = "https://c.y.qq.com/rsc/fcgi-bin/fcg_get_profile_homepage.fcg?cid=205360838&ct=20&userid="+encodeURIComponent(uin)+"&reqfrom=1&reqtype=0&format=json";
  ADAPTER_request(url, {headers:withCookie()}).then(function(txt){
    var d = jsonp_safeParse(txt);

    var info = d.data && (d.data.creator || d.data.userInfo || d.data);
    var nick = (info && (info.nick || info.nickname || info.name)) || (d.data.nickname) || "";
    var head = (info && (info.headpic || info.headurl || info.avatar || info.headIcon)) || "";
    var changed = false;

    if (head){ state.user.avatar = fixCover(head); changed = true; }

function bindEvents(){

    var mark = $("#brandMark");
    if (!mark || mark._themeBound) return;
    mark._themeBound = true;
    var tm = null, moved = false, longPressed = false, startX = 0, startY = 0;
    function clear(){ if (tm){ clearTimeout(tm); tm = null; } }
    function onStart(e){
      moved = false; longPressed = false;
      var t = e.touches ? e.touches[0] : e;
      startX = t.clientX; startY = t.clientY;
      clear();

        tm = null; longPressed = true;

      if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10){
        moved = true; clear();
      }
    }
    function onEnd(){ clear(); }
    mark.addEventListener("touchstart", onStart, { passive: true });
    mark.addEventListener("touchmove", onMove, { passive: true });
    mark.addEventListener("touchend", onEnd, { passive: true });
    mark.addEventListener("touchcancel", onEnd, { passive: true });
    mark.addEventListener("mousedown", onStart);
    mark.addEventListener("mousemove", onMove);
    mark.addEventListener("mouseup", onEnd);

  // 输入时：清空回热搜；有字防抖联想（不 push 历史）
  sInput.addEventListener("input", function(){

      openSearchPage();

    if (!kw){

      try { history.replaceState(currentHistoryState({view:"search", params:{}}), "", "#search"); } catch(e) {}
      clearTimeout(searchTimer);
      renderSearchEmpty();
      return;
    }
    // 有字：防抖联想，不改 history，避免删字触发返回栈变化
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      renderSearchSuggest(kw);
    }, 280);
  });
  sInput.addEventListener("keydown", function(e){

      e.preventDefault();

      doSearch(sInput.value);
      try { sInput.blur(); } catch(err) {}
    }
    // Escape：仅失焦，不返回（删字/取消输入）

  $("#avatarBtn").onclick = function(){

  // player bar
  function togglePlay(){

    unlockAudioFromGesture();
    if (audio.paused){
      try {
        audio.muted = false;
        audio.volume = state.volume || 0.8;
      } catch(e){}
      // 若 audio 无 src 但队列有歌，重新 load
      if (!audio.src || audio.src === window.location.href){

      audio.play().then(function(){ setPlayingUI(true); }).catch(function(){

      });

  }
  $("#pbPlay").onclick = togglePlay;
  $("#pbPrev").onclick = prevTrack;
  $("#pbNext").onclick = function(){ nextTrack(false); };
  $("#pbModeBtn").onclick = cycleMode;

  function cycleQuality(){

  var fpPlayBtn = $("#fpPlay"), fpPrevBtn = $("#fpPrev"), fpNextBtn = $("#fpNext");

  if (fpPrevBtn) fpPrevBtn.onclick = prevTrack;
  if (fpNextBtn) fpNextBtn.onclick = function(){ nextTrack(false); };
  $("#pbQuality").onclick = cycleQuality;

  // progress bar drag（迷你栏 + 全屏播放器）
  var draggingBar = false, activeSeekBar = null;
  function seekFromEvent(e, barEl){
    var bar = barEl || activeSeekBar || $("#pbBar");
    if (!bar) return;
    var rect = bar.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    var d = audio.duration || (state.queue[state.queueIndex]&&state.queue[state.queueIndex].interval) || 0;
    if (d) audio.currentTime = pct * d;
    updateProgressUI(pct * d, d);
  }
  function bindSeekBar(bar){
    if (!bar) return;
    bar.addEventListener("mousedown", function(e){ draggingBar=true; activeSeekBar=bar; seekFromEvent(e, bar); });
    bar.addEventListener("touchstart", function(e){ draggingBar=true; activeSeekBar=bar; seekFromEvent(e, bar); e.preventDefault(); }, {passive:false});
    bar.addEventListener("touchmove", function(e){ if (draggingBar){ seekFromEvent(e, bar); e.preventDefault(); } }, {passive:false});
    bar.addEventListener("touchend", function(){ draggingBar=false; activeSeekBar=null; });
  }
  bindSeekBar($("#pbBar"));
  bindSeekBar($("#fpBar"));
  window.addEventListener("mousemove", function(e){ if (draggingBar) seekFromEvent(e, activeSeekBar); });
  window.addEventListener("mouseup", function(){ draggingBar=false; activeSeekBar=null; });

  // volume drag
  function volFromEvent(e){
    var bar = $("#pbVolBar"); var rect = bar.getBoundingClientRect();
    var x = (e.touches?e.touches[0].clientX:e.clientX) - rect.left;
    var pct = Math.min(1, Math.max(0, x/rect.width));
    state.volume = pct; storeSet("volume", pct); try { audio.volume = pct; } catch(eV1){}
    $("#pbVolFill").style.width = (pct*100)+"%";
    $("#pbVolIcon use").setAttribute("href", pct===0 ? "#i-vol0" : "#i-vol");
  }
  var draggingVol=false;
  $("#pbVolBar").addEventListener("mousedown", function(e){ draggingVol=true; volFromEvent(e); });
  window.addEventListener("mousemove", function(e){ if (draggingVol) volFromEvent(e); });
  window.addEventListener("mouseup", function(){ draggingVol=false; });
  $("#pbVolFill").style.width = (state.volume*100)+"%";

  // 打开/关闭全屏播放器
  $("#pbMeta").onclick = openFullPlayer; $("#pbCover").onclick = openFullPlayer;
  var _pbLyric = $("#pbLyricBtn"); if (_pbLyric) _pbLyric.onclick = openFullPlayer;
  $("#fpClose").onclick = function(){ closeFullPlayer(false); };
  var _pbList = $("#pbListBtn");
  if (_pbList) _pbList.onclick = function(){ openFullPlayer(); switchFpTab("playlist"); };
  bindFullPlayerGesture();

  $all(".fp-tab").forEach(function(t){ t.onclick = function(){ switchFpTab(t.dataset.tab); }; });

  // 点击歌词区域 → 全屏歌词；行内单击不跳转，双击/双击才跳转播放
  (function bindLyricsFocusTap(){
    var wrap = $("#lyricsWrap");
    if (!wrap || wrap._lyricsFocusBound) return;
    wrap._lyricsFocusBound = true;
    var sx = 0, sy = 0, moved = false;
    var lastTapT = 0, lastTapLine = null;
    wrap.addEventListener("touchstart", function(e){
      var t = e.touches ? e.touches[0] : e;
      sx = t.clientX; sy = t.clientY; moved = false;
    }, { passive: true });
    wrap.addEventListener("touchmove", function(e){
      var t = e.touches ? e.touches[0] : e;
      if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) moved = true;
    }, { passive: true });
    wrap.addEventListener("click", function(e){
      if (moved) return;
      var line = e.target && e.target.closest ? e.target.closest(".lyric-line") : null;
      // 空白处单击：只进全屏
      if (!line){
        enterLyricsFocus(false);
        lastTapLine = null;
        return;
      }
      // 行：单击进全屏；短间隔第二次点同一行 → 视为双击跳转
      var now = Date.now();
      if (lastTapLine === line && (now - lastTapT) < 380){
        lastTapLine = null;
        lastTapT = 0;
        var tt = +line.dataset.t;
        if (isFinite(tt)) {
          try { audio.currentTime = tt; } catch(e1) {}
          try { audio.play(); } catch(e2) {}
        }
        enterLyricsFocus(false);
        return;
      }
      lastTapLine = line;
      lastTapT = now;
      enterLyricsFocus(false);
    });
  })();

  // 登录相关（仅 Cookie）
  var btnCookie = $("#btnLoginCookie");
  if (btnCookie) btnCookie.onclick = function(){

var _fpClosing = false;
var _fpHistoryPushed = false;

/** 仅控制全屏播放器 UI 显示（不碰 history） */

/**
 * 保证全屏播放器在历史栈中有且仅有一层 overlay:player。
 * 禁止在切歌时反复 push，否则系统返回/手势返回会连续踩多层才能关掉。
 */
function ensurePlayerHistory(){
  var fp = $("#fullPlayer");
  if (!fp || !fp.classList.contains("show")) return;
  try {
    var st = currentHistoryState({ overlay: "player" });
    if ((history.state && history.state.overlay === "player") || _fpHistoryPushed){
      history.replaceState(st, "", location.href);
      _fpHistoryPushed = true;
    } else {
      history.pushState(st, "", location.href);
      _fpHistoryPushed = true;
    }
  } catch(e) {}
  setSubviewChrome(true);
}

var _lyricsFocusPushed = false;

function enterLyricsFocus(skipHistory){
  var fp = $("#fullPlayer");
  if (!fp || !fp.classList.contains("show")) return;
  if (fp.classList.contains("lyrics-focus")) return;
  var lyricsWrap = $("#lyricsWrap");
  if (lyricsWrap && lyricsWrap.style.display === "none") return;
  fp.classList.add("lyrics-focus");
  try { switchFpTab("lyrics"); } catch(e) {}
  if (!skipHistory){
    try {
      var inHist = !!(history.state && history.state.overlay === "lyrics");
      if (!inHist){
        pushOverlayState("lyrics");
        _lyricsFocusPushed = true;
      } else {
        history.replaceState(currentHistoryState({ overlay: "lyrics" }), "", location.href);
        _lyricsFocusPushed = true;
      }
    } catch(e2) { _lyricsFocusPushed = false; }
  } else {
    try { _lyricsFocusPushed = !!(history.state && history.state.overlay === "lyrics"); } catch(e3) {}
  }
  setSubviewChrome(true);
  syncAppUnderlay();
  try {
    if (audio) syncLyricsScroll(audio.currentTime || 0, true);
  } catch(e4) {}
}

function exitLyricsFocus(skipHistory){
  var fp = $("#fullPlayer");
  if (!fp || !fp.classList.contains("lyrics-focus")) return;
  fp.classList.remove("lyrics-focus");
  var needBack = false;
  if (!skipHistory){
    try {
      needBack = _lyricsFocusPushed || !!(history.state && history.state.overlay === "lyrics");
    } catch(eN) { needBack = !!_lyricsFocusPushed; }
  }
  _lyricsFocusPushed = false;
  if (needBack){
    _overlayNavLock = true;
    _ignorePop = 1;
    try { history.back(); } catch(e) {}
    setTimeout(function(){
      _overlayNavLock = false;
      if (_ignorePop > 0) _ignorePop = 0;
      try {
        if (history.state && history.state.overlay !== "player"){
          history.replaceState(currentHistoryState({ overlay: "player" }), "", location.href);
        }
        _fpHistoryPushed = true;
      } catch(e2) {}
    }, 200);
  } else if (!skipHistory){
    try {
      history.replaceState(currentHistoryState({ overlay: "player" }), "", location.href);
      _fpHistoryPushed = true;
    } catch(eR) {}
  }
  setSubviewChrome(true);
  syncAppUnderlay();
}

function openFullPlayer(){
  if (!state.queue.length){ toast("先播放一首歌曲吧"); return; }
  var fp = $("#fullPlayer");
  if (!fp) return;
  var already = fp.classList.contains("show");
  var inHistory = false;
  try { inHistory = !!(history.state && history.state.overlay === "player"); } catch(e0) {}

  if (!already){
    // 打开时必须压一层，保证返回先关播放器而不是退出 App
    if (!inHistory){
      try { pushOverlayState("player"); } catch(e1) {}
    } else {
      try { history.replaceState(currentHistoryState({ overlay: "player" }), "", location.href); } catch(e2) {}
    }
    _fpHistoryPushed = true;
  } else {
    // 已打开：校正 state
    try {
      history.replaceState(currentHistoryState({ overlay: "player" }), "", location.href);
      _fpHistoryPushed = true;
    } catch(e) {}
  }
  showFullPlayerUI();
  // 再保险：打开后 chrome 禁止原生直接退出
  try { setSubviewChrome(true); } catch(e3) {}
}

/**
 * 关闭全屏播放器
 * @param {boolean} [skipHistory] true=只关 UI（popstate/已处理 history）
 */
function closeFullPlayer(skipHistory){
  var fp = $("#fullPlayer");
  if (!fp || !fp.classList.contains("show") || _fpClosing) return;
  try { fp.classList.remove("lyrics-focus"); _lyricsFocusPushed = false; } catch(eLf) {}
  _fpClosing = true;
  fp.style.transition = "transform .4s cubic-bezier(0.22,1,0.36,1), opacity .3s ease";
  fp.style.transform = "translate3d(0,100%,0)";
  fp.style.opacity = "0";
  setTimeout(function(){
    fp.classList.remove("show");
    fp.style.transition = "none";
    fp.style.transform = "";
    fp.style.opacity = "";
    fp.style.visibility = "";
    fp.style.pointerEvents = "";
    _fpClosing = false;
    setSubviewChrome(state.view !== "home");
    syncAppUnderlay();
  }, 280);

  var needBack = false;
  if (!skipHistory){
    try {
      needBack = _fpHistoryPushed || !!(history.state && history.state.overlay === "player");
    } catch(eN) { needBack = !!_fpHistoryPushed; }
  }
  _fpHistoryPushed = false;
  if (needBack){
    _overlayNavLock = true;
    _ignorePop = 1;
    try { history.back(); } catch(e) {}
    setTimeout(function(){
      _overlayNavLock = false;
      if (_ignorePop > 0) _ignorePop = 0;
    }, 280);
  } else if (!skipHistory){
    try { history.replaceState(currentHistoryState({ overlay: null }), "", location.href); } catch(eR) {}
  }
  setSubviewChrome(state.view !== "home");
  syncAppUnderlay();
}
function switchFpTab(tab){

/** 全屏播放页手势：下滑关闭；左侧边缘不拦截，交给系统返回 */
function bindFullPlayerGesture(){
  var fp = $("#fullPlayer");
  if (!fp || fp._gestureBound) return;
  fp._gestureBound = true;
  var startY = 0, startX = 0, dragging = false, moved = false, edgeStart = false;
  var EDGE = 28; // 左侧边缘留给系统返回手势

  function onStart(e){
    if (!fp.classList.contains("show") || _fpClosing) return;
    var t = e.touches ? e.touches[0] : e;
    // 系统侧滑返回：不接管左边缘起点
    if (t.clientX <= EDGE){
      edgeStart = true;
      dragging = false;
      return;
    }
    edgeStart = false;
    var scrollEl = e.target.closest("#lyricsWrap, #playlistPanel");
    if (scrollEl && scrollEl.scrollTop > 2) return;
    // 进度条/按钮区域不启动拖拽关闭，避免误触
    if (e.target.closest(".fp-bar, .fp-ctrls, .fp-play, .fp-ctrl-btn, .fp-quick, .fp-close")) return;
    startY = t.clientY; startX = t.clientX;
    dragging = true; moved = false;
    fp.style.transition = "none";
  }
  function onMove(e){
    if (edgeStart || !dragging || _fpClosing) return;
    var t = e.touches ? e.touches[0] : e;
    var dy = t.clientY - startY;
    var dx = t.clientX - startX;
    // 明显横向滑动：放弃本地下滑关闭，不 preventDefault，避免干扰系统手势
    if (!moved && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10){
      dragging = false;
      fp.style.transform = "translate3d(0,0,0)";
      fp.style.opacity = "1";
      return;
    }
    if (dy < 0) dy = 0;
    if (dy > 6) moved = true;
    if (moved){
      fp.style.transform = "translateY("+dy+"px)";
      fp.style.opacity = String(Math.max(0.35, 1 - dy / (window.innerHeight * 0.7)));
      if (e.cancelable) e.preventDefault();
    }
  }
  function onEnd(e){
    if (edgeStart){ edgeStart = false; return; }
    if (!dragging) return;
    dragging = false;
    if (_fpClosing) return;
    var t = (e.changedTouches && e.changedTouches[0]) || e;
    var dy = (t ? t.clientY : startY) - startY;
    if (moved && dy > 100){
      if (fp.classList.contains("lyrics-focus")){
        fp.style.transition = "transform .35s cubic-bezier(0.22,1,0.36,1), opacity .25s ease";
        fp.style.transform = "translate3d(0,0,0)";
        fp.style.opacity = "1";
        exitLyricsFocus(false);
      } else {
        closeFullPlayer(false);
      }
    } else {
      fp.style.transition = "transform .45s cubic-bezier(0.34,1.56,0.64,1), opacity .3s ease";
      fp.style.transform = "translate3d(0,0,0)";
      fp.style.opacity = "1";
    }
  }
  fp.addEventListener("touchstart", onStart, { passive: true });
  fp.addEventListener("touchmove", onMove, { passive: false });
  fp.addEventListener("touchend", onEnd, { passive: true });
  fp.addEventListener("touchcancel", onEnd, { passive: true });
}

/* ============================================================
   § 13. TV 遥控方向导航
   ------------------------------------------------------------
   遥控器按键在 fongmi/WebHome 环境下通常映射为标准方向键
   事件（ArrowUp/Down/Left/Right + Enter）。采用几何最近邻算法
   在当前可见的可聚焦元素间移动焦点，避免为每个视图手写导航图。
   ============================================================ */
var FOCUSABLE_SEL = ".nav-item,.card,.mv-card,.radio-card,.rank-card,.song-row,.hero-play,.login-btn,.cookie-area,.sr-tab,.hot-search-tag,.pb-play,.pb-ctrl-btn,.fp-tab,.lyric-line";
var curFocusEl = null;
function tvFocusables(){
  return $all(FOCUSABLE_SEL).filter(function(e){
    var r = e.getBoundingClientRect();
    return r.width>0 && r.height>0 && r.top < window.innerHeight && r.bottom > -50;
  });
}
function setTvFocus(node){
  if (curFocusEl) curFocusEl.classList.remove("tv-focus");
  curFocusEl = node;
  if (node){ node.classList.add("tv-focus"); node.scrollIntoView({block:"nearest", inline:"nearest", behavior:"smooth"}); }
}
function moveTvFocus(dir){
  var list = tvFocusables();
  if (!list.length) return;
  if (!curFocusEl || list.indexOf(curFocusEl) === -1){ setTvFocus(list[0]); return; }
  var r0 = curFocusEl.getBoundingClientRect();
  var c0 = {x:r0.left+r0.width/2, y:r0.top+r0.height/2};
  var best=null, bestScore=Infinity;
  list.forEach(function(node){
    if (node===curFocusEl) return;
    var r = node.getBoundingClientRect();
    var c = {x:r.left+r.width/2, y:r.top+r.height/2};
    var dx=c.x-c0.x, dy=c.y-c0.y;
    var ok = dir==="left"?dx<-4 : dir==="right"?dx>4 : dir==="up"?dy<-4 : dy>4;
    if (!ok) return;
    var primary = (dir==="left"||dir==="right") ? Math.abs(dx) : Math.abs(dy);
    var secondary = (dir==="left"||dir==="right") ? Math.abs(dy) : Math.abs(dx);
    var score = primary + secondary*2.2;
    if (score < bestScore){ bestScore = score; best = node; }
  });
  if (best) setTvFocus(best);
}
document.addEventListener("keydown", function(e){
  // 系统返回键 / Backspace：全局统一处理（手机 WebView + TV）
  // 输入框内的 Backspace 用于删字，绝不能当成返回
  if (e.key === "Backspace" || e.keyCode === 4 || e.key === "Escape"){
    var t = e.target;
    var tag = (t && t.tagName) ? t.tagName.toUpperCase() : "";
    var typing = tag === "INPUT" || tag === "TEXTAREA" || (t && t.isContentEditable);
    // Escape 在输入框内：仅失焦，不返回（官方常见行为）
    if (typing && e.key === "Escape"){
      try { t.blur(); } catch(err) {}
      e.preventDefault();
      return;
    }
    // 输入框内 Backspace：放行给系统删字
    if (typing && (e.key === "Backspace" || e.keyCode === 4)){
      return;
    }
    if (handleBack()){
      e.preventDefault();
      e.stopPropagation();
    }
    return;
  }
  if (!state.isTv) return;
  var map = {ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
  if (map[e.key]){ e.preventDefault(); moveTvFocus(map[e.key]); }
  else if (e.key==="Enter" || e.keyCode===13){ if (curFocusEl) curFocusEl.click(); }
});
document.addEventListener("click", function(e){
  if (!state.isTv) return;
  var target = e.target.closest(FOCUSABLE_SEL);
  if (target) setTvFocus(target);
}, true);


/* ============================================================
   § 14. 初始化
   ============================================================ */
function bootApp(){
  // 重新检测 TV（fongmiClient 可能稍晚注入）
  if (window.fongmiClient && window.fongmiClient.isLeanback){
    state.isTv = true;
    document.documentElement.classList.add("tv-mode");
  }
  // 底栏：全部关闭（含 TV）；仅维护 tv-mode 类
  try {
    if (state.isTv) document.documentElement.classList.add("tv-mode");
    else document.documentElement.classList.remove("tv-mode");
    var bn = document.getElementById("bottomNav");
    if (bn) {
      bn.style.display = "none";
      bn.setAttribute("hidden", "");
      bn.setAttribute("aria-hidden", "true");
    }
  } catch(eBn) {}
  if (state.user){ closeLoginView(true); syncUserAvatar(); fetchUserProfile(); }
  else { try { closeLoginView(true); } catch(eGU){} syncUserAvatar(); }
  bindEvents();
  try {
    var _q0 = state.quality || "HQ";
    var _pbq = $("#pbQuality"); if (_pbq) _pbq.textContent = _q0;
    var _fpq = $("#fpQuality"); if (_fpq) _fpq.textContent = _q0;
  } catch(eQ) {}
  syncModeUI();
  // 启动氛围背景（主题色光晕，播放后会随封面变色）
  try { applyAmbient(themeAmbientColors(), themeLightAmbientColors()); } catch(e) {}
  if (!state.sourceUnlocked){ state.source = "qq"; }
  else {
    var saved = storeGet("musicSource", "qq");
    // 酷狗 / 网易已下线，历史选择强制回落
    if (saved === "kugou" || saved === "netease" || saved === "qishui") saved = "qq";
    if (saved && saved !== "qq" && (saved === "kuwo" || saved === "ytmusic")) state.source = saved;
    else state.source = "qq";
  }
  // 启动即显示迷你播放栏（空状态），与 Apple Music 一致
  ensurePlayerBarVisible();

  var hash = location.hash.replace("#","");
  var parts = hash.split("/");
  var startView = VIEWS.indexOf(parts[0])>-1 ? parts[0] : "home";
  try {
    // Solene：首页 = entry0，裸 URL，不垫哨兵
    if (!history.state || !history.state.qqm){
      history.replaceState({view:"home", params:{}, qqm:1}, "", location.pathname + location.search);
    }
    if (startView !== "home"){
      history.pushState({view:startView, params:{}, qqm:1}, "", hashFor(startView, {}));
    } else {
      history.replaceState({view:"home", params:{}, qqm:1}, "", location.pathname + location.search);
    }
  } catch(e) {}
  /* [fix] 启动渲染保护：异常时兜底切到 home，避免白屏 */
try {
  switchView(startView, {}, false);
} catch(eSV) {
  try { console.error("[qqm] switchView err", eSV); } catch(_e){}
  try { switchView("home", {}, false); } catch(eSV2){}
}

  setSubviewChrome(startView !== "home");
  syncAppUnderlay();
  window.handleBack = handleBack;
  window.__qqmBack = function(){ try { return handleBack(); } catch(e){ return false; } };

  // 息屏/后台：记录播放态；回前台补切歌与续播；顺带刷新每日推荐
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden"){
      try { _wasPlayingBeforeHide = !!(audio && !audio.paused); } catch(eH) { _wasPlayingBeforeHide = false; }
      // 离开前尽量预取下一首
      try { prefetchNextPlayUrl(); } catch(eP) {}
    } else if (document.visibilityState === "visible"){
      try { maybeRefreshDaily(false); } catch(e) {}
      try { tryResumeAfterBackground(); } catch(eR) {}
    }
  });
  // 部分 WebView 用 pagehide/pageshow
  window.addEventListener("pagehide", function(){
    try { _wasPlayingBeforeHide = !!(audio && !audio.paused); } catch(e) {}
    try { prefetchNextPlayUrl(); } catch(e2) {}
  });
  window.addEventListener("pageshow", function(){
    try { tryResumeAfterBackground(); } catch(e) {}
  });
  // 每 10 分钟检查一次是否跨入新时段（页面一直挂着不切页时也能更新）
  setInterval(function(){
    try {
      if (state.view === "home") maybeRefreshDaily(false);
    } catch(e) {}
  }, 10 * 60 * 1000);

  if (state.isTv) setTimeout(function(){ setTvFocus(tvFocusables()[0]); }, 400);
}

function init(){
  // App 内必须先等 fm 注入，再发请求；否则会误走 JSONP/fetch 拿不到数据
  whenFm(5000).then(function(fmObj){
    if (fmObj) console.log("[qqm] fm SDK ready");
    else console.warn("[qqm] fm SDK not found, fallback JSONP/fetch");
    bootApp();
  }).catch(function(){ bootApp(); });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();


/* 宿主返回键：优先走 handleBack，避免全屏播放器时直接退出 */
(function bindHostBack(){
  try {
    if (window.fm && window.fm.ui && typeof window.fm.ui.onBack === "function"){
      window.fm.ui.onBack(function(){
        return handleBack();
      });
    }
  } catch(e) {}
  // 部分 WebHome 用这个
  try {
    window.__onBackPressed = function(){ return handleBack(); };
  } catch(e2) {}
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" || e.keyCode === 27){
      if (isOverlayOpen()){
        e.preventDefault();
        handleBack();
      }
    }
  }, true);
})();

})();

    {name:"蓝色", css:"#4da3ff", dot:"#4da3ff"},
    {name:"红色", css:"#ff5f57", dot:"#ff5f57"},

    {name:"紫色", css:"#b36bff", dot:"#b36bff"},
    {name:"青色", css:"#2dd4bf", dot:"#2dd4bf"},
    {name:"粉色", css:"#ff6ba9", dot:"#ff6ba9"},
    {name:"白色", css:"#ffffff", dot:"#ffffff"}
  ];
  var idx = 0;
  try{ idx = parseInt(localStorage.getItem("qqm_lyric_color")||"0",10)||0; }catch(e){}
  idx = ((idx % colors.length) + colors.length) % colors.length;
  function applyLyricColor(){
    var c = colors[idx];
    var root = document.documentElement;
    try{
      if (c.css){ root.style.setProperty("--lyric-color", c.css); root.style.setProperty("--lyric-color-tr", c.css); }
      else { root.style.removeProperty("--lyric-color"); root.style.removeProperty("--lyric-color-tr"); }
    }catch(e){}
    var dot = document.getElementById("fpLyricColorDot");
    if (dot) dot.style.background = c.dot;
    try{ localStorage.setItem("qqm_lyric_color", String(idx)); }catch(e){}
  }
  function bindLyricColorBtn(){
    var btn = document.getElementById("fpLyricColor");
    if (!btn) return;
    btn.onclick = function(){
      idx = (idx + 1) % colors.length;
      applyLyricColor();
      try{ if (window.toast) toast("歌词颜色: " + colors[idx].name, 900); }catch(e){}
    };
    applyLyricColor();
  }
  if (document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", bindLyricColorBtn); }
  else { bindLyricColorBtn(); }
})();
