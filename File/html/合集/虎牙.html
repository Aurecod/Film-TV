<!DOCTYPE html>
<html lang="zh-CN">

<title>虎牙直播</title>
<script>
(function () {
  var d = document, root = d.documentElement;

  }

    };

  }

  var supports = (window.CSS && CSS.supports) ? function (p, v) { try { return CSS.supports(p, v); } catch (e) { return false; } } : function () { return false; };

  /* flex gap 必须实测 */

    try {
      var box = d.createElement('div');
      box.style.cssText = 'display:flex;flex-direction:column;position:absolute;visibility:hidden;';
      box.style.rowGap = '10px';

      box.appendChild(d.createElement('div'));

    if (!supports('aspect-ratio', '16 / 9')) return false;
    try {
      var el = d.createElement('div');

<style>
/* ============ tokens ============ */
:root{
  --ink:#0B0910;
  --panel:rgba(22,16,32,0.86);
  --panel-2:rgba(30,22,42,0.9);
  --line:rgba(255,255,255,0.10);
  --text:#F3EFF6;
  --muted:#ADA6BC;

  /* 浮层实底：带一点蓝紫，比纯黑活泼 */
  --solid:#100C18;
  --solid-2:#1C1728;
  --solid-3:#261E36;
  --amber:#FF9500;      /* 焦点橙 */
  --signal:#FF7B00;     /* 虎牙橙 */
  --pink2:#FFB04D;      /* 亮橙 */
  --radius:16px;        /* 更圆润 */

  --safe-top:0px;
  --safe-bottom:0px;
  --safe-left:0px;
  --safe-right:0px;
}
:root{
  --safe-top:var(--fm-safe-top,0px);
  --safe-bottom:var(--fm-safe-bottom,0px);
  --safe-left:var(--fm-safe-left,0px);
  --safe-right:var(--fm-safe-right,0px);
}
@supports (top: max(0px, 1px)){
  :root{
    --safe-top:max(var(--fm-safe-top,0px), env(safe-area-inset-top,0px));
    --safe-bottom:max(var(--fm-safe-bottom,0px), env(safe-area-inset-bottom,0px));
    --safe-left:max(var(--fm-safe-left,0px), env(safe-area-inset-left,0px));
    --safe-right:max(var(--fm-safe-right,0px), env(safe-area-inset-right,0px));
  }
}

*{ -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; padding:0;
  height:100%;
  background:transparent;           /* App 壁纸透出，不写死背景 */
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 浏览器预览时给一个底色，App 内保持透明 */
html:not(.fm-native) body{ background:#0A0D13; }

body{
  min-height:100vh;
  min-height:var(--fm-web-height,100vh);
  overflow-x:hidden;
  position:relative;
}

/* 压暗蒙版：WebHome 页面是透明的，App 壁纸直接透上来，
   卡片和文字压在星云上根本看不清。这层垫在内容底下、壁纸之上，
   把壁纸压下去但不盖死 —— 氛围还在，可读性回来了。 */
body::before{
  content:'';
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  z-index:-2;
  /* 二次元梦幻夜空：粉紫渐变打底 + 多处柔光斑，不透明、不靠壁纸 */
  background:
    radial-gradient(90% 55% at 82% -8%,  rgba(255,155,184,0.30), transparent 62%),
    radial-gradient(85% 50% at 12% 6%,   rgba(140,110,240,0.28), transparent 60%),
    radial-gradient(80% 55% at 95% 60%,  rgba(255,149,0,0.20),  transparent 58%),
    radial-gradient(90% 60% at 5% 108%,  rgba(255,119,0,0.24), transparent 60%),
    linear-gradient(165deg, #1a1030 0%, #150e26 38%, #10101f 70%, #0d0a18 100%);
  pointer-events:none;
}
/* 极光带：斜向流光，极缓慢漂移 */
body::after{
  content:'';
  position:fixed;
  top:-20%; left:-20%; right:-20%; bottom:-20%;
  z-index:-1;
  background:
    radial-gradient(40% 22% at 30% 30%, rgba(255,155,184,0.14), transparent 70%),
    radial-gradient(46% 24% at 70% 66%, rgba(120,150,255,0.12), transparent 70%);
  filter:blur(30px);
  opacity:.9;
  pointer-events:none;
  animation:aurora 26s ease-in-out infinite alternate;
}
@keyframes aurora{
  0%   { transform:translate(0,0) scale(1); }
  50%  { transform:translate(3%, -2%) scale(1.08); }
  100% { transform:translate(-3%, 2%) scale(1.04); }
}
@media (prefers-reduced-motion: reduce){ body::after{ animation:none; } }

/* 星星点缀：小圆点铺一层，很淡 */
.stars{ position:fixed; inset:0; top:0;left:0;right:0;bottom:0; z-index:-1; pointer-events:none;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 65% 15%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 80% 45%, rgba(255,255,255,.45), transparent),
    radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 15% 85%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 55% 55%, rgba(255,255,255,.3), transparent);
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{ 0%,100%{ opacity:.6; } 50%{ opacity:1; } }
@media (prefers-reduced-motion: reduce){ .stars{ animation:none; } }

/* 樱花层：固定铺满、极淡、缓慢飘落。纯 CSS 花瓣，无图片。 */
.sakura{ position:fixed; inset:0; top:0;left:0;right:0;bottom:0; z-index:-1; pointer-events:none; overflow:hidden; }
.sakura i{
  position:absolute; top:-8%;
  background:radial-gradient(circle at 32% 28%, #FFD4E2, #FB7299 75%);
  border-radius:14px 2px 14px 2px;
  opacity:0;
  box-shadow:0 0 6px rgba(255,119,0,0.5);
  animation:fall linear infinite;
}
.sakura i:nth-child(1){ left:6%;  width:14px;height:14px; animation-duration:13s; animation-delay:0s;  }
.sakura i:nth-child(2){ left:18%; width:18px;height:18px; animation-duration:17s; animation-delay:2s;  }
.sakura i:nth-child(3){ left:31%; width:12px;height:12px; animation-duration:15s; animation-delay:6s;  }
.sakura i:nth-child(4){ left:44%; width:16px;height:16px; animation-duration:19s; animation-delay:1s;  }
.sakura i:nth-child(5){ left:56%; width:13px;height:13px; animation-duration:14s; animation-delay:8s;  }
.sakura i:nth-child(6){ left:68%; width:17px;height:17px; animation-duration:18s; animation-delay:4s;  }
.sakura i:nth-child(7){ left:79%; width:12px;height:12px; animation-duration:16s; animation-delay:10s; }
.sakura i:nth-child(8){ left:88%; width:15px;height:15px; animation-duration:20s; animation-delay:3s;  }
.sakura i:nth-child(9){ left:95%; width:11px;height:11px; animation-duration:15s; animation-delay:7s;  }
.sakura i:nth-child(10){left:12%; width:13px;height:13px; animation-duration:21s; animation-delay:11s; }
@keyframes fall{
  0%   { transform:translateY(-12vh) translateX(0) rotate(0deg);     opacity:0; }
  12%  { opacity:.85; }
  50%  { transform:translateY(50vh) translateX(28px) rotate(180deg); }
  88%  { opacity:.7; }
  100% { transform:translateY(112vh) translateX(-12px) rotate(360deg); opacity:0; }
}
@media (prefers-reduced-motion: reduce){ .sakura{ display:none; } }

img{ border:0; display:block; }
button,input{ font:inherit; color:inherit; }
button{ background:none; border:0; cursor:pointer; }

/* ============ 顶栏 ============ */
.top{
  position:sticky; top:0; z-index:40;
  padding:8px 12px;
  padding-top:calc(var(--safe-top) + 4px);
  padding-left:12px; padding-right:12px;
  background:rgba(16,11,24,0.7);
  border-bottom:1px solid rgba(255,119,0,0.14);
}
@supports (backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px)){
  .top{ -webkit-backdrop-filter:blur(20px) saturate(1.3); backdrop-filter:blur(20px) saturate(1.3); background:rgba(16,11,24,0.55); }
}
@supports (backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px)){
  .top{ -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
}


.brand{
  display:inline-block; vertical-align:middle;
  padding:0; margin:0;
  line-height:40px;
  white-space:nowrap;
}
/* Logo 图标：兼作网络状态灯 —— 正常是虎牙橙，断网时褪成灰 */
.brand .mark{
  display:inline-block; vertical-align:middle;
  color:var(--signal);
  line-height:0;
  transition:color .25s ease;
  animation:breathe 3.2s ease-in-out infinite;
  transform-origin:center;
}
@keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@media (prefers-reduced-motion: reduce){ .brand .mark{ animation:none; } }
.brand .mark svg{ display:block; }
.brand .mark.ok{ color:var(--signal); }
.brand .mark.bad{ color:#8A93A0; }        /* 断网：褪成灰，不刺眼但看得出来 */
.brand .word{
  display:inline-block; vertical-align:middle;
  margin-left:8px;
  font-size:19px; font-weight:800;
  /* 圆润无衬线优先，柔和一点的字重 */
  font-family:"Baloo 2","Quicksand","Nunito","PingFang SC","Hiragino Sans GB",
              -apple-system,"Segoe UI",system-ui,sans-serif;
  letter-spacing:-.01em;
  /* 虎牙橙双色渐变填充，和图标、按钮同一套色 */
  background:linear-gradient(100deg,var(--signal) 0%,var(--pink2) 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  padding-right:2px;                       /* 渐变裁字右侧别切到 */
  text-shadow:0 1px 8px rgba(255,119,0,0.2);
}
.brand:active .word{ transform:scale(0.96); }
.brand:active .mark{ transform:scale(0.94); }
.brand:focus .word{ -webkit-text-fill-color:var(--amber); color:var(--amber); background:none; }
.brand:focus .mark{ color:var(--amber); }

.gear{
  display:inline-block; vertical-align:middle;
  width:40px; height:40px;
  border:0; background:none;
  color:var(--muted);
  line-height:0;
  text-align:center;
  transition:color .18s ease, transform .3s ease;
}
.gear svg{ display:inline-block; vertical-align:middle; }
.gear:active{ transform:rotate(60deg); }
.gear:focus{ color:var(--amber); transform:rotate(60deg); }
@media (prefers-reduced-motion: reduce){
  .gear{ transition:none; }
  .gear:active, .gear:focus{ transform:none; }
}

/* 搜索联想 */
.sug{
  position:absolute;
  top:44px; left:0; right:0;
  z-index:80;
  display:none;
  border-radius:14px;
  overflow:hidden;
  background:rgba(18,21,29,0.98);
  border:1px solid var(--line);
  box-shadow:0 16px 40px rgba(0,0,0,0.5);
}
.sug.open{ display:block; }

/* 搜索态：内容区轻微压暗，注意力收到搜索框上 */
body.searching .wrap{ opacity:.45; transition:opacity .2s ease; }
body.searching .tabs{ opacity:.45; transition:opacity .2s ease; }
.wrap, .tabs{ transition:opacity .2s ease; }
@media (prefers-reduced-motion: reduce){
  body.searching .wrap, body.searching .tabs, .wrap, .tabs{ transition:none; }
}
.sug-row{
  position:relative;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.sug-row:last-child{ border-bottom:0; }
.sug-hit{
  display:block; width:100%;
  padding:12px 42px 12px 14px;
  text-align:left;
  font-size:14px;
  color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sug-row.on,
.sug-hit:focus{ background:rgba(255,149,0,0.14); }
.sug-row.on .sug-hit,
.sug-hit:focus{ color:var(--amber); }
.sug .k{
  color:var(--muted);
  margin-right:10px;
  display:inline-flex;
  vertical-align:-2px;
}
.sug-del{
  position:absolute;
  right:4px; top:4px;
  width:36px; height:36px;
  color:var(--muted);
  font-size:17px; line-height:36px; text-align:center;
}
.sug-del:focus{ color:var(--amber); }
.search{
  display:inline-block; vertical-align:middle;
  width:auto; max-width:none;
  position:relative;
  margin-right:0;
}
/* logo 和齿轮一行，搜索框独占一行、左右顶满 */
.top-row{
  padding-top:2px;
  margin-bottom:8px;
  white-space:nowrap;
  position:relative;
}
.top-row .gear{ position:absolute; right:0; top:8px; margin-left:0; }
.search{ display:block; width:100%; }
.search input{ height:42px; line-height:42px; font-size:15px; }
.search .go{ top:6px; right:6px; }
.sug{ top:48px; }
.search input{
  width:100%; box-sizing:border-box;
  height:38px; line-height:38px;
  padding:0 40px 0 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--panel-2);
  outline:none;
  font-size:14px;
}
.search input:focus{ border-color:var(--signal); box-shadow:0 0 0 3px rgba(255,119,0,0.18); }
/* 系统自带的清除按钮：大小由内核决定，CSS 改不动，只能藏掉自己画 */
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration{
  -webkit-appearance:none;
  appearance:none;
  display:none;
}
.search input{ padding-right:76px; }   /* 给清空 + 搜索两个按钮腾位置 */

.search .clr{
  position:absolute;
  top:5px; right:40px;
  width:32px; height:32px;
  border-radius:50%;
  color:var(--muted);
  display:none;
  align-items:center; justify-content:center;
  padding:0;
}
.search .clr.on{ display:inline-flex; }
.search .clr:active{ color:var(--text); transform:scale(0.9); }
.search .clr:focus{ color:var(--amber); }

/* 两个按钮之间加一道细分隔，视觉上不糊成一坨 */
.search .clr.on + .go::before{
  content:'';
  position:absolute;
  left:-4px; top:8px;
  width:1px; height:16px;
  background:rgba(255,255,255,0.14);
}

.search .go{
  position:absolute;
  top:5px; right:6px;
  width:32px; height:32px;
  border-radius:50%;
  color:var(--muted);
  display:inline-flex;
  align-items:center; justify-content:center;
  padding:0;
}
.search .go:active{ color:var(--text); }
.search .go:focus{ color:var(--amber); }

.icon-btn{
  display:inline-block; vertical-align:middle;
  height:38px; min-width:38px; padding:0 10px;
  border-radius:999px; border:1px solid var(--line);
  background:var(--panel-2);
  font-size:13px; color:var(--muted);
  margin-left:6px;
}
.icon-btn:focus{ color:var(--ink); background:var(--amber); border-color:var(--amber); }

/* ============ 分类 tab ============ */
.tabs{
  white-space:nowrap; overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  margin-top:10px;
  padding-bottom:2px;
  /* 让 tabs 自己吃掉横向手势，不要交给页面（否则会被判成切类别） */
  touch-action:pan-x;
  overscroll-behavior-x:contain;   /* 横滑到头不带动页面 */
}
.tabs::-webkit-scrollbar{ display:none; }

/* 二级页标题栏：和 tabs 互斥显示 */
.liveareas{
  display:none;
  white-space:nowrap; overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  margin-top:8px; padding-bottom:2px;
  touch-action:pan-x;              /* 声明横向手势归它自己 */
  overscroll-behavior-x:contain;
}
.liveareas.on{ display:block; }
.liveareas::-webkit-scrollbar{ display:none; }
.larea{
  display:inline-block;
  padding:5px 13px; margin-right:7px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}
.larea.on{ background:linear-gradient(135deg,var(--signal),var(--pink2)); color:#fff; border-color:transparent; box-shadow:0 2px 10px rgba(255,119,0,0.3); font-weight:600; }

.subbar{
  display:none;
  position:relative;
  margin-top:10px;
  padding-bottom:2px;
  white-space:nowrap;
}
.subbar.on{ display:block; }
.tabs.off{ display:none; }

.sub-back{
  display:inline-flex; vertical-align:middle;
  align-items:center; justify-content:center;
  width:36px; height:36px;
  border-radius:50%;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--text);
  padding:0;
}
.sub-back svg{ margin-left:-1px; }
.sub-back:focus{ background:var(--amber); border-color:var(--amber); color:#0A0D13; }

.sub-meta{
  display:inline-block; vertical-align:middle;
  margin-left:10px;
  max-width:calc(100% - 150px);
  overflow:hidden;
}
.sub-name{
  font-size:14px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sub-desc{
  font-size:11px; color:var(--muted);
  margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sub-play{
  position:absolute;
  right:0; top:1px;
  z-index:3;
  padding:9px 15px;
  border-radius:999px;
  background:var(--signal);
  color:#fff;
  font-size:12px; font-weight:600;
  white-space:nowrap;
}

  async function req(url, opt){

      if(!r || !r.ok){ var e=new Error((r&&(r.error||('HTTP '+r.status)))||'请求失败'); e.status=r?r.status:0; throw e; }

    { g:'2165',name:'CSGO' },
    { g:'100023',name:'户外' },
    { g:'2633',name:'星秀' },

      title:(v.introduction || v.roomName || v.title || '').replace(/<[^>]+>/g,''),

      pic: v.screenshot || v.sScreenshot || v.cover || v.avatar || v.sAvatar180 || '',

  var SPAM_RE = /距你\s*\d+\s*[mM米]|日结.{0,4}(兼职|招|付|结算)|兼职.{0,4}(日结|招)|招.{0,6}(兼职|主持|模特).{0,10}(日结|结算)/;

  async function fetchLive(gid, page){
    var j, list;

  async function fetchSearch(kw, page){

  async function getStream(rid){

    var streams = null, dbg = '';

    // 方式1：stream base64
    var m1 = html.match(/"stream":\s*"([A-Za-z0-9+/=]{50,})"/);

    }
    // 方式2：HNF_GLOBAL_INIT 内联对象
    if(!streams){
      var m2 = html.match(/window\.HNF_GLOBAL_INIT\s*=\s*(\{[\s\S]*?\})\s*<\/script>/);

    }

    }

      if(m4){ try{ streams=JSON.parse(m4[1]); dbg='direct'; }catch(e){} }
    }

      var name    = unicode(pick(/"sStreamName":\s*"([^"]+)"/));
      var hlsAnti = unicode(pick(/"sHlsAntiCode":\s*"([^"]*)"/));
      var flvUrl  = unicode(pick(/"sFlvUrl":\s*"([^"]+)"/));
      var flvAnti = unicode(pick(/"sFlvAntiCode":\s*"([^"]*)"/));

      }
    }

    if(!streams || !streams.length){
      var has = html.indexOf('gameStreamInfoList')>=0;
      var hasHls = html.indexOf('sHlsUrl')>=0;
      throw new Error('无流：list'+(has?1:0)+' hls'+(hasHls?1:0)+' name'+(html.indexOf('sStreamName')>=0?1:0)+' len'+html.length);
    }

    var s0 = streams[0];
    function fixProto(u){ if(!u)return u; if(u.indexOf('//')===0) return 'https:'+u; return u; }
    // HLS 优先
    if(s0.sHlsUrl && s0.sStreamName){
      var url = buildUrl(fixProto(s0.sHlsUrl), s0.sStreamName, s0.sHlsAntiCode || '', 'm3u8');
      return { url: url, format:'application/x-mpegURL' };
    }
    if(s0.sFlvUrl && s0.sStreamName){
      var url2 = buildUrl(fixProto(s0.sFlvUrl), s0.sStreamName, s0.sFlvAntiCode || '', 'flv');
      return { url: url2 };
    }
    throw new Error('流地址字段缺失');
  }

  // 从任意层级的对象里挖出 gameStreamInfoList
  function digStreams(obj, d){
    d = d||0; if(!obj || d>12 || typeof obj!=='object') return null;
    if(obj.gameStreamInfoList && obj.gameStreamInfoList.length) return obj.gameStreamInfoList;
    if(Object.prototype.toString.call(obj)==='[object Array]'){
      for(var i=0;i<obj.length;i++){ var r=digStreams(obj[i],d+1); if(r)return r; }
      return null;
    }
    for(var k in obj){ if(obj.hasOwnProperty(k)){ var r2=digStreams(obj[k],d+1); if(r2)return r2; } }
    return null;
  }

  window.DouyuEngine = {
    CATE: CATE,
    setPrefs: function(p){ for(var k in p) if(p[k]!==undefined) prefs[k]=p[k]; },
    getUA: function(){ return prefs.ua; },
    live: fetchLive,
    search: fetchSearch,
    stream: getStream,
    resImg: resUrl,
    req: req
  };
})();
</script>

<script>
(function () {

  };

  /* 懒加载 */

  function lazyWatch(img){ if(window.IntersectionObserver){ if(!lazyIO){ lazyIO=new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ lazyLoad(en.target); lazyIO.unobserve(en.target); } }); },{rootMargin:'250px 0px'}); } lazyIO.observe(img); return; } lazyList.push(img); }

  function showState(h){ elState.innerHTML=h; }

  function loadingState(){ clearState(); elList.className='grid skel'; elList.replaceChildren(skeleton(12)); }

  function moeEmpty(t,s){ return '<div class="moe-empty"><svg viewBox="0 0 80 64" width="84" height="66" aria-hidden="true"><rect x="6" y="14" width="68" height="44" rx="15" fill="#FF7700"/><rect x="13" y="21" width="54" height="30" rx="10" fill="#1C1712"/><path d="M25 33 q4 5 8 0" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M47 33 q4 5 8 0" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg><div class="moe-text">'+t+'</div><div class="moe-sub">'+(s||'')+'</div></div>'; }

  /* 二级筛选：按已加载数据里出现过的具体内容(cate)做二次过滤，纯前端，不额外请求 */
  function updateAreas(){

  function autoPage(){ function near(){ if(view.loading||!view.more||!elMore.firstChild)return; var r=elMore.getBoundingClientRect(); if(r.top<window.innerHeight+500){ view.page++; load(false); } } window.addEventListener('scroll',function(){near();lazyScan();},{passive:true}); setInterval(function(){near();lazyScan();},1200); }

  /* 无封面图时的兜底占位图（虎牙橙底+简笔虎头），避免走原生播放器自带的默认图标 */
  var HUYA_ART = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">'+
    '<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">'+

    '<rect width="200" height="200" rx="40" fill="url(#bg2)"/>'+
    '<circle cx="100" cy="100" r="52" fill="#fff" fill-opacity="0.15"/>'+
    '<circle cx="100" cy="100" r="40" fill="#fff"/>'+
    '<polygon points="90,82 90,118 122,100" fill="#FF6B4A"/>'+
    '<circle cx="150" cy="56" r="12" fill="#fff"/>'+
    '<circle cx="150" cy="56" r="5" fill="#FF6B4A"/>'+
    '<text x="100" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#fff" letter-spacing="2">LIVE</text>'+
    '</svg>'

  /* 播放 */

      toast('正在解析直播…');

        await fm.vodInline({ vod_id:'hy_'+item.rid, vod_name:item.title||'虎牙直播', vod_pic:art, wallPic:art, vod_play_from:'直播', mark:epn, episodes:[{ name:epn, url:s.url }] });
      } else if(native && fm.play){

  }

  /* tabs = 分类 */
  function scrollTabIntoView(){ var on=elTabs.querySelector('.tab.on'); if(!on)return; var left=on.offsetLeft-(elTabs.clientWidth-on.offsetWidth)/2; if(elTabs.scrollTo) elTabs.scrollTo({left:left,behavior:'smooth'}); else elTabs.scrollLeft=left; }
  function clearSearchBox(){ setVal('q',''); if(typeof syncClear==='function') syncClear(); closeSug(); }
  function renderTabs(){

      b.addEventListener('click',function(){ clearSearchBox(); view.kind='live'; view.cate=t.g; renderTabs(); scrollTabIntoView(); load(true); });

  function doSearch(){ var q=getVal('q').trim(); if(!q)return; closeSug(); pushHistory(q); view.kind='search'; view.kw=q; renderTabs(); load(true); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); bodyClass('searching',false); }

  /* 搜索历史 + 联想（简版，无联想接口就只留历史） */
  var history_=[], elSug=$('sug'), sugItems=[], sugIdx=-1;
  var ICON_HIST='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 4v4h4"></path><path d="M12 8v4l3 2"></path></svg>';
  async function loadHistory(){ try{ var r=await store.get('history'); history_=r?JSON.parse(r):[]; }catch(e){ history_=[]; } }
  async function pushHistory(q){ q=String(q).trim(); if(!q)return; history_=history_.filter(function(x){return x!==q;}); history_.unshift(q); if(history_.length>12) history_=history_.slice(0,12); try{ await store.set('history',JSON.stringify(history_)); }catch(e){} }
  async function delHistory(q){ history_=history_.filter(function(x){return x!==q;}); try{ await store.set('history',JSON.stringify(history_)); }catch(e){} }
  function closeSug(){ elSug.className='sug'; elSug.replaceChildren(); sugItems=[]; sugIdx=-1; }
  function renderSug(list){ if(!list.length){closeSug();return;} sugItems=list; sugIdx=-1; elSug.replaceChildren(); list.forEach(function(w){ var row=document.createElement('div'); row.className='sug-row'; var b=document.createElement('button'); b.type='button'; b.className='sug-hit'; b.innerHTML='<span class="k">'+ICON_HIST+'</span>'; b.appendChild(document.createTextNode(w)); b.addEventListener('click',function(){ setVal('q',w); syncClear(); closeSug(); doSearch(); }); row.appendChild(b); var x=document.createElement('button'); x.type='button'; x.className='sug-del'; x.textContent='×'; x.addEventListener('click',function(e){ e.stopPropagation(); delHistory(w).then(function(){ if(history_.length)renderSug(history_); else closeSug(); }); }); row.appendChild(x); elSug.appendChild(row); }); elSug.className='sug open'; }
  function showHistory(){ if(getVal('q').trim())return; if(!history_.length){closeSug();return;} renderSug(history_); }
  function syncClear(){ var c=$('clrBtn'); if(c) c.className=getVal('q')?'clr on':'clr'; }
  function onType(){ syncClear(); if(!getVal('q').trim()) showHistory(); else closeSug(); }
  function sugKey(e){ var key=e.key||'',code=e.keyCode||0,open=elSug.className.indexOf('open')!==-1; if((key==='Escape'||code===27)&&open){closeSug();return true;} if(!open||!sugItems.length)return false; var nodes=elSug.querySelectorAll('.sug-row'); if(key==='ArrowDown'||code===40){sugIdx=(sugIdx+1)%sugItems.length;} else if(key==='ArrowUp'||code===38){sugIdx=(sugIdx<=0?sugItems.length:sugIdx)-1;} else if((key==='Enter'||code===13)&&sugIdx>=0){ setVal('q',sugItems[sugIdx]); syncClear(); closeSug(); doSearch(); return true; } else return false; var i; for(i=0;i<nodes.length;i++) nodes[i].className=(i===sugIdx)?'sug-row on':'sug-row'; e.preventDefault(); return true; }

  /* 自绘下拉 */
  function pickerLabel(sel){ var o=sel.options[sel.selectedIndex]; return o?o.textContent:''; }
  function buildPickers(){ var sels=document.querySelectorAll('.field select'); Array.prototype.forEach.call(sels,function(sel){ if(sel._picked)return; sel._picked=true; var btn=document.createElement('button'); btn.type='button'; btn.className='picker'; btn.textContent=pickerLabel(sel); sel.parentNode.insertBefore(btn,sel); sel._btn=btn; btn.addEventListener('click',function(){ openPicker(sel); }); }); }
  function syncPickers(){ var sels=document.querySelectorAll('.field select'); Array.prototype.forEach.call(sels,function(sel){ if(sel._btn) sel._btn.textContent=pickerLabel(sel); }); }
  function openPicker(sel){ var lab=sel.parentNode.querySelector('label'); $('optTitle').textContent=lab?lab.textContent:'选择'; var list=$('optList'); list.replaceChildren(); Array.prototype.forEach.call(sel.options,function(o,i){ var b=document.createElement('button'); b.type='button'; b.className='opt-item'+(i===sel.selectedIndex?' on':''); b.textContent=o.textContent; b.addEventListener('click',function(){ sel.selectedIndex=i; if(sel._btn) sel._btn.textContent=o.textContent; closePicker(); }); list.appendChild(b); }); $('optMask').className='opt-mask on'; $('optSheet').className='opt-sheet on'; }
  function closePicker(){ $('optMask').className='opt-mask'; $('optSheet').className='opt-sheet'; }

  /* 浮层 */
  var sheets={ settings:$('settings'), net:$('net') }, openName='';
  function openSheet(n,silent){ var k; for(k in sheets) sheets[k].className='sheet'; sheets[n].className='sheet open'; sheets[n].scrollTop=0; bodyClass('locked',true); openName=n; if(!silent) history.pushState({sheet:n},'','#'+n); }
  function closeSheet(silent){ var k; for(k in sheets) sheets[k].className='sheet'; bodyClass('locked',false); openName=''; if(!silent&&history.state&&history.state.sheet) history.back(); }
  window.addEventListener('popstate',function(){ if(openName){ closeSheet(true); } });

  /* 设置 */
  async function loadPrefs(){ var r=await store.get('prefs'); if(r){ try{ var p=JSON.parse(r); if(p.rate)prefs.rate=p.rate; if(p.wall)prefs.wall=p.wall; }catch(e){} } setVal('rate',prefs.rate); setVal('wall',prefs.wall); E.setPrefs(prefs); buildPickers(); syncPickers(); }
  async function savePrefs(){ prefs.rate=getVal('rate')||'0'; prefs.wall=getVal('wall')||'pic'; await store.set('prefs',JSON.stringify(prefs)); E.setPrefs(prefs); syncPickers(); toast('已保存'); closeSheet(); }

  /* 自检 */
  function diagLine(n,note){ var el=document.createElement('div'); el.className='diag-line'; el.innerHTML='<b>'+n+'</b> · <span>检测中…</span><div style="margin-top:4px">'+note+'</div>'; return el; }
  async function probe(el,fn){ var t0=Date.now(); try{ await fn(); el.querySelector('span').innerHTML='<span class="ok">通过 · '+(Date.now()-t0)+'ms</span>'; }catch(e){ el.querySelector('span').innerHTML='<span class="bad">失败 · '+String(e.message).slice(0,50)+'</span>'; } }
  async function runDiag(){
    var box=$('diag'); box.replaceChildren();
    var a=diagLine('列表接口','推荐/分区直播列表'); var b=diagLine('取流','点直播能否拿到地址');
    box.appendChild(a); box.appendChild(b);
    var firstRid=0;
    await probe(a,async function(){ var r=await E.live('',1); if(!r.items.length) throw new Error('空'); firstRid=r.items[0].rid; });
    await probe(b,async function(){ if(!firstRid) throw new Error('无房间'); var s=await E.stream(firstRid); if(!s.url) throw new Error('无地址'); b.querySelector('div').innerHTML='拿到 '+(s.format?'HLS':'FLV'); });
  }

  /* 手势：左右切分类 + 下拉刷新 */
  var PULL_MAX=110, PULL_FIRE=68, pullY=0;
  var elWrap=$('wrap'), elPullSpin=$('pullSpin');
  function setPull(y){ pullY=y; elWrap.style.transform=y?('translateY('+y+'px)'):''; elPullSpin.style.opacity=String(Math.min(y/PULL_FIRE,1)); elPullSpin.style.transform='translateY('+(y*0.6-40)+'px) rotate('+(y*3)+'deg)'; elPullSpin.className='pull-spin'+(y>=PULL_FIRE?' ready':''); }
  function endPull(){ elWrap.className='wrap snap'; elWrap.style.transform=''; elPullSpin.className='pull-spin'; elPullSpin.style.opacity='0'; elPullSpin.style.transform='translateY(-40px)'; pullY=0; setTimeout(function(){elWrap.className='wrap';},460); }
  function releasePull(refresh){ elWrap.className='wrap snap'; if(!refresh){endPull();return;} elWrap.style.transform='translateY(56px)'; elPullSpin.className='pull-spin spin'; elPullSpin.style.opacity='1'; elPullSpin.style.transform='translateY(-6px)'; load(true).then(endPull,endPull); }
  function cateIndex(){ var i; for(i=0;i<E.CATE.length;i++) if(E.CATE[i].g===view.cate)return i; return -1; }
  function gotoCate(dir){ var idx=cateIndex(); if(idx===-1)idx=0; var n=idx+dir; if(n<0||n>=E.CATE.length)return; clearSearchBox(); view.kind='live'; view.cate=E.CATE[n].g; renderTabs(); scrollTabIntoView(); load(true); }
  function initGestures(){
    var sx=0,sy=0,ax='',touching=false,swipeX=0;
    document.addEventListener('touchstart',function(e){ if(openName||e.touches.length>1){ax='no';return;} if(hasBodyClass('searching')){ax='no';return;} var t=e.target; if(t&&t.closest&&t.closest('.tabs,.sug,.sheet')){ax='no';return;} sx=e.touches[0].clientX; sy=e.touches[0].clientY; ax=''; touching=true; swipeX=0; elWrap.className='wrap'; },{passive:true});
    document.addEventListener('touchmove',function(e){ if(!touching||ax==='no')return; var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy; if(!ax){ var adx=Math.abs(dx),ady=Math.abs(dy); if(adx<6&&ady<6)return; if(adx>ady*1.05){ ax='x'; } else if(dy>0&&window.pageYOffset<=0&&ady>adx*1.5){ ax='y'; } else if(ady>adx*1.5){ ax='no'; return; } else return; } if(ax==='x'){ var idx=cateIndex(); var edge=(dx>0&&idx<=0)||(dx<0&&idx>=E.CATE.length-1); swipeX=edge?dx*0.28:dx*0.85; elWrap.style.transform='translateX('+swipeX+'px)'; elWrap.style.opacity=String(1-Math.min(Math.abs(swipeX)/400,0.35)); if(e.cancelable)e.preventDefault(); return; } if(ax==='y'){ if(dy<=0||window.pageYOffset>0){ if(pullY)setPull(0); ax='no'; return; } setPull(PULL_MAX*(1-Math.exp(-dy/(PULL_MAX*1.1)))); if(e.cancelable)e.preventDefault(); } },{passive:false});
    function done(){ if(!touching)return; touching=false; if(ax==='x'){ elWrap.className='wrap snap'; elWrap.style.transform=''; elWrap.style.opacity=''; setTimeout(function(){elWrap.className='wrap';},420); if(Math.abs(swipeX)>=56) gotoCate(swipeX<0?1:-1); } else if(ax==='y'){ releasePull(pullY>=PULL_FIRE); } ax=''; }
    document.addEventListener('touchend',done); document.addEventListener('touchcancel',done);
  }

  function clampSafeTop(){ try{ var cs=getComputedStyle(document.documentElement); var mode=(cs.getPropertyValue('--fm-chrome-mode')||'').trim(); var raw=parseFloat(cs.getPropertyValue('--fm-safe-top'))||0; var sb=parseFloat(cs.getPropertyValue('--fm-status-bar-height'))||0; var use; if(mode==='normal'||mode==='tv-normal'){ use=0; } else if(sb>0&&sb<=48){ use=sb; } else if(raw<=48){ use=raw; } else { use=28; } document.documentElement.style.setProperty('--safe-top', use+'px'); }catch(e){} }

  function bind(){
    on('goBtn','click',doSearch);
    on('q','input',onType);
    on('q','focus',function(){ bodyClass('searching',true); showHistory(); });
    on('q','keydown',function(e){ if(sugKey(e))return; if(e.key==='Enter'||e.keyCode===13)doSearch(); });
    on('q','blur',function(){ setTimeout(closeSug,160); });
    on('clrBtn','click',function(){ setVal('q',''); syncClear(); showHistory(); var q=$('q'); if(q&&q.focus)q.focus(); });
    on('setBtn','click',function(){ openSheet('settings'); });
    on('netBtn','click',function(){ openSheet('net'); runDiag(); });
    on('setBack','click',function(){ closeSheet(); });
    on('netBack','click',function(){ closeSheet(); });
    on('runDiag','click',runDiag);
    on('optMask','click',closePicker);
    on('saveBtn','click',savePrefs);
    on('resetBtn','click',function(){ setVal('rate','0'); setVal('wall','pic'); syncPickers(); });
    document.addEventListener('touchstart',function(e){ var t=e.target; if(t&&t.closest&&t.closest('.search'))return; if(document.activeElement!==$('q')&&!hasBodyClass('searching'))return; closeSug(); var q=$('q'); if(q&&q.blur)q.blur(); bodyClass('searching',false); },{passive:true});
  }

  async function boot(){
    native=!!(window.fm&&window.fm.req);
    clampSafeTop(); window.addEventListener('fmviewport',clampSafeTop);
    document.documentElement.className+=native?' fm-native':'';
    try{ await loadPrefs(); }catch(e){}
    try{ bind(); }catch(e){}
    try{ renderTabs(); }catch(e){}
    try{ autoPage(); }catch(e){}
    try{ initGestures(); }catch(e){}
    try{ await loadHistory(); }catch(e){}
    if(native&&fm.ui&&fm.ui.setChrome){ try{ fm.ui.setChrome({mode:'edge',statusBarStyle:'light',startup:true})['catch'](function(){}); }catch(e){} }
    load(true);
  }
  if(window.fm&&window.fm.req) boot();
  else{ var started=false; window.addEventListener('fmsdk',function(){ if(!started){started=true;boot();} }); setTimeout(function(){ if(!started){started=true;boot();} },1200); }
})();
</script>
