    // 不要带 songs filter params（部分地区/版本会直接空结果）
    function pack(d){
      if (!d) return { list: [], singers: [] };
      return {
        list: _ytmDedup(_ytmCollectSongs(d, [], 0)),
        singers: _ytmDedupArtists(_ytmCollectArtists(d, [], 0))
      };
    }
    return _ytmPost("search", { query: kw }, "web").then(function(d){
      var p = pack(d);
      if (p.list.length || p.singers.length) return p;
      return _ytmPost("search", { query: kw }, "android_music").then(pack);
    });
  }

  function fromYoutubeWeb(){
    // 普通 YouTube 搜索兜底（结构不同）
    var url = "https://www.youtube.com/youtubei/v1/search?prettyPrint=false&key=" + encodeURIComponent(YTM_KEY);
    var body = JSON.stringify({
      context: { client: { clientName: "WEB", clientVersion: "2.20250312.00.00", hl: "en", gl: "US" } },
      query: kw
    });
    return ADAPTER_request(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "User-Agent": YTM_HDR["User-Agent"],
        "Origin": "https://www.youtube.com",
        "Referer": "https://www.youtube.com/"
      },
      body: body,
      timeout: 16,
      credentials: "omit"
    }).then(function(txt){
      if (!txt) return [];
      var d = null;
      try { d = JSON.parse(txt); } catch(e){ d = jsonp_safeParse(txt); }
      if (!d) return [];
      var out = [];
      function walk(node, depth){
        if (!node || depth > 14) return;
        if (Array.isArray(node)){ node.forEach(function(n){ walk(n, depth+1); }); return; }
        if (typeof node !== "object") return;
        var vr = node.videoRenderer || node.playlistVideoRenderer;
        if (vr && vr.videoId){
          var title = _ytmWalkRuns(((vr.title || {}).runs) || []) || (vr.title && vr.title.simpleText) || "";
          var author = "";
          try {
            author = _ytmWalkRuns(((((vr.ownerText || vr.shortBylineText) || {}).runs) || []));
          } catch(e){}
          var dur = 0;
          try {
            var ds = (vr.lengthText && (vr.lengthText.simpleText || _ytmWalkRuns(vr.lengthText.runs || []))) || "";
            dur = _ytmParseDuration(ds);
          } catch(e2){}
          var cover = "";
          try {
            var th = (vr.thumbnail && vr.thumbnail.thumbnails) || [];
            cover = _ytmThumb(th) || ("https://i.ytimg.com/vi/" + vr.videoId + "/hqdefault.jpg");
          } catch(e3){}
          if (title){
            out.push({
              songmid: "yt_" + vr.videoId,
              videoId: vr.videoId,
              media_mid: vr.videoId,
              name: title,
              singer: author || "YouTube",
              albumname: "",
              cover: cover,
              interval: dur,
              isVip: false,
              playUrl: "",
              source: "ytmusic"
            });
          }
        }
        Object.keys(node).forEach(function(k){
          if (k === "videoRenderer" || k === "playlistVideoRenderer") return;
          if (node[k] && typeof node[k] === "object") walk(node[k], depth+1);
        });
      }
      walk(d, 0);
      return _ytmDedup(out);
    }).catch(function(){ return []; });
  }

  function withSingers(list, singers){
    list = list || [];
    singers = singers || [];
    if (singers.length < 3 && list.length){
      var seen = {};
      singers.forEach(function(a){ if (a.name) seen[a.name] = 1; });
      list.forEach(function(s){
        var n = (s.singer || "").split(/[\/、,&]/)[0].trim();
        if (!n || seen[n] || /YouTube/i.test(n)) return;
        seen[n] = 1;
        singers.push({
          mid: "yt_artist_" + n,
          browseId: "",
          name: n,
          cover: s.cover || "",
          source: "ytmusic",
          fromSong: true
        });
      });
    }
    return { list: list.slice(0, 30), total: list.length, singers: singers.slice(0, 12) };
  }

  // 并行：YT Music Innertube + 普通 YouTube 搜索，谁先有结果用谁
  return Promise.all([
    fromInnertube().catch(function(){ return { list: [], singers: [] }; }),
    fromYoutubeWeb().catch(function(){ return []; })
  ]).then(function(arr){
    var pack = arr[0] || { list: [], singers: [] };
    var webList = arr[1] || [];
    var list = (pack.list && pack.list.length) ? pack.list : webList;
    var singers = pack.singers || [];
    // Innertube 有歌手但没歌时，用 web 补歌
    if ((!list || !list.length) && webList.length) list = webList;
    if (!list || !list.length) list = ytmFallbackSearch(kw);
    return withSingers(list, singers);
  }).catch(function(){
    return fromYoutubeWeb().then(function(list2){
      if (!list2 || !list2.length) list2=ytmFallbackSearch(kw);
      return withSingers(list2 || [], []);
    }).catch(function(){ var fallback=ytmFallbackSearch(kw); return withSingers(fallback, []); });
  });
};

/** 从 player 响应提取最佳音频直链 */
function _ytmPickAudio(d){
  if (!d) return null;
  var formats = [];
  try {
    var sf = (d.streamingData && d.streamingData.adaptiveFormats) || [];
    var f2 = (d.streamingData && d.streamingData.formats) || [];
    formats = sf.concat(f2);
  } catch(e){}
  var best = null, bestBr = -1;
  formats.forEach(function(f){
    if (!f || !f.url) return;
    var mime = String(f.mimeType || "");
    // 只要纯音频
    if (mime.indexOf("audio/") < 0 && !(f.audioQuality || f.audioSampleRate)) return;
    if (mime.indexOf("video/") >= 0 && !(f.audioQuality)) return;
    var br = Number(f.bitrate || f.averageBitrate || 0);
    if (br > bestBr){ bestBr = br; best = f; }
  });
  if (best && best.url) return String(best.url).replace(/^http:/, "https:");
  // 部分响应只有 signatureCipher，浏览器端难解，跳过
  return null;
}

API.ytmusicUrl = function(song){
  var vid = (song && (song.videoId || String(song.songmid || "").replace(/^yt_/, ""))) || "";
  if (!vid) return Promise.resolve(null);
  if (song.playUrl && /^https?:\/\//i.test(song.playUrl) && /googlevideo\.com|youtube\.com|piped|invidious/i.test(song.playUrl)){
    return Promise.resolve(song.playUrl);
  }

  // 自定义代理
  var base = (state.ytmApi || "").replace(/\/$/, "");
  if (base){
    var u = base + (base.indexOf("?") >= 0 ? "&" : "?") + "id=" + encodeURIComponent(vid);
    return ADAPTER_request(u, { headers: { "User-Agent": QQ_HEADERS["User-Agent"] }, timeout: 12 }).then(function(txt){
      if (!txt) return null;
      if (/^https?:\/\//i.test(String(txt).trim())) return String(txt).trim().replace(/^http:/, "https:");
      var d = null;
      try { d = JSON.parse(txt); } catch(e){ d = jsonp_safeParse(txt); }
      if (!d) return null;
      var url = d.url || d.playUrl || d.music || (d.data && (d.data.url || d.data.playUrl)) || "";
      return url ? String(url).replace(/^http:/, "https:") : null;
    }).catch(function(){ return null; });
  }

  function pickAudio(d){
    if (!d) return null;
    var status = (d.playabilityStatus && d.playabilityStatus.status) || "";
    if (status && status !== "OK") return null;
    var formats = [];
    try {
      var sf = (d.streamingData && d.streamingData.adaptiveFormats) || [];
      var f2 = (d.streamingData && d.streamingData.formats) || [];
      formats = sf.concat(f2);
    } catch(e){}
    var best = null, bestBr = -1;
    formats.forEach(function(f){
      if (!f || !f.url) return;
      var mime = String(f.mimeType || "");
      var isAudio = mime.indexOf("audio/") >= 0 || !!f.audioQuality || !!f.audioSampleRate;
      if (!isAudio) return;
      var br = Number(f.bitrate || f.averageBitrate || 0);
      if (br > bestBr){ bestBr = br; best = f; }
    });
    return best && best.url ? String(best.url).replace(/^http:/, "https:") : null;
  }

  function playerTry(clientName, clientVersion, host, extraClient){
    var client = Object.assign({
      clientName: clientName,
      clientVersion: clientVersion,
      hl: "en",
      gl: "US"
    }, extraClient || {});
    var body = {
      context: { client: client },
      videoId: vid,
      contentCheckOk: true,
      racyCheckOk: true,
      playbackContext: {
        contentPlaybackContext: { html5Preference: "HTML5_PREF_WANTS" }
      }
    };
    var url = host + "/youtubei/v1/player?prettyPrint=false&key=" + encodeURIComponent(YTM_KEY);
    return ADAPTER_request(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "User-Agent": clientName.indexOf("ANDROID") >= 0
          ? ("com.google.android.youtube/" + clientVersion + " (Linux; U; Android 11) gzip")
          : YTM_HDR["User-Agent"],
        "Origin": host,
        "Referer": host + "/watch?v=" + encodeURIComponent(vid)
      },
      body: JSON.stringify(body),
      timeout: 9,
      credentials: "omit"
    }).then(function(txt){
      if (!txt) return null;
      var d = null;
      try { d = JSON.parse(txt); } catch(e){ d = jsonp_safeParse(txt); }
      return pickAudio(d);
    }).catch(function(){ return null; });
  }

  var chain = Promise.resolve(null);
  [
    function(){ return playerTry("ANDROID", "19.17.34", "https://www.youtube.com", { androidSdkVersion: 30 }); },
    function(){ return playerTry("ANDROID_MUSIC", "7.27.52", "https://music.youtube.com", { androidSdkVersion: 30 }); },
    function(){ return playerTry("IOS", "19.09.3", "https://www.youtube.com", { deviceMake: "Apple", deviceModel: "iPhone16,2" }); },
    function(){ return playerTry("WEB", "2.20250312.00.00", "https://www.youtube.com", {}); }
  ].forEach(function(fn){
    chain = chain.then(function(got){ return got || fn(); });
  });

  [
    "https://api.piped.private.coffee/streams/" + encodeURIComponent(vid),
    "https://pipedapi.leptons.xyz/streams/" + encodeURIComponent(vid),
    "https://inv.nadeko.net/api/v1/videos/" + encodeURIComponent(vid),
    "https://invidious.jing.rocks/api/v1/videos/" + encodeURIComponent(vid)
  ].forEach(function(mu){
    chain = chain.then(function(got){
      if (got) return got;
      return ADAPTER_request(mu, {
        headers: { "User-Agent": QQ_HEADERS["User-Agent"], "Accept": "application/json" },
        timeout: 9,
        credentials: "omit"
      }).then(function(txt){
        if (!txt) return null;
        var d = null;
        try { d = JSON.parse(txt); } catch(e){ return null; }
        var audio = d.audioStreams || [];
        if (audio.length){
          audio.sort(function(a,b){ return (b.bitrate||0)-(a.bitrate||0); });
          var u2 = audio[0] && audio[0].url;
          if (u2) return String(u2).replace(/^http:/, "https:");
        }
        var af = d.adaptiveFormats || d.formatStreams || [];
        var best = null, bestBr = -1;
        af.forEach(function(f){
          var t = String(f.type || f.mimeType || "");
          if (t.indexOf("audio") < 0) return;
          var br = Number(f.bitrate || 0);
          if (f.url && br >= bestBr){ bestBr = br; best = f.url; }
        });
        return best ? String(best).replace(/^http:/, "https:") : null;
      }).catch(function(){ return null; });
    });
  });

  return chain;
};

/** 清洗 YT 标题，便于 QQ/酷我/网易跨源匹配 */
API.ytCleanTitle = function(song){
  var raw = (song && song.name) || "";
  var singer = (song && song.singer) || "";
  // 书名号优先
  var book = /[《「]([^」》]+)[」》]/.exec(raw);
  if (book && book[1]) return book[1].trim();
  var name = String(raw)
    .replace(/\s*[\(（\[]?\s*Official\s*(Music\s*)?Video\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Official\s*Audio\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Official\s*Lyric\s*Video\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Lyrics?\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Audio\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*MV\s*[\)）\]]?/ig, "")
    .replace(/\s*\|\s*Official.*$/ig, "")
    .replace(/\s*【[^】]*】/g, "")
    .replace(/\s*\[[^\]]*\]/g, "")
    .replace(/Joker\s*Xue/ig, "")
    .replace(/\s+/g, " ")
    .trim();
  if (singer){
    var s0 = singer.split(/[\/、,&]/)[0].trim();
    if (s0 && name.indexOf(s0) === 0){
      name = name.slice(s0.length).replace(/^[\s\-–—_:：]+/, "").trim();
    }
  }
  return name || raw;
};

API.ytmusicLyric = function(videoId){
  if (!videoId) return Promise.resolve({ lyric: "", trans: "" });
  // next → watchNext → lyrics browseId
  return _ytmPost("next", {
    enablePersistentPlaylistPanel: true,
    isAudioOnly: true,
    tunerSettingValue: "AUTOMIX_SETTING_NORMAL",
    videoId: videoId
  }, "web").then(function(d){
    if (!d) return { lyric: "", trans: "" };
    var browseId = "";
    try {
      var tabs = (((((d.contents || {}).singleColumnMusicWatchNextResultsRenderer || {}).tabbedRenderer || {}).tabbedSearchResultsRenderer || {}).tabs) ||
        (((((d.contents || {}).singleColumnMusicWatchNextResultsRenderer || {}).tabbedRenderer || {}).watchNextTabbedResultsRenderer || {}).tabs) || [];
      // 结构多变，深度找 lyrics
      function findLyricsId(node, depth){
        if (!node || depth > 14) return "";
        if (Array.isArray(node)){
          for (var i=0;i<node.length;i++){ var x=findLyricsId(node[i], depth+1); if (x) return x; }
          return "";
        }
        if (typeof node !== "object") return "";
        if (node.browseId && String(node.browseId).indexOf("MPLYt") === 0) return node.browseId;
        if (node.endpoint && node.endpoint.browseEndpoint && node.endpoint.browseEndpoint.browseId){
          var bid = node.endpoint.browseEndpoint.browseId;
          if (String(bid).indexOf("MPLYt") === 0) return bid;
        }
        if (node.browseEndpoint && node.browseEndpoint.browseId){
          var bid2 = node.browseEndpoint.browseId;
          if (String(bid2).indexOf("MPLYt") === 0) return bid2;
        }
        var keys = Object.keys(node);
        for (var k=0;k<keys.length;k++){
          var v = node[keys[k]];
          if (v && typeof v === "object"){
            var f = findLyricsId(v, depth+1);
            if (f) return f;
          }
        }
        return "";
      }
      browseId = findLyricsId(d, 0);
    } catch(e){}
    if (!browseId) return { lyric: "", trans: "" };
    return _ytmPost("browse", { browseId: browseId }, "web").then(function(bd){
      if (!bd) return { lyric: "", trans: "" };
      var lines = [];
      function collectLines(node, depth){
        if (!node || depth > 12) return;
        if (Array.isArray(node)){ node.forEach(function(n){ collectLines(n, depth+1); }); return; }
        if (typeof node !== "object") return;
        if (node.lyricsLineRenderer){
          var t = _ytmWalkRuns((((node.lyricsLineRenderer || {}).runs) || (node.lyricsLineRenderer && node.lyricsLineRenderer.text && node.lyricsLineRenderer.text.runs) || []));
          // 另一结构
          if (!t && node.lyricsLineRenderer.text) t = _ytmWalkRuns(node.lyricsLineRenderer.text.runs || []);
          if (t) lines.push(t);
        }
        if (node.description && node.description.runs){
          var full = _ytmWalkRuns(node.description.runs);
          if (full && full.length > 20) lines.push(full);
        }
        Object.keys(node).forEach(function(k){
          if (node[k] && typeof node[k] === "object") collectLines(node[k], depth+1);
        });
      }
      collectLines(bd, 0);
      // 去重保序
      var seen = {}, out = [];
      lines.forEach(function(l){ if (l && !seen[l]){ seen[l]=1; out.push(l); } });
      // 无时间轴：包成简单 LRC（每行 +3s 估）
      var lrc = out.map(function(line, i){
        var sec = i * 3;
        var m = Math.floor(sec/60), s = sec%60;
        return "[" + (m<10?"0":"")+m + ":" + (s<10?"0":"")+s + ".00]" + line;
      }).join("\n");
      return { lyric: lrc, trans: "" };
    });
  }).catch(function(){ return { lyric: "", trans: "" }; });
};

function shuffleArray(arr){
  var a = (arr || []).slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function dedupePlaylists(list){
  var seen = {}, out = [];
  (list || []).forEach(function(p){
    if (!p || !p.dissid || seen[p.dissid]) return;
    seen[p.dissid] = 1;

  });
  return out;
}

// 智能推荐：多源混合 + 随机分类 + 随机分页 + 全量打散（换一批真的会变）
// 第 4 个参数 refresh=true 时强制换源/换页
API.recommendPlaylists = function(categoryId, sortId, count, refresh){
  count = count || 18;
  if (refresh) _plRefreshNonce++;
  var nonce = _plRefreshNonce + (refresh ? Math.floor(Math.random()*1000) : 0);

  // 指定具体分类（歌单页 Tab）
  if (categoryId && categoryId !== 10000000 && categoryId !== "10000000" && categoryId !== "smart" && categoryId !== null){
    var sin = refresh ? (Math.floor(Math.random() * 8) * 20) : 0; // 0/20/40/.../140
    return API.playlistsByTagPage(categoryId, sortId || 5, sin, Math.max(count, 24)).then(function(list){
      if (list.length) return shuffleArray(list).slice(0, count);
      // 空则换页再试一次
      return API.playlistsByTagPage(categoryId, 5, 0, count).then(function(list2){
        return shuffleArray(list2).slice(0, count);
      });
    });
  }

  // 每次（尤其换一批）随机抽 3 个分类 + 随机分页
  var pool = shuffleArray(PL_CAT_POOL);
  var catA = pool[nonce % pool.length];
  var catB = pool[(nonce + 3) % pool.length];
  var catC = pool[(nonce + 7) % pool.length];
  var sinA = (nonce % 5) * 12;
  var sinB = ((nonce + 2) % 5) * 12;
  var sinC = ((nonce + 4) % 5) * 12;

  return Promise.all([
    API.hotRecommendPlaylists(),
    API.playlistsByTagPage(catA, 5, sinA, 16),
    API.playlistsByTagPage(catB, 5, sinB, 16),
    API.playlistsByTagPage(catC, 5, sinC, 16)
  ]).then(function(parts){
    var mixed = dedupePlaylists([].concat(parts[0]||[], parts[1]||[], parts[2]||[], parts[3]||[]));
    // 换一批：整表打散，不要固定热门前 8
    mixed = shuffleArray(mixed);
    if (mixed.length >= count) return mixed.slice(0, count);
    // 不够再补一页全部
    return API.playlistsByTagPage(10000000, 5, (nonce % 6) * 18, 30).then(function(more){
      return shuffleArray(dedupePlaylists(mixed.concat(more || []))).slice(0, count);
    });
  }).catch(function(){
    return API.playlistsByTagPage(10000000, 5, 0, count).then(function(list){
      return shuffleArray(list).slice(0, count);
    });
  });
};

API.playlistDetail = function(dissid, pageNo, pageSize){

  function fromCdlist(txt){
    var d = jsonp_safeParse(txt);

    var c = d.cdlist[0];
    var all = (c.songlist || []).map(normalizeSongFromPlaylist).filter(function(s){ return s && s.songmid; });

      songs: slice,

      pageNo: pageNo,
      _cdAll: pageNo === 0 ? all : null // 首页缓存全量，后续页本地切片
    };

  function fromMusicu(){
    var body = JSON.stringify({
      comm: { ct: 24, cv: 0 },

        module: "srf_diss_info.DissInfoServer",
        method: "CgiGetDiss",
        param: { disstid: Number(dissid)||dissid, num: pageSize, orderlist: 1, page_no: pageNo, onlysonglist: pageNo > 0 ? 1 : 0, enc_host_uin: "" }
      }

      var total = dir.songnum || dir.song_num || data.total_song_num || data.total || 0;

          title: dir.title || dir.dissname || "",
          cover: fixCover(dir.picurl || dir.logo || dir.pic_url || ""),
          desc: dir.desc || "",

          songCount: total || ((pageNo * pageSize) + songs.length)
        },
        songs: songs,
        hasMore: songs.length >= pageSize,
        pageNo: pageNo
      };
    }).catch(function(){ return { info: {}, songs: [], hasMore: false, pageNo: pageNo }; });
  }
  // 分页页只走 musicu；首页优先 cdlist，空则 musicu
  if (pageNo > 0){

      // cdlist 若一次给全量，后续用本地缓存翻页

    });

/** 按歌名+歌手从 QQ 拉歌词（给 YT/酷我等跨源用） */
API.lyricByMeta = function(name, singer){
  name = (name || "").trim();
  if (!name) return Promise.resolve({ lyric: "", trans: "" });
  var kw = (name + " " + ((singer || "").split(/[\/、,&]/)[0] || "")).trim();
  return API._searchByType(kw, 0, 1, 5).then(function(songRes){
    var list = (((songRes || {}).data || {}).song || {}).list || [];
    if (!list.length) return { lyric: "", trans: "" };
    var best = null, bestScore = -1;
    list.forEach(function(it){
      var n = normalizeSongFromSearch(it);
      var score = 0;
      if (n.name === name) score += 5;
      else if (n.name && name && n.name.indexOf(name) >= 0) score += 3;
      else if (n.name && name && name.indexOf(n.name) >= 0) score += 2;
      if (singer && n.singer && n.singer.indexOf((singer.split(/[\/、]/)[0]||"")) >= 0) score += 3;
      if (score > bestScore){ bestScore = score; best = n; }
    });
    if (!best || !best.songmid) best = normalizeSongFromSearch(list[0]);
    if (!best || !best.songmid) return { lyric: "", trans: "" };
    return API.lyric(best.songmid);
  }).catch(function(){ return { lyric: "", trans: "" }; });
};

API.lyric = function(songmid){
  if (!songmid) return Promise.resolve({lyric:"", trans:""});
  var url = "https://c.y.qq.com/lyric/fcgi-bin/fcg_query_lyric_new.fcg?songmid="+encodeURIComponent(songmid)+
    "&pcachetime="+Date.now()+"&g_tk=5381&loginUin=0&hostUin=0&format=json&inCharset=utf8&outCharset=utf-8"+
    "&notice=0&platform=yqq.json&needNewCode=0&nobase64=1";
  return ADAPTER_request(url, {headers:withCookie({"Referer":"https://y.qq.com/"})}).then(function(txt){
    var d = jsonp_safeParse(txt);
    if (!d) return {lyric:"", trans:""};
    var lyric = d.lyric || "";
    var trans = d.trans || "";
    // 若仍是 base64（无 [00: 时间戳），尝试解码
    if (lyric && lyric.indexOf("[") === -1) lyric = atob_safe(lyric);
    if (trans && trans.indexOf("[") === -1) trans = atob_safe(trans);
    return { lyric: lyric, trans: trans };
  }).catch(function(){ return {lyric:"", trans:""}; });
};
function atob_safe(b64){ try{ return decodeURIComponent(escape(atob(b64))); }catch(e){ try{ return atob(b64); }catch(e2){ return ""; } } }

var _crossLyricCache = {};
function lyricMetaMatch(searchFn, lyricFn, name, singer){
  name = String(name || "").trim();
  singer = String(singer || "").trim();
  if (!name) return Promise.resolve({ lyric:"", trans:"" });
  var firstSinger = (singer.split(/[\/、,&]/)[0] || "").trim();
  var origin = { name:name, singer:singer };
  return searchFn((name + " " + firstSinger).trim(), 1).then(function(res){
    var list = (res && res.list) || [];
    var best = null, bestScore = -999;
    list.forEach(function(item){
      var score = sourceMatchScore(origin, item);
      if (score > bestScore){ bestScore = score; best = item; }
    });
    if (!best || bestScore < 8) return { lyric:"", trans:"" };
    return lyricFn(best);
  }).catch(function(){ return { lyric:"", trans:"" }; });
}
API.kuwoLyricByMeta = function(name, singer){

};

/** 五平台统一歌词：当前平台优先，失败后并行跨平台匹配。 */
API.lyricForSong = function(song){
  song = song || {};
  var source = song.source || "qq";
  var name = song.name || "";
  var singer = song.singer || "";

  function valid(res){
    var text = String((res && res.lyric) || "");
    return !!(text && hasTimelineLyrics(text));
  }
  function timed(promise, ms){
    return new Promise(function(resolve){
      var done = false;
      var timer = setTimeout(function(){ if (!done){ done = true; resolve({ lyric:"", trans:"" }); } }, ms || 9000);
      Promise.resolve(promise).then(function(res){
        if (done) return;
        done = true; clearTimeout(timer); resolve(res || { lyric:"", trans:"" });
      }).catch(function(){
        if (done) return;
        done = true; clearTimeout(timer); resolve({ lyric:"", trans:"" });
      });
    });
  }
  function firstValid(tasks){
    return new Promise(function(resolve){
      var left = tasks.length, settled = false;
      if (!left){ resolve({ lyric:"", trans:"" }); return; }
      tasks.forEach(function(task){
        timed(task, 10500).then(function(res){
          if (!settled && valid(res)){
            settled = true;
            resolve(res);
            return;
          }
          left--;
          if (!settled && left <= 0) resolve({ lyric:"", trans:"" });
        });
      });
    });
  }
  function primary(){
    if (source === "netease"){
      var neId = song.neteaseId || String(song.songmid || "").replace(/^ne_/, "");
      return timed(API.neteaseLyric(neId), 9000).then(function(res){ res.sourceLabel="网易官方"; return res; });
    }
    if (source === "kuwo") return timed(API.kuwoLyric(song), 10000).then(function(res){ res.sourceLabel="酷我官方"; return res; });
    if (source === "kugou") return timed(API.kugouLyric(song), 10000).then(function(res){ res.sourceLabel="酷狗官方"; return res; });
    if (source === "ytmusic"){
      var yid = song.videoId || String(song.songmid || "").replace(/^yt_/, "");
      return timed(API.ytmusicLyric(yid), 10000).then(function(res){ res.sourceLabel="YTM Lyrics"; return res; });
    }
    return timed(API.lyric(song.songmid), 9000).then(function(res){ res.sourceLabel="QQ官方"; return res; });
  }
  var cleanName = source === "ytmusic" && typeof API.ytCleanTitle === "function" ? API.ytCleanTitle(song) : name;
  cleanName = cleanName || name;
  var cacheKey = sourceMatchText(cleanName) + "|" + sourceMatchText((singer.split(/[\/、,&]/)[0] || ""));
  function labeled(promise, label){
    return Promise.resolve(promise).then(function(res){ res = res || { lyric:"", trans:"" }; res.sourceLabel=label; return res; });
  }
  function crossFallback(){
    var providers = [
      { id:"qq", run:function(){ return labeled(API.lyricByMeta(cleanName, singer), "QQ备用匹配"); } },
      { id:"netease", run:function(){ return labeled(API.neteaseLyricByMeta(cleanName, singer), "网易备用匹配"); } },
      { id:"kuwo", run:function(){ return labeled(API.kuwoLyricByMeta(cleanName, singer), "酷我跨源匹配"); } },
      { id:"kugou", run:function(){ return labeled(API.kugouLyricByMeta(cleanName, singer), "酷狗跨源匹配"); } }
    ];
    var tasks = [];
    providers.forEach(function(provider){
      if (provider.id !== source) tasks.push(provider.run());
    });
    return firstValid(tasks).then(function(res){
      if (valid(res) || source === "ytmusic") return res;
      return timed(labeled(API.ytmusicLyricByMeta(cleanName, singer), "YTM跨源匹配"), 10500);
    });
  }

  if (_crossLyricCache[cacheKey]) return Promise.resolve(_crossLyricCache[cacheKey]);
  return primary().then(function(res){
    if (valid(res)) return res;
    return crossFallback();
  }).then(function(res){
    if (valid(res)){
      _crossLyricCache[cacheKey] = { lyric:res.lyric || "", trans:res.trans || "", sourceLabel:res.sourceLabel || "歌词" };
      return res;
    }
    return { lyric:"", trans:"", sourceLabel:"平台与备用歌词均不可用" };
  }).catch(function(){ return { lyric:"", trans:"", sourceLabel:"歌词加载失败" }; });
};

function _lxCleanAudioUrl(value){
  if (typeof value !== "string") return null;
  var text = value.trim().replace(/&amp;/g, "&").replace(/\\\//g, "/");
  if (!text) return null;
  if ((text.charAt(0) === '"' && text.charAt(text.length-1) === '"') || (text.charAt(0) === "'" && text.charAt(text.length-1) === "'")){
    text = text.slice(1,-1).trim();
  }
  if (/^https?%3a%2f%2f/i.test(text)){
    try { text = decodeURIComponent(text); } catch(e0) {}
  }
  if (/^\/\//.test(text)) text = "https:" + text;
  if (!/^https?:\/\//i.test(text)) return null;
  if (/\.(?:jpe?g|png|gif|webp|svg)(?:[?#]|$)/i.test(text)) return null;
  return text.replace(/^http:/, "https:");
}
function _lxParseBody(value, depth){
  depth = depth || 0;

  if (typeof value === "string"){
    var direct = _lxCleanAudioUrl(value);
    if (direct) return direct;
    var text = value.trim();
    if (!text || /^</.test(text)) return null;
    if ((text.charAt(0) === "{" && text.charAt(text.length-1) === "}") || (text.charAt(0) === "[" && text.charAt(text.length-1) === "]")){
      try { return _lxParseBody(JSON.parse(text), depth+1); } catch(e1) {}
    }

  }
  if (Array.isArray(value)){
    for (var i=0;i<value.length;i++){
      var fromArray = _lxParseBody(value[i], depth+1);
      if (fromArray) return fromArray;
    }
    return null;
  }
  if (typeof value !== "object") return null;
  var directKeys = ["url","playUrl","play_url","musicUrl","music_url","src","location","link","downloadUrl"];
  for (var j=0;j<directKeys.length;j++){
    var directValue = _lxParseBody(value[directKeys[j]], depth+1);
    if (directValue) return directValue;
  }
  var nestedKeys = ["data","result","body","response","payload","resource"];
  for (var k=0;k<nestedKeys.length;k++){

API.lxUrl = function(song, opts){
  opts = opts || {};
  if (!song || !isLxApiConfigured()) return Promise.resolve(null);
  var attempts = _lxBuildAttempts(song,opts);
  if (!attempts.length) return Promise.resolve(null);
  var budgetMs = Math.max(3000, Number(opts.budgetMs || LX_API.budgetMs || 30000));
  var deadline = Date.now() + budgetMs;
  var cursor = 0;
  var waveSize = Math.max(1, Math.min(4, Number(opts.waveSize || 3)));
  function pause(ms){ return new Promise(function(resolve){ setTimeout(resolve,ms); }); }
  function runWave(){
    var remaining = deadline-Date.now();
    if (remaining < 900) return Promise.resolve(null);
    if (cursor >= attempts.length){
      if (opts.singlePass || song._lxPreviewRejected) return Promise.resolve(null);
      cursor = 0;
      return pause(Math.min(1200,Math.max(250,deadline-Date.now()))).then(runWave);
    }
    var wave = attempts.slice(cursor,cursor+waveSize);
    cursor += wave.length;
    return Promise.all(wave.map(function(attempt){ return _lxRequestAttempt(attempt,remaining,song); })).then(function(results){
      for (var i=0;i<results.length;i++) if (results[i] && results[i].url) return results[i].url;
      if (deadline-Date.now() < 900) return null;
      return pause(260).then(runWave);
    });
  }
  return runWave();
};

/**
 * 洛雪多音源兜底：先本源 (tx/kw/wy/kg/mg)，失败再按歌名跨源匹配后走洛雪

API.lxUrlMulti = function(song, skipPrimary, opts){
  if (!song || !isLxApiConfigured()) return Promise.resolve(null);
  if (skipPrimary && typeof skipPrimary === "object"){ opts=skipPrimary;skipPrimary=false; }
  opts=opts||{};
  var deadline=Number(opts.deadline)||Date.now()+Math.max(12000,Number(opts.budgetMs||LX_API.budgetMs||30000));
  function remaining(){return Math.max(0,deadline-Date.now());}
  // 1) 本源直取
  var first = skipPrimary ? Promise.resolve(null) : API.lxUrl(song,{budgetMs:Math.max(3000,Math.min(remaining(),18000))});
  return first.then(function(url){
    if (url){ song._resolvedSource=song.source||"qq"; return url; }
    if (remaining()<2500) return null;
    // 2) 跨源：用歌名+歌手去其它平台搜 id，再走洛雪对应源
    var name = (song.name || "").trim();
    var singer = ((song.singer || "").split(/[\/、,&]/)[0] || "").trim();
    if (!name) return null;
    var kw = (name + " " + singer).trim();
    var primary = API.lxSourceOf(song);

    function trySearchThenLx(searchFn, mapSong, srcTag){
      if (srcTag === primary) return Promise.resolve(null);
      if (remaining()<2500) return Promise.resolve(null);
      return searchFn(kw, 1).then(function(res){
        var list = (res && res.list) || [];
        if (!list.length) return null;
        var best = null, bestScore = -999;
        list.forEach(function(it){
          var score = sourceMatchScore(song,it);
          if (score > bestScore){ bestScore = score; best = it; }
        });
        if (!best || bestScore < 7) return null;
        var s2 = mapSong ? mapSong(best) : best;
        s2.source = srcTag === "tx" ? "qq" : (srcTag === "kw" ? "kuwo" : (srcTag === "wy" ? "netease" : (srcTag === "kg" ? "kugou" : srcTag)));
        if (remaining()<2500) return null;
        return API.lxUrl(s2,{budgetMs:remaining()}).then(function(url){
          if (url) song._resolvedSource=s2.source;
          return url;
        });
      }).catch(function(){ return null; });
    }

    // 顺序：kw → wy → kg → tx（跳过已试过的本源）
    var chain2 = Promise.resolve(null);
    var steps = [
      function(){ return trySearchThenLx(API.kuwoSearch, null, "kw"); },
      function(){ return trySearchThenLx(API.neteaseSearch, null, "wy"); },
      function(){ return trySearchThenLx(API.kugouSearch, null, "kg"); },
      function(){
        if (remaining()<2500) return Promise.resolve(null);
        // QQ 搜索 → 当 tx 用
        return API._searchByType(kw, 0, 1, 6).then(function(songRes){
          var list = (((songRes || {}).data || {}).song || {}).list || [];
          if (!list.length) return null;
          var best = null, bestScore = -999;
          list.forEach(function(it){
            var n = normalizeSongFromSearch(it);
            var score = sourceMatchScore(song,n);
            if (score > bestScore){ bestScore = score; best = n; }
          });
          if (!best || bestScore < 7 || !best.songmid) return null;
          best.source = "qq";
          if (remaining()<2500) return null;
          return API.lxUrl(best,{budgetMs:remaining()}).then(function(url){
            if (url) song._resolvedSource="qq";
            return url;
          });
        }).catch(function(){ return null; });
      }
    ];
    steps.forEach(function(fn){
      chain2 = chain2.then(function(got){
        if (got) return got;
        return fn();
      });
    });
    return chain2;
  });
};

function pickMvStreamUrl(info){
  if (!info) return null;
  function joinVkey(u, vkey){
    if (!u) return "";
    u = String(u).trim();
    if (u.indexOf("//") === 0) u = "https:" + u;
    u = u.replace(/^http:/, "https:");
    if (vkey && u.indexOf("vkey=") < 0){
      u += (u.indexOf("?") >= 0 ? "&" : "?") + "vkey=" + encodeURIComponent(vkey);
    }
    return u;
  }
  function collect(arr, out){
    (arr || []).forEach(function(x){
      if (!x || (x.code && x.code !== 0 && x.code !== 1000)) return;
      var urls = [].concat(x.url || [], x.freeflow_url || [], x.comm_url || []);
      var vkey = x.vkey || "";
      urls.forEach(function(u){
        u = joinVkey(u, vkey);
        if (u && /^https?:\/\//i.test(u)) out.push({ u: u, size: Number(x.fileSize || x.filetype || 0) });
      });
      if (x.m3u8){
        var m = joinVkey(x.m3u8, vkey);
        if (m) out.push({ u: m, size: Number(x.fileSize || 0) });
      }
    });
  }
  var cands = [];
  collect(info.mp4, cands);
  collect(info.hls, cands);
  if (!cands.length) return null;
  cands.sort(function(a,b){ return b.size - a.size; });
  return cands[0].u;
}

API.dailyRecommend = function(periodKey){
  var uin = (state.user && state.user.uin) || "0";
  var body = JSON.stringify({
    comm: { ct: 24, cv: 0, uin: String(uin), t: Date.now() },
    req_0: {
      module: "music.recommend.TrackRecommend",
      method: "GetDailySongs",
      param: { period: periodKey || "" }
    }
  });
  function mapSong(s){
    if (!s) return null;
    var song = s.songInfo || s.track || s;
    var mid = song.mid || song.songmid || "";
    if (!mid) return null;
    var album = song.album || {};
    return {
      songmid: mid,
      name: song.title || song.name || "",
      singer: (song.singer || []).map(function(a){ return a.name; }).join("/") || song.singer_name || "",
      albummid: album.mid || album.pmid || song.albummid || "",
      albumname: album.name || album.title || "",
      cover: fixCover(album.pic || song.pic || ""),
      interval: song.interval || 0,
      isVip: !!(song.pay && (song.pay.pay_play === 1 || song.pay.payplay === 1))
    };
  }
  /** 按时段对列表做确定性轮转，保证早/中/晚首屏曲目不同 */
  function rotateByPeriod(list, pk){
    if (!list || list.length < 3) return list || [];
    var seed = 0;
    var s = String(pk || "");
    for (var i = 0; i < s.length; i++) seed = (seed * 31 + s.charCodeAt(i)) >>> 0;
    var offset = seed % list.length;
    if (!offset) return list.slice();
    return list.slice(offset).concat(list.slice(0, offset));
  }
  function fromNewSongs(){
    // type 按时段切换：5 内地 / 1 港台 / 4 欧美，增加差异
    var typeMap = { morning: 5, noon: 1, evening: 4 };
    var ntype = typeMap[periodKey] || 5;
    var body2 = JSON.stringify({
      comm: { ct: 24, cv: 0, t: Date.now() },
      req_0: { module: "newsong.NewSongServer", method: "get_new_song_info", param: { type: ntype } }
    });
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST", headers: withCookie({ "Content-Type": "application/json" }), body: body2
    }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var list = (d && d.req_0 && d.req_0.data && d.req_0.data.songlist) || [];
      return rotateByPeriod(list.map(mapSong).filter(Boolean), periodKey).slice(0, 30);
    }).catch(function(){ return []; });
  }
  return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg?t=" + Date.now(), {
    method: "POST", headers: withCookie({ "Content-Type": "application/json" }), body: body
  }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var data = d && d.req_0 && d.req_0.data;
    var list = (data && (data.songlist || data.songList || data.list || data.trackList)) || [];
    var songs = rotateByPeriod(list.map(mapSong).filter(Boolean), periodKey);
    if (songs.length) return { songs: songs, source: "daily" };
    return fromNewSongs().then(function(songs2){ return { songs: songs2, source: "newsong" }; });
  }).catch(function(){
    return fromNewSongs().then(function(songs2){ return { songs: songs2, source: "newsong" }; });
  });
};

/* ============================================================
   § 4. 路由 + 全局返回（对齐 Solene）
   ------------------------------------------------------------
   - 首页 = history 第 0 层，URL = pathname+search（不带 #hash）
     原生用 URL 判断「是否主页」；带 #home 会对不上 homePage，无法退出全屏
   - 不垫任何哨兵层；离开首页才 pushState
   - 子页 restoreAffordance:"none"；首页 "auto" 交给 App 退出
   ============================================================ */
var VIEWS = ["home","toplist","playlists","singers","radio","mine","search","detail","singerDetail"];
var MAIN_TABS = ["home","toplist","playlists","singers","radio","mine"];
var _overlayNavLock = false;
var _ignorePop = 0;

function currentHistoryState(extra){
  var base = { view: state.view, params: state.viewParams || {}, qqm: 1 };
  if (extra) {
    for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) base[k] = extra[k];
  }
  return base;
}

function isOverlayOpen(){
  var parser = $("#parserConfigView");
  if (parser && parser.classList.contains("show")) return "parser";
  var login = $("#loginView");
  if (login && !login.classList.contains("hidden") && getComputedStyle(login).display !== "none") return "login";
  var mv = $("#mvPlayerView");
  if (mv && mv.classList.contains("show")) return "mv";
  var fp = $("#fullPlayer");
  if (fp && fp.classList.contains("show")){
    if (fp.classList.contains("lyrics-focus")) return "lyrics";
    return "player";
  }
  return null;
}

function syncAppUnderlay(){
  var app = $("#app");
  if (!app) return;
  if (isOverlayOpen()) app.classList.add("overlay-hidden");
  else app.classList.remove("overlay-hidden");
}

/** Solene: 子页 none（返回走 WebView history）；首页 auto（原生可退出全屏） */
function setSubviewChrome(isSubview){
  try {
    if (window.fm && window.fm.ui && typeof window.fm.ui.setChrome === "function"){
      window.fm.ui.setChrome({
        mode: "edge",
        statusBarStyle: "light",
        navigationBarStyle: "light",
        restoreAffordance: isSubview ? "none" : "auto"
      }).catch(function(){});
    }
  } catch(e) {}
}

function hashFor(name, params){
  params = params || {};
  // 首页必须裸 URL，不能带 #home（Solene 注释：否则原生永远认为还没回主页）
  if (name === "home") return location.pathname + location.search;
  var h = "#"+name;
  if (params.id) h += "/"+params.id;
  if (params.mid) h += "/"+params.mid;
  if (params.kw) h += "/"+encodeURIComponent(params.kw);
  return h;
}

function switchView(name, params, push){
  params = params || {};
  var prev = state.view;
  state.view = name;
  state.viewParams = params;

  VIEWS.forEach(function(v){
    var node = $("#view-"+v);
    if (node) node.classList.toggle("active", v === name);
  });
  $all(".nav-item").forEach(function(n){
    n.classList.toggle("active", n.dataset.view === name);
  });
  var vp = $("#viewport"); if (vp) vp.scrollTop = 0;
  var vnode = $("#view-"+name); if (vnode) vnode.scrollTop = 0;

  if (push !== false){
    var url = hashFor(name, params);
    var st = currentHistoryState({view:name, params:params, overlay:null});
    try {
      if (name === "home"){
        // 回首页只 replace 成裸 URL（真正弹栈由 handleBack / history.back 完成）
        // 禁止在子页上误把当前 entry 直接改成 home，否则 Native 会认为已在主页并退出
        history.replaceState(st, "", url);
      } else if (MAIN_TABS.indexOf(name) > -1){
        if (prev === "home") history.pushState(st, "", url);
        else history.replaceState(st, "", url);
      } else {
        history.pushState(st, "", url);
      }
    } catch(e) {}
  }

  // 首页 auto；其它视图 / 浮层 none
  setSubviewChrome(name !== "home" || !!isOverlayOpen());
  renderView(name, params);
  syncAppUnderlay();
  if (state.isTv) scheduleTvRefresh("render");
}

function pushOverlayState(kind){
  try {
    history.pushState(currentHistoryState({overlay: kind}), "", location.href);
  } catch(e) {}
  setSubviewChrome(true);
}

function closeOverlayUI(kind){
  if (kind === "parser") closeParserConfig(true);
  else if (kind === "login") closeLoginView(true);
  else if (kind === "mv") closeMv(true);
  else if (kind === "lyrics") exitLyricsFocus(true);
  else if (kind === "player") closeFullPlayer(true);
  setSubviewChrome(state.view !== "home");
  syncAppUnderlay();
}

function tryCloseOverlay(fromPopstate){
  var kind = isOverlayOpen();
  if (!kind) return false;
  // 是否在历史栈里真正压过这一层（没有则绝不能 history.back，否则会退出 WebView）
  var hadHistory = false;
  try {
    hadHistory = !!(history.state && history.state.overlay === kind);
  } catch(eH) { hadHistory = false; }

  if (kind === "parser") closeParserConfig(true);
  else if (kind === "login") closeLoginView(true);
  else if (kind === "mv") closeMv(true);
  else if (kind === "lyrics"){
    exitLyricsFocus(true);
  }
  else if (kind === "player"){
    _fpHistoryPushed = false;
    closeFullPlayer(true);
  }
  // 关闭后立刻按当前 view 校正 chrome
  setSubviewChrome(state.view !== "home");
  syncAppUnderlay();

  if (!fromPopstate){
    if (hadHistory){
      _overlayNavLock = true;
      _ignorePop = 1;
      try { history.back(); } catch(e) {}
      setTimeout(function(){
        _overlayNavLock = false;
        if (_ignorePop > 0) _ignorePop = 0;
      }, 280);
    } else {
      // 没有浮层历史：只清 state，禁止 back 到原生
      try {
        history.replaceState(currentHistoryState({ overlay: null }), "", location.href);
      } catch(e2) {}
    }
  }
  return true;
}

/** 强制回到首页并清洗历史，防止栈深度为 1 时 Native 直接退出 */
function forceGoHome(){
  // 尽量关掉浮层
  try { tryCloseOverlay(true); } catch(e) {}
  try { tryCloseOverlay(true); } catch(e) {}

  state.view = "home";
  state.viewParams = {};
  VIEWS.forEach(function(v){
    var node = $("#view-" + v);
    if (node) node.classList.toggle("active", v === "home");
  });
  $all(".nav-item").forEach(function(n){
    n.classList.toggle("active", n.dataset.view === "home");
  });
  var vp = $("#viewport"); if (vp) vp.scrollTop = 0;
  var vnode = $("#view-home"); if (vnode) vnode.scrollTop = 0;

  try {
    history.replaceState(
      { view: "home", params: {}, qqm: 1, overlay: null },
      "",
      location.pathname + location.search
    );
  } catch(e) {}

  setSubviewChrome(false);
  syncAppUnderlay();
  renderView("home", {});
}

function handleBack(){
  if (closePlayerSearchFloat(state.isTv)) return true;
  // 全屏播放器 / 登录 / MV：必须先关浮层，绝不交给原生
  if (isOverlayOpen()){
    tryCloseOverlay(false);
    return true;
  }

  if (state.view !== "home"){
    // 优先真弹栈；栈已空或丢失首页层时强制回首页，避免 Native 直接退出
    var canPop = false;
    try {
      canPop = history.length > 1 && !!(history.state && history.state.qqm);
    } catch(e) {}

    if (canPop) {
      try {
        history.back();
        return true;
      } catch(e) {
        canPop = false;
      }
    }

    forceGoHome();
    return true;
  }

  // 首页：不拦截。canGoBack 应为 false，交给原生退出全屏
  return false;
}

window.addEventListener("popstate", function(e){
  if (_ignorePop > 0){
    _ignorePop--;
    _overlayNavLock = false;
    // 即使忽略本次路由切换，也保证 chrome 与当前 state.view 一致
    setSubviewChrome(state.view !== "home" || !!isOverlayOpen());
    syncAppUnderlay();
    return;
  }

  var s = e.state || { view: "home", params: {}, qqm: 1 };
  var open = isOverlayOpen();

  // 浮层已不在 state 里 → 关 DOM（系统手势返回 / 物理返回键）
  if (open && !(s && s.overlay === open)){
    if (open === "player") _fpHistoryPushed = false;
    if (open === "lyrics") _lyricsFocusPushed = false;
    closeOverlayUI(open);
    // 关掉播放器后若目标就是当前 view，不必再 switchView
    var targetView = (s && s.view && VIEWS.indexOf(s.view) > -1) ? s.view : state.view;
    if (targetView === state.view && !(s && s.overlay)){
      setSubviewChrome(state.view !== "home");
      syncAppUnderlay();
      return;
    }
  }

  if (s && s.overlay){
    if (s.overlay === "player"){
      _fpHistoryPushed = true;
      showFullPlayerUI();
      exitLyricsFocus(true);
    } else if (s.overlay === "lyrics"){
      _fpHistoryPushed = true;
      showFullPlayerUI();
      enterLyricsFocus(true);
    } else if (s.overlay === "login"){
      var login = $("#loginView");
      if (login) login.classList.remove("hidden");
    }
    setSubviewChrome(true);
    syncAppUnderlay();
    return;
  }

  var view = (s && s.view && VIEWS.indexOf(s.view) > -1) ? s.view : "home";
  var params = (s && s.params) || {};
  if (view !== state.view || JSON.stringify(params) !== JSON.stringify(state.viewParams||{})){
    switchView(view, params, false);
  } else {
    setSubviewChrome(view !== "home");
    syncAppUnderlay();
  }
});

}

var IMG_PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">'+
  '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2a22"/><stop offset="100%" stop-color="#0d1512"/></linearGradient></defs>'+

function safeImg(src, cls){
  var raw = src ? fixCover(src) : "";
  var u = raw ? esc(mediaUrl(raw)) : IMG_PLACEHOLDER;
  return '<img src="'+u+'"'+(cls?' class="'+cls+'"':'')+' loading="lazy" decoding="async" onerror="this.onerror=null;this.src=\''+IMG_PLACEHOLDER+'\';">';
}
/** 安全设置 img：失败时加 img-err（露出 CSS 底图）并回退 SVG */
function setImgSrc(el, src, fallbackSrc){
  if (!el) return;
  var primary = src ? mediaUrl(fixCover(src)) : "";
  var fallback = fallbackSrc ? mediaUrl(fixCover(fallbackSrc)) : "";
  // 同一地址不重复赋值，避免切歌封面闪一下
  if (primary && el.dataset.curSrc === primary && !el.classList.contains("img-err")) return;
  el.onerror = function(){
    if (fallback && this.dataset.tried !== "1"){
      this.dataset.tried = "1";
      this.src = fallback;
      this.dataset.curSrc = fallback;
      return;
    }
    this.onerror = null;
    this.classList.add("img-err");
    // 失败时保留上一张可见图，不强制换成占位图造成闪白
  };
  el.dataset.tried = "0";
  if (!primary){
    el.classList.add("img-err");
    return;
  }
  el.classList.remove("img-err");
  el.dataset.curSrc = primary;
  el.src = primary;
}

function platformSearch(src,kw,page){
  var fn=src==="kuwo"?API.kuwoSearch
    :src==="netease"?API.neteaseSearch
    :src==="kugou"?API.kugouSearch
    :src==="ytmusic"?API.ytmusicSearch
    :API.search;
  return fn(kw,page||1).then(function(res){
    res=res||{};
    (res.list||[]).forEach(function(song){ if (!song.source) song.source=src; });
    return {list:res.list||[],singers:res.singers||[]};
  }).catch(function(){ return {list:[],singers:[]}; });
}
function platformCollection(src,def,force){
  var key=src+"|"+(def.toplistId||def.q);
  if (!force && _platformCollectionCache[key]) return Promise.resolve(_platformCollectionCache[key]);
  if (src==="netease" && def.toplistId){
    return API.neteaseToplistSongs(def.toplistId).then(function(res){
      var out={def:def,songs:((res&&res.songs)||[]).slice(0,100),singers:[]};
      _platformCollectionCache[key]=out;
      return out;
    }).catch(function(){ return {def:def,songs:[],singers:[]}; });
  }
  return platformSearch(src,def.q,1).then(function(res){
    var out={def:def,songs:(res.list||[]).slice(0,20),singers:res.singers||[]};
    _platformCollectionCache[key]=out;
    return out;
  });
}
function platformPlaylistCollection(src,def,force){
  var key=src+"|playlist|"+(def.q||def.title||"");
  if(!force&&_platformCollectionCache[key])return Promise.resolve(_platformCollectionCache[key]);
  var searchFn=src==="kuwo"?API.kuwoSearchPlaylists
    :src==="netease"?API.neteaseSearchPlaylists
    :src==="kugou"?API.kugouSearchPlaylists
    :src==="ytmusic"?API.ytmusicSearchPlaylists:null;
  var detailFn=src==="kuwo"?API.kuwoPlaylistSongs
    :src==="netease"?API.neteasePlaylistSongs
    :src==="kugou"?API.kugouPlaylistSongs
    :src==="ytmusic"?API.ytmusicPlaylistSongs:null;
  function fallback(){return platformCollection(src,def,force);}
  if(!searchFn||!detailFn)return fallback();
  return searchFn(def.q||def.title||"").then(function(list){
    list=list||[];
    if(!list.length)return fallback();
    var candidates=list.slice(0,8);
    if(force)candidates=shuffleArray(candidates);
    function tryCandidate(index){
      if(index>=candidates.length)return fallback();
      var selected=candidates[index];
      if(!selected||!selected.id)return tryCandidate(index+1);
      return detailFn(selected.id).then(function(res){
        var songs=(res&&res.songs)||[];
        if(!songs.length)return tryCandidate(index+1);
        var info=(res&&res.info)||{};
        var actualDef=Object.assign({},def,{title:selected.title||info.title||def.title});
        function finish(finalSongs,supplemented){
          var out={def:actualDef,songs:finalSongs.slice(0,100),singers:[],cover:selected.cover||info.cover||"",playlist:selected,realPlaylist:true,supplemented:!!supplemented};
          _platformCollectionCache[key]=out;
          return out;
        }
        if(songs.length>=12)return finish(songs,false);
        return platformSearch(src,def.q||def.title||"",1).then(function(extra){
          var seen={},merged=[];
          songs.concat((extra&&extra.list)||[]).forEach(function(song){
            var songKey=(song.source||src)+"|"+(song.songmid||song.videoId||song.neteaseId||song.rid||song.hash||"");
            if(!songKey||seen[songKey])return;seen[songKey]=1;merged.push(song);
          });
          return finish(merged,merged.length>songs.length);
        }).catch(function(){return finish(songs,false);});
      }).catch(function(){return tryCandidate(index+1);});
    }
    return tryCandidate(0);
  }).catch(fallback);
}
function loadPlatformGroups(src,defs,force,onUpdate,kind){
  var groups=defs.map(function(def){return {def:def,songs:[],singers:[]};});
  defs.forEach(function(def,index){
    var settled=false;
    var timer=setTimeout(function(){
      if(settled)return;settled=true;
      onUpdate(groups,index,true);
    },kind==="playlists"?32000:12000);
    var task=kind==="playlists"?platformPlaylistCollection(src,def,force):platformCollection(src,def,force);
    task.then(function(group){
      if(settled)return;settled=true;clearTimeout(timer);
      groups[index]=group||groups[index];
      onUpdate(groups,index,false);
    }).catch(function(){
      if(settled)return;settled=true;clearTimeout(timer);
      onUpdate(groups,index,true);
    });
  });
  return groups;
}

/** 早 / 中 / 晚 三个时段：5–11 上午，11–17 中午，其余晚上 */
function getDailyPeriodInfo(){
  var now = new Date();
  var h = now.getHours();
  var period = h >= 5 && h < 11 ? "morning" : (h >= 11 && h < 17 ? "noon" : "evening");
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1);
  if (m.length < 2) m = "0" + m;
  var d = String(now.getDate());
  if (d.length < 2) d = "0" + d;
  var day = y + "-" + m + "-" + d;
  var labels = {
    morning: { short: "上午", title: "晨间推荐", subRec: "清晨好时光<br>来点儿音乐提提神吧~", sub30: "上午热歌精选<br>开启元气一天" },
    noon:    { short: "中午", title: "午间推荐", subRec: "午后小憩<br>换首好歌继续听~", sub30: "午间热歌精选<br>保持好心情" },
    evening: { short: "晚上", title: "晚间推荐", subRec: "夜色正好<br>沉浸在音乐里吧~", sub30: "晚间热歌精选<br>陪你慢慢听" }
  };
  var meta = labels[period] || labels.evening;
  return {
    key: day + "-" + period,
    day: day,
    period: period,
    short: meta.short,
    title: meta.title,
    subRec: meta.subRec,
    sub30: meta.sub30
  };
}

var _dailyCache = { key: "", recSongs: [], d30Songs: [], loading: false };

function loadDailySections(force){
  var period = getDailyPeriodInfo();
  // 跨时段：强制清空缓存，重新拉数据（官方早中晚会换歌）
  if (_dailyCache.key && _dailyCache.key !== period.key){
    force = true;
    _dailyCache.recSongs = [];
    _dailyCache.d30Songs = [];
    _dailyCache.key = "";
  }
  // 同一时段已加载过且非强制刷新 → 跳过请求，只保证按钮仍绑定
  if (!force && _dailyCache.key === period.key && (_dailyCache.recSongs.length || _dailyCache.d30Songs.length)){
    return;
  }
  if (_dailyCache.loading && !force) return;
  _dailyCache.loading = true;

  var recCover = $("#dailyRecCover");
  var d30Cover = $("#daily30Cover");
  var recMeta = $("#dailyRecMeta");
  var d30Meta = $("#daily30Meta");
  var recSongs = force ? [] : (_dailyCache.recSongs || []);
  var d30Songs = force ? [] : (_dailyCache.d30Songs || []);

  function setCardCover(el, song){
    if (!el) return;
    var url = songCoverUrl(song);
    el.innerHTML = safeImg(url);
  }
  function setMeta(el, song, sub){
    if (!el) return;
    if (!song){
      el.innerHTML = '<div class="df-name">暂无数据</div><div class="df-sub">'+esc(sub||"")+'</div>';
      return;
    }
    el.innerHTML = '<div class="df-name">'+esc(song.name)+(song.singer?(" - "+esc(song.singer)):"")+'</div><div class="df-sub">'+esc(sub||"")+'</div>';
  }
  function bindPlay(cardId, playId, getSongs, label, tag){
    function playOrToggle(){
      if (state.queueTag === tag && state.queue && state.queue.length){
        if (!audio.paused){ audio.pause(); return; }
        audio.play().catch(function(){});
        return;
      }
      var songs = getSongs();
      if (!songs || !songs.length){ toast(label+"还在加载，稍后再试"); return; }
      playQueue(songs, 0, tag);
    }
    var card = $("#"+cardId), btn = $("#"+playId);
    if (card) card.onclick = function(e){
      if (e.target && e.target.closest && e.target.closest(".dc-play")) return;
      playOrToggle();
    };
    if (btn) btn.onclick = function(e){ e.stopPropagation(); playOrToggle(); };
  }

  bindPlay("dailyRecCard", "dailyRecPlay", function(){ return _dailyCache.recSongs; }, "每日推荐", "daily-rec");
  bindPlay("daily30Card", "daily30Play", function(){ return _dailyCache.d30Songs; }, "每日30首", "daily-30");

  // 时段文案先更新
  var subRec = $("#dailyRecCard .dc-sub");
  if (subRec) subRec.innerHTML = period.subRec;
  var sub30 = $("#daily30Card .dc-sub");
  if (sub30) sub30.innerHTML = period.sub30;
  var titleRec = $("#dailyRecCard .dc-title");
  if (titleRec) titleRec.textContent = period.title;
  var title30 = $("#daily30Card .dc-title");
  if (title30) title30.textContent = "Daily 30 · " + period.short;

  API.dailyRecommend(period.period).then(function(res){
    recSongs = res.songs || [];
    _dailyCache.recSongs = recSongs;
    var tip = res.source === "daily"
      ? ("猜你喜欢 · " + period.short)
      : ("新歌速递 · " + period.short);
    if (recSongs[0]){
      setCardCover(recCover, recSongs[0]);
      setMeta(recMeta, recSongs[0], tip);
      if (subRec) subRec.innerHTML = res.source === "daily" ? period.subRec : ("今日新歌速递<br>" + period.short + "精选");
    } else {
      setMeta(recMeta, null, period.title);
    }
  }).catch(function(){}).then(function(){
    _dailyCache.key = period.key;
    _dailyCache.loading = false;
  });

  API.daily30(period.period).then(function(res){
    d30Songs = res.songs || [];
    _dailyCache.d30Songs = d30Songs;
    if (d30Songs[0]){
      setCardCover(d30Cover, d30Songs[0]);
      setMeta(d30Meta, d30Songs[0], "每日30首 · "+(res.title||"热歌榜")+" · "+period.short);
    } else {
      setMeta(d30Meta, null, "每日30首");
    }
  }).catch(function(){});
}

var heroTimer=null, heroIdx=0, heroCount=0;
function goHero(i){
  if (!heroCount) return;
  heroIdx = (i + heroCount) % heroCount;
  var track = $("#heroTrack");
  if (track){
    track.style.transition = "transform .35s var(--ease)";
    track.style.transform = "translateX(-"+(heroIdx*100)+"%)";
  }
  $all(".hero-dot").forEach(function(d,j){ d.classList.toggle("active", j===heroIdx); });
}
function startHeroAuto(n){
  heroCount = n; heroIdx = 0;
  clearInterval(heroTimer);
  if (n <= 1) return;
  heroTimer = setInterval(function(){ goHero(heroIdx + 1); }, 5000);
}
function initHeroSwipe(n){
  var box = $("#heroBox");
  if (!box || !n) return;
  if (box._swipeBound) return;
  box._swipeBound = true;
  startHeroAuto(n);
  var startX=0, startY=0, dx=0, dragging=false, locked=false;
  function onStart(e){
    if (!heroCount) return;
    var t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; dx = 0; dragging = true; locked = false;
    clearInterval(heroTimer);
    var track = $("#heroTrack");
    if (track) track.style.transition = "none";
  }
  function onMove(e){
    if (!dragging) return;
    var t = e.touches ? e.touches[0] : e;
    var adx = t.clientX - startX, ady = t.clientY - startY;
    if (!locked){
      if (Math.abs(ady) > Math.abs(adx) && Math.abs(ady) > 8){ dragging = false; return; }
      if (Math.abs(adx) > 8) locked = true;
    }
    if (!locked) return;
    dx = adx;
    var track = $("#heroTrack");
    if (track){
      var pct = heroIdx * 100 - (dx / box.clientWidth * 100);
      track.style.transform = "translateX(-"+pct+"%)";
    }
    if (e.cancelable) e.preventDefault();
  }
  function onEnd(){
    if (!dragging && !locked){ startHeroAuto(heroCount); return; }
    dragging = false;
    if (Math.abs(dx) > box.clientWidth * 0.18) goHero(heroIdx + (dx < 0 ? 1 : -1));
    else goHero(heroIdx);
    startHeroAuto(heroCount);
  }
  box.addEventListener("touchstart", onStart, { passive: true });
  box.addEventListener("touchmove", onMove, { passive: false });
  box.addEventListener("touchend", onEnd, { passive: true });
  box.addEventListener("touchcancel", onEnd, { passive: true });
  // 点击圆点切换
  box.addEventListener("click", function(e){
    var dot = e.target.closest(".hero-dot");
    if (!dot) return;
    var dots = $all(".hero-dot");
    var i = dots.indexOf(dot);
    if (i >= 0){ clearInterval(heroTimer); goHero(i); startHeroAuto(heroCount); }
  });
}

      plState.seen = {};

      if (tip) tip.textContent = "";
    } else {
      if (tip) tip.textContent = "加载中…";
    }
    var isSmart = (currentCat === "smart" || currentCat === "10000000");
    var pageSize = 24;
    var req;
    if (isSmart){
      // 智能推荐：换一批 / 加载更多都走 refresh 打散；更多时用更大 nonce 偏移
      req = API.recommendPlaylists(null, 5, pageSize, true);
    } else {
      var sin = isMore ? plState.sin : (isRefresh ? (Math.floor(Math.random()*6)*pageSize) : 0);
      req = API.playlistsByTagPage(currentCat, 5, sin, pageSize).then(function(list){
        plState.sin = sin + pageSize;
        return list;
      });
    }
    req.then(function(list){
      plState.loading = false;
      list = list || [];
      // 去重追加
      var added = [];
      list.forEach(function(p){
        if (!p || !p.dissid || plState.seen[p.dissid]) return;
        plState.seen[p.dissid] = 1;
        plState.list.push(p);
        added.push(p);
      });
      plState._lastAppend = added.length;
      if (isSmart){
        plState.hasMore = added.length > 0;
        // 智能池可能重复，若本页全重复再试一次有限次
        if (isMore && !added.length) plState.hasMore = false;
      } else {
        plState.hasMore = list.length >= pageSize;
      }
      if (!isMore){
        if (!plState.list.length && !isSmart){
          return API.recommendPlaylists(null, 5, 24, true).then(function(list2){
            (list2||[]).forEach(function(p){
              if (!p || !p.dissid || plState.seen[p.dissid]) return;
              plState.seen[p.dissid]=1; plState.list.push(p);
            });
            renderPlGrid(false);
            if (plState.list.length) toast("该分类暂无数据，已展示推荐歌单");
          });
        }
        renderPlGrid(false);
      } else {
        if (added.length) renderPlGrid(true);
        else if (tip) tip.textContent = "已加载全部";
      }
    }).catch(function(){
      plState.loading = false;
      if (!isMore){
        if (wrap) wrap.innerHTML = emptyHtml("加载失败","请稍后重试");
      } else if (tip) tip.textContent = "加载失败，上拉重试";
    });
  }
  $all(".sr-tab", v).forEach(function(t){
    t.onclick = function(){
      $all(".sr-tab", v).forEach(function(x){ x.classList.remove("active"); });
      t.classList.add("active");
      load(t.dataset.id, false, false);
    };
  });
  var rb = $("#plRefreshBtn");
  if (rb) rb.onclick = function(e){
    e.preventDefault();
    e.stopPropagation();
    load(currentCat, true, false);
    toast("已换一批");
  };
  // 滚动加载更多（用 view 上的最新 load 引用，避免闭包过期）
  window._qqmPlLoadMore = function(){ load(currentCat, false, true); };
  window._qqmPlState = plState;
  if (!v._plScrollBound){
    v._plScrollBound = true;
    v.addEventListener("scroll", function(){
      if (state.view !== "playlists") return;
      var st = window._qqmPlState;
      if (!st || st.loading || !st.hasMore) return;
      var remain = v.scrollHeight - v.scrollTop - v.clientHeight;
      if (remain < 180){
        try { window._qqmPlLoadMore && window._qqmPlLoadMore(); } catch(e) {}
      }
    }, { passive: true });
  }
  load("smart", false, false);
}

function renderSingerDetail(params){
  var v = $("#view-singerDetail");
  var mid = params.mid || "";
  var name = params.name || "";
  var src = params.source || "qq";
  v.innerHTML = '<div class="skeleton" style="height:120px;border-radius:20px;margin-top:16px"></div>';

  function loadParts(){
    // QQ 原生
    if (src === "qq" || (!params.source && mid && !/^(kg_|kw_|ne_|yt_)/i.test(mid))){
      return Promise.all([
        API.singerSongs(mid),
        API.singerAlbums(mid)
      ]).then(function(parts){
        return {
          songs: (parts[0] && parts[0].songs) || [],
          total: (parts[0] && parts[0].total) || 0,
          info: (parts[0] && parts[0].info) || {},
          albums: parts[1] || [],
          albumSongLoader: function(a){ return API.albumSongs(a.mid); }
        };
      });
    }
    // 其它音源：搜索热门曲 + 专辑列表
    var searchFn = src === "kuwo" ? API.kuwoSearch
      : src === "netease" ? API.neteaseSearch
      : src === "kugou" ? API.kugouSearch
      : src === "ytmusic" ? API.ytmusicSearch
      : null;
    var albumFn = src === "kuwo" ? API.kuwoSearchAlbums
      : src === "netease" ? API.neteaseSearchAlbums
      : src === "kugou" ? API.kugouSearchAlbums
      : null;
    var albumSongFn = src === "kuwo" ? API.kuwoAlbumSongs
      : src === "netease" ? API.neteaseAlbumSongs
      : src === "kugou" ? API.kugouAlbumSongs
      : null;

    var q = name || mid;
    return Promise.all([
      searchFn ? searchFn(q, 1) : Promise.resolve({ list: [] }),
      albumFn ? albumFn(q) : Promise.resolve([])
    ]).then(function(parts){
      var res = parts[0] || { list: [] };
      var albums = parts[1] || [];
      var songs = res.list || [];
      // 优先歌手名匹配的歌曲
      songs = songs.slice().sort(function(a,b){
        var sa = (a.singer && name && a.singer.indexOf(name) >= 0) ? 1 : 0;
        var sb = (b.singer && name && b.singer.indexOf(name) >= 0) ? 1 : 0;
        return sb - sa;
      });
      // 专辑优先本歌手
      albums = (albums || []).filter(function(a){
        if (!name) return true;
        if (a.singer && a.singer.indexOf(name) >= 0) return true;
        if (a.name && name && a.name.indexOf(name) >= 0) return true;
        return false;
      });
      // 若过滤后太少，回退全部
      if (albums.length < 2 && (parts[1] || []).length){
        albums = parts[1];
      }
      var cover = (res.singers && res.singers[0] && res.singers[0].cover) || (songs[0] && songs[0].cover) || (albums[0] && albums[0].cover) || "";
      return {
        songs: songs,
        total: songs.length,
        info: { name: name, cover: cover },
        albums: albums,
        albumSongLoader: function(a){
          if (!albumSongFn) return Promise.resolve({ songs: [] });
          return albumSongFn(a.albumId || a.mid);
        }
      };
    });
  }

  loadParts().then(function(parts){
    parts = parts || {};
    var songRes = { songs: parts.songs || [], total: parts.total || 0, info: parts.info || {} };
    var albums = parts.albums || [];
    var songs = songRes.songs || [];
    var albumSongLoader = parts.albumSongLoader || function(a){ return API.albumSongs(a.mid); };
    var cover = (songRes.info && songRes.info.cover) || (src === "qq" ? coverUrl(mid, "singer") : "") || (songs[0] && songs[0].cover) || "";
    var displayName = name || (songRes.info && songRes.info.name) || "歌手";

    v.innerHTML =
      '<div class="sec-head" style="margin-top:8px"><button type="button" id="singerBackBtn" style="padding:6px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px">‹ 返回</button></div>'+
      '<div class="mine-header">'+
        '<div class="mine-avatar" style="border-radius:50%">'+safeImg(cover)+'</div>'+
        '<div><div class="mine-name">'+esc(displayName)+'</div>'+
        '<div class="mine-uin">'+(songRes.total || songs.length)+' 首热门 · '+albums.length+' 张专辑</div></div>'+
        '<button class="hero-play" id="playAllSinger" style="margin-left:auto"><svg><use href="#i-play"/></svg>播放全部</button>'+
      '</div>'+
      '<div class="sr-tabs" id="singerTabs" style="margin:12px 0;gap:10px">'+
        '<div class="sr-tab active" data-tab="hot">热门歌曲</div>'+
        '<div class="sr-tab" data-tab="album">专辑</div>'+
      '</div>'+
      '<div id="singerBody"></div>';

    var body = $("#singerBody");
    function showHot(){
      if (!songs.length){
        body.innerHTML = emptyHtml("暂无热门歌曲", "可切换到「专辑」浏览");
        return;
      }
      body.innerHTML = '<div class="song-list" id="singerSongs"></div>';
      renderSongList($("#singerSongs"), songs);
    }
    function showAlbums(){
      if (!albums.length){
        body.innerHTML = emptyHtml("暂无专辑", "");
        return;
      }
      // 每个专辑下方自带展开面板，点击就地展开，不跳到底部
      body.innerHTML = albums.map(function(a, i){
        return '<div class="album-block" data-i="'+i+'">'+
          '<div class="song-row singer-album" data-i="'+i+'">'+
            '<div class="song-cover">'+safeImg(a.cover)+'</div>'+
            '<div class="song-meta">'+
              '<div class="song-title">'+esc(a.name)+'</div>'+
              '<div class="song-sub">'+(a.pubTime ? esc(String(a.pubTime).slice(0,10)) : "专辑")+(a.company && a.company !== "未确定" ? " · "+esc(a.company) : "")+'</div>'+
            '</div>'+
            '<span class="album-chevron" style="color:var(--text-2);font-size:16px;padding-right:8px;transition:transform .2s">›</span>'+
          '</div>'+
          '<div class="album-panel" data-i="'+i+'" style="display:none;padding:0 0 8px 12px;border-left:2px solid rgba(var(--accent-rgb),.35);margin:0 12px 6px 18px"></div>'+
        '</div>';
      }).join("");

      $all(".singer-album", body).forEach(function(row){
        row.onclick = function(){
          var i = Number(row.dataset.i);
          var a = albums[i];
          if (!a) return;
          var block = row.closest(".album-block") || row.parentNode;
          var panel = block.querySelector(".album-panel");
          var chev = row.querySelector(".album-chevron");
          if (!panel) return;

          // 已展开：收起
          if (panel.style.display === "block"){
            panel.style.display = "none";
            panel.innerHTML = "";
            row.style.background = "";
            if (chev) chev.style.transform = "";
            return;
          }

          // 收起其它已展开项
          $all(".album-panel", body).forEach(function(p){
            if (p !== panel){ p.style.display = "none"; p.innerHTML = ""; }
          });
          $all(".singer-album", body).forEach(function(x){ x.style.background = ""; });
          $all(".album-chevron", body).forEach(function(c){ c.style.transform = ""; });

          row.style.background = "rgba(var(--accent-rgb),.1)";
          if (chev) chev.style.transform = "rotate(90deg)";
          panel.style.display = "block";
          panel.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 4px 4px">'+
              '<span style="font-size:12px;color:var(--text-2)">加载中…</span>'+
              '<button type="button" class="play-album-btn sec-more" style="border:none;background:none;font-size:13px">播放专辑</button>'+
            '</div>'+
            '<div class="song-list album-song-list">'+skeletonRows(4)+'</div>';

          albumSongLoader(a).then(function(res){
            // 面板可能已被收起/切换
            if (panel.style.display !== "block") return;
            var list = (res && res.songs) || [];
            var head = panel.querySelector("span");
            var wrap = panel.querySelector(".album-song-list");
            var pb = panel.querySelector(".play-album-btn");
            if (head) head.textContent = list.length ? (list.length + " 首") : "暂无歌曲";
            if (!wrap) return;
            if (!list.length){ wrap.innerHTML = emptyHtml("专辑暂无歌曲",""); return; }
            // 统一标记音源，方便播放
            list.forEach(function(s){ if (!s.source) s.source = src; });
            renderSongList(wrap, list);
            if (pb) pb.onclick = function(e){ e.stopPropagation(); playQueue(list, 0); };
          });
        };
      });
    }

    showHot();
    $all("#singerTabs .sr-tab").forEach(function(t){
      t.onclick = function(){
        $all("#singerTabs .sr-tab").forEach(function(x){ x.classList.remove("active"); });
        t.classList.add("active");
        if (t.dataset.tab === "album") showAlbums();
        else showHot();
      };
    });
    var playAll = $("#playAllSinger");
    if (playAll) playAll.onclick = function(){ if (songs.length) playQueue(songs, 0); else toast("暂无可播放歌曲"); };
    var sb = $("#singerBackBtn");
    if (sb) sb.onclick = function(){ handleBack(); };
  }).catch(function(){
    v.innerHTML = emptyHtml("加载歌手失败", "请返回重试");
  });
}

function bindParserSettings(){
  var modeBtn=$("#lxModeBtn"),saveBtn=$("#lxSaveBtn"),testBtn=$("#lxTestBtn");
  if (!modeBtn || modeBtn._parserBound) return;
  modeBtn._parserBound=true;
  var modes=["auto","url","v4","v3"];
  var labels={auto:"自动识别",url:"URL",v4:"V4 签名",v3:"V3"};
  $("#lxBaseInput").value=LX_API.base;
  $("#lxKeyInput").value=LX_API.key;
  $("#lxSecretInput").value=LX_API.secret;
  $("#lxTokenInput").value=LX_API.tokenMd5;
  modeBtn.setAttribute("data-mode",LX_API.mode);
  modeBtn.textContent=labels[LX_API.mode]||labels.v4;
  function status(text,ready){
    var node=$("#parserStatus");
    if (!node) return;
    node.textContent=text;
    node.classList.toggle("ready",!!ready);
  }
  function report(text){
    var node=$("#lxProbeReport");
    if (node) node.textContent=text||"";
  }
  status("已启用 "+LX_API.mirrors.length+" 条解析线路 · "+Math.round(LX_API.budgetMs/1000)+" 秒时间盒",true);
  function saveConfig(silent){
    var base=String($("#lxBaseInput").value||"").trim().replace(/\/$/,"");
    if (base && !/^https?:\/\//i.test(base)){
      toast("服务地址必须以 http:// 或 https:// 开头",2600);
      return false;
    }
    storeSet("lxApiBase",base);
    storeSet("lxApiKey",String($("#lxKeyInput").value||"").trim());
    storeSet("lxApiSecret",String($("#lxSecretInput").value||""));
    storeSet("lxTokenMd5",String($("#lxTokenInput").value||"").trim());
    storeSet("lxApiMode",String((modeBtn&&modeBtn.getAttribute("data-mode"))||"auto"));
    reloadLxApiConfig();
    _lxParserFailureCount=0;
    _lxParserSuppressUntil=0;
    (state.queue||[]).forEach(function(song){
      if (!song) return;
      song.playUrl="";
      try{ delete song._fbTried; delete song._resolvedSource; }catch(e){}
    });
    status("已启用 "+LX_API.mirrors.length+" 条解析线路 · "+Math.round(LX_API.budgetMs/1000)+" 秒时间盒",true);
    report("自定义线路优先；失败后自动轮询原版共享 URL、V4/V3 与 QQ vkeys");
    if (!silent) toast("解析服务设置已保存",1800);
    return true;
  }
  if (modeBtn) modeBtn.onclick=function(){
    var current=modeBtn.getAttribute("data-mode")||"auto";
    var index=modes.indexOf(current);
    var next=modes[(index+1+modes.length)%modes.length];
    modeBtn.setAttribute("data-mode",next);
    modeBtn.textContent=labels[next];
  };
  if (saveBtn) saveBtn.onclick=function(){ saveConfig(false); };
  if (testBtn) testBtn.onclick=function(){
    if (!saveConfig(true)) return;
    testBtn.disabled=true;
    status("正在执行多线路能力测试",false);
    report("准备探测解析协议…");
    API.lxCapabilityProbe(function(text){ report(text); }).then(function(result){
      report(result.text);
      if (result.ok){
        _lxParserFailureCount=0;_lxParserSuppressUntil=0;
        status("可用 "+result.sourceOk+"/"+result.sourceTotal+" · 线路 "+result.routeOk+"/"+result.routeTotal,true);
        toast("解析能力测试完成",1800);
      } else {
        status("全部线路未返回音频",false);
        toast("解析线路当前不可用或测试歌曲未命中",2800);
      }
      testBtn.disabled=false;
    }).catch(function(err){
      report("能力测试失败："+String(err&&err.message||"未知错误"));
      status("能力测试失败",false);toast("解析能力测试失败",2400);testBtn.disabled=false;
    });
  };
  var closeBtn=$("#parserConfigClose");
  if (closeBtn) closeBtn.onclick=function(){ tryCloseOverlay(false); };
}

var _lxParserFailureCount=0;
var _lxParserSuppressUntil=0;
var _parserConfigReturnEl=null;
function openParserConfig(){
  var view=$("#parserConfigView");
  if (!view || view.classList.contains("show")) return;
  _parserConfigReturnEl=document.activeElement;
  bindParserSettings();
  view.classList.add("show");
  view.setAttribute("aria-hidden","false");
  _lxParserFailureCount=0;
  _lxParserSuppressUntil=Date.now()+60000;
  pushOverlayState("parser");
  syncAppUnderlay();
  if (state.isTv){
    syncTvFocusMetadata();
    setTimeout(function(){ focusRemoteTarget($("#lxBaseInput")||$("#parserConfigClose")); },80);
  }
}
function closeParserConfig(){
  var view=$("#parserConfigView");
  if (!view) return;
  view.classList.remove("show");
  view.setAttribute("aria-hidden","true");
  syncAppUnderlay();
  if (state.isTv){
    refreshFocusDomain();
    var target=_parserConfigReturnEl;

    if (tip && !isFirst) tip.textContent = "加载中…";

      var slice = detailState.cdAll.slice(start, start + PAGE);
      detailState.songs = detailState.songs.concat(slice);

        detailState.songs = detailState.songs.concat(more);
        detailState.page++;
        detailState.hasMore = !!res.hasMore && more.length > 0;

/** 收藏项统一取 songmid */
function favMidOf(item){
  if (!item) return "";

}
function isFavorite(mid){
  if (!mid) return false;
  for (var i=0;i<state.favorites.length;i++){
    if (favMidOf(state.favorites[i]) === mid) return true;
  }
  return false;
}
function favIndexOf(mid){
  if (!mid) return -1;
  for (var i=0;i<state.favorites.length;i++){
    if (favMidOf(state.favorites[i]) === mid) return i;
  }
  return -1;
}
/** 从完整 song 抽可持久化字段 */
function slimSong(song){
  if (!song) return null;

  if (!mid) return null;
  return {
    songmid: mid,
    songid: Number(song.songid || song.songId || song.id || 0) || 0,
    media_mid: song.media_mid || song.strMediaMid || song.mediaMid || "",
    name: song.name || song.title || mid,

    albummid: song.albummid || song.album_mid || "",
    albumname: song.albumname || "",
    cover: song.cover || "",

}
/** 解析收藏列表为可播放 song 对象（旧版纯 mid 会先占位再补全） */
function resolveFavoriteSongs(){

    if (typeof item === "string"){

    }

  });
