/** 用 QQ 接口补全歌名/歌手（仅 qq 源 mid） */
API.hydrateSongs = function(songs){
  var list = (songs || []).filter(function(s){
    return s && s.songmid && (!s.source || s.source === "qq") &&
      (s._needHydrate || !s.name || s.name === s.songmid || !s.singer);
  });
  if (!list.length) return Promise.resolve(songs || []);
  var mids = [];
  var seen = {};
  list.forEach(function(s){
    if (!seen[s.songmid]){ seen[s.songmid] = 1; mids.push(s.songmid); }
  });
  mids = mids.slice(0, 40);
  // 逐首 get_song_detail_yqq（兼容性最好）
  var chain = Promise.resolve({});
  var byMid = {};
  mids.forEach(function(mid){
    chain = chain.then(function(){
      var body = JSON.stringify({
        comm: { ct: 24, cv: 0, uin: String((state.user && state.user.uin) || "0") },
        songinfo: {
          module: "music.pf_song_detail_svr",
          method: "get_song_detail_yqq",
          param: { song_mid: mid }
        }
      });
      return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
        method: "POST",
        headers: withCookie({ "Content-Type": "application/json", "Referer": "https://y.qq.com/" }),
        body: body
      }).then(function(txt){
        var d = jsonp_safeParse(txt);
        var info = d && d.songinfo && d.songinfo.data && (d.songinfo.data.track_info || d.songinfo.data);
        if (!info) return;
        var n = null;
        try { n = normalizeSongFromSearch(info); } catch(eN) {}
        if (!n || !n.songmid){
          var name = info.name || info.title || "";
          var singers = info.singer || [];
          var singer = Array.isArray(singers) ? singers.map(function(a){ return a.name || ""; }).filter(Boolean).join("/") : (info.singer_name || "");
          var amid = (info.album && (info.album.mid || info.album.pmid)) || info.albummid || "";
          var mediaMid = (info.file && (info.file.media_mid || info.file.mediaMid)) || info.media_mid || mid;
          n = {
            songmid: info.mid || info.songmid || mid,
            songid: Number(info.id || info.songid || info.songId || 0) || 0,
            media_mid: mediaMid,
            name: name || mid,
            singer: singer,
            albummid: amid,
            albumname: (info.album && info.album.name) || "",
            cover: "",
            interval: info.interval || 0,
            source: "qq"
          };
        }
        n.source = "qq";
        byMid[mid] = n;
        byMid[n.songmid] = n;
      }).catch(function(){});
    });
  });
  return chain.then(function(){
    var changed = false;
    (songs || []).forEach(function(s){
      var info = byMid[s.songmid];
      if (!info) return;
      s.name = info.name || s.name;
      s.singer = info.singer || s.singer;
      s.albummid = info.albummid || s.albummid;
      s.media_mid = info.media_mid || s.media_mid;
      s.interval = info.interval || s.interval;
      s.cover = info.cover || s.cover;
      s.albumname = info.albumname || s.albumname;
      s.source = s.source || "qq";
      delete s._needHydrate;
      var idx = favIndexOf(s.songmid);
      if (idx > -1){
        state.favorites[idx] = slimSong(s);
        changed = true;
      }
    });
    if (changed) storeSet("favorites", state.favorites);
    return songs;
  }).catch(function(){ return songs || []; });
};

function matchFavoriteToQq(song){
  if (!song || !song.name) return Promise.reject(new Error("歌曲信息不完整"));
  var knownId = Number(song.qqSongId || song.songid || song.songId || 0) || 0;
  if ((song.source || "qq") === "qq" && knownId){
    return Promise.resolve({ songid:knownId, songmid:song.qqSongmid || song.songmid, name:song.name, singer:song.singer || "" });
  }
  var singer = ((song.singer || "").split(/[\/、,&]/)[0] || "").trim();
  return API.search((song.name + " " + singer).trim(), 1).then(function(res){
    var best = null, bestScore = -999;
    ((res && res.list) || []).forEach(function(item){
      var score = sourceMatchScore(song, item);
      if (score > bestScore){ bestScore = score; best = item; }
    });
    if (!best || bestScore < 8 || !(Number(best.songid) > 0)) throw new Error("QQ音乐未找到可同步版本");
    return best;
  });
}
API.syncQqFavorite = function(song, add){
  if (!state.user || !state.user.uin) return Promise.reject(new Error("未登录QQ音乐"));
  return matchFavoriteToQq(song).then(function(qqSong){
    var body = {
      comm: {
        ct:24, cv:0, format:"json", uin:Number(state.user.uin) || 0,
        authst:(state.user.qqmusic_key || state.user.qm_keyst || "")
      },
      req_0: {
        module:"music.musicasset.PlaylistDetailWrite",
        method:add ? "AddSonglist" : "DelSonglist",
        param:{ dirId:201, v_songInfo:[{ songType:0, songId:Number(qqSong.songid) }] }
      }
    };
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method:"POST",
      headers:withCookie({ "Content-Type":"application/json", "Referer":"https://y.qq.com/" }),
      body:JSON.stringify(body), credentials:"include", timeout:20
    }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var block = d && d.req_0;
      var updateTime = block && block.data && block.data.result && block.data.result.updateTime;
      if (!block || Number(block.code) !== 0 || !updateTime) throw new Error((block && block.msg) || "官方收藏接口未确认成功");
      return qqSong;
    });
  });
};
var _favoriteOps = {};
function syncPendingFavoritesToOfficial(){

function sourceMatchText(value){
  return String(value||"").toLowerCase().replace(/[\s\-—_·.，,。!！?？'"“”‘’()（）\[\]【】]/g,"");
}
function sourceMatchScore(origin,candidate){
  var on=sourceMatchText(origin&&origin.name),cn=sourceMatchText(candidate&&candidate.name);
  var os=sourceMatchText(((origin&&origin.singer)||"").split(/[\/、,&]/)[0]);
  var cs=sourceMatchText((candidate&&candidate.singer)||"");
  var originVariant=/live|现场|伴奏|翻唱|remix|dj版|纯音乐/i.test(origin&&origin.name||"");
  var candidateVariant=/live|现场|伴奏|翻唱|remix|dj版|纯音乐|串烧|\+|合唱版/i.test(candidate&&candidate.name||"");
  if (candidateVariant && !originVariant) return -999;
  var score=0;
  if (on && cn===on) score+=12;
  else if (on && cn && (cn.indexOf(on)>=0 || on.indexOf(cn)>=0)) score+=7;
  if (os && cs===os) score+=6;
  else if (os && cs && (cs.indexOf(os)>=0 || os.indexOf(cs)>=0)) score+=4;
  if (on && cn && cn!==on && cn.length>on.length+6) score-=7;
  return score;
}
function searchSongsForSource(src,kw){
  var fn=src==="kuwo"?API.kuwoSearch
    :src==="netease"?API.neteaseSearch
    :src==="kugou"?API.kugouSearch
    :src==="ytmusic"?API.ytmusicSearch
    :API.search;
  return fn(kw,1).then(function(res){ return (res&&res.list)||[]; }).catch(function(){ return []; });
}
function resolveFreeOfficialFallback(song){
  if (!song || !song.name) return Promise.resolve(null);
  var singer=((song.singer||"").split(/[\/、,&]/)[0]||"").trim();
  var kw=(song.name+" "+singer).trim();

  function pickStrict(list){
    var best=null,bestScore=-999;
    (list||[]).forEach(function(candidate){
      if (!candidate || candidate.isVip) return;
      var score=sourceMatchScore(song,candidate);
      if (score>bestScore){ bestScore=score;best=candidate; }
    });
    return bestScore>=12?best:null;
  }
  function tryQq(){
    if (song.source==="qq") return Promise.resolve(null);
    return API._searchByType(kw,0,1,8).then(function(res){
      var raw=((((res||{}).data||{}).song||{}).list)||[];
      var list=raw.map(normalizeSongFromSearch);
      var best=pickStrict(list);
      if (!best) return null;
      return API.songUrl(best,true).then(function(url){
        if (_lxIsRejectedMedia(url)) return null;
        if (url) song._resolvedSource="qq";
        return url;
      });
    }).catch(function(){ return null; });
  }
  function tryKuwo(){
    if (song.source==="kuwo") return Promise.resolve(null);
    return API.kuwoSearch(kw,1).then(function(res){
      var best=pickStrict((res&&res.list)||[]);
      if (!best) return null;
      return API.kuwoUrl(best).then(function(url){
        if (_lxIsRejectedMedia(url)) return null;
        if (url) song._resolvedSource="kuwo";
        return url;
      });
    }).catch(function(){ return null; });
  }
  function tryNetease(){
    if (song.source==="netease") return Promise.resolve(null);
    return API.neteaseSearch(kw,1).then(function(res){
      var best=pickStrict((res&&res.list)||[]);
      if (!best) return null;
      return API.neteaseUrl(best).then(function(url){
        if (_lxIsRejectedMedia(url)) return null;
        if (url) song._resolvedSource="netease";
        return url;
      });
    }).catch(function(){ return null; });
  }

  var chain=Promise.resolve(null);
  [tryQq,tryKuwo,tryNetease].forEach(function(step){
    chain=chain.then(function(url){ return url||step(); });
  });
  return chain;
}
function resolveQqFallback(song){
  return API.fallbackViaQQ(song,true).then(function(url){
    if (_lxIsRejectedMedia(url)) return null;
    if (url) song._resolvedSource="qq";
    return url;
  }).catch(function(){ return null; });
}
function markSongAsVip(song){
  if (!song) return;
  song.isVip=true;
  $all(".song-row.playing .song-title").forEach(function(title){
    if (!title.querySelector(".tag-vip")) title.insertAdjacentHTML("beforeend",'<span class="tag-vip">VIP</span>');
  });

function resolvePlatformUrlByPolicy(song){
  if (!song) return Promise.resolve(null);
  var source=song.source||"qq";
  var official=function(){ return Promise.resolve(null); };
  if (source==="kuwo") official=function(){ return API.kuwoUrl(song); };
  else if (source==="netease") official=function(){ return API.neteaseUrl(song); };
  else if (source==="kugou") official=function(){ return API.kugouUrl(song); };
  function officialUrl(){
    return official().catch(function(){ return null; }).then(function(url){
      if (_lxIsRejectedMedia(url)) return null;
      if (url) song._resolvedSource=source;
      return url;
    });
  }
  if (!shouldUseAuthorizedParser(song)){
    if (song.isVip == null){
      return officialUrl().then(function(url){
        if (url) return url;
        markSongAsVip(song);
        return resolveAuthorizedParser(song);
      });
    }
    return officialUrl();
  }
  return resolveAuthorizedParser(song).then(function(url){
    if (url) song._resolvedSource=song._resolvedSource||source;
    return url||officialUrl();
  });
}
function resolveStrictSourceUrl(song){
  if (!song) return Promise.resolve(null);
  var task = null;
  if (song.source === "kuwo" || song.source === "netease" || song.source === "kugou") task = resolvePlatformUrlByPolicy(song);
  else if (song.source === "ytmusic") task = API.ytmusicUrl(song).catch(function(){ return null; });
  else task = API.songUrl(song).catch(function(){ return null; });
  return task.then(function(url){
    if (url){ song._resolvedSource=song._resolvedSource||song.source||"qq"; return url; }
    return null;
  });
}
function rollbackSourceSwitch(song,message){
  var rb=song&&song._sourceSwitchRollback;
  if (!rb || !rb.song) return false;
  if (state.queueIndex!==rb.index || state.queue[rb.index]!==song) return false;
  state.queue[rb.index]=rb.song;
  _sourceSwitchResumeTime=rb.time||0;
  _sourceSwitchPauseAfterLoad=!!rb.paused;
  setMusicSource(rb.song.source||"qq");
  refreshPlatformSurface("platform-rollback");
  syncSourceSwitchUI();
  toast(message||"目标音源不可播放，已恢复原音源",2600);

function switchCurrentTrackSource(target){
  if (MUSIC_SOURCES.indexOf(target)<0 || _sourceSwitchBusy) return;
  var origin=state.queue[state.queueIndex];
  var originIndex=state.queueIndex;
  if (!origin){
    selectBrowsingSource(target);
    toast("搜索音源已切换为 "+SOURCE_LABELS[target]);
    return;
  }
  var from=(origin._resolvedSource||origin.source||"qq");
  if (from===target){ toast("当前已经是 "+SOURCE_LABELS[target]+" 音源"); return; }
  _sourceSwitchBusy=true;
  syncSourceSwitchUI(target);
  toast("正在匹配 "+SOURCE_LABELS[target]+" 音源…",1800);
  var firstSinger=((origin.singer||"").split(/[\/、,&]/)[0]||"").trim();
  var keyword=(origin.name+" "+firstSinger).trim();
  searchSongsForSource(target,keyword).then(function(list){
    if (state.queueIndex!==originIndex || state.queue[originIndex]!==origin){
      _sourceSwitchBusy=false;syncSourceSwitchUI();return;
    }
    var best=null,bestScore=-999;
    (list||[]).forEach(function(item){
      var score=sourceMatchScore(origin,item);
      if (score>bestScore){bestScore=score;best=item;}
    });
    if (!best || bestScore < 8){
      _sourceSwitchBusy=false;syncSourceSwitchUI();toast(SOURCE_LABELS[target]+" 未找到匹配歌曲");return;
    }
    var resumeTime=audio&&isFinite(audio.currentTime)?Math.max(0,audio.currentTime):0;
    var pauseAfter=!!(audio&&audio.paused);
    best.source=target;
    best.playUrl="";
    toast("正在验证 "+SOURCE_LABELS[target]+" 播放地址…",1800);
    return resolveStrictSourceUrl(best).then(function(url){
      if (state.queueIndex!==originIndex || state.queue[originIndex]!==origin){
        _sourceSwitchBusy=false;syncSourceSwitchUI();return;
      }
      if (!url){
        _sourceSwitchBusy=false;syncSourceSwitchUI();toast(SOURCE_LABELS[target]+" 暂无可用播放地址");return;
      }
      best.playUrl=url;
      best._strictSourceSwitch=1;
      best._sourceSwitchedFrom=from;
      best._sourceSwitchRollback={song:origin,index:originIndex,time:resumeTime,paused:pauseAfter};
      state.queue[originIndex]=best;
      _sourceSwitchResumeTime=resumeTime;
      _sourceSwitchPauseAfterLoad=pauseAfter;
      setMusicSource(target);
      refreshPlatformSurface("player-source-switch");
      _sourceSwitchBusy=false;
      syncSourceSwitchUI();
      loadCurrent();
      toast("已切换到 "+SOURCE_LABELS[target]+" · "+best.name,2200);
    });
  }).catch(function(){
    _sourceSwitchBusy=false;syncSourceSwitchUI();toast(SOURCE_LABELS[target]+" 音源切换失败");
  });
}
function cycleCurrentTrackSource(){
  var current=currentSongSource();

/** 完整搜索结果：单曲 + 歌手 + 歌单 + 专辑 */
function renderSearchResults(kw){
  kw = (kw || "").trim();
  var v = $("#view-search");
  if (!v) return;
  var seq = ++_searchSeq;

  if (state.source === "kugou" || state.source === "kuwo" || state.source === "netease" || state.source === "ytmusic"){
    var srcLabel = { kugou:"酷狗", kuwo:"酷我", netease:"网易", ytmusic:"YTM" }[state.source] || state.source;
    v.innerHTML =
      '<div class="sec-head" style="margin-top:12px;align-items:center">'+
        '<button type="button" class="sr-back" id="searchBackBtn" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px;font-weight:500;margin-right:8px">‹ 返回</button>'+
        '<div class="sec-title" style="font-size:17px">'+srcLabel+'「'+esc(kw)+'」</div>'+
      '</div>'+
      renderSourceSwitch()+
      '<div id="searchResults" style="margin-top:8px">'+skeletonRows(8)+'</div>';
    $("#searchBackBtn").onclick = function(){ handleBack(); };
    bindSourceTabs(v);
    var searchFn = state.source === "kuwo" ? API.kuwoSearch
      : state.source === "netease" ? API.neteaseSearch
      : state.source === "ytmusic" ? API.ytmusicSearch
      : API.kugouSearch;
    searchFn(kw, 1).then(function(res){
      if (seq !== _searchSeq) return;
      var wrap = $("#searchResults");
      if (!wrap) return;
      var songs = (res && res.list) || [];
      var singers = (res && res.singers) || [];
      if (!songs.length && !singers.length){
        wrap.innerHTML = emptyHtml(srcLabel+"未找到结果", "换个关键词试试");
        return;
      }
      // 酷我 / 网易 / 酷狗 / YT：歌手与 QQ 一致（列表行 + 圆头像），再单曲
      if ((state.source === "ytmusic" || state.source === "kuwo" || state.source === "netease" || state.source === "kugou") && (singers.length || songs.length)){
        var html = "";
        if (singers.length){
          html += '<div class="sec" style="margin-top:6px"><div class="sec-head"><div class="sec-title" style="font-size:16px">歌手</div></div>';
          html += singers.slice(0, 6).map(function(s){
            return '<div class="song-row src-artist-row" data-name="'+esc(s.name)+'" data-mid="'+(esc(s.mid||""))+'">'+
              '<div class="song-cover" style="border-radius:50%">'+safeImg(s.cover||"")+'</div>'+
              '<div class="song-meta"><div class="song-title">'+esc(s.name)+'</div>'+
              '<div class="song-sub">歌手</div></div></div>';
          }).join("");
          html += '</div>';
        }
        if (songs.length){
          html += '<div class="sec" style="margin-top:10px"><div class="sec-head"><div class="sec-title" style="font-size:16px">单曲</div></div>'+
            '<div class="song-list" id="altSongList"></div></div>';
        }
        wrap.innerHTML = html;
        if (songs.length){
          renderSongList($("#altSongList"), songs);
        }
        $all(".src-artist-row", wrap).forEach(function(row){
          row.onclick = function(){
            var name = row.dataset.name || "";
            var mid = row.dataset.mid || "";
            if (!name && !mid) return;
            openSourceArtist(name, mid, state.source);
          };
        });
        return;
      }
      renderSongList(wrap, songs);
    });
    return;
  }

  v.innerHTML =
    '<div class="sec-head" style="margin-top:12px;align-items:center">'+
      '<button type="button" class="sr-back" id="searchBackBtn" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px;font-weight:500;margin-right:8px">‹ 返回</button>'+
      '<div class="sec-title" style="font-size:17px">搜索「'+esc(kw)+'」</div>'+
    '</div>'+
    renderSourceSwitch()+
    '<div class="sr-tabs" id="srTabs" style="margin:10px 0 12px;gap:10px">'+
      '<div class="sr-tab active" data-tab="all">综合</div>'+
      '<div class="sr-tab" data-tab="song">单曲</div>'+
      '<div class="sr-tab" data-tab="singer">歌手</div>'+
      '<div class="sr-tab" data-tab="playlist">歌单</div>'+
      '<div class="sr-tab" data-tab="album">专辑</div>'+
    '</div>'+
    '<div id="searchResults">'+skeletonRows(8)+'</div>';
  var backBtn = $("#searchBackBtn");
  if (backBtn) backBtn.onclick = function(){ handleBack(); };
  bindSourceTabs(v);

  API.search(kw, 1).then(function(res){
    if (seq !== _searchSeq) return;
    var wrap = $("#searchResults");
    if (!wrap) return;
    var hasAny = (res.list && res.list.length) || (res.singers && res.singers.length) ||
      (res.playlists && res.playlists.length) || (res.albums && res.albums.length);
    if (!hasAny){
      wrap.innerHTML = emptyHtml('没有找到 "'+esc(kw)+'" 相关结果',"换个关键词试试");
      return;
    }

    function renderTab(tab){
      var html = "";
      if (tab === "all" || tab === "singer"){
        if (res.singers && res.singers.length){
          html += '<div class="sec" style="margin-top:6px"><div class="sec-head"><div class="sec-title" style="font-size:16px">歌手</div></div>';
          var sl = (tab === "all") ? res.singers.slice(0, 4) : res.singers.slice(0, 20);
          html += sl.map(function(s){
            var mid = s.singer_mid || s.mid || s.singerMID || "";
            var name = s.singer_name || s.name || s.singerName || "";
            var pic = s.singer_pic || s.pic || coverUrl(mid, "singer");
            return '<div class="song-row sr-singer" data-mid="'+esc(mid)+'" data-name="'+esc(name)+'">'+
              '<div class="song-cover" style="border-radius:50%">'+safeImg(pic)+'</div>'+
              '<div class="song-meta"><div class="song-title">'+esc(name)+'</div><div class="song-sub">歌手'+(s.song_num?(' · '+s.song_num+' 首'):'')+'</div></div></div>';
          }).join("");
          html += '</div>';
        }
      }
      if (tab === "all" || tab === "song"){
        if (res.list && res.list.length){
          html += '<div class="sec" style="margin-top:6px"><div class="sec-head"><div class="sec-title" style="font-size:16px">单曲</div>'+
            (res.total ? '<div class="sec-more" style="font-size:12px;color:var(--text-2)">共 '+fmtCount(res.total)+' 首</div>' : '')+
            '</div><div class="song-list" id="srSongList"></div></div>';
        }
      }
      if (tab === "all" || tab === "playlist"){
        if (res.playlists && res.playlists.length){
          html += '<div class="sec" style="margin-top:6px"><div class="sec-head"><div class="sec-title" style="font-size:16px">歌单</div></div>';
          var pl = (tab === "all") ? res.playlists.slice(0, 6) : res.playlists.slice(0, 20);
          html += pl.map(function(p){
            var id = String(p.dissid || p.id || p.tid || "");
            var title = p.dissname || p.title || p.name || "";
            var cover = fixCover(p.imgurl || p.logo || p.picurl || p.cover || "");
            var creator = (p.creator && (p.creator.name || p.creator.nickname)) || p.nickname || "";
            return '<div class="song-row sr-pl" data-id="'+esc(id)+'">'+
              '<div class="song-cover">'+safeImg(cover)+'</div>'+
              '<div class="song-meta"><div class="song-title">'+esc(title)+'</div><div class="song-sub">歌单'+(creator?(' · '+esc(creator)):'')+'</div></div></div>';
          }).join("");
          html += '</div>';
        }
      }
      if (tab === "all" || tab === "album"){
        if (res.albums && res.albums.length){
          html += '<div class="sec" style="margin-top:6px"><div class="sec-head"><div class="sec-title" style="font-size:16px">专辑</div></div>';
          var al = (tab === "all") ? res.albums.slice(0, 6) : res.albums.slice(0, 20);
          html += al.map(function(a){
            var mid = a.albumMID || a.album_mid || a.mid || "";
            var name = a.albumName || a.album_name || a.name || "";
            var singer = a.singerName || a.singer_name || "";
            var pic = a.albumPic || a.pic || coverUrl(mid);
            return '<div class="song-row sr-album" data-mid="'+esc(mid)+'">'+
              '<div class="song-cover">'+safeImg(pic)+'</div>'+
              '<div class="song-meta"><div class="song-title">'+esc(name)+'</div><div class="song-sub">专辑'+(singer?(' · '+esc(singer)):'')+'</div></div></div>';
          }).join("");
          html += '</div>';
        }
      }
      if (!html){
        html = emptyHtml("该分类暂无结果", "试试其它分类或换个词");
      }
      wrap.innerHTML = html;
      if ((tab === "all" || tab === "song") && res.list && res.list.length){
        var songWrap = $("#srSongList");
        if (songWrap) renderSongList(songWrap, tab === "all" ? res.list.slice(0, 15) : res.list);
      }
      $all(".sr-singer", wrap).forEach(function(row){
        row.onclick = function(){ switchView("singerDetail", { mid: row.dataset.mid, name: row.dataset.name }); };
      });
      $all(".sr-pl", wrap).forEach(function(row){
        row.onclick = function(){ switchView("detail", { type: "playlist", id: row.dataset.id }); };
      });
      $all(".sr-album", wrap).forEach(function(row){
        row.onclick = function(){
          var amid = row.dataset.mid;
          toast("加载专辑…");
          API.albumSongs(amid).then(function(res){
            if (!res.songs || !res.songs.length){ toast("专辑暂无歌曲"); return; }
            var title = (row.querySelector(".song-title") || {}).textContent || "";
            switchView("detail", { type: "album", id: amid, title: title, songs: res.songs, cover: coverUrl(amid) });
          });
        };
      });
    }

    renderTab("all");
    $all("#srTabs .sr-tab").forEach(function(t){
      t.onclick = function(){
        $all("#srTabs .sr-tab").forEach(function(x){ x.classList.remove("active"); });
        t.classList.add("active");
        renderTab(t.dataset.tab);
      };
    });
    // 后台补歌手/专辑/歌单，不挡首屏单曲
    API.searchExtra(kw).then(function(extra){
      if (seq !== _searchSeq) return;
      if (!extra) return;
      var ids = {};
      (res.singers || []).forEach(function(s){ if (s.mid) ids[s.mid] = true; });
      (extra.singers || []).forEach(function(s){ if (s.mid && !ids[s.mid]) res.singers.push(s); });
      res.albums = extra.albums || [];
      res.playlists = extra.playlists || [];
      var active = $("#srTabs .sr-tab.active");
      var tab = (active && active.dataset.tab) || "all";
      if (tab !== "song") renderTab(tab);
    });
  });
}

/** 歌手页：QQ 走原生 mid；其它音源走 singerDetail 同源样式（含专辑展开） */
function openSourceArtist(name, mid, source){
  name = (name || "").trim();
  source = source || state.source || "qq";
  mid = mid || "";
  if (!name && !mid){
    toast("无效歌手");
    return;
  }
  // QQ 原生歌手
  if (source === "qq" && mid && !/^(kg_|kw_|ne_|yt_|kw_ar_|kg_ar_|ne_ar_|yt_artist_)/i.test(mid)){
    switchView("singerDetail", { mid: mid, name: name, source: "qq" });
    return;
  }
  switchView("singerDetail", {
    mid: mid || name,
    name: name || mid,
    source: source
  });
}

function doSearch(kw){
  kw = (kw || "").trim();
  if (!kw) return;
  if (state.view === "search"){
    state.viewParams = { kw: kw };
    try {
      history.replaceState(currentHistoryState({view:"search", params:{kw:kw}}), "", "#search/"+encodeURIComponent(kw));
    } catch(e) {}
    renderSearchResults(kw);
    return;
  }
  switchView("search", {kw:kw});
}

var playerSearchHideTimer = null;

function requestPlayerSearchKeyboard(input,selectAll){
  if (!input) return;
  input.readOnly=false;
  input.classList.add("focusable","tv-editing");
  input.setAttribute("tabindex","0");
  try {
    var focused=false;
    if (state.isTv && typeof focusRemoteTarget === "function") focused=focusRemoteTarget(input);
    if (!focused) input.focus();
  } catch(e0) {
    try { input.focus(); } catch(e1) {}
  }
  try {
    if (selectAll && input.select) input.select();
    else if (input.setSelectionRange) input.setSelectionRange(input.value.length,input.value.length);
  } catch(e2) {}
  try { input.click(); } catch(e3) {}
  try {
    var bridge=window.fongmiClient||window.Android||window.WebViewBridge;
    if (bridge){
      if (typeof bridge.showKeyboard === "function") bridge.showKeyboard(input.id);
      else if (typeof bridge.showSoftInput === "function") bridge.showSoftInput(input.id);
      else if (typeof bridge.openKeyboard === "function") bridge.openKeyboard(input.id);
    }
  } catch(e4) {}
}
function openPlayerSearchFloat(){
  var box = $("#playerSearchFloat"), input = $("#playerSearchInput"), mainInput = $("#searchInput");
  if (!box || !input) return;
  clearTimeout(playerSearchHideTimer);
  input.value = mainInput ? mainInput.value : "";
  box.classList.add("show","editing");
  box.setAttribute("aria-hidden","false");
  input.classList.add("focusable");
  if (state.isTv) input.classList.add("tv-editing");
  input.setAttribute("data-focus-row","playerSearch");
  input.setAttribute("data-focus-index","0");
  input.setAttribute("data-focus-key","player-search:input");
  input.setAttribute("tabindex","0");
  input.readOnly = false;
  requestPlayerSearchKeyboard(input,true);
  setTimeout(function(){
    if (!isPlayerSearchOpen()) return;
    requestPlayerSearchKeyboard(input,false);
  },80);
  setTimeout(function(){
    if (!isPlayerSearchOpen() || document.activeElement !== input) return;
    requestPlayerSearchKeyboard(input,false);
  },260);
}
function closePlayerSearchFloat(restoreTvFocus){

  if (!box || !box.classList.contains("show")) return false;

function openMv(mv){
  var mvEl = $("#mvPlayerView");
  if (!mvEl.classList.contains("show")){
    pushOverlayState("mv");
  }
  mvEl.classList.add("show");
  syncAppUnderlay();
  $("#mvTopTitle").textContent = (mv.title || "MV") + (mv.singer ? ("  ·  " + mv.singer) : "");
  var video = $("#mvVideo");
  if (!video) return;
  try{ video.pause(); }catch(e){}
  video.removeAttribute("src");
  video.poster = fixCover(mv.cover || "") || "";
  toast("正在解析MV地址…", 1500);
  API.mvUrl(mv.vid).then(function(url){
    if (!url){
      toast("MV解析失败，请登录后重试或换一个MV");
      return;
    }
    // 页内 <video> 播放；不走 fm.play/webResource（易出现网络读取失败）
    var playSrc = url;
    try{
      if (window.fm && typeof window.fm.res === "function"){
        var proxied = window.fm.res(url, {
          headers: withCookie({ "Referer": "https://y.qq.com/", "User-Agent": QQ_HEADERS["User-Agent"] }),
          credentials: "include"
        });
        if (proxied) playSrc = proxied;
      }
    }catch(e1){}
    video.src = playSrc;
    var p = video.play();
    if (p && typeof p.then === "function"){
      p.catch(function(err){
        console.warn("mv play fail", err);
        // 代理失败回退直链
        if (playSrc !== url){
          video.src = url;
          video.play().catch(function(){
            toast("MV播放失败，可能被防盗链限制");
          });
        } else {
          toast("MV播放失败，可能被防盗链限制");
        }
      });
    }
  });
}

var audioA = $("#audioEl");

function setPlayerResolving(active, gen){

function parkAudioForLoad(el, gen){

    el._qqmSrcToken = "";
    el._qqmPlayAllowed = false;
    el.oncanplay = null;

function _syncAudioVolume(){

function swapAudioPair(){

/** 把下一首装进 standby，canplay 后标记 ready，实现曲末无缝切换 */
function prepareStandbyForNext(){
  try {
    var requestGen = _loadGen;
    if (state.playMode === "single") return;
    var idx = peekNextQueueIndex();
    if (idx < 0) return;
    var s = state.queue[idx];
    if (!s) return;
    // 已为同一首准备好则跳过
    if (_standbyMeta && _standbyMeta.songmid === s.songmid && _standbyMeta.ready) return;
    var applyUrl = function(url){
      if (requestGen !== _loadGen || state.queue[idx] !== s) return;
      if (!url) return;
      try {
        if (s && !s.playUrl) s.playUrl = url;
      } catch(e0) {}
      _standbyMeta = { songmid: s.songmid, url: url, idx: idx, ready: false };
      try {

/** 多频段时间驱动模拟频谱：播放中随 currentTime 跳动，不依赖 WebAudio */
function fillSimulatedFreq(out, t, playing){
  if (!out || !out.length) return 0;
  var n = out.length;
  if (!playing){
    for (var z = 0; z < n; z++) out[z] = Math.max(0, (out[z] || 0) * 0.82);
    return 0;
  }
  // 节拍感：约 2.1Hz 底鼓 + 多层谐波，低频更强
  var kick = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2.15)), 10);
  var hat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 8.4 + 0.4)), 4);
  var sum = 0;
  for (var i = 0; i < n; i++){
    var band = i / n;
    var bass = 0.55 + 0.45 * Math.sin(t * 3.7 + band * 1.8);
    var mid = 0.5 + 0.5 * Math.sin(t * 6.9 + band * 4.6 + 1.2);
    var high = 0.45 + 0.55 * Math.sin(t * 12.5 + band * 9.1 + 0.6);
    var flutter = 0.5 + 0.5 * Math.sin(t * 21 + i * 0.73);
    var energy = (1 - band * 0.62) * (0.22 + bass * 0.42 + mid * 0.28 + high * 0.14);
    energy += kick * (1 - band) * 0.55;
    energy += hat * band * 0.22;
    energy *= 0.75 + flutter * 0.35;
    energy = Math.max(0.04, Math.min(1, energy));
    var v = (energy * 255) | 0;
    out[i] = v;
    sum += v;
  }
  return sum / (n * 255);
}

function updateFpVisualizer(){
  var art = $("#fpArt");
  if (!art) return;
  var style = art.getAttribute("data-style") || "vinyl";
  var need = (style === "spectrum" || style === "wave" || style === "pulse" || style === "ring");
  if (!need) return;

  var playing = !!(audio && !audio.paused);
  var live = false;
  var avg = 0.18;
  var data = null;
  var len = 0;

  if (_analyser && _freqData && playing){
    try {
      _analyser.getByteFrequencyData(_freqData);
      var sum = 0, n = _freqData.length, nonZero = 0;
      for (var i = 0; i < n; i++){
        sum += _freqData[i];
        if (_freqData[i] > 2) nonZero++;
      }
      avg = sum / (n * 255);
      // 连续全零：跨域/静音数据 → 用模拟；偶发有数据则认真实
      if (nonZero > 4 && avg > 0.01){
        live = true;
        _audioGraphOk = true;
        _zeroBinStreak = 0;
        data = _freqData;
        len = n;
      } else {
        _zeroBinStreak++;
        // 播放中连续约 45 帧全零，判定 analyser 读不到有效 PCM
        if (_zeroBinStreak > 45) _audioGraphOk = false;
      }
    } catch(e) { live = false; }
  }

  if (!live){
    if (!_simFreq) _simFreq = new Uint8Array(128);
    var t = 0;
    try { t = audio && isFinite(audio.currentTime) ? audio.currentTime : (Date.now() / 1000); } catch(eT){ t = Date.now() / 1000; }
    avg = fillSimulatedFreq(_simFreq, t, playing);
    data = _simFreq;
    len = _simFreq.length;
  }

  _vizAvgSmooth = _vizAvgSmooth * 0.82 + avg * 0.18;
  avg = _vizAvgSmooth;
  if (_vizFakeState !== !live){
    _vizFakeState = !live;
    art.classList.toggle("is-fake", !live);
  }
  if (!data || !len) return;

  if (style === "spectrum"){
    var bars = art.querySelectorAll("#fpSpectrum i");
    var bn = bars.length;
    if (!bn) return;
    // 环形声波：对称镜像 + 平滑邻域
    var levels = [];
    var half = Math.max(1, Math.floor(bn / 2));
    for (var j = 0; j < bn; j++){
      var idx = Math.min(len - 1, Math.floor((j % half) / half * len * 0.55) + 1);
      levels[j] = data[idx] / 255;
    }
    for (var p = 0; p < 2; p++){
      var next = levels.slice();
      for (var j2 = 0; j2 < bn; j2++){
        var a = levels[(j2 - 1 + bn) % bn], b = levels[j2], c = levels[(j2 + 1) % bn];
        next[j2] = a * 0.2 + b * 0.6 + c * 0.2;

    for (var j3 = 0; j3 < bn; j3++){
      var v = levels[j3];
      if (v > peak) peak = v;
      var scale = playing ? (0.22 + v * 1.65) : 0.12;
      bars[j3].style.transform = "var(--tr) scaleY(" + scale.toFixed(3) + ")";
      bars[j3].style.opacity = String(playing ? (0.35 + v * 0.65) : 0.2);
    }
    var glow = $("#fpSpectrumGlow");
    if (glow){
      var g = 1 + peak * 0.08;
      glow.style.transform = "scale(" + g.toFixed(3) + ")";
      glow.style.opacity = String(playing ? (0.35 + peak * 0.5) : 0.15);
    }
  } else if (style === "wave"){
    // 粒子扩散：从封面【外缘】向外扩散（edgeR≈封面半径，避免被封面挡住）
    ensureFpArtDecor();
    var waveEl = $("#fpWave");
    var pool = waveEl && waveEl._particlePool;
    if (!pool) return;
    var stageEl = art.querySelector(".fp-art-stage");
    var half = stageEl && stageEl.offsetWidth ? stageEl.offsetWidth / 2 : 130;
    // 关键点必须在圆形封面外侧，否则会被封面盖住看不见

    if (playing){
      _waveSpawnAcc += 4.5 + avg * 10;
      var burst = Math.min(16, Math.floor(_waveSpawnAcc));
      _waveSpawnAcc -= burst;
      for (var bi = 0; bi < burst; bi++){

          if (pool[pi].active) continue;
          var p = pool[pi];
          p.active = true;
          p.ang = Math.random() * Math.PI * 2;
          var near = Math.random() < 0.65;
          // 贴边 / 略外一圈，全部在封面外
          p.r = edgeR * (near ? (1.0 + Math.random() * 0.04) : (1.06 + Math.random() * 0.12));
          if (near){
            p.vr = 0.25 + avg * 0.9 + Math.random() * 0.5;
            p.maxLife = 36 + Math.random() * 44;
            p.size = 0.9 + Math.random() * 1.1 + avg * 0.5;
          } else {
            p.vr = 0.7 + avg * 2.2 + Math.random() * 1.2;
            p.maxLife = 28 + Math.random() * 36 + avg * 14;
            p.size = 0.7 + Math.random() * 0.9 + avg * 0.4;
          }
          p.life = 0;
          break;
        }
      }
    } else {
      _waveSpawnAcc += 0.8;
      if (_waveSpawnAcc >= 1){
        _waveSpawnAcc -= 1;
        for (var pi2 = 0; pi2 < pool.length; pi2++){
          if (pool[pi2].active) continue;
          var p2 = pool[pi2];
          p2.active = true;
          p2.ang = Math.random() * Math.PI * 2;
          p2.r = edgeR * (1.0 + Math.random() * 0.05);
          p2.vr = 0.15 + Math.random() * 0.25;
          p2.maxLife = 45 + Math.random() * 40;
          p2.size = 0.8 + Math.random() * 1.0;
          p2.life = 0;
          break;
        }
      }
    }
    for (var wi = 0; wi < pool.length; wi++){

      wp.el.style.transform = "translate(" + wx.toFixed(1) + "px," + wy.toFixed(1) + "px) scale(" + Math.max(0.25, wsc).toFixed(2) + ")";
    }

    var rings = art.querySelectorAll(".fp-pulse-ring");
    var sc = 0.92 + avg * 0.22;

  }
}

    try{

        : resolvedSource === "netease" ? "https://music.163.com/"
        : resolvedSource === "ytmusic" ? "https://music.youtube.com/"

      var hdrs = withCookie({ "Referer": ref, "User-Agent": QQ_HEADERS["User-Agent"] });

      try {
        if (window.fm && typeof window.fm.res === "function"){

        if (i >= candidates.length){

            }
            return;
          }
          if (s.source && s.source !== "qq" && !s._fbTried){
            s._fbTried = 1;
            resolveFreeOfficialFallback(s).then(function(fb){
              return fb||resolveQqFallback(s);
            }).then(function(fb){
              if (gen !== _loadGen) return;
              if (!fb){ setPlayerResolving(false,gen); toast("播放失败：无可用音频地址"); setPlayingUI(false); return; }
              s.playUrl = fb;
              candidates = [fb];
              try {
                if (window.fm && typeof window.fm.res === "function"){
                  var fbSource=s._resolvedSource||"qq";
                  var fbRef=fbSource==="kuwo"?"https://www.kuwo.cn/":(fbSource==="netease"?"https://music.163.com/":"https://y.qq.com/");
                  var p2 = window.fm.res(fb, { headers: withCookie({ "Referer": fbRef }), credentials: "include" });

          }
          toast("播放失败，请检查网络或换一首");
          setPlayerResolving(false,gen);
          setPlayingUI(false);
          return;
        }
        var src = candidates[i];
        var targetAudio = audio;
        if (!targetAudio || targetAudio._qqmLoadGen !== gen) return;
        var srcToken = String(gen) + ":" + String(i) + ":" + src;
        try {
          targetAudio._qqmSrcToken = srcToken;
          targetAudio._qqmPlayAllowed = true;
          targetAudio.muted = false;
          var vol = (typeof state.volume === "number" && state.volume > 0) ? state.volume : 0.8;
          targetAudio.volume = vol;
          try { targetAudio.removeAttribute("crossorigin"); } catch(eC) {}
          targetAudio.src = src;
          try { targetAudio.load(); } catch(eL) {}
          var p = targetAudio.play();
          if (p && typeof p.then === "function"){
            p.then(function(){
              if (gen !== _loadGen || targetAudio !== audio || targetAudio._qqmSrcToken !== srcToken){
                if (targetAudio._qqmSrcToken === srcToken){
                  try { targetAudio.pause(); targetAudio.muted = true; targetAudio.removeAttribute("src"); targetAudio.load(); } catch(eStale) {}
                }
                return;
              }
              try { delete s._strictSourceSwitch; delete s._sourceSwitchRollback; } catch(eSw) {}
              setPlayerResolving(false,gen);
              targetAudio.muted = false;
              if (!(targetAudio.volume > 0.05)) targetAudio.volume = vol;
              setPlayingUI(true);
              try { resumeAudioCtx(); } catch(eR) {}
              updateProgressUI(audio.currentTime || 0, audio.duration || knownDur);
              try { startBgWatch(); } catch(eW) {}
              // 开播后预取下一首直链，并装入 standby 实现无缝联播
              setTimeout(function(){
                try { prefetchNextPlayUrl(); } catch(ePf) {}
                try { prepareStandbyForNext(); } catch(eSb) {}

              setTimeout(function(){

                if (!targetAudio.paused && (targetAudio.currentTime || 0) < 0.05 && (i + 1) < candidates.length){

            }).catch(function(err){
              console.warn("audio.play fail", i, err);

      if (gen !== _loadGen) return;

    if (gen !== _loadGen) return;
    console.warn("loadCurrent resolve error", err);

    toast("解析失败，请稍后重试");
    setPlayingUI(false);
  });
  loadLyricsForSong(s, true);
  highlightPlayingRow();

/* ============================================================
   Media Session：系统状态栏 / 锁屏 / 通知中心接管
   （页面 audio 播放时生效；fm.play 原生通道由宿主自行接管）
   ============================================================ */
var _mediaSessionBound = false;
function updateMediaSession(s){
  try {
    if (!("mediaSession" in navigator)) return;
    s = s || (state.queue && state.queue[state.queueIndex]) || null;
    if (!s){
      try { navigator.mediaSession.metadata = null; } catch(e0){}
      return;
    }
    var cover = "";
    try {
      var raw = typeof songCoverUrl === "function" ? songCoverUrl(s) : (s.cover || "");
      // 状态栏封面尽量用原站 https 图，避免 blob/代理地址失效
      cover = (raw || "").replace(/^http:/, "https:");
      if (cover && cover.indexOf("//") === 0) cover = "https:" + cover;
    } catch(e1){}
    var artwork = [];
    if (cover && /^https?:\/\//i.test(cover)){
      [96, 128, 192, 256, 384, 512].forEach(function(sz){
        artwork.push({ src: cover, sizes: sz + "x" + sz, type: "image/jpeg" });
      });
    }
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.name || "QQ音乐",
      artist: s.singer || "",
      album: s.albumname || s.album || "",
      artwork: artwork
    });
    bindMediaSessionHandlers();
    try {
      navigator.mediaSession.playbackState = (audio && !audio.paused) ? "playing" : "paused";
    } catch(e2){}
    try { syncMediaSessionPosition(); } catch(e3){}
  } catch(e){
    console.warn("[mediaSession] update fail", e);
  }
}
function syncMediaSessionPosition(){
  try {
    if (!("mediaSession" in navigator) || typeof navigator.mediaSession.setPositionState !== "function") return;
    var dur = Number(audio.duration) || 0;
    var cur = Number(audio.currentTime) || 0;
    if (!isFinite(dur) || dur <= 0){
      var s = state.queue && state.queue[state.queueIndex];
      dur = Number(s && s.interval) || 0;
    }
    if (!isFinite(dur) || dur <= 0) return;
    navigator.mediaSession.setPositionState({
      duration: dur,
      playbackRate: audio.playbackRate || 1,
      position: Math.max(0, Math.min(cur, dur))
    });
  } catch(e){}
}
function bindMediaSessionHandlers(){
  if (_mediaSessionBound || !("mediaSession" in navigator)) return;
  _mediaSessionBound = true;
  var ms = navigator.mediaSession;
  try {
    ms.setActionHandler("play", function(){
      try {
        audio.muted = false;
        var p = audio.play();
        if (p && p.catch) p.catch(function(){});
        setPlayingUI(true);
        ms.playbackState = "playing";
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("pause", function(){
      try {
        audio.pause();
        setPlayingUI(false);
        ms.playbackState = "paused";
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("previoustrack", function(){ prevTrack(); });
  } catch(e){}
  try {
    ms.setActionHandler("nexttrack", function(){ nextTrack(false); });
  } catch(e){}
  try {
    ms.setActionHandler("stop", function(){
      try {
        audio.pause();
        audio.currentTime = 0;
        setPlayingUI(false);
        ms.playbackState = "none";
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("seekto", function(details){
      try {
        if (details && typeof details.seekTime === "number" && isFinite(details.seekTime)){
          audio.currentTime = details.seekTime;
          syncMediaSessionPosition();
        }
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("seekbackward", function(details){
      try {
        var off = (details && details.seekOffset) || 10;
        audio.currentTime = Math.max(0, (audio.currentTime || 0) - off);
        syncMediaSessionPosition();
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("seekforward", function(details){
      try {
        var off = (details && details.seekOffset) || 10;
        var dur = audio.duration || 0;
        audio.currentTime = Math.min(dur || 1e9, (audio.currentTime || 0) + off);
        syncMediaSessionPosition();
      } catch(e){}
    });
  } catch(e){}
}

/* 全屏封面视觉样式：黑胶 / 频谱 / 脉冲 / 方封 / 波形 / 光环 */
var FP_ART_STYLES = [
  { id: "vinyl", name: "黑胶" },
  { id: "spectrum", name: "频谱" },
  { id: "pulse", name: "脉冲" },
  { id: "square", name: "方封" },
  { id: "wave", name: "粒子扩散" },
  { id: "ring", name: "光环" }
];
function ensureFpArtDecor(){
  var art = $("#fpArt");
  var stage = art && art.querySelector(".fp-art-stage");
  var spec = $("#fpSpectrum");
  // 半径：封面外一圈（舞台宽度的一半略大一点）
  var radius = 100;
  if (stage && stage.offsetWidth) radius = Math.round(stage.offsetWidth * 0.46);
  if (spec && !spec.childNodes.length){
    var n = 80, html = "";
    for (var i = 0; i < n; i++){
      var rot = (i / n) * 360;
      var delay = (i % 12) * 0.04;
      html += '<i style="--tr:rotate('+rot+'deg) translateY(-'+radius+'px);transform:var(--tr) scaleY(.3);animation-delay:'+delay+'s"></i>';
    }
    spec.innerHTML = html;
  }
  var wave = $("#fpWave");
  if (wave && !wave._particlePool){
    // 粒子扩散：预建密集粒子池，模拟星尘环
    wave.innerHTML = "";
    var pool = [];
    for (var pi = 0; pi < 140; pi++){
      var el = document.createElement("i");
      el.className = "fp-particle";
      wave.appendChild(el);
      pool.push({ el: el, active: false, ang: 0, r: 0, vr: 0, life: 0, maxLife: 1, size: 1 });
    }
    wave._particlePool = pool;
  }
}
var _waveSpawnAcc = 0;

      img.style.width = "100%";
      img.style.height = "100%";
      img.style.border = "none";

function parseLrc(lrc, trans){

      stamps.forEach(function(time){ rows.push({ time:time, text:text }); });

      var prev = rows[index - 1];

    });

  var transRows = rowsFrom(trans || "");
  if (transRows.length){
    var transIndex = 0;
    out.forEach(function(row){
      while (transIndex + 1 < transRows.length && transRows[transIndex + 1].time <= row.time) transIndex++;
      var best = transRows[transIndex];
      var next = transRows[transIndex + 1];
      if (next && (!best || Math.abs(next.time - row.time) < Math.abs(best.time - row.time))) best = next;
      row.tr = best && Math.abs(best.time - row.time) <= 0.35 && best.text !== row.text ? best.text : "";
    });

    out.forEach(function(row){ row.tr = ""; });
  }

function extractAmbientColor(url){
  if (!url){ applyAmbient(themeAmbientColors(), themeLightAmbientColors()); return; }
  var img = new Image();
  img.crossOrigin = "anonymous";
  var fallback = true;
  // 不再 900ms 强制回落主题色（会与封面取色打架导致闪一下）
  var tm = null;
  img.onload = function(){
    fallback = false; if (tm) clearTimeout(tm);
    try{
      if (!_colorCtx){ applyAmbient(themeAmbientColors(), themeLightAmbientColors()); return; }
      _colorCtx.drawImage(img,0,0,16,16);
      var data = _colorCtx.getImageData(0,0,16,16).data;
      var buckets = {};
      for (var i=0;i<data.length;i+=4){
        var r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
        if (a < 200) continue;
        if (r+g+b < 50 || r+g+b > 700) continue;
        var key = (r>>4)+","+(g>>4)+","+(b>>4);
        buckets[key] = (buckets[key]||0)+1;
      }
      var sorted = Object.keys(buckets).sort(function(a,b){ return buckets[b]-buckets[a]; });
      var top = sorted.slice(0,3).map(function(k){
        var p = k.split(",").map(function(n){ return (+n)<<4; });
        return _boostColor(p[0], p[1], p[2]);
      });
      var topLight = sorted.slice(0,3).map(function(k){
        var p = k.split(",").map(function(n){ return (+n)<<4; });
        return _boostLightColor(p[0], p[1], p[2]);
      });
      var defaults = themeAmbientColors();
      var defaultsL = themeLightAmbientColors();
      while (top.length<3) top.push(defaults[top.length] || defaults[0]);
      while (topLight.length<3) topLight.push(defaultsL[topLight.length] || defaultsL[0]);
      applyAmbient(top, topLight);
    }catch(e){ applyAmbient(themeAmbientColors(), themeLightAmbientColors()); }
  };
  img.onerror = function(){ fallback=false; if (tm) clearTimeout(tm); /* 失败保留上一套氛围色，不闪回主题色 */ };
  img.src = url;
}

/* ============================================================
   § 11. 登录
   ------------------------------------------------------------
   三种方式：
   1) 账号密码 —— 腾讯对第三方密码登录有滑块/设备风控，
      此处按标准 ptlogin 流程发起请求，若被拦截会提示改用其它方式。
   2) 扫码登录 —— 标准 QQ 互联二维码轮询流程（ptqrshow / ptqrlogin），
      依赖原生端保持同一 Cookie 会话，真机联调时请重点验证这一步。
   3) Cookie 登录 —— 最稳妥，用户从已登录的浏览器会话粘贴 Cookie。
   ============================================================ */
function parseCookieStr(str){
  var map = {};
  str.split(/;\s*/).forEach(function(kv){
    var idx = kv.indexOf("=");
    if (idx<0) return;
    map[kv.slice(0,idx).trim()] = kv.slice(idx+1).trim();
  });
  return map;
}
function applyLogin(cookieStr, uinOverride){
  var map = parseCookieStr(cookieStr);
  var uin = uinOverride || map.uin || map.p_uin || "";
  uin = uin.replace(/^o0*/,"");
  if (!uin || !(map.qqmusic_key || map.qm_keyst || map.skey)){
    toast("Cookie 中未识别到有效登录态（需包含 uin 与 qqmusic_key/qm_keyst）");
    return false;
  }
  // 规范化 Cookie：保证含 uin=oXXXX 形式（部分接口依赖）
  var ck = cookieStr;
  if (uin && !/(?:^|;\s*)uin=/.test(ck)){
    ck = "uin=o" + uin + "; " + ck;
  }
  state.user = {
    uin: uin,
    cookie: ck,
    nickname: "QQ音乐用户 "+uin,
    avatar: avatarUrl(uin),
    vip: false,
    qqmusic_key: map.qqmusic_key || "",
    qm_keyst: map.qm_keyst || ""
  };
  storeSet("user", state.user);
  toast("登录成功");
  closeLoginView(false);
  syncUserAvatar();

function qqHash33(text){
  var hash = 0;
  text = String(text || "");
  for (var i=0;i<text.length;i++) hash += (hash << 5) + text.charCodeAt(i);
  return hash & 2147483647;
}
function responseCookieValues(res){
  var out = [];
  if (res && Array.isArray(res.cookies)) out = out.concat(res.cookies);
  var headers = res && res.headers;
  if (headers && typeof headers === "object"){
    Object.keys(headers).forEach(function(key){
      if (String(key).toLowerCase() !== "set-cookie") return;
      var value = headers[key];
      if (Array.isArray(value)) out = out.concat(value);
      else if (value) out.push(value);
    });
  }
  return out;
}
function mergeResponseCookies(res){
  responseCookieValues(res).forEach(function(raw){
    var first = String(raw || "").split(";")[0];
    var eq = first.indexOf("=");
    if (eq <= 0) return;
    var name = first.slice(0,eq).trim();
    var value = first.slice(eq+1).trim();
    if (name) qrCookieJar[name] = value;
  });
}
function qrCookieString(){
  return Object.keys(qrCookieJar).map(function(key){ return key + "=" + qrCookieJar[key]; }).join("; ");
}
function scheduleQrPoll(){
  if (qrPollTimer) clearTimeout(qrPollTimer);

}
function startQrLogin(){

  ADAPTER_requestRaw(url, {

    responseType:"base64", credentials:"include", timeout:20
  }).then(function(res){
    mergeResponseCookies(res);
    qrSig = qrCookieJar.qrsig || "";
    qrToken = qqHash33(qrSig);
    if (!res.ok || !res.body || !qrSig) throw new Error(res.error || "二维码响应不完整");
    if (image) image.src = "data:image/png;base64," + String(res.body);

    if (refresh) refresh.disabled = false;

      stopQrLogin();

    }, 120000);

function parsePtuiCallback(text){

function applyNativeQrSession(cookie, redirectUrl){

  if (!uin){
    var match = String(redirectUrl || "").match(/[?&]uin=o?0*(\d+)/i);
    if (match) uin = match[1];

    qqmusic_key:map.qqmusic_key || "",

function finishQrLogin(redirectUrl){
  setQrStatus("扫码成功，正在建立 QQ 音乐登录态", "");
  ADAPTER_requestRaw(String(redirectUrl || "").replace(/&amp;/g,"&"), {
    headers:{ "Referer":"https://xui.ptlogin2.qq.com/", "User-Agent":QQ_HEADERS["User-Agent"] },
    responseType:"text", credentials:"include", timeout:25
  }).then(function(res){
    mergeResponseCookies(res);
    return ADAPTER_requestRaw("https://y.qq.com/", {
      headers:{ "Referer":"https://y.qq.com/", "User-Agent":QQ_HEADERS["User-Agent"] },
      responseType:"text", credentials:"include", timeout:20
    });
  }).then(function(res){
    mergeResponseCookies(res);
    var cookie = qrCookieString();
    if (window.fm && typeof window.fm.getCookie === "function"){
      try{
        var nativeCookie = window.fm.getCookie("https://y.qq.com/") || window.fm.getCookie("y.qq.com");
        if (nativeCookie){
          var nativeMap = parseCookieStr(String(nativeCookie));
          Object.keys(nativeMap).forEach(function(key){ qrCookieJar[key] = nativeMap[key]; });
          cookie = qrCookieString();
        }
      }catch(e){}
    }
    var map = parseCookieStr(cookie || "");
    var hasReadableCookie = !!((map.uin || map.p_uin) && (map.qqmusic_key || map.qm_keyst || map.skey));
    var applied = hasReadableCookie ? applyLogin(cookie) : applyNativeQrSession(cookie, redirectUrl);
    if (!applied){
      setQrStatus("登录态已写入 App，但页面未读到完整账号凭据，请刷新二维码重试", "登录态读取失败");
      showLoginPane("qr");
    }
  }).catch(function(err){
    setQrStatus("登录确认失败：" + String(err && err.message || "网络不可用"), "登录失败");
  });
}
function pollQrStatus(){
  if (!qrSig || !qrToken) return;
  var url = "https://ssl.ptlogin2.qq.com/ptqrlogin?u1=https%3A%2F%2Fy.qq.com%2F&ptqrtoken="+qrToken+
    "&ptredirect=0&h=1&t=1&g=1&from_ui=1&ptlang=2052&action=0-0-"+Date.now()+"&js_ver=20102616&js_type=1&pt_uistyle=40&aid=716027609&daid=383&pt_3rd_aid=100497308";
  ADAPTER_requestRaw(url, {
    headers:{ "Cookie":"qrsig="+qrSig, "Referer":"https://xui.ptlogin2.qq.com/", "User-Agent":QQ_HEADERS["User-Agent"] },
    responseType:"text", credentials:"include", timeout:18
  }).then(function(res){
    mergeResponseCookies(res);
    var match = parsePtuiCallback(res.body);
    var code = match ? match[1] : "";
    if (code === "0"){
      stopQrLogin();
      finishQrLogin(match[3]);
      return;
    }
    if (code === "65"){
      stopQrLogin();
      setQrStatus("二维码已过期，请刷新", "二维码已过期");
      return;
    }
    if (code === "67") setQrStatus("已扫码，请在手机 QQ 上确认", "");
    else if (code === "66") setQrStatus("请使用手机 QQ 扫码并确认登录", "");
    else if (!res.ok) setQrStatus("登录状态检查失败，正在重试", "");
    scheduleQrPoll();
  }).catch(function(){ scheduleQrPoll(); });
}

/**
 * 保证全屏播放器在历史栈中有且仅有一层 overlay:player。
 * 禁止在切歌时反复 push，否则系统返回/手势返回会连续踩多层才能关掉。

function ensurePlayerHistory(){
  var fp = $("#fullPlayer");

  try {

    if ((history.state && history.state.overlay === "player") || _fpHistoryPushed){
      history.replaceState(st, "", location.href);
      _fpHistoryPushed = true;

      history.pushState(st, "", location.href);
      _fpHistoryPushed = true;
    }
  } catch(e) {}
  setSubviewChrome(true);
}

        _lyricsFocusPushed = true;

        _lyricsFocusPushed = true;

/** 全屏播放页手势：下滑关闭；左侧边缘不拦截，交给系统返回 */
function bindFullPlayerGesture(){
  var fp = $("#fullPlayer");
  if (!fp || fp._gestureBound) return;
  fp._gestureBound = true;
  var startY = 0, startX = 0, dragging = false, moved = false, edgeStart = false;
  var EDGE = 28; // 左侧边缘留给系统返回手势

  function onStart(e){
    if (!fp.classList.contains("show") || _fpClosing) return;
    var t = e.touches ? e.touches[0] : e;
    // 系统侧滑返回：不接管左边缘起点
    if (t.clientX <= EDGE){
      edgeStart = true;
      dragging = false;
      return;
    }
    edgeStart = false;
    var scrollEl = e.target.closest("#lyricsWrap, #playlistPanel");
    if (scrollEl && scrollEl.scrollTop > 2) return;
    // 进度条/按钮区域不启动拖拽关闭，避免误触
    if (e.target.closest(".fp-bar, .fp-ctrls, .fp-play, .fp-ctrl-btn, .fp-quick, .fp-close")) return;
    startY = t.clientY; startX = t.clientX;
    dragging = true; moved = false;
    fp.style.transition = "none";
  }
  function onMove(e){
    if (edgeStart || !dragging || _fpClosing) return;
    var t = e.touches ? e.touches[0] : e;
    var dy = t.clientY - startY;
    var dx = t.clientX - startX;
    // 明显横向滑动：放弃本地下滑关闭，不 preventDefault，避免干扰系统手势
    if (!moved && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10){
      dragging = false;
      fp.style.transform = "translate3d(0,0,0)";
      fp.style.opacity = "1";
      return;
    }
    if (dy < 0) dy = 0;
    if (dy > 6) moved = true;
    if (moved){
      fp.style.transform = "translateY("+dy+"px)";
      fp.style.opacity = String(Math.max(0.35, 1 - dy / (window.innerHeight * 0.7)));
      if (e.cancelable) e.preventDefault();
    }
  }
  function onEnd(e){
    if (edgeStart){ edgeStart = false; return; }
    if (!dragging) return;
    dragging = false;
    if (_fpClosing) return;
    var t = (e.changedTouches && e.changedTouches[0]) || e;
    var dy = (t ? t.clientY : startY) - startY;
    if (moved && dy > 100){
      if (fp.classList.contains("lyrics-focus")){
        fp.style.transition = "transform .35s cubic-bezier(0.22,1,0.36,1), opacity .25s ease";
        fp.style.transform = "translate3d(0,0,0)";
        fp.style.opacity = "1";
        exitLyricsFocus(false);
      } else {
        closeFullPlayer(false);
      }
    } else {
      fp.style.transition = "transform .45s cubic-bezier(0.34,1.56,0.64,1), opacity .3s ease";
      fp.style.transform = "translate3d(0,0,0)";
      fp.style.opacity = "1";
    }
  }
  fp.addEventListener("touchstart", onStart, { passive: true });
  fp.addEventListener("touchmove", onMove, { passive: false });
  fp.addEventListener("touchend", onEnd, { passive: true });
  fp.addEventListener("touchcancel", onEnd, { passive: true });
}

      var gridMore=document.querySelector("[data-focus-for-grid='"+row+"']");
      if (gridMore){ gridMore.setAttribute("data-return-focus-key",node.getAttribute("data-focus-key")||""); return focusRemoteTarget(gridMore); }
      return focusRemoteTarget(node);
    }
    else if (dir === "up" && index-cols>=0) next=index-cols;
    else if (dir === "down" && index+cols<gridItems.length) next=index+cols;
    else return focusRemoteTarget(viewLaneTarget(node,dir));
    return focusRemoteTarget(gridItems[next]);
  }
  if (row === "fpList"){
    var fpListItems=tvLaneItems("fpList"),fpListIndex=fpListItems.indexOf(node);
    if (dir === "up"){
      if (fpListIndex > 0) return focusRemoteTarget(fpListItems[fpListIndex-1]);
      return focusRemoteTarget(tvLaneItems("fpTabs")[0] || $("#fpSourceTag") || $("#fpClose"));
    }
    if (dir === "down"){
      if (fpListIndex >= 0 && fpListIndex < fpListItems.length-1) return focusRemoteTarget(fpListItems[fpListIndex+1]);
      return focusRemoteTarget($("#fpPlay"));
    }
    if (dir === "left") return focusRemoteTarget($("#fpArt"));
    return true;
  }
  if (row.indexOf("list-") === 0){
    var listItems=tvLaneItems(row),listIndex=listItems.indexOf(node);
    if (dir === "up"){
      if (listIndex > 0) return focusRemoteTarget(listItems[listIndex-1]);
      return focusRemoteTarget(viewLaneTarget(node,"up") || $("#searchBox"));
    }
    if (dir === "down"){
      if (listIndex >= 0 && listIndex < listItems.length-1) return focusRemoteTarget(listItems[listIndex+1]);
      if ($("#playerBar") && $("#playerBar").classList.contains("show")) return focusRemoteTarget($("#pbPlay"));
      return focusRemoteTarget(viewLaneTarget(node,"down"));
    }
    if (dir === "left"){
      return focusRemoteTarget(document.querySelector("#bottomNav .nav-item.active") || $("#searchBox"));
    }
    return true;
  }
  if (row === "fpTabs"){
    if (dir === "left") return moveAlongLane(node,-1);
    if (dir === "right") return moveAlongLane(node,1);
    if (dir === "up") return focusRemoteTarget($("#fpSourceTag") || $("#fpClose"));
    if (dir === "down") return focusRemoteTarget(tvLaneItems("fpList")[0] || $("#fpPlay"));
  }
  if (row === "fpControls"){
    if (dir === "left") return moveAlongLane(node,-1);
    if (dir === "right") return moveAlongLane(node,1);
    if (dir === "up") return focusRemoteTarget($("#fpArt") || tvLaneItems("fpTabs")[0]);
    if (dir === "down") return focusRemoteTarget(tvLaneItems("fpQuick")[0]);
  }
  if (row === "fpQuick"){
    if (dir === "left") return moveAlongLane(node,-1);
    if (dir === "right") return moveAlongLane(node,1);
    if (dir === "up") return focusRemoteTarget($("#fpPlay"));
    return true;
  }
  if (dir === "left") return moveAlongLane(node,-1);
  if (dir === "right") return moveAlongLane(node,1);
  var target = viewLaneTarget(node,dir);
  if (target) return focusRemoteTarget(target);
  if (dir === "up" && node.closest(".view.active")) return focusRemoteTarget($("#searchBox"));
  if (dir === "down" && node.closest(".view.active") && $("#playerBar").classList.contains("show")) return focusRemoteTarget($("#pbPlay"));
  return true;
}
function moveTvFocus(dir){ return handleArrow(dir); }
function tvDirectionFromEvent(e){
  var code=e.keyCode||e.which||0;
  if (e.key === "ArrowUp" || code === 19 || e.code === 19) return "up";
  if (e.key === "ArrowDown" || code === 20 || e.code === 20) return "down";
  if (e.key === "ArrowLeft" || code === 21 || e.code === 21) return "left";
  if (e.key === "ArrowRight" || code === 22 || e.code === 22) return "right";
  return "";
}
var TV_OK_DOUBLE_MS=360;
var tvOkAt=0;
var tvOkScope="";
var tvOkResetTimer=null;
var tvOkHoldTimer=null;
var tvOkKeyDown=false;
function tvIsOkEvent(e){
  var code=e.keyCode||e.which||0;
  return e.key === "Enter" || e.key === "OK" || code === 13 || code === 23 || code === 66;
}
function clearTvOkSequence(){
  clearTimeout(tvOkResetTimer);
  tvOkResetTimer=null;
  tvOkAt=0;
  tvOkScope="";
}
function handleTvOkEvent(active){
  if (tvOkKeyDown) return true;
  tvOkKeyDown=true;
  clearTimeout(tvOkHoldTimer);
  tvOkHoldTimer=setTimeout(function(){ tvOkKeyDown=false; },650);

  var now=Date.now();
  var isDouble=tvOkAt>0 && now-tvOkAt<=TV_OK_DOUBLE_MS && tvOkScope === "app";
  if (isDouble){
    clearTvOkSequence();
    if (state.queue && state.queue.length){
      var fp=$("#fullPlayer");
      if (fp && fp.classList.contains("show")){
        scheduleTvRefresh("overlay");
        setTimeout(function(){ focusRemoteTarget($("#fpPlay")); },20);
      } else openFullPlayer();
    }
    return true;
  }

  clearTvOkSequence();
  if (tvOverlayDomain() === "app"){
    tvOkAt=now;
    tvOkScope="app";
    tvOkResetTimer=setTimeout(clearTvOkSequence,TV_OK_DOUBLE_MS+20);
  }
  activateTvTarget(isVisibleFocusable(active) ? active : curFocusEl);
  return true;
}
document.addEventListener("keydown", function(e){
  var code=e.keyCode||e.which||0;
  var back=e.key === "Backspace" || e.key === "Escape" || code === 4 || code === 27;
  var active=document.activeElement;
  if (back){
    clearTvOkSequence();
    if (state.isTv && exitTvEditing(active)){ e.preventDefault();e.stopPropagation();return; }
    var tag=(active&&active.tagName||"").toUpperCase();
    if ((tag === "INPUT" || tag === "TEXTAREA") && e.key === "Backspace") return;
    if (handleBack()){
      e.preventDefault();e.stopPropagation();setTimeout(restoreFocusSnapshot,220);
    }
    return;
  }
  if (!state.isTv) return;
  if (active && active.classList && active.classList.contains("tv-editing")) return;
  var dir=tvDirectionFromEvent(e);
  if (dir){
    clearTvOkSequence();
    var handled=handleArrow(dir);
    if (handled !== false){ e.preventDefault();e.stopPropagation(); }
    return;
  }
  if (tvIsOkEvent(e)){
    e.preventDefault();e.stopPropagation();
    handleTvOkEvent(active);
  }
},true);
document.addEventListener("keyup",function(e){
  if (!state.isTv || !tvIsOkEvent(e)) return;
  clearTimeout(tvOkHoldTimer);
  tvOkHoldTimer=null;
  tvOkKeyDown=false;
  e.preventDefault();e.stopPropagation();
},true);
document.addEventListener("focusin",function(e){
  if (!state.isTv || !isVisibleFocusable(e.target)) return;
  if (curFocusEl && curFocusEl !== e.target) curFocusEl.classList.remove("tv-focus");
  curFocusEl=e.target;e.target.classList.add("tv-focus");
  var view=e.target.closest(".view.active");
  if (view) tvLastViewFocus=e.target;
  tvFocusSnapshot={
    scope:activeScope,
    view:state.view,
    row:e.target.getAttribute("data-focus-row")||"",
    key:e.target.getAttribute("data-focus-key")||"",
    index:e.target.getAttribute("data-focus-index")||"0"
  };
},true);
document.addEventListener("click", function(e){
  if (!state.isTv) return;
  var target=e.target.closest(".focusable");
  if (target && isVisibleFocusable(target)) focusRemoteTarget(target);
},true);
window.addEventListener("focus",function(){ if (state.isTv) setTimeout(restoreNativeFocus,60); });
window.addEventListener("resize",function(){ if (state.isTv) scheduleTvRefresh("resize"); });
document.addEventListener("fmresume",function(){ if (state.isTv) setTimeout(restoreFocusSnapshot,120); });
window.addEventListener("pageshow",function(){ if (state.isTv) setTimeout(restoreFocusSnapshot,120); });
function initTvUi(){
  if (!state.isTv) return;
  document.documentElement.classList.add("tv-mode");
  window.__qqmTvRestoreFocus=restoreFocusSnapshot;
  window.__qqmTvRefreshFocus=function(){ syncTvFocusMetadata(); return restoreFocusSnapshot(); };
  syncTvFocusMetadata();
  if (!tvObserver && window.MutationObserver){
    tvObserver=new MutationObserver(function(records){
      var needs=false;
      for (var i=0;i<records.length;i++){
        if (records[i].type === "childList" || records[i].type === "attributes"){needs=true;break;}
      }
      if (needs) scheduleTvRefresh("render");
    });
    var viewport=$("#viewport");
    if (viewport) tvObserver.observe(viewport,{childList:true,subtree:true});
    [$("#parserConfigView"),$("#loginView"),$("#fullPlayer"),$("#mvPlayerView")].forEach(function(node){
      if (node) tvObserver.observe(node,{attributes:true,attributeFilter:["class"]});
    });
  }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ restoreFocusSnapshot(); }); });
}


/* ============================================================
   § 14. 初始化
   ============================================================ */
function bootApp(){
  // 重新检测 TV（fongmiClient 可能稍晚注入）
  if (window.fongmiClient && window.fongmiClient.isLeanback){
    state.isTv = true;
    document.documentElement.classList.add("tv-mode");
  }
  // 底栏：仅 TV 显示，移动端隐藏
  try {
    if (state.isTv) document.documentElement.classList.add("tv-mode");
    else document.documentElement.classList.remove("tv-mode");
    var bn = document.getElementById("bottomNav");
    if (bn) bn.style.display = state.isTv ? "flex" : "none";
  } catch(eBn) {}
  if (state.user){ closeLoginView(true); syncUserAvatar(); fetchUserProfile(); }
  else { syncUserAvatar(); }
  bindEvents();
  bindParserSettings();
  if (!state.user){
    showLoginPane("qr");
    startQrLogin();
  }
  try {
    var _q0 = state.quality || "HQ";
    var _pbq = $("#pbQuality"); if (_pbq) _pbq.textContent = _q0;
    var _fpq = $("#fpQuality"); if (_fpq) _fpq.textContent = _q0;
  } catch(eQ) {}
  syncModeUI();
  // 启动氛围背景（主题色光晕，播放后会随封面变色）
  try { applyAmbient(themeAmbientColors(), themeLightAmbientColors()); } catch(e) {}
  state.source = storeGet("musicSource", "qq") || "qq";
  setMusicSource(state.source);
  // 启动即显示迷你播放栏（空状态），与 Apple Music 一致
  ensurePlayerBarVisible();

  var hash = location.hash.replace("#","");
  var parts = hash.split("/");
  var startView = VIEWS.indexOf(parts[0])>-1 ? parts[0] : "home";
  try {
    // Solene：首页 = entry0，裸 URL，不垫哨兵
    if (!history.state || !history.state.qqm){
      history.replaceState({view:"home", params:{}, qqm:1}, "", location.pathname + location.search);
    }
    if (startView !== "home"){
      history.pushState({view:startView, params:{}, qqm:1}, "", hashFor(startView, {}));
    } else {
      history.replaceState({view:"home", params:{}, qqm:1}, "", location.pathname + location.search);
    }
  } catch(e) {}
  switchView(startView, {}, false);
  setSubviewChrome(startView !== "home");
  syncAppUnderlay();
  window.handleBack = handleBack;
  window.__qqmBack = function(){ try { return handleBack(); } catch(e){ return false; } };

  // 息屏/后台：记录播放态；回前台补切歌与续播；顺带刷新每日推荐
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden"){
      try { _wasPlayingBeforeHide = !!(audio && !audio.paused); } catch(eH) { _wasPlayingBeforeHide = false; }
      // 离开前尽量预取下一首
      try { prefetchNextPlayUrl(); } catch(eP) {}
      try { prepareStandbyForNext(); } catch(eS) {}
    } else if (document.visibilityState === "visible"){
      try { maybeRefreshDaily(false); } catch(e) {}
      try { tryResumeAfterBackground(); } catch(eR) {}
    }
  });
  // 部分 WebView 用 pagehide/pageshow
  window.addEventListener("pagehide", function(){
    try { _wasPlayingBeforeHide = !!(audio && !audio.paused); } catch(e) {}
    try { prefetchNextPlayUrl(); } catch(e2) {}
  });
  window.addEventListener("pageshow", function(){
    try { tryResumeAfterBackground(); } catch(e) {}
  });
  // 每 10 分钟检查一次是否跨入新时段（页面一直挂着不切页时也能更新）
  setInterval(function(){
    try {
      if (state.view === "home") maybeRefreshDaily(false);
    } catch(e) {}
  }, 10 * 60 * 1000);

  if (state.isTv) initTvUi();
}

function init(){
  // App 内必须先等 fm 注入，再发请求；否则会误走 JSONP/fetch 拿不到数据
  whenFm(5000).then(function(fmObj){
    if (fmObj) console.log("[qqm] fm SDK ready");
    else console.warn("[qqm] fm SDK not found, fallback JSONP/fetch");
    bootApp();
  }).catch(function(){ bootApp(); });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();


/* 宿主返回键：优先走 handleBack，避免全屏播放器时直接退出 */
(function bindHostBack(){
  try {
    if (window.fm && window.fm.ui && typeof window.fm.ui.onBack === "function"){
      window.fm.ui.onBack(function(){
        return handleBack();
      });
    }
  } catch(e) {}
  // 部分 WebHome 用这个
  try {
    window.__onBackPressed = function(){ return handleBack(); };
  } catch(e2) {}
  document.addEventListener("keydown", function(e){
    if (e.defaultPrevented) return;
    if (e.key === "Escape" || e.keyCode === 27){
      if (isOverlayOpen()){
        e.preventDefault();
        handleBack();
      }
    }
  }, true);
})();

})();
