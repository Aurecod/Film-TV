<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>8色 TV</title>
<style>
:root {
  color-scheme: dark;
  --bg: #050505;
  --panel: rgba(18,18,18,.94);
  --panel-soft: rgba(255,255,255,.075);
  --text: #fff;
  --muted: rgba(255,255,255,.68);
  --line: rgba(255,255,255,.12);
  --accent: #ff5f67;
  --mint: #31d5b5;
  --gold: #e0b45c;
  --side-w: 92px;
  --content-left: 0px;
  --safe-bottom: env(safe-area-inset-bottom,0px);
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
* { box-sizing: border-box; }
html,body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button,input,select {
  font: inherit;
  color: inherit;
}
button {
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }

@keyframes mrtRainbowMove {
  0% { background-position: 0 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}
.rainbow-focus {
  position: relative;
  border: 2px solid transparent;
  outline: 0;
}
.rainbow-focus:focus,
.rainbow-focus:focus-visible {
  outline: 0;
}
.rainbow-focus::before {
  content: "";
  position: absolute;
  inset: -2px;
  z-index: 5;
  padding: 2px;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(90deg,#ff2d55,#ff9f0a,#ffd60a,#32d74b,#00c7be,#64d2ff,#bf5af2,#ff375f);
  background-size: 320% 320%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite: exclude;
}
.tab-btn:focus,
.tab-btn:focus-visible,
.side-btn:focus,
.side-btn:focus-visible,
.side-category-item.active,
.side-category-item:focus,
.side-category-item:focus-visible,
.tag-item:focus,
.tag-item:focus-visible,
.back-btn:focus,
.back-btn:focus-visible,
.action-btn:focus,
.action-btn:focus-visible,
.load-more:focus,
.load-more:focus-visible,
.viewer-btn:focus,
.viewer-btn:focus-visible,
.viewer-jump:focus,
.viewer-jump:focus-visible {
  color: #fff;
  background: linear-gradient(90deg,rgba(255,45,85,.88),rgba(255,159,10,.82),rgba(255,214,10,.76),rgba(50,215,75,.74),rgba(0,199,190,.78),rgba(100,210,255,.78),rgba(191,90,242,.84));
  background-size: 320% 320%;
  animation: mrtRainbowMove 2.2s linear infinite;
  outline: 0;
}
.rainbow-focus:focus::before,
.rainbow-focus:focus-visible::before {
  opacity: 1;
  animation: mrtRainbowMove 2.2s linear infinite;
}

.app {
  min-height: 100vh;
  padding: 0;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 0;
  width: 100vw;
  min-height: 54px;
  padding: 0;
  background: linear-gradient(180deg,#050505 0%,rgba(5,5,5,.94) 72%,rgba(5,5,5,0) 100%);
}
.brand {
  display: none;
}
.brand-mark {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 2px solid rgba(255,95,103,.86);
  border-radius: 999px;
  color: var(--accent);
  font-size: 25px;
  font-weight: 950;
}
.brand-title {
  font-size: 26px;
  font-weight: 950;
  letter-spacing: 0;
}
.tabs {
  width: 100vw;
  flex: 1 1 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto;
  min-width: 0;
  width: auto;
  height: 42px;
  padding: 0 16px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  color: rgba(255,255,255,.72);
  font-size: 17px;
  font-weight: 850;
  white-space: nowrap;
}
.tab-btn.active,
.tab-btn:focus { color: #fff; }
.tab-btn.active,
.tab-btn:focus {
  background: linear-gradient(90deg,rgba(255,45,85,.88),rgba(255,159,10,.82),rgba(255,214,10,.76),rgba(50,215,75,.74),rgba(0,199,190,.78),rgba(100,210,255,.78),rgba(191,90,242,.84));
  background-size: 320% 320%;
  animation: mrtRainbowMove 2.2s linear infinite;
}

.summary {
  display: none;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  margin: 8px 0 18px;
}
.summary h1 {
  margin: 0;
  font-size: 30px;
  line-height: 1.18;
  letter-spacing: 0;
}
.summary small {
  display: block;
  margin-top: 7px;
  color: var(--muted);
  font-size: 15px;
}
.status {
  min-width: 260px;
  color: rgba(255,255,255,.64);
  text-align: right;
  font-size: 15px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 0;
  align-items: start;
}
.card {
  overflow: hidden;
  border: 0;
  border-radius: 0;
  outline: 0;
  background: #141414;
  color: #fff;
  text-align: left;
  box-shadow: none;
  transition: transform .14s ease, background .14s ease;
}
.card:focus {
  z-index: 20;
  outline: 0;
  transform: none;
  background: #1d1d1d;
}
.poster {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4.15;
  overflow: hidden;
  border-radius: 4px;
  background: linear-gradient(135deg,#161616,#282828 48%,#171717);
}
.poster::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 6;
  padding: 3px;
  border-radius: 4px;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(90deg,#ff2d55,#ff9f0a,#ffd60a,#32d74b,#00c7be,#64d2ff,#bf5af2,#ff375f);
  background-size: 320% 320%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite: exclude;
}
.card:focus .poster::before,
.card:focus-visible .poster::before {
  opacity: 1;
  animation: mrtRainbowMove 2.2s linear infinite;
}
.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.model {
  position: absolute;
  right: 0;
  bottom: 0;
  max-width: 82%;
  padding: 7px 10px;
  color: #fff;
  background: rgba(0,0,0,.42);
  font-size: 15px;
  font-weight: 760;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.card-info {
  padding: 5px 6px 6px;
  border: 0;
  outline: 0;
}
.card:focus .card-info,
.card:focus-visible .card-info {
  border: 0;
  outline: 0;
}
.card-title {
  min-height: 0;
  color: rgba(255,255,255,.9);
  font-size: 13px;
  font-weight: 780;
  line-height: 18px;
  display: block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.meta {
  height: 16px;
  margin-top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: rgba(255,255,255,.6);
  font-size: 11px;
  line-height: 14px;
}
.empty {
  grid-column: 1 / -1;
  padding: 68px 20px;
  border-radius: 8px;
  background: rgba(255,255,255,.055);
  color: var(--muted);
  text-align: center;
  font-size: 18px;
}
.load-more {
  display: none;
  width: min(420px,80vw);
  height: 52px;
  margin: 34px auto 0;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.78);
  font-size: 17px;
  font-weight: 850;
}

.side-nav {
  position: fixed;
  left: calc(-1 * var(--side-w) - 18px);
  top: 0;
  bottom: 0;
  z-index: 220;
  width: var(--side-w);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 8px;
  background: rgba(0,0,0,.18);
  opacity: 0;
  pointer-events: none;
  transform: translateX(-8px);
  transition: left .18s ease, opacity .18s ease, transform .18s ease;
}
.side-nav.open {
  left: 0;
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0);
}
.side-btn {
  width: 64px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.74);
  font-size: 15px;
  font-weight: 880;
  transition: transform .14s ease, background .14s ease, color .14s ease;
}
.side-btn svg {
  width: 25px;
  height: 25px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.side-btn:focus {
  transform: scale(1.08);
  background: linear-gradient(90deg,rgba(255,45,85,.88),rgba(255,159,10,.82),rgba(255,214,10,.76),rgba(50,215,75,.74),rgba(0,199,190,.78),rgba(100,210,255,.78),rgba(191,90,242,.84));
  background-size: 320% 320%;
  animation: mrtRainbowMove 2.2s linear infinite;
  color: #fff;
}
.side-category-panel {
  position: fixed;
  left: var(--side-w);
  top: 0;
  bottom: 0;
  z-index: 240;
  width: max-content;
  min-width: 150px;
  max-width: min(320px,calc(100vw - var(--side-w) - 20px));
  padding: 18px 10px 18px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: rgba(0,0,0,.18);
  opacity: 0;
  pointer-events: none;
  transform: translateX(-18px);
  transition: opacity .16s ease, transform .16s ease;
}
.side-category-panel.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0);
}
.panel-title {
  flex: 0 0 auto;
  height: auto;
  padding: 10px 13px 6px;
  color: rgba(255,255,255,.86);
  font-size: 15px;
  font-weight: 900;
  text-shadow: 0 2px 8px #000;
}
.side-category-list {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 7px;
  overflow-y: auto;
  scrollbar-width: none;
}
.tag-list {
  max-height: calc(100% - 40px);
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  align-items: flex-start;
  gap: 8px;
  overflow-y: auto;
  scrollbar-width: none;
}
.side-category-list::-webkit-scrollbar,
.tag-list::-webkit-scrollbar { display: none; }
.side-category-item {
  width: max-content;
  max-width: 100%;
  min-height: 42px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  border-radius: 12px;
  background: rgba(0,0,0,.10);
  color: rgba(255,255,255,.78);
  text-align: left;
  font-size: 14px;
  font-weight: 850;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tag-item {
  width: max-content;
  max-width: 100%;
  min-height: 42px;
  padding: 0 13px;
  border-radius: 8px;
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.78);
  text-align: left;
  font-size: 16px;
  font-weight: 760;
}
.side-category-item.active,
.side-category-item:focus,
.tag-item:focus {
  color: #fff;
  background: linear-gradient(90deg,rgba(255,45,85,.88),rgba(255,159,10,.82),rgba(255,214,10,.76),rgba(50,215,75,.74),rgba(0,199,190,.78),rgba(100,210,255,.78),rgba(191,90,242,.84));
  background-size: 320% 320%;
  animation: mrtRainbowMove 2.2s linear infinite;
}

.modal-mask,
.detail,
.viewer {
  position: fixed;
  inset: 0;
  display: none;
}
.modal-mask.active,
.detail.active,
.viewer.active { display: flex; }
.modal-mask {
  z-index: 420;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.72);
}
.modal {
  width: min(560px,86vw);
  padding: 24px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 8px;
  background: #111;
  box-shadow: 0 28px 90px rgba(0,0,0,.58);
}
.modal h2 {
  margin: 0 0 18px;
  font-size: 24px;
  line-height: 1.2;
}
.field {
  margin-top: 13px;
}
.field label {
  display: block;
  margin-bottom: 8px;
  color: rgba(255,255,255,.7);
  font-size: 14px;
  font-weight: 760;
}
.input,
.select {
  width: 100%;
  height: 46px;
  padding: 0 13px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 8px;
  outline: 0;
  background: rgba(255,255,255,.075);
  color: #fff;
}
.select option { color: #111; }
.modal-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
}
.action-btn {
  min-width: 96px;
  height: 44px;
  padding: 0 18px;
  border-radius: 999px;
  background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.8);
  font-weight: 850;
}
.action-btn.primary {
  background: var(--accent);
  color: #fff;
}

.tag-popup {
  position: fixed;
  inset: 84px 52px 42px 118px;
  z-index: 300;
  display: none;
  padding: 20px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px;
  background: rgba(14,14,14,.97);
  box-shadow: 0 22px 70px rgba(0,0,0,.48);
}
.tag-popup.open { display: block; }
.tag-list {
  max-height: calc(100% - 40px);
}
.tag-item {
  text-align: center;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.detail {
  z-index: 330;
  flex-direction: column;
  background: #050505;
  overflow-y: auto;
}
.detail-head {
  position: sticky;
  top: 0;
  z-index: 40;
  min-height: 86px;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0;
  background: linear-gradient(180deg,#050505 0%,rgba(5,5,5,.96) 78%,rgba(5,5,5,0) 100%);
}
.back-btn {
  flex: 0 0 auto;
  width: auto;
  min-width: 0;
  height: 42px;
  padding: 0 18px;
  border-radius: 999px;
  background: rgba(255,255,255,.08);
  color: #fff;
  font-weight: 900;
}
.detail-title {
  min-width: 0;
  flex: 1 1 auto;
}
.detail-title h1 {
  margin: 0;
  font-size: 25px;
  line-height: 1.24;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.detail-title small {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-size: 14px;
}
.image-grid {
  width: 100%;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 0;
  align-items: start;
}
.image-btn {
  position: relative;
  width: 100%;
  height: auto;
  min-height: 0;
  align-self: start;
  overflow: hidden;
  border: 0;
  border-radius: 4px;
  outline: 0;
  background: transparent;
  line-height: 0;
  transition: transform .14s ease;
}
.image-btn:focus {
  z-index: 12;
  outline: 0;
  transform: none;
}
.image-btn::before {
  inset: 0;
  z-index: 6;
  padding: 3px;
  border-radius: 4px;
}
.image-btn img {
  width: 100%;
  height: auto;
  min-height: 0;
  max-height: none;
  object-fit: contain;
  background: transparent;
}

.viewer {
  z-index: 520;
  align-items: center;
  justify-content: center;
  border: 0 !important;
  outline: 0 !important;
  background: rgba(0,0,0,.94);
  box-shadow: none !important;
  overflow: hidden;
}
.viewer:focus,
.viewer:focus-visible,
.viewer-stage:focus,
.viewer-img:focus {
  border: 0 !important;
  outline: 0 !important;
  box-shadow: none !important;
}
.viewer-stage {
  position: absolute;
  inset: 0;
  border: 0;
  outline: 0;
  overflow: hidden;
}
.viewer-img {
  position: absolute;
  left: 50%;
  top: 50%;
  max-width: 100vw;
  max-height: 100vh;
  object-fit: contain;
  border: 0;
  outline: 0;
  box-shadow: none;
  transform: translate(-50%,-50%) scale(1);
  transform-origin: center center;
  user-select: none;
  -webkit-user-drag: none;
}
.viewer-counter {
  position: absolute;
  top: 14px;
  left: 18px;
  z-index: 6;
  color: rgba(255,255,255,.78);
  background: transparent;
  font-size: 18px;
  font-weight: 850;
  line-height: 1;
  pointer-events: none;
  text-shadow: 0 2px 8px rgba(0,0,0,.75);
}
.viewer-toolbar {
  position: absolute;
  left: 50%;
  bottom: calc(18px + var(--safe-bottom));
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 100vw;
  padding: 10px;
  border-radius: 999px;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  overflow-x: auto;
  scrollbar-width: none;
  transform: translateX(-50%);
  transition: opacity .14s ease;
}
.viewer-toolbar::-webkit-scrollbar { display: none; }
.viewer-toolbar.show {
  opacity: 1;
  pointer-events: auto;
}
.viewer-btn {
  min-width: 46px;
  height: 42px;
  padding: 0 13px;
  border-radius: 999px;
  background: transparent;
  color: #fff;
  font-weight: 900;
}
.viewer-jump {
  width: 88px;
  height: 42px;
  padding: 0 10px;
  border: 0;
  border-radius: 999px;
  outline: 0;
  background: transparent;
  color: #fff;
  text-align: center;
  font-size: 16px;
  font-weight: 850;
}
.viewer-jump::placeholder {
  color: rgba(255,255,255,.56);
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + var(--safe-bottom));
  z-index: 800;
  max-width: 72vw;
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(0,0,0,.76);
  color: #fff;
  font-size: 15px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%,12px);
  transition: opacity .16s ease, transform .16s ease;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%,0);
}

@media (max-width: 780px) {
  :root {
    --content-left: 0px;
    --side-w: 82px;
  }
  .app { padding: 0; }
  .topbar { align-items: center; flex-direction: row; gap: 0; }
  .brand-title { font-size: 22px; }
  .tabs { width: 100%; }
  .summary { align-items: flex-start; flex-direction: column; }
  .status { min-width: 0; text-align: left; }
  .grid { grid-template-columns: repeat(4,minmax(0,1fr)); gap: 0; }
  .card-title { min-height: 0; font-size: 12px; line-height: 17px; }
  .meta { height: 15px; font-size: 10px; line-height: 13px; }
  .tag-popup { inset: 84px 14px 26px 14px; }
  .side-category-panel {
    left: var(--side-w);
    width: max-content;
    max-width: calc(100vw - var(--side-w) - 14px);
  }
  .detail-head { padding: 12px 14px 14px; }
  .image-grid { grid-template-columns: repeat(4,minmax(0,1fr)); padding: 0; }
}
</style>
</head>
<body>

function cleanText(text){
  return String(text||"")
    .replace(/\u00a0|&nbsp;|\u3000/g," ")
    .replace(/[\r\n\t]+/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function escapeHtml(value){
  return String(value==null?"":value).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function host(){
  return String(settings.host||DEFAULT_SETTINGS.host).replace(/\/+$/,"");
}
function fixUrl(url,base){
  url=String(url||"").trim().replace(/&amp;/g,"&");
  if(!url)return "";
  if(url.indexOf("//")===0)return "https:"+url;
  if(/^(https?:|file:|content:|blob:|data:)/i.test(url))return url;
  try{return new URL(url,(base||host())+"/").toString();}
  catch(e){return url;}
}
function pathOf(url){
  try{return new URL(fixUrl(url)).pathname;}
  catch(e){return String(url||"");}
}
function pageUrl(base,page){
  page=Math.max(1,Number(page||1));
  var path=pathOf(base||"/photos/1.html");
  if(path==="/")path="/photos/1.html";
  if(/^\/photos\/\d+\.html$/i.test(path))return host()+"/photos/"+page+".html";
  var collection=path.match(/^(\/photos\/(?:series|keyword)-[^\/]+)(?:\/\d+)?\.html$/i);
  if(collection)return host()+collection[1]+"/"+page+".html";
  return fixUrl(base);
}
function pageCandidates(base,page){
  var primary=pageUrl(base,page),output=[primary];
  if(Number(page||1)===1){
    var match=pathOf(base).match(/^(\/photos\/(?:series|keyword)-[^\/]+)(?:\/\d+)?\.html$/i);
    if(match)output.push(host()+match[1]+".html");
  }
  return output.filter(function(url,index,list){return url&&list.indexOf(url)===index;});
}
function parseHtml(html){
  return new DOMParser().parseFromString(String(html||""),"text/html");
}
function toast(message){
  var el=$("toast");
  el.textContent=message||"";
  el.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer=setTimeout(function(){el.classList.remove("show");},2300);
}
function loadSettings(){
  try{
    var raw=localStorage.getItem(STORE_KEY);
    var data=raw?JSON.parse(raw):{};
    return Object.assign({},DEFAULT_SETTINGS,data||{});
  }catch(e){return Object.assign({},DEFAULT_SETTINGS);}
}
function saveSettings(){
  localStorage.setItem(STORE_KEY,JSON.stringify(settings));
}
function normalizeProxy(value){
  value=cleanText(value||DEFAULT_SETTINGS.shellProxy);
  if(!value)return DEFAULT_SETTINGS.shellProxy;
  if(/^\d+$/.test(value))return "http://127.0.0.1:"+value;
  if(!/^[a-z]+:\/\//i.test(value))return "http://"+value;
  return value.replace(/\/+$/,"");
}

function fmReqReady(){return !!(window.fm&&typeof window.fm.req==="function");}
function fmResReady(){return !!(window.fm&&typeof window.fm.res==="function");}
function checkedHtml(value){
  var text=String(value==null?"":value);
  if(/<title>\s*Just a moment|cdn-cgi\/challenge-platform|__cf_chl_opt|Enable JavaScript and cookies|cf-error-details|Attention Required/i.test(text)){
    throw new Error("站点安全验证拦截");
  }
  if(!text.trim())throw new Error("站点返回空内容");
  return text;
}
function requestHeaders(){
  return {
    "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
    "Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
    "Accept-Language":"zh-CN,zh;q=0.9,en;q=0.8",
    "Referer":host()+"/"
  };
}
function proxyCandidates(url){
  var base=normalizeProxy(settings.shellProxy);
  var encoded=encodeURIComponent(url);
  return [
    base+"/?url="+encoded,
    base+"/proxy?url="+encoded,
    base+"/proxy?do=js&url="+encoded,
    base+"/http?url="+encoded
  ];
}
function responseBody(result,depth){
  if(result==null)return "";
  if(typeof result==="string")return result;
  if(typeof result!=="object"||(depth||0)>2)return "";
  var fields=["body","content","text","data"];
  for(var i=0;i<fields.length;i++){
    var value=result[fields[i]];
    if(typeof value==="string")return value;
    if(value&&typeof value==="object"){
      var nested=responseBody(value,(depth||0)+1);
      if(nested)return nested;
    }
  }
  return "";
}
function waitFmReqReady(timeout){
  if(fmReqReady())return Promise.resolve(true);
  return new Promise(function(resolve){
    var started=Date.now();
    var timer=setInterval(function(){
      if(fmReqReady()||Date.now()-started>=Number(timeout||2600)){
        clearInterval(timer);
        resolve(fmReqReady());
      }
    },80);
  });
}
function readerUrl(url){
  var fixed=fixUrl(url);
  if(!/^https?:\/\//i.test(fixed)||/^https:\/\/r\.jina\.ai\//i.test(fixed))return fixed;
  return "https://r.jina.ai/http://"+fixed.replace(/^https?:\/\//i,"");
}
async function reqTextRaw(url,extraHeaders){
  url=fixUrl(url);
  var headers=Object.assign({},requestHeaders(),extraHeaders||{});
  var shellError=null;
  if(settings.requestMode!=="direct"&&await waitFmReqReady(2600)){
    try{
      var result=await window.fm.req(url,{
        method:"GET",
        headers:headers,
        responseType:"text",
        timeout:30,
        proxy:normalizeProxy(settings.shellProxy)
      });
      if(result&&result.error)throw new Error(result.error);
      var status=Number(result&&(result.status||result.statusCode)||0);
      if(status>=400)throw new Error("HTTP "+status);
      return checkedHtml(responseBody(result));
    }catch(error){
      shellError=error;
    }
  }else if(settings.requestMode==="shell"){
    shellError=new Error("壳请求接口未就绪");
  }
  if(settings.requestMode==="proxy"){
    var list=proxyCandidates(url);
    for(var i=0;i<list.length;i++){
      try{
        var proxied=await fetch(list[i],{headers:headers,cache:"no-store"});
        if(proxied.ok)return checkedHtml(await proxied.text());
      }catch(e){}
    }
  }
  if(settings.requestMode==="shell"&&shellError)throw shellError;
  var response=await fetch(url,{headers:headers,cache:"no-store"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  return checkedHtml(await response.text());
}
async function reqReaderText(url){
  return reqTextRaw(readerUrl(url),{"X-Return-Format":"html"});
}
async function reqText(url){
  try{
    return await reqTextRaw(url);
  }catch(primaryError){
    try{
      return await reqReaderText(url);
    }catch(readerError){
      throw new Error((primaryError.message||"主请求失败")+"；备用读取失败："+(readerError.message||"unknown"));
    }
  }
}
function resUrl(url){
  url=fixUrl(url);
  if(!url)return "";
  if(/^(file:|content:|blob:|data:)/i.test(url))return url;
  if(settings.requestMode!=="direct"&&fmResReady()){
    try{
      return window.fm.res(url,{
        headers:{
          "User-Agent":requestHeaders()["User-Agent"],
          "Accept":"image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
          "Referer":state.detailItem&&state.detailItem.vod_id?state.detailItem.vod_id:host()+"/"
        },
        proxy:normalizeProxy(settings.shellProxy)
      })||url;

function normalizeGroups(groups){
  return (groups||[]).map(function(group){
    var children=(group.children||[]).map(function(child){
      if(Array.isArray(child))return {name:child[0],href:child[1]};
      return {name:child.name,href:child.href};
    }).filter(function(child){return child.name&&child.href&&child.name!=="AI图区";});
    return {name:group.name,children:children};
  }).filter(function(group){return group.name&&group.children.length;});
}
function classesFromGroups(groups){
  var output=[{type_name:"首页",type_id:"/photos/1.html",kind:"list"}];
  normalizeGroups(groups).forEach(function(group){
    var selected=state&&state.selectedFilters&&state.selectedFilters[group.name];
    var child=group.children.filter(function(item){return item.href===selected;})[0]||group.children[0];
    output.push({
      type_name:group.name,
      type_id:child.href,
      kind:"filters",
      children:group.children,
      filter_name:child.name
    });
  });
  output.push({type_name:"AI图区",type_id:"/photos/series-6443d480eb757.html",kind:"list"});
  output.push({type_name:"今日热图",type_id:"/",kind:"hot"});
  return output;
}
function defaultClasses(){

}
function dedupeClasses(list){

    if(!item||!item.type_name||!item.type_id)return;

function getImgSrc(img,base){
  if(!img)return "";
  var attrs=["data-src","data-original","data-lazy","lay-src","src"];
  for(var i=0;i<attrs.length;i++){
    var value=img.getAttribute(attrs[i]);
    if(value)return fixUrl(value,base);
  }
  return "";
}
function getBackgroundImage(node,base){
  if(!node)return "";
  var style=String(node.getAttribute("style")||"");
  var match=style.match(/background-image\s*:\s*url\(\s*(['"]?)(.*?)\1\s*\)/i);
  return match&&match[2]?fixUrl(match[2],base):"";
}
function isBadImage(url){
  var low=String(url||"").toLowerCase();
  return !low||low.indexOf("logo")>=0||low.indexOf("favicon")>=0||
    low.indexOf("avatar")>=0||low.indexOf("blank")>=0||
    low.indexOf("/static/")>=0||low.indexOf("51.la")>=0;
}
function parseList(html,baseUrl,page){
  var doc=parseHtml(html);
  var list=[],seen={};
  var links=Array.from(doc.querySelectorAll(".list.photo-list .item.photo a[href*='/photo/id-'], .item.photo a[href*='/photo/id-']"));
  if(!links.length)links=Array.from(doc.querySelectorAll(".photo-list a[href*='/photo/id-'], a[href*='/photo/id-']"));
  links.forEach(function(link){
    var node=link.closest(".item.photo")||link.closest(".item")||link;
    var href=fixUrl(link.getAttribute("href")||"",baseUrl);
    if(!href||seen[href])return;
    var imgNode=link.querySelector(".img")||node.querySelector(".img");
    var img=link.querySelector("img")||node.querySelector("img");
    var pic=getBackgroundImage(imgNode,baseUrl)||getImgSrc(img,baseUrl);
    if(isBadImage(pic))pic="";
    var title=cleanText((node.querySelector(".text .title")||{}).textContent)||cleanText(link.getAttribute("title")||"")||"图集";
    var subNodes=node.querySelectorAll(".text .subs > div");
    var date=cleanText(subNodes.length>1?subNodes[1].textContent:"");
    var series=cleanText(subNodes.length?subNodes[0].textContent:"");
    var tagNodes=node.querySelectorAll(".tags > div");
    var count=cleanText(tagNodes.length?tagNodes[0].textContent:"");
    var comments=cleanText(tagNodes.length>2?tagNodes[2].textContent:"").replace(/[^0-9]/g,"");
    seen[href]=true;
    list.push({
      vod_id:href,
      vod_name:title,
      vod_pic:pic,
      model:count,
      series:series,
      vod_time:date,
      views:comments
    });
  });
  var pagecount=Number(page||1);
  Array.from(doc.querySelectorAll(".pager a[href]")).forEach(function(link){
    var text=cleanText(link.textContent);
    var n=Number(text);
    if(n)pagecount=Math.max(pagecount,n);
    var href=link.getAttribute("href")||"";
    var m=href.match(/\/(\d+)\.html(?:[?#].*)?$/i);
    if(m)pagecount=Math.max(pagecount,Number(m[1]));
  });
  return {list:dedupeItems(list),page:Number(page||1),pagecount:pagecount};
}
async function readListPage(base,page){
  var candidates=pageCandidates(base,page),lastData=null,lastError=null;
  for(var i=0;i<candidates.length;i++){
    var url=candidates[i];
    try{
      var html=await reqText(url);
      var data=parseList(html,url,page);
      console.info("[8se list]",url,"cards="+data.list.length);
      if(data.list.length)return data;
      lastData=data;
      var readerHtml=await reqReaderText(url);
      var readerData=parseList(readerHtml,url,page);
      console.info("[8se list reader]",url,"cards="+readerData.list.length);
      if(readerData.list.length)return readerData;
      lastData=readerData;
    }catch(error){
      lastError=error;
      console.warn("[8se list retry]",url,error);
    }
  }
  if(lastData)return lastData;
  throw lastError||new Error("分类页面没有返回内容");
}
function dedupeItems(list){
  var seen={},out=[];
  (list||[]).forEach(function(item){
    var key=item&&item.vod_id;
    if(!key||seen[key])return;
    seen[key]=true;
    out.push(item);
  });
  return out;
}
function parseHotItems(html,baseUrl){
  var doc=parseHtml(html);
  var items=[],seen={};
  Array.from(doc.querySelectorAll(".content-box.numbered-list")).some(function(box){
    var heading=cleanText((box.querySelector(".header .left")||box.querySelector(".header")||{}).textContent);
    if(heading!=="今日热图")return false;
    Array.from(box.querySelectorAll(".body > a[href*='/photo/id-']")).forEach(function(link,index){
      var href=fixUrl(link.getAttribute("href")||"",baseUrl);
      var name=cleanText(link.getAttribute("title")||"")||cleanText((link.querySelector(".title")||{}).textContent);
      if(!name||!href||seen[href])return;
      seen[href]=true;
      items.push({name:(index+1)+". "+name,title:name,href:href});
    });
    return true;
  });
  return items;
}
function fullPhotoUrl(url){
  url=String(url||"");
  return url.replace(/\/(\d+)_\d+x\d+\.webp(?=([?#].*)?$)/i,"/$1.jpg");
}
function parseDetailImages(html,baseUrl){
  var doc=parseHtml(html);
  var title=cleanText((doc.querySelector(".info-card.photo-detail .item:first-child .text")||{}).textContent)||
    cleanText((doc.querySelector(".breadcrumb a:last-child")||{}).textContent)||
    cleanText((doc.querySelector("title")||{}).textContent).replace(/\s*-\s*8色人体摄影\s*$/i,"")||"详情";
  var images=[],seen={};
  Array.from(doc.querySelectorAll(".list.photo-items .item.photo-image")).forEach(function(node){
    var thumb=getBackgroundImage(node.querySelector(".img"),baseUrl)||getImgSrc(node.querySelector("img"),baseUrl);
    if(isBadImage(thumb))return;
    var src=fullPhotoUrl(thumb),key=src.split("#")[0];
    if(seen[key])return;
    seen[key]=true;
    images.push({src:src,thumb:thumb});
  });
  var pages=[],pageSeen={};
  Array.from(doc.querySelectorAll(".list.photo-items ~ .pager a[href], .content-box .pager a[href]")).forEach(function(link){
    var href=fixUrl(link.getAttribute("href")||"",baseUrl);
    if(!/\/photo\/id-[^\/]+\/\d+\.html$/i.test(pathOf(href)))return;
    if(pageSeen[href])return;
    pageSeen[href]=true;
    pages.push(href);
  });
  pages.sort(function(a,b){
    function n(url){
      var m=pathOf(url).match(/\/(\d+)\.html$/);
      return m?Number(m[1]):1;
    }
    return n(a)-n(b);
  });
  return {title:title,images:images,pages:pages};
}

function nearest(key,scope){

  if(!list.length)return null;

  var from=center(active);
  var vertical=key==="ArrowUp"||key==="ArrowDown";
  var forward=key==="ArrowRight"||key==="ArrowDown";
  var best=null,bestScore=Infinity;
  list.forEach(function(el){
    if(el===active)return;
    var to=center(el);
    var main=vertical?to.y-from.y:to.x-from.x;
    var cross=vertical?Math.abs(to.x-from.x):Math.abs(to.y-from.y);
    if(forward?main<=4:main>=-4)return;
    var score=Math.abs(main)*1.3+cross*1.8;
    if(score<bestScore){best=el;bestScore=score;}
  });

  if(active&&(
    active.classList.contains("tab-btn")&&sameRowEdge(active,".tab-btn",true)||
    active.classList.contains("card")&&sameRowEdge(active,".card",true)||
    active===$("loadMoreBtn")
  )){
    showSideNav();
    return true;
  }
  return false;
}
function handleKeydown(event){
  var key=normalizeKey(event);
  if(!key)return;
  if(event.repeat||duplicate(key)){consume(event);return;}
  if(handleViewerKey(key)){consume(event);return;}
  if(handleModalKey(key)){consume(event);return;}
  if(closeTagPopupOnBack(key)){consume(event);return;}
  if(handleSideKey(key)){consume(event);return;}
  if($("detail").classList.contains("active")&&key==="Menu"){
    consume(event);
    restoreDetailFocus(true);
    return;
  }
  if($("detail").classList.contains("active")&&!$("detail").contains(document.activeElement)&&
    ["Enter","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(key)>=0){
    consume(event);
    if(key==="ArrowDown"&&!focusFirstDetailImage())restoreDetailFocus(false);
    else restoreDetailFocus(true);
    return;
  }
  if(key==="Escape"||key==="Backspace"){
    if($("detail").classList.contains("active")){consume(event);closeDetail();return;}
  }
  if(key==="Enter"){
    var active=document.activeElement;
    if(active&&active.click){consume(event);active.click();return;}
  }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(key)<0)return;
  if(maybeOpenSide(key)){consume(event);return;}
  if($("detail").classList.contains("active")&&key==="ArrowDown"&&document.activeElement===$("closeDetailBtn")){
    consume(event);
    focusFirstDetailImage();
    return;
  }
  if(key==="ArrowDown"&&document.activeElement&&document.activeElement.classList&&
    document.activeElement.classList.contains("card")&&cardInLastRow(document.activeElement)&&
    state.page<state.pagecount){
    consume(event);
    loadMorePreserveFocus();
    return;
  }
  var target=nearest(key,$("detail").classList.contains("active")?$("detail"):document);
  if(target){
    consume(event);
    $("detail").classList.contains("active")?focusDetail(target):focusHome(target);
  }else if($("detail").classList.contains("active")){
    consume(event);
  }
}
function suppressRemoteMenuEvent(event){
  if(normalizeKey(event)!=="Menu")return;
  if($("viewer").classList.contains("active")||$("detail").classList.contains("active"))consume(event);
}
function handleContextMenu(event){
  if($("viewer").classList.contains("active")){
    consume(event);
    showViewerToolbar();
    return;
  }
  if($("detail").classList.contains("active")){
    consume(event);
    restoreDetailFocus(true);
  }
}
function closeTagPopupOnBack(key){
  if(!$("tagPopup").classList.contains("open"))return false;
  if(key==="Escape"||key==="Backspace"){
    closeTagPopup(true);
    return true;
  }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(key)>=0){
    var target=nearest(key,$("tagPopup"));
    if(target){
      focusWithoutScroll(target);
      try{target.scrollIntoView({block:"nearest",inline:"nearest"});}catch(e){}
    }else if(key==="ArrowLeft"){
      closeTagPopup(true);
    }else{
      var list=$("tagList");
      if(list&&(key==="ArrowUp"||key==="ArrowDown"))list.scrollTop+=key==="ArrowDown"?48:-48;
      focusWithoutScroll(document.activeElement);
    }
    return true;
  }
  if(key==="Enter"&&document.activeElement&&document.activeElement.click){
    document.activeElement.click();
    return true;
  }
  return false;
}

function bindActions(){
  $("loadMoreBtn").addEventListener("click",loadMore);
  $("closeDetailBtn").addEventListener("click",closeDetail);
  $("sideSettingsBtn").addEventListener("click",function(){openModal("settingsModal");});
  $("sideSearchBtn").addEventListener("click",function(){openModal("searchModal");});
  $("sideRefreshBtn").addEventListener("click",function(){hideSideNav(false);refreshCurrent();});
  $("sideCategoryBtn").addEventListener("click",showCategoryPanel);
  $("sideHomeBtn").addEventListener("click",function(){hideSideNav(false);selectCategory(0,true);});
  $("sideTopBtn").addEventListener("click",function(){
    hideSideNav(false);
    window.scrollTo(0,0);
    focusActiveTab();
  });
  $("sidePrevCatBtn").addEventListener("click",function(){hideSideNav(false);selectCategory(state.activeIndex-1,true);});
  $("sideNextCatBtn").addEventListener("click",function(){hideSideNav(false);selectCategory(state.activeIndex+1,true);});
  $("searchCancelBtn").addEventListener("click",function(){closeModal("searchModal",true);});
  $("searchSubmitBtn").addEventListener("click",function(){runSearch($("searchInput").value);});
  $("searchInput").addEventListener("keydown",function(event){
    if(normalizeKey(event)==="Enter"){consume(event);runSearch($("searchInput").value);}
  });
  $("settingsCancelBtn").addEventListener("click",function(){closeModal("settingsModal",true);});
  $("settingsSaveBtn").addEventListener("click",saveSettingsFromModal);
  $("viewerCloseBtn").addEventListener("click",function(){closeViewer(true);});
  $("viewerPrevBtn").addEventListener("click",function(){runViewerControl(function(){viewerMove(-1);});});
  $("viewerNextBtn").addEventListener("click",function(){runViewerControl(function(){viewerMove(1);});});
  $("viewerZoomOutBtn").addEventListener("click",function(){runViewerControl(function(){viewerZoom(-.25);});});
  $("viewerZoomInBtn").addEventListener("click",function(){runViewerControl(function(){viewerZoom(.25);});});
  $("viewerRotateBtn").addEventListener("click",function(){runViewerControl(viewerRotate);});
  $("viewerResetBtn").addEventListener("click",function(){runViewerControl(viewerReset);});
  $("viewerSlideshowBtn").addEventListener("click",function(){runViewerControl(viewerToggleSlideshow);});
  $("viewerIntervalBtn").addEventListener("click",function(){runViewerControl(viewerCycleInterval);});
  $("viewerJumpInput").addEventListener("keydown",function(event){
    if(normalizeKey(event)==="Enter"){
      consume(event);
      viewerJumpTo($("viewerJumpInput").value);
      hideViewerToolbar(true);
    }
  });
  $("viewerStage").addEventListener("click",function(event){
    if((event.target===$("viewerStage")||event.target===$("viewerImg"))&&viewerAtOriginal())closeViewer(true);
  });
  $("viewer").addEventListener("click",function(event){
    if(event.target!==$("viewer")||viewerToolbarOpen())return;
    if(viewerAtOriginal())closeViewer(true);
    else viewerTogglePan();
  });
  $("viewerImg").addEventListener("load",applyViewerTransform);
  $("viewerImg").addEventListener("error",function(){
    var img=$("viewerImg"),fallback=img.dataset.fallback||"";
    if(img.dataset.fallbackUsed==="1"||!fallback||img.src===fallback)return;
    img.dataset.fallbackUsed="1";
    img.src=fallback;
  });
  ["mousemove","focusin","keydown"].forEach(function(type){
    $("sideNav").addEventListener(type,scheduleSideHide,true);
  });
  document.addEventListener("focusin",function(event){
    maybeAutoLoadForCard(event.target);
    if($("detail").classList.contains("active")&&!$("viewer").classList.contains("active")&&
      !$("detail").contains(event.target)){
      requestAnimationFrame(function(){restoreDetailFocus(true);});
    }
  },true);
  window.addEventListener("keydown",handleKeydown,true);
  window.addEventListener("keyup",suppressRemoteMenuEvent,true);
  window.addEventListener("keypress",suppressRemoteMenuEvent,true);
  window.addEventListener("contextmenu",handleContextMenu,true);
  window.addEventListener("popstate",handlePopState);
}
async function init(){
  bindActions();
  state.classes=defaultClasses();
  renderTabs();
  updateHeader();
  requestAnimationFrame(function(){
    showSideNav();
  });
  await loadClasses();
  await selectCategory(0,false);
}

init();
})();
</script>
</body>
</html>
