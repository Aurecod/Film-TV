  0%{ background-position:0% -40%; opacity:.35; }
  50%{ background-position:0% 140%; opacity:.75; }
  100%{ background-position:0% -40%; opacity:.35; }
}
.fp-art[data-style="holo"] .fp-holo{display:block;}
.fp-art[data-style="holo"] .fp-art-stage{overflow:visible!important;}
.fp-art[data-style="holo"] .fp-vinyl{
  background:
    radial-gradient(circle at 35% 28%, rgba(180,220,255,.12), transparent 42%),
    radial-gradient(circle at 50% 50%, #14141c 0%, #0a0a10 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.1),
    0 0 32px rgba(var(--accent-rgb),.28),
    0 0 60px rgba(120,180,255,.12),
    0 20px 48px rgba(0,0,0,.45);
  overflow:hidden;
}
.fp-art[data-style="holo"] .fp-vinyl.spin{animation:spin 18s linear infinite;}
.fp-art[data-style="holo"] .fp-vinyl img{
  width:86%;height:86%;border:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.1), inset 0 0 20px rgba(120,200,255,.08);
}
.fp-art.is-paused .fp-holo .h-ring,
.fp-art.is-paused .fp-holo .h-ring::after,
.fp-art.is-paused .fp-holo .h-scan{animation-play-state:paused!important;}

.fp-track-info{text-align:center;width:100%;max-width:360px;padding:0 8px;box-sizing:border-box;flex-shrink:0;}
.fp-track-name{font-size:22px;font-weight:700;line-height:1.3;word-break:break-word;letter-spacing:-0.3px;}
.fp-track-artist{font-size:12.5px;color:var(--text-1);margin-top:6px;}
.fp-quick{display:flex;gap:18px;align-items:center;justify-content:center;}
.fp-quick button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-1);}
.fp-quick button svg{width:17px;height:17px;}
.fp-quick button.on{color:var(--danger);}
.fp-quality-btn,.fp-quick button.fp-quality-btn,
.fp-speed-btn,.fp-quick button.fp-speed-btn{
  width:auto!important;min-width:36px;padding:0 4px;
  border:none!important;background:transparent!important;border-radius:0!important;
  font-size:12px;font-weight:700;letter-spacing:0.04em;
  color:var(--text-1)!important;
}
.fp-speed-btn.on,.fp-quick button.fp-speed-btn.on{
  color:var(--green)!important;
}

.fp-controls{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 4px;box-sizing:border-box;}
.fp-progress{display:flex;align-items:center;gap:8px;width:100%;}
.fp-time{font-size:11px;color:var(--text-2);font-family:var(--font-num);width:36px;flex-shrink:0;}
.fp-time.right{text-align:right;}
.fp-bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;touch-action:none;}
.fp-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:#fff;width:0%;}
.fp-bar-knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 1px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);left:0%;}
.fp-ctrls{display:flex;align-items:center;justify-content:center;gap:36px;}
.fp-ctrl-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--text-1);}
.fp-ctrl-btn svg{width:24px;height:24px;}
.fp-play{width:60px;height:60px;border-radius:50%;background:#fff;color:#111;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 32px rgba(0,0,0,.38), 0 1px 0 rgba(255,255,255,.55) inset;
  transition:transform .32s var(--ease-spring), box-shadow .25s;}
.fp-play svg{width:24px;height:24px;}
.fp-play:hover{box-shadow:0 10px 36px rgba(0,0,0,.42);}
.fp-play:active{transform:scale(.92);}

.fp-right{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:70px 48px 30px;min-width:0;box-sizing:border-box;}
.fp-tabs{display:flex;gap:22px;margin-bottom:14px;flex-shrink:0;}
.fp-tab{font-size:16px;color:var(--text-2);padding-bottom:8px;border-bottom:2px solid transparent;transition:all .2s;}
.fp-tab.active{color:var(--text-0);border-color:var(--green);font-weight:600;}

#fullPlayer.lyrics-focus .fp-left{display:none!important;}
#fullPlayer.lyrics-focus .fp-dock{display:none!important;}
#fullPlayer.lyrics-focus .fp-tabs{display:none!important;}
#fullPlayer.lyrics-focus .fp-right{
  position:absolute!important;inset:0!important;width:100%!important;max-width:none!important;
  padding:calc(56px + var(--safe-t)) 20px calc(28px + var(--safe-b))!important;
  margin:0!important;z-index:6!important;
  display:flex!important;flex-direction:column!important;
  order:unset!important;overflow:hidden!important;background:transparent!important;
}
#fullPlayer.lyrics-focus #lyricsWrap,
#fullPlayer.lyrics-focus #playlistPanel{
  flex:1 1 auto!important;min-height:0!important;max-height:none!important;
  mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 92%,transparent 100%)!important;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 92%,transparent 100%)!important;
}
#fullPlayer.lyrics-focus .lyric-line{font-size:20px!important;line-height:1.9!important;padding:8px 12px!important;}
#fullPlayer.lyrics-focus .lyric-line.active{font-size:32px!important;font-weight:700!important;}
#fullPlayer.lyrics-focus .lyric-tr{font-size:14px!important;}
#fullPlayer.lyrics-focus .fp-topbar{z-index:8!important;}
#lyricsWrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(180deg,transparent 0,#000 10%,#000 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10%,#000 88%,transparent 100%);}
.lyric-line{
  font-size:18px;line-height:2.1;color:var(--text-2);
  cursor:pointer;padding:6px 8px;text-align:center;font-weight:500;
  transform:scale(1) translateY(0);transform-origin:center center;
  opacity:.72;
  transition:
    color .4s cubic-bezier(0.22,1,0.36,1),
    opacity .4s cubic-bezier(0.22,1,0.36,1),
    font-size .48s cubic-bezier(0.22,1,0.36,1),
    transform .48s cubic-bezier(0.22,1,0.36,1),
    letter-spacing .4s ease,
    font-weight .3s ease;
  will-change:transform,font-size,opacity;
}
.lyric-line:hover{color:var(--text-1);opacity:.9;}
.lyric-line.active{
  color:var(--text-0);font-size:28px;font-weight:700;letter-spacing:-0.3px;
  opacity:1;
  transform:scale(1.04) translateY(0);
}
.lyric-line.active .lyric-tr{color:var(--green);transition:color .35s ease;}
.lyric-line.is-leaving{
  opacity:.45;
  transform:scale(0.96) translateY(-6px);
}
.lyric-line.is-entering{
  animation:lyricEnter .48s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes lyricEnter{
  from{ opacity:.4; transform:scale(0.94) translateY(10px); }
  to{ opacity:1; transform:scale(1.04) translateY(0); }
}
.lyric-tr{display:block;font-size:13px;color:var(--text-2);margin-top:2px;font-weight:400;}

.lyric-main{display:inline;}
.lyric-word{
  display:inline;
  color:inherit;
  transition:color .08s linear, opacity .08s linear, text-shadow .12s ease;
}
#fullPlayer .lyric-line.active .lyric-word,
.lyric-line.active .lyric-word{
  color:rgba(60,60,67,.28)!important;
  opacity:1!important;
}
#fullPlayer .lyric-line.active .lyric-word.sung,
.lyric-line.active .lyric-word.sung{
  color:var(--green)!important;
  opacity:1!important;
  text-shadow:0 0 10px rgba(var(--accent-rgb),.3);
}
#fullPlayer .lyric-line.active .lyric-word.sung.current,
.lyric-line.active .lyric-word.sung.current{
  color:var(--green)!important;
  font-weight:700!important;
}

.lyric-line.active .lyric-main.ktv-sweep,
#fullPlayer .lyric-line.active .lyric-main.ktv-sweep{
  color:transparent!important;
  -webkit-text-fill-color:transparent!important;
  background-image:linear-gradient(
    90deg,
    var(--green) 0%,
    var(--green) var(--ktv-fill, 0%),
    rgba(60,60,67,.28) var(--ktv-fill, 0%),
    rgba(60,60,67,.28) 100%
  );
  -webkit-background-clip:text!important;
  background-clip:text!important;
}
html[data-mode="dark"] .lyric-line.active .lyric-main.ktv-sweep,
html[data-mode="dark"] #fullPlayer .lyric-line.active .lyric-main.ktv-sweep{
  background-image:linear-gradient(
    90deg,
    var(--green) 0%,
    var(--green) var(--ktv-fill, 0%),
    rgba(235,235,245,.26) var(--ktv-fill, 0%),
    rgba(235,235,245,.26) 100%
  );
}
.lyric-line:not(.active) .lyric-main.ktv-sweep{
  color:inherit!important;
  -webkit-text-fill-color:inherit!important;
  background-image:none!important;
  -webkit-background-clip:border-box!important;
  background-clip:border-box!important;
}
.lyric-line.active .lyric-word{

  transition:none!important;
  color:inherit!important;
  -webkit-text-fill-color:inherit!important;
  background:none!important;
}
html[data-mode="dark"] #fullPlayer .lyric-line.active .lyric-word,
html[data-mode="dark"] .lyric-line.active .lyric-word{
  color:rgba(235,235,245,.26)!important;
}
html[data-mode="dark"] #fullPlayer .lyric-line.active .lyric-word.sung,
html[data-mode="dark"] .lyric-line.active .lyric-word.sung{
  color:var(--green)!important;
  text-shadow:0 0 12px rgba(var(--accent-rgb),.4);
}
#playlistPanel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pl-panel-row{display:flex;align-items:center;gap:10px;padding:11px 6px;border-radius:10px;cursor:pointer;}
.pl-panel-row:hover{background:var(--glass);}
.pl-panel-row.playing{color:var(--green);}

.mv-card{flex:0 0 auto;width:220px;cursor:pointer;}
.mv-cover{width:220px;height:124px;border-radius:var(--radius-m);overflow:hidden;position:relative;
  background:linear-gradient(145deg,#1a222a,#0d1215);}
.mv-cover::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff' opacity='0.22'><path d='M8 5v14l11-7z'/></svg>") center/22% no-repeat;pointer-events:none;z-index:0;}
.mv-cover img{width:100%;height:100%;object-fit:cover;transition:transform .3s var(--ease);position:relative;z-index:1;}
.mv-card:hover .mv-cover img{transform:scale(1.06);}
.mv-dur{position:absolute;right:7px;bottom:7px;font-size:10px;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:5px;z-index:2;}
.mv-rank-badge{position:absolute;left:7px;top:7px;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2;font-family:var(--font-num);}
.mv-rank-badge.top1{background:linear-gradient(135deg,#ffd700,#f0a000);color:#1a1200;}
.mv-rank-badge.top2{background:linear-gradient(135deg,#e8e8e8,#b0b0b0);color:#222;}
.mv-rank-badge.top3{background:linear-gradient(135deg,#e8a060,#c07030);color:#1a1000;}
.mv-play-fab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.25);z-index:2;}
.mv-card:hover .mv-play-fab{opacity:1;}
.mv-play-fab svg{width:36px;height:36px;color:#fff;}
.mv-title{font-size:13px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mv-sub{font-size:11px;color:var(--text-2);margin-top:2px;}
.mv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 12px;}
.mv-grid .mv-card{width:100%;}
.mv-grid .mv-cover{width:100%;height:auto;aspect-ratio:16/9;}

#mvPlayerView{position:fixed;inset:0;z-index:210;background:#000;display:none;flex-direction:column;
  touch-action:pan-y;overscroll-behavior:none;
  transition:transform .4s cubic-bezier(0.22,1,0.36,1),opacity .3s ease;}
#mvPlayerView.show{display:flex;}
#mvPlayerView video{flex:1;width:100%;object-fit:contain;background:#000;min-height:0;}
.mv-top-bar{position:absolute;top:0;left:0;right:0;padding:20px 26px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);z-index:2;

  padding-top:max(20px, calc(12px + env(safe-area-inset-top, 0px)));}
.mv-top-bar .fp-close{position:static;}
.mv-drag-hint{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top, 0px));transform:translateX(-50%);
  width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.35);pointer-events:none;z-index:3;}

.radio-card{flex:0 0 auto;width:132px;text-align:center;cursor:pointer;}
.radio-cover{width:132px;height:132px;border-radius:50%;overflow:hidden;background:conic-gradient(var(--green),#12864e,var(--green));
  padding:3px;}
.radio-cover img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
.radio-name{font-size:12.5px;margin-top:10px;}

#homeVoiceSec{display:none;}
#homeVoiceSec.is-ne{display:block;}
.voice-hscroll{
  display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:4px 2px 8px;scroll-snap-type:x mandatory;
}
.voice-hscroll::-webkit-scrollbar{display:none;}
.voice-card{flex:0 0 auto;width:118px;cursor:pointer;scroll-snap-align:start;}
.voice-cover{
  width:118px;height:118px;border-radius:12px;overflow:hidden;position:relative;
  background:linear-gradient(145deg,#2a1a40,#120a22);
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.voice-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.voice-badge{
  position:absolute;left:6px;top:6px;z-index:2;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;
  background:rgba(0,0,0,.55);color:#fff;
}
.voice-badge.free{background:linear-gradient(135deg,#31c27c,#1a9e5c);}
.voice-badge.trial{background:linear-gradient(135deg,#ff8a4a,#e06020);}
.voice-badge.xm{background:linear-gradient(135deg,#ff5534,#e03a1a);}
.voice-badge.funny{background:linear-gradient(135deg,#ff9f0a,#e08600);}
.voice-name{
  font-size:12.5px;margin-top:8px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.voice-sub{font-size:11px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.voice-all-tabs{
  display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:4px 0 12px;scrollbar-width:none;
}
.voice-all-tabs::-webkit-scrollbar{display:none;}
.voice-all-tab{
  flex:0 0 auto;font-size:13px;padding:6px 14px;border-radius:100px;font-weight:600;
  color:var(--text-1);background:rgba(118,118,128,.14);border:1px solid transparent;
  white-space:nowrap;
}
.voice-all-tab.active{
  color:var(--text-0);background:rgba(var(--accent-rgb),.18);
  border-color:rgba(var(--accent-rgb),.4);
}
.voice-all-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;
  padding:4px 2px 8px;
}
@media(min-width:600px){.voice-all-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}}
.voice-all-grid .voice-card{width:100%;}
.voice-all-grid .voice-cover{width:100%;aspect-ratio:1/1;height:auto;padding-bottom:0;position:relative;}
.voice-all-grid .voice-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.voice-all-more{text-align:center;padding:14px 0 28px;font-size:12.5px;color:var(--text-2);}
.voice-sort-bar{display:flex;align-items:center;gap:8px;padding:4px 0 10px;}
.voice-sort-btn{
  font-size:12.5px;padding:5px 12px;border-radius:100px;font-weight:600;
  color:var(--text-1);background:rgba(118,118,128,.14);border:1px solid transparent;
}
.voice-sort-btn.active{
  color:var(--text-0);background:rgba(var(--accent-rgb),.16);
  border-color:rgba(var(--accent-rgb),.35);
}

.channel-sec-head{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;min-width:0;
}
.channel-sec-head .sec-title{flex-shrink:0;margin:0;}
.channel-tabs{
  display:flex;flex:1;min-width:0;gap:4px;overflow-x:auto;align-items:center;
  -webkit-overflow-scrolling:touch;padding:2px 0;scrollbar-width:none;
}
.channel-tabs::-webkit-scrollbar{display:none;}
.channel-tab{
  flex-shrink:0;padding:5px 12px;border-radius:980px;font-size:14px;font-weight:500;
  color:var(--text-2);background:transparent;border:none;cursor:pointer;
  transition:color .2s, background .2s, transform .3s var(--ease-spring);
  white-space:nowrap;line-height:1.2;
}
.channel-tab:active{transform:scale(.94);}
.channel-tab.active{
  color:var(--text-0);background:rgba(255,255,255,.14);font-weight:600;
}
html[data-mode="dark"] .channel-tab.active{
  color:#111;background:#fff;
}
.channel-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:16px 12px;
  padding:4px 2px 8px;
}
.channel-item{
  display:flex;flex-direction:column;align-items:stretch;text-align:left;
  cursor:pointer;-webkit-user-select:none;user-select:none;
  transition:transform .35s var(--ease-spring);
  position:relative;min-width:0;
}
.channel-item:active{transform:scale(.96);}
.channel-avatar{
  width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;position:relative;
  box-shadow:0 8px 24px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.08) inset;
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  background:#1c1c1e;
  transition:box-shadow .25s, transform .35s var(--ease-spring), border-color .2s;
  box-sizing:border-box;
}
.channel-avatar img{
  width:100%;height:100%;object-fit:cover;display:block;
  border:none;outline:none;border-radius:inherit;
  position:relative;z-index:1;
}

.channel-avatar.has-cover::after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.12) 0%, transparent 42%, rgba(0,0,0,.22) 100%);
  border-radius:inherit;
}

.channel-avatar.has-cover .ch-art{display:none;}

.channel-avatar .ch-art{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:1;overflow:hidden;
}
.channel-avatar .ch-art::before{
  content:"";position:absolute;width:140%;height:140%;left:-20%;top:-30%;
  background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.28) 0%, transparent 48%),
             radial-gradient(circle at 80% 75%, rgba(0,0,0,.22) 0%, transparent 50%);
  pointer-events:none;
}
.channel-avatar .ch-art-mark{
  position:relative;z-index:2;
  font-size:28px;font-weight:800;letter-spacing:-0.5px;line-height:1;
  color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.28);
  opacity:.95;
}
.channel-avatar .ch-art-sub{
  position:relative;z-index:2;margin-top:6px;
  font-size:10px;font-weight:600;letter-spacing:.12em;
  color:rgba(255,255,255,.72);text-transform:uppercase;
}
.channel-avatar .ch-art-ring{
  position:absolute;right:-18%;bottom:-18%;width:62%;aspect-ratio:1;border-radius:50%;
  border:2px solid rgba(255,255,255,.14);pointer-events:none;z-index:1;
}
.channel-avatar .ch-art-ring2{
  position:absolute;left:-22%;top:-22%;width:55%;aspect-ratio:1;border-radius:50%;
  background:rgba(255,255,255,.08);pointer-events:none;z-index:0;
}
.channel-name{
  font-size:13px;color:var(--text-0);margin-top:9px;line-height:1.35;
  width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
  transition:color .2s;text-align:center;letter-spacing:-0.1px;
}

.channel-item.is-playing .channel-avatar{
  border-color:rgba(var(--accent-rgb),.55);
  box-shadow:0 0 0 2px var(--green), 0 10px 28px rgba(0,0,0,.35);
}
.channel-item.is-playing .channel-name{
  color:var(--green);font-weight:700;
}
.channel-item.is-playing .channel-avatar .ch-playing{
  position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;
  background:var(--green);box-shadow:0 2px 10px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;z-index:3;
}
.channel-item.is-playing .channel-avatar .ch-playing svg{
  width:12px;height:12px;color:#fff;margin-left:1px;
}
html[data-mode="dark"] .channel-item.is-playing .channel-avatar{
  border-color:rgba(255,255,255,.4);
  box-shadow:0 0 0 2px #fff, 0 10px 28px rgba(0,0,0,.45);
}
html[data-mode="dark"] .channel-item.is-playing .channel-name{color:#fff;}
html[data-mode="dark"] .channel-item.is-playing .channel-avatar .ch-playing{

/* 清晰封面：遮罩从清晰淡到透明 —— 融合本质是「同一张图从清晰过渡到模糊」 */
.detail-hero-bg{
  position:absolute;inset:0;z-index:0;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,
    #000 0%, #000 42%,
    rgba(0,0,0,0.78) 62%,
    rgba(0,0,0,0.35) 80%,
    rgba(0,0,0,0.08) 92%,
    transparent 100%);
  mask-image:linear-gradient(180deg,
    #000 0%, #000 42%,
    rgba(0,0,0,0.78) 62%,
    rgba(0,0,0,0.35) 80%,
    rgba(0,0,0,0.08) 92%,
    transparent 100%);
}

<script>
(function(){
"use strict";

var _jsonpSeq = 0;

function isNativeFm(){
  return !!(window.fm && typeof window.fm.req === "function");
}

function whenFm(timeoutMs){
  if (isNativeFm()) return Promise.resolve(window.fm);
  return new Promise(function(resolve){
    var done = false;
    function finish(v){
      if (done) return;
      done = true;
      resolve(v || window.fm || null);
    }
    try{
      window.addEventListener("fmsdk", function(){ finish(window.fm); }, { once: true });
    }catch(e){
      window.addEventListener("fmsdk", function(){ finish(window.fm); });
    }
    var n = 0, max = Math.ceil((timeoutMs || 4000) / 50);
    var timer = setInterval(function(){
      n++;
      if (isNativeFm()){ clearInterval(timer); finish(window.fm); }
      else if (n >= max){ clearInterval(timer); finish(null); }
    }, 50);
  });
}

function unwrapFmResponse(res){
  if (res == null) return "";
  if (typeof res === "object"){
    if (res.body != null){
      if (typeof res.body === "string") return res.body;
      try{ return JSON.stringify(res.body); }catch(e){ return String(res.body); }
    }
    if (res.error) return "";
    try{ return JSON.stringify(res); }catch(e){ return ""; }
  }
  if (typeof res === "string") return res;
  return String(res);
}

function jsonpRequest(url, timeoutMs){
  return new Promise(function(resolve, reject){
    var cb = "__qqm_jp_" + (++_jsonpSeq) + "_" + Date.now();
    var timer = setTimeout(function(){
      cleanup();
      reject(new Error("jsonp timeout"));
    }, timeoutMs || 12000);
    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if (script && script.parentNode) script.parentNode.removeChild(script);
    }
    window[cb] = function(data){
      cleanup();
      try{
        resolve(typeof data === "string" ? data : JSON.stringify(data));
      }catch(e){ resolve(String(data)); }
    };
    var sep = url.indexOf("?") >= 0 ? "&" : "?";
    var finalUrl = url;
    if (/([?&])(callback|jsonpCallback)=/.test(finalUrl)){
      finalUrl = finalUrl.replace(/([?&])(callback|jsonpCallback)=[^&]*/g, "$1$2=" + cb);
    } else {
      finalUrl = finalUrl + sep + "callback=" + cb + "&jsonpCallback=" + cb;
    }
    // 酷狗专辑/歌单等接口不支持 format=jsonp，改写会导致空响应
    var skipJsonpFmt = /kugou\.com\/.*\/(search\/(album|special|singer)|album\/song|special\/song)/i.test(finalUrl)
      || /msearch(cdn)?\.kugou\.com/i.test(finalUrl)
      || /mobilecdn(bj)?\.kugou\.com/i.test(finalUrl)
      || /gateway\.kugou\.com/i.test(finalUrl)
      || /nplserver\.kuwo\.cn/i.test(finalUrl);
    if (!skipJsonpFmt){
      finalUrl = finalUrl.replace(/([?&])format=json\b/g, "$1format=jsonp");
    }
    var script = document.createElement("script");
    script.async = true;
    script.src = finalUrl;
    script.onerror = function(){
      cleanup();
      reject(new Error("jsonp script error"));
    };
    (document.head || document.documentElement).appendChild(script);
  });
}

function ADAPTER_request(url, opts){
  opts = opts || {};
  var method = (opts.method || "GET").toUpperCase();
  var headers = opts.headers || {};
  var body = opts.body;
  if (body != null && typeof body !== "string"){
    try{ body = JSON.stringify(body); }catch(e){ body = String(body); }
  }

  if (isNativeFm()){
    var reqOpts = {
      method: method,
      headers: headers,
      body: body || "",
      responseType: "text",
      timeout: opts.timeout || 30,
      credentials: opts.credentials || "include"
    };
    return Promise.resolve()
      .then(function(){ return window.fm.req(url, reqOpts); })
      .then(function(res){
        var text = unwrapFmResponse(res);
        if (res && typeof res === "object" && res.ok === false && !text){
        }
        return text;
      })
      .catch(function(e){
        return "";
      });
  }

  try{
    var jpUrl = url;
    // 酷狗专辑/歌单等纯 JSON 接口：跳过 JSONP（callback 会导致解析失败），直接 fetch / 交给上层
    var forcePlain = /msearch(cdn)?\.kugou\.com/i.test(url)
      || /mobilecdn(bj)?\.kugou\.com/i.test(url)
      || /complexsearch\.kugou\.com/i.test(url)
      || /gateway\.kugou\.com/i.test(url)
      || /mobileservice\.kugou\.com/i.test(url)
      || /m\.kugou\.com\/v2\/special/i.test(url)
      || /kugou\.com\/api\/v3\/(search\/special|special\/song)/i.test(url)
      || /nplserver\.kuwo\.cn/i.test(url)
      || /wapi\.kuwo\.cn\/api\/www\/playlist/i.test(url);
    if (method === "POST" && body && /u\.y\.qq\.com\/cgi-bin\/musicu\.fcg/i.test(url)){
      var sep = url.indexOf("?") >= 0 ? "&" : "?";
      jpUrl = url + sep + "data=" + encodeURIComponent(body);
      if (jpUrl.indexOf("format=") < 0) jpUrl += "&format=jsonp&inCharset=utf8&outCharset=utf-8&platform=yqq.json&needNewCode=0";
    } else if (method === "POST"){
      return fetch(url, { method: method, headers: headers, body: body, mode:"cors", credentials:"omit" })
        .then(function(r){ return r.text(); })
        .catch(function(){ return ""; });
    }
    if (forcePlain){
      return fetch(url, { method: "GET", headers: headers, mode:"cors", credentials:"omit" })
        .then(function(r){ return r.text(); })
        .catch(function(){ return ""; });
    }
    return jsonpRequest(jpUrl).catch(function(err){
      return fetch(url, { method: method === "POST" ? "POST" : "GET", headers: headers, body: method === "POST" ? body : undefined, mode:"cors", credentials:"omit" })
        .then(function(r){ return r.text(); })
        .catch(function(){ return ""; });
    });
  }catch(e){
    return Promise.resolve("");
  }
}

function nativePlay(url, headers, title){

}

function safePlaySrc(url){
  if (!url) return url;
  var u = String(url);
  try {
    if (typeof location !== "undefined" && location.protocol === "https:" && /^http:\/\//i.test(u)){

      u = u.replace(/^http:/i, "https:");
    }
  } catch(e) {}
  return u;
}

function isBrowserOnly(){
  try { return !isNativeFm(); } catch(e) { return true; }
}

function mediaUrl(url, headers){
  if (!url) return "";
  url = String(url).trim();
  if (url.indexOf("//") === 0) url = "https:" + url;
  url = url.replace(/^http:/, "https:");
  try{
    if (window.fm && typeof window.fm.res === "function"){
      var r = window.fm.res(url, {
        headers: headers || { "Referer": "https://y.qq.com/" },
        credentials: "include"
      });

      if (r) return r;
    }
  }catch(e){}
  return url;
}

function storeGet(key, def){
  try{
    var raw = localStorage.getItem("qqm_"+key);
    if (raw === null) return def;
    return JSON.parse(raw);
  }catch(e){ return def; }
}
function storeSet(key, val){
  var s = JSON.stringify(val);
  try{ localStorage.setItem("qqm_"+key, s); }catch(e){}
}

var RECENT_VOICE_MAX = 40;
function getRecentVoiceList(){
  try {
    var list = storeGet("recentVoice", []);
    return Array.isArray(list) ? list : [];
  } catch(e) { return []; }
}
function setRecentVoiceList(list){
  try { storeSet("recentVoice", (list || []).slice(0, RECENT_VOICE_MAX)); } catch(e) {}
}
function removeRecentVoiceById(id){
  if (!id) return false;
  var list = getRecentVoiceList();
  var next = list.filter(function(x){ return x && x.id && x.id !== id; });
  if (next.length === list.length) return false;
  setRecentVoiceList(next);
  return true;
}
function isVoicePlaybackSong(s){
  if (!s) return false;
  if (s.isDjProgram || s.source === "ximalaya") return true;
  var tag = String(state.queueTag || "");
  if (tag.indexOf("xm-voice-") === 0 || tag.indexOf("ne-voice-") === 0) return true;
  var mid = String(s.songmid || "");
  if (mid.indexOf("xm_") === 0) return true;
  return false;
}

function recordRecentVoiceBook(song, extra){
  if (!isVoicePlaybackSong(song)) return;
  extra = extra || {};
  var tag = String(state.queueTag || "");
  var source = song.source || (tag.indexOf("xm-voice-") === 0 ? "ximalaya" : (tag.indexOf("ne-voice-") === 0 ? "netease" : ""));
  if (!source) source = "ximalaya";
  var albumId = "";
  var xmAlbumId = song.xmAlbumId || "";
  if (tag.indexOf("xm-voice-") === 0){
    albumId = tag;
    xmAlbumId = xmAlbumId || tag.slice("xm-voice-".length);
  } else if (tag.indexOf("ne-voice-") === 0){
    albumId = tag;
  } else if (xmAlbumId){
    albumId = "xm-voice-" + xmAlbumId;
    source = "ximalaya";
  } else if (song.songmid){
    albumId = "track-" + song.songmid;
  } else {
    return;
  }
  var t = 0;
  try { t = (audio && audio.currentTime) || 0; } catch(e0) {}
  if (!(t > 0)) t = +(extra.time || 0) || 0;
  var trackIdx = -1;
  try {
    if (state.queue && state.queueIndex >= 0) trackIdx = state.queueIndex;
  } catch(e1) {}
  var singer0 = extra.dj || song.singer || "";
  var albumTitle = extra.albumTitle || extra.title || song.albumname || song.album || "";
  // 避免把「喜马拉雅」当成书名
  if (!albumTitle || albumTitle === "喜马拉雅" || albumTitle === "网易云音乐" || albumTitle === "听书"){
    albumTitle = "";
  }
  if (!albumTitle){
    // 用曲目名去掉集数前缀做兜底书名
    var tn = String(song.name || "").replace(/^(第?[0-9零一二三四五六七八九十百千]+[集章节回部期讲].*?)[：:\s\-—|｜].*$/, "").trim();
    if (tn && tn !== "喜马拉雅") albumTitle = tn;
  }
  if (!albumTitle) albumTitle = "听书";
  var author = singer0;
  if (!author || author === "喜马拉雅" || author === "网易云音乐"){
    author = extra.dj || "";
  }
  var entry = {
    id: albumId,
    source: source,
    xmAlbumId: xmAlbumId || "",
    title: albumTitle,
    cover: extra.cover || song.cover || "",
    dj: author || "",
    trackId: String(song.xmTrackId || ""),
    songmid: String(song.songmid || ""),
    trackName: String(song.name || ""),
    trackIndex: trackIdx,
    time: t > 2 ? t : (extra.time || 0),
    ts: Date.now()
  };
  var list = getRecentVoiceList().filter(function(x){ return x && x.id && x.id !== entry.id; });
  list.unshift(entry);
  setRecentVoiceList(list);
}
function _shortVoiceEpisode(trackName, bookTitle){

function enrichRecentVoiceAuthors(done){
  var list = getRecentVoiceList();
  if (!list.length){ if (done) done(); return; }
  var need = [];
  list.forEach(function(e, i){
    if (!e) return;
    var dj = String(e.dj || "").trim();
    if (dj && dj !== "喜马拉雅" && dj !== "听书" && dj !== "网易云音乐") return;
    if (e.source === "ximalaya" && (e.xmAlbumId || (e.id && String(e.id).indexOf("xm-voice-") === 0))){
      var aid = e.xmAlbumId || String(e.id).replace(/^xm-voice-/, "");
      if (aid) need.push({ i: i, aid: aid });
    }
  });
  if (!need.length){ if (done) done(); return; }
  var jobs = need.slice(0, 12);
  var pending = jobs.length;
  var changed = false;
  jobs.forEach(function(job){
    API.ximalayaAlbumInfo(job.aid).then(function(info){
      if (info && info.dj){
        var e = list[job.i];
        if (e){
          e.dj = info.dj;
          if (!e.title || e.title === "听书" || e.title === "喜马拉雅"){
            if (info.title) e.title = info.title;
          }
          if (!e.cover && info.cover) e.cover = info.cover;
          changed = true;
        }
      }
    }).catch(function(){}).then(function(){
      pending--;
      if (pending <= 0){

        if (done) done();
      }
    });
  });
}

function scrollDetailToPlaying(opts){
  opts = opts || {};
  try {
    var v = document.getElementById("view-detail");
    if (!v || state.view !== "detail") return;
    var cur = state.queue && state.queue[state.queueIndex];
    if (!cur) return;
    var mid = String(cur.songmid || "");
    var tid = String(cur.xmTrackId || "");
    var rows = v.querySelectorAll(".song-row");
    var target = null;
    for (var i = 0; i < rows.length; i++){
      var r = rows[i];
      var rm = r.getAttribute("data-mid") || "";
      var rt = r.getAttribute("data-tid") || "";
      var ri = Number(r.dataset.i);
      if (mid && rm && rm === mid){ target = r; break; }
      if (tid && rt && rt === tid){ target = r; break; }
      if (state.queue[ri] && mid && String(state.queue[ri].songmid || "") === mid){ target = r; break; }
    }
    // 找不到同一首歌/集时不要按序号滚动（避免其他专辑误定位）
    if (!target) return;
    // 只保留当前播放高亮，清掉其它行的 playing
    for (var j = 0; j < rows.length; j++){
      rows[j].classList.toggle("playing", rows[j] === target);
    }
    var behavior = opts.smooth === false ? "auto" : "smooth";
    // 先让列表渲染完再滚
    setTimeout(function(){
      try {
        target.scrollIntoView({ block: "center", behavior: behavior });
      } catch(e1) {
        try {
          var top = target.offsetTop - (v.clientHeight / 3);
          v.scrollTop = Math.max(0, top);
        } catch(e2) {}
      }
    }, opts.delay != null ? opts.delay : 120);
  } catch(e) {}
}

function _kuwoResolvePic(raw, baseHint){
  if (!raw) return "";
  var pic = String(raw).trim().replace(/^["']|["']$/g, "");
  if (!pic || pic === "null" || pic === "undefined") return "";
  if (pic.indexOf("//") === 0) pic = "https:" + pic;
  if (/^https?:\/\//i.test(pic)) return pic.replace(/^http:/i, "https:");
  pic = pic.replace(/^\/+/, "");
  var base = "";
  if (baseHint && String(baseHint).indexOf("http") === 0){
    base = String(baseHint).replace(/\/?$/, "/");
  } else {
    var kind = String(baseHint || "album").toLowerCase();
    if (kind === "artist" || kind === "starheads" || kind.indexOf("starheads") >= 0){
      base = "https://img1.kuwo.cn/star/starheads/";
    } else if (kind === "playlist" || kind === "userpl" || kind.indexOf("userpl") >= 0){
      base = "https://img1.kuwo.cn/star/userpl2015/";
    } else {
      base = "https://img1.kuwo.cn/star/albumcover/";
    }
  }
  return (base + pic).replace(/^http:/i, "https:");
}

API.kuwoLyric = function(song){
  var rid = (song && (song.rid || String(song.songmid || "").replace(/^kw_/, ""))) || "";
  rid = String(rid).replace(/^MUSIC_/i, "").trim();
  if (!rid) return Promise.resolve({ lyric: "", trans: "" });

  function lrclistToLrc(list){
    if (!list || !list.length) return "";
    var lines = [];
    for (var i = 0; i < list.length; i++){
      var it = list[i] || {};
      var text = String(it.lineLyric || it.line_lyric || it.lyric || it.text || "").trim();
      if (!text || text === "null") continue;
      var t = parseFloat(it.time != null ? it.time : (it.startTime != null ? it.startTime : 0));
      if (isNaN(t)) t = 0;

      if (t > 10000) t = t / 1000;
      var m = Math.floor(t / 60);
      var s = t - m * 60;
      var ss = s.toFixed(2);
      if (ss.length < 5) ss = (s < 10 ? "0" : "") + ss;
      var mm = (m < 10 ? "0" : "") + m;
      lines.push("[" + mm + ":" + ss + "]" + text);
    }
    return lines.join("\n");
  }

  function extractLrc(txt){
    if (!txt) return "";
    var d = _parseKuwoBody(txt);
    if (!d) {

      if (String(txt).indexOf("[") !== -1 && /\[\d{1,2}:\d{2}/.test(txt)) return String(txt);
      return "";
    }

    var data = d.data || d;
    if (data && data.lrclist && data.lrclist.length){
      return lrclistToLrc(data.lrclist);
    }
    if (data && data.lrc && data.lrc.list){
      return lrclistToLrc(data.lrc.list);
    }

    var raw = (data && (data.lyric || data.lrc || data.lrcContent || data.lyricContent)) ||
              d.lyric || d.lrc || "";
    if (typeof raw === "string" && raw.trim()) return raw.trim();
    if (Array.isArray(raw)) return lrclistToLrc(raw);
    return "";
  }

  var urls = [

    "https://kuwo.cn/openapi/v1/www/lyric/getlyric?musicId=" + encodeURIComponent(rid),
    "https://www.kuwo.cn/openapi/v1/www/lyric/getlyric?musicId=" + encodeURIComponent(rid),
    "https://m.kuwo.cn/newh5/singles/songinfoandlrc?musicId=" + encodeURIComponent(rid) + "&httpsStatus=1",
    "https://kuwo.cn/newh5/singles/songinfoandlrc?musicId=" + encodeURIComponent(rid) + "&httpsStatus=1",
    "https://mobi.kuwo.cn/mobi.s?f=web&type=lyric_txt&rid=MUSIC_" + encodeURIComponent(rid)
  ];

  function tryOne(i){
    if (i >= urls.length) return Promise.resolve({ lyric: "", trans: "" });
    return ADAPTER_request(urls[i], {
      headers: {
        "User-Agent": QQ_HEADERS["User-Agent"],
        "Referer": "https://www.kuwo.cn/",
        "Accept": "application/json, text/plain, */*"
      },
      timeout: 12,
      credentials: "omit"
    }).then(function(txt){
      var lrc = extractLrc(txt);
      if (lrc) return { lyric: lrc, trans: "" };
      return tryOne(i + 1);
    }).catch(function(){ return tryOne(i + 1); });
  }
  return tryOne(0);
};

API.ytCleanTitle = function(song){
  var raw = (song && song.name) || "";
  var singer = (song && song.singer) || "";

  var book = /[《「]([^」》]+)[」》]/.exec(raw);
  if (book && book[1]) return book[1].trim();
  var name = String(raw)
    .replace(/\s*[\(（\[]?\s*Official\s*(Music\s*)?Video\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Official\s*Audio\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Official\s*Lyric\s*Video\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Lyrics?\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Audio\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*MV\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*HD\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*4K\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Live\s*(Performance|Session|at)[^\)）\]]*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Topic\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Color\s*Coded[^\)）\]]*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*feat\.?[^\)）\]]*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*ft\.?[^\)）\]]*[\)）\]]?/ig, "")
    .replace(/\s*\|\s*Official.*$/ig, "")
    .replace(/\s*【[^】]*】/g, "")
    .replace(/\s*\[[^\]]*\]/g, "")
    .replace(/Joker\s*Xue/ig, "")
    .replace(/\s+[-–—]\s+(Official|Audio|Video|Lyrics|MV).*$/ig, "")
    .replace(/\s+/g, " ")
    .trim();
  if (singer){
    var s0 = singer.split(/[\/、,&]/)[0].trim();
    if (s0 && name.toLowerCase().indexOf(s0.toLowerCase()) === 0){
      name = name.slice(s0.length).replace(/^[\s\-–—_:：]+/, "").trim();
    }
  }
  return name || raw;
};

API.ytmusicLyric = function(videoId){
  if (!videoId) return Promise.resolve({ lyric: "", trans: "" });

  return _ytmPost("next", {
    enablePersistentPlaylistPanel: true,
    isAudioOnly: true,
    tunerSettingValue: "AUTOMIX_SETTING_NORMAL",
    videoId: videoId
  }, "web").then(function(d){
    if (!d) return { lyric: "", trans: "" };
    var browseId = "";
    try {
      var tabs = (((((d.contents || {}).singleColumnMusicWatchNextResultsRenderer || {}).tabbedRenderer || {}).tabbedSearchResultsRenderer || {}).tabs) ||
        (((((d.contents || {}).singleColumnMusicWatchNextResultsRenderer || {}).tabbedRenderer || {}).watchNextTabbedResultsRenderer || {}).tabs) || [];

      function findLyricsId(node, depth){
        if (!node || depth > 14) return "";
        if (Array.isArray(node)){
          for (var i=0;i<node.length;i++){ var x=findLyricsId(node[i], depth+1); if (x) return x; }
          return "";
        }
        if (typeof node !== "object") return "";
        if (node.browseId && String(node.browseId).indexOf("MPLYt") === 0) return node.browseId;
        if (node.endpoint && node.endpoint.browseEndpoint && node.endpoint.browseEndpoint.browseId){
          var bid = node.endpoint.browseEndpoint.browseId;
          if (String(bid).indexOf("MPLYt") === 0) return bid;
        }
        if (node.browseEndpoint && node.browseEndpoint.browseId){
          var bid2 = node.browseEndpoint.browseId;
          if (String(bid2).indexOf("MPLYt") === 0) return bid2;
        }
        var keys = Object.keys(node);
        for (var k=0;k<keys.length;k++){
          var v = node[keys[k]];
          if (v && typeof v === "object"){
            var f = findLyricsId(v, depth+1);
            if (f) return f;
          }
        }
        return "";
      }
      browseId = findLyricsId(d, 0);
    } catch(e){}
    if (!browseId) return { lyric: "", trans: "" };
    return _ytmPost("browse", { browseId: browseId }, "web").then(function(bd){
      if (!bd) return { lyric: "", trans: "" };
      var lines = [];
      function collectLines(node, depth){
        if (!node || depth > 12) return;
        if (Array.isArray(node)){ node.forEach(function(n){ collectLines(n, depth+1); }); return; }
        if (typeof node !== "object") return;
        if (node.lyricsLineRenderer){
          var t = _ytmWalkRuns((((node.lyricsLineRenderer || {}).runs) || (node.lyricsLineRenderer && node.lyricsLineRenderer.text && node.lyricsLineRenderer.text.runs) || []));

          if (!t && node.lyricsLineRenderer.text) t = _ytmWalkRuns(node.lyricsLineRenderer.text.runs || []);
          if (t) lines.push(t);
        }
        if (node.description && node.description.runs){
          var full = _ytmWalkRuns(node.description.runs);
          if (full && full.length > 20) lines.push(full);
        }
        Object.keys(node).forEach(function(k){
          if (node[k] && typeof node[k] === "object") collectLines(node[k], depth+1);
        });
      }
      collectLines(bd, 0);

      var seen = {}, out = [];
      lines.forEach(function(l){ if (l && !seen[l]){ seen[l]=1; out.push(l); } });

      var lrc = out.map(function(line, i){
        var sec = i * 3;
        var m = Math.floor(sec/60), s = sec%60;
        return "[" + (m<10?"0":"")+m + ":" + (s<10?"0":"")+s + ".00]" + line;
      }).join("\n");
      return { lyric: lrc, trans: "" };
    });
  }).catch(function(){ return { lyric: "", trans: "" }; });
};

      "https://mobilecdn.kugou.com/api/v3/special/song?specialid=" + sid + "&page=" + page + "&pagesize=" + pageSize + "&format=json"
    ]);
  }

  if (isGid || playlistId.length > 12){

      "http://mobilecdnbj.kugou.com/api/v3/special/song?plat=0&specialid=" + sid + "&page=" + page + "&pagesize=" + pageSize + "&version=9108",

    ].concat(urls);

  urls.push(
    "https://m.kugou.com/v2/special/single?specialid=" + sid + "&page=" + page + "&pagesize=" + pageSize + "&json=true"
  );
  function chain(i, last){

    return tryUrl(urls[i]).then(function(res){
      if (res && res.songs && res.songs.length) return res;

};

API.kugouAlbumSongs = function(albumId, page, pageSize){

  }
  if (!albumId) return Promise.resolve({ songs: [], hasMore:false });

    "User-Agent": (typeof QQ_HEADERS !== "undefined" && QQ_HEADERS["User-Agent"]) || "Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/122.0.0.0 Mobile Safari/537.36",
    "Referer": "https://www.kugou.com/",
    "Accept": "application/json, text/plain, */*"
  };
  function mapSongs(list){
    return (list || []).map(function(it){
      if (!it) return null;
      var hash = it.hash || it.FileHash || it.filehash || it.hqhash || it.HQFileHash ||
        it["320hash"] || it.sqhash || it.SQFileHash || "";
      hash = String(hash || "").trim();
      var fname = it.filename || it.fileName || it.FileName || "";
      var name = (it.songname || it.songName || it.SongName || it.name || fname || "").replace(/<[^>]+>/g, "");
      if (fname && !(it.songname || it.songName || it.SongName)){
        var parts = String(fname).split(" - ");
        if (parts.length >= 2) name = parts.slice(1).join(" - ").trim();
        else name = String(fname).trim();
      }
      var singer = it.singername || it.singerName || it.SingerName || it.author_name || it.authorName || "";
      if (!singer && fname){
        var p2 = String(fname).split(" - ");
        if (p2.length >= 2) singer = p2[0].trim();
      }
      var dur = Number(it.duration || it.timeLength || it.timelen || it.TimeLength || 0) || 0;
      if (dur > 10000) dur = Math.round(dur / 1000);
      var img = it.img || it.album_img || it.album_img_url || "";
      try {
        if (!img && it.trans_param && it.trans_param.union_cover) img = it.trans_param.union_cover;
      } catch(eI) {}
      if (img) img = String(img).replace(/\{size\}/g, "240").replace(/^http:/, "https:");

      if (!name) name = "未知歌曲";
      return {
        songmid: "kg_" + hash,
        media_mid: hash,
        hash: hash,
        kgHash: hash,
        name: name,

    }).filter(Boolean);

  function parseResp(txt){
    if (!txt) return { songs: [], total: 0 };
    var d = null;
    try { d = typeof txt === "string" ? jsonp_safeParse(txt) : txt; } catch(e){ d = null; }
    if (!d) return { songs: [], total: 0 };
    var list = (d.data && (d.data.info || d.data.list || d.data.lists)) || d.info || d.list || [];
    var total = Number((d.data && (d.data.total || d.data.count)) || d.total || 0) || 0;
    var songs = mapSongs(list);
    return { songs: songs, total: total };
  }
  function tryUrl(url){
    return ADAPTER_request(url, { headers: hdr, timeout: 14, credentials: "omit" }).then(parseResp).catch(function(){
      return { songs: [], total: 0 };
    });
  }
  // 多个可用域名；不带 format=jsonp
  var urls = [
    "https://mobilecdn.kugou.com/api/v3/album/song?albumid=" + encodeURIComponent(albumId) + "&page=" + page + "&pagesize=" + pageSize + "&format=json",
    "https://mobilecdnbj.kugou.com/api/v3/album/song?albumid=" + encodeURIComponent(albumId) + "&page=" + page + "&pagesize=" + pageSize + "&format=json",
    "https://mobilecdn.kugou.com/api/v3/album/song?albumid=" + encodeURIComponent(albumId) + "&page=" + page + "&pagesize=" + pageSize,
    "https://mobilecdnbj.kugou.com/api/v3/album/song?albumid=" + encodeURIComponent(albumId) + "&page=" + page + "&pagesize=" + pageSize
  ];
  function chain(i){
    if (i >= urls.length) return Promise.resolve({ songs: [], hasMore: false });
    return tryUrl(urls[i]).then(function(res){
      if (res && res.songs && res.songs.length){
        var hasMore = res.songs.length >= pageSize || (res.total > 0 && (page * pageSize) < res.total);
        return { songs: res.songs, hasMore: hasMore, total: res.total, info: { songCount: res.total || undefined } };
      }
      return chain(i + 1);
    });
  }
  return chain(0);
}

API.neteaseUrl = function(song){

    if (typeof isNeteaseVipSong === "function" && isNeteaseVipSong(song)){

  } catch(eVip) {}

  function isTrialOrBlocked(item){
    if (!item) return true;
    if (!item.url) return true;
    if (item.code != null && Number(item.code) !== 200) return true;

    // 明确试听字段（空对象也算试听）
    if (item.freeTrialInfo != null && item.freeTrialInfo !== false) return true;
    if (item.freeTrialPrivilege){

    if (item.type === 1 || item.type === "1") return true;

      var br = Number(item.br) || Number(item.bitrate) || 128000;
      if (br < 1000) br = br * 1000; // 有的接口 br=128

    if (/\/try\/|try[_-]?url|preview|onlyplay|freeTrial|audition/i.test(u)) return true;

    if (i >= brList.length) return Promise.resolve(null);
    var url = "https://music.163.com/api/song/enhance/player/url?id=" + id + "&ids=[" + id + "]&br=" + brList[i];

function _textToPseudoLrc(text, durationSec){
  text = String(text || "").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&");
  text = text.replace(/\s+/g, " ").trim();
  if (!text) return "";
  // 按句号/换行切分
  var parts = [];
  text.replace(/[^。！？；\n\r]+[。！？；]?/g, function(m){
    m = String(m || "").trim();
    if (m) parts.push(m);
  });
  if (parts.length <= 1){
    // 按长度硬切
    parts = [];
    var chunk = 36;
    for (var i = 0; i < text.length; i += chunk){
      parts.push(text.slice(i, i + chunk));
    }
  }
  if (!parts.length) return "";
  var dur = Number(durationSec) || Math.max(parts.length * 4, 30);
  var step = dur / parts.length;
  var lines = [];
  for (var j = 0; j < parts.length; j++){
    var t = j * step;
    var mm = Math.floor(t / 60);
    var ss = Math.floor(t % 60);
    var cs = Math.floor((t - Math.floor(t)) * 100);
    function pad(n){ return (n < 10 ? "0" : "") + n; }
    lines.push("[" + pad(mm) + ":" + pad(ss) + "." + pad(cs) + "]" + parts[j]);
  }
  return lines.join("\n");
}
API.ximalayaTrackLyric = function(song){
  if (!song) return Promise.resolve({ lyric: "", trans: "" });
  if (song.lyricText && String(song.lyricText).replace(/\s+/g, "").length > 4){
    return Promise.resolve({ lyric: song.lyricText, trans: "" });
  }
  var tid = song.xmTrackId || String(song.media_mid || song.songmid || "").replace(/^xm_/, "");
  if (!tid) return Promise.resolve({ lyric: "", trans: "" });
  var urls = [
    "https://mobile.ximalaya.com/v1/track/baseInfo?device=android&trackId=" + encodeURIComponent(tid),
    "https://www.ximalaya.com/revision/track/simple?trackId=" + encodeURIComponent(tid),
    "https://mobile.ximalaya.com/mobile/track/v2/detail?trackId=" + encodeURIComponent(tid) + "&device=android"
  ];
  function pickIntro(d){
    if (!d) return "";
    var node = d.data || d.trackInfo || d.track || d;
    if (node.data && !node.intro && !node.richIntro) node = node.data;
    var keys = ["richIntro", "intro", "shortIntro", "trackIntro", "content", "description", "caption", "summary"];
    var i, v;
    for (i = 0; i < keys.length; i++){
      v = node[keys[i]];
      if (v && typeof v === "string" && v.replace(/\s+/g, "").length > 8) return v;
    }
    if (node.album && typeof node.album.intro === "string") return node.album.intro;
    return "";
  }
  function tryOne(i){
    if (i >= urls.length) return Promise.resolve({ lyric: "", trans: "" });
    return ADAPTER_request(urls[i], {
      headers: (urls[i].indexOf("mobile") >= 0 ? (_xmMobHdr ? _xmMobHdr() : _xmHdr()) : _xmHdr()),
      timeout: 10,
      credentials: "omit"
    }).then(function(txt){
      var intro = pickIntro(jsonp_safeParse(txt));
      if (intro){
        var lrc = _textToPseudoLrc(intro, song.interval || 0);
        if (lrc){
          try { song.lyricText = lrc; } catch(e) {}
          return { lyric: lrc, trans: "" };
        }
      }
      return tryOne(i + 1);
    }).catch(function(){ return tryOne(i + 1); });
  }
  return tryOne(0);
};

API.ximalayaTrackUrl = function(song){
  var tid = (song && (song.xmTrackId || String(song.songmid || "").replace(/^xm_/, ""))) || "";
  if (!tid) return Promise.resolve(null);
  if (song.playUrl && /^https?:\/\//i.test(song.playUrl) && isPlayUrlFresh(song)){
    return Promise.resolve(song.playUrl);
  }
  function normalizeSrc(src){
    if (!src) return "";
    src = String(src);
    if (src.indexOf("//") === 0) src = "https:" + src;
    if (src.indexOf("http://") === 0) src = "https://" + src.slice(7);
    return src;
  }
  function applySrc(src){
    src = normalizeSrc(src);
    if (src && song){
      song.playUrl = src;
      var now = Date.now();
      song.playUrlAt = now;
      song.playUrlTs = now;
    }
    return src || null;

  var webUrl = "https://www.ximalaya.com/revision/play/tracks?trackIds=" + encodeURIComponent(tid);

    var d = jsonp_safeParse(txt);

    var item = arr[0] || {};
    return applySrc(item.src || item.playUrl || item.url || "");
  }).catch(function(){ return null; });

  var pMob = ADAPTER_request(mobUrl, { headers: _xmMobHdr(), timeout: 10, credentials: "omit" }).then(function(txt){
    var d = jsonp_safeParse(txt) || {};
    var node = d.data || d;
    var src = node.playUrl64 || node.playUrl32 || node.playPathAacv164 || node.playPathAacv224 ||
      node.downloadUrl || node.playUrl || "";
    return applySrc(src);
  }).catch(function(){ return null; });

  return Promise.all([pWeb, pMob]).then(function(parts){
    for (var i = 0; i < parts.length; i++){
      if (parts[i]) return parts[i];
    }
    return ADAPTER_request(v1Url, { headers: _xmHdr(), timeout: 8, credentials: "omit" }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var data = (d && d.data) || d || {};
      var src = data.src || data.playUrl || data.url || data.trackUrl ||
        (data.playUrlList && data.playUrlList[0] && (data.playUrlList[0].url || data.playUrlList[0])) || "";
      return applySrc(src);
    }).catch(function(){ return null; });
  });
};

API.neteasePersonalFm = function(limit){
  limit = Math.max(3, Math.min(limit || 30, 40));
  var endpoints = [
    "https://music.163.com/api/personal_fm",
    "https://music.163.com/api/v1/radio/get",
    "https://music.163.com/api/radio/get"
  ];
  function parseFm(txt){
    var d = jsonp_safeParse(txt);
    if (!d) return [];
    var list = (d.data && Array.isArray(d.data) ? d.data : null)
      || (d.data && d.data.songs)
      || d.songs
      || d.result
      || [];
    if (!Array.isArray(list)) list = [];
    return list.map(function(item){
      return _mapNeteaseSong(item.song || item.songInfo || item);
    }).filter(Boolean);
  }
  function oneShot(epIdx){
    if (epIdx >= endpoints.length) return Promise.resolve([]);
    var url = endpoints[epIdx] + (endpoints[epIdx].indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
    return ADAPTER_request(url, {
      headers: _neHdrDaily(),
      timeout: 12,
      credentials: "omit"
    }).then(function(txt){
      var list = parseFm(txt);
      if (list.length) return list;
      return oneShot(epIdx + 1);
    }).catch(function(){ return oneShot(epIdx + 1); });
  }
  var pool = [];
  var seen = {};
  var rounds = 0;
  var maxRounds = 12;
  function loop(){
    if (pool.length >= limit || rounds >= maxRounds){
      return Promise.resolve(pool.slice(0, limit));
    }
    rounds++;
    return oneShot(0).then(function(batch){
      (batch || []).forEach(function(s){
        if (!s || !s.songmid || seen[s.songmid]) return;
        seen[s.songmid] = true;
        pool.push(s);
      });

      if (!(batch && batch.length)) return pool.slice(0, limit);
      return loop();
    });
  }
  return loop().then(function(list){
    return _enrichNeteaseCovers(list || []).then(function(songs){
      return { songs: (songs || []).slice(0, limit), source: "personal-fm", title: "私人FM" };
    });
  });
};

function shuffleArray(arr){
  var a = (arr || []).slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));

  return a;
}

API.playlistsByTagPage = function(categoryId, sortId, sin, count){
  categoryId = categoryId == null ? 10000000 : categoryId;

      "&g_tk=5381&loginUin=0&hostUin=0&format=json&inCharset=utf8&outCharset=utf-8&notice=0&platform=yqq.json"+

API.recommendPlaylists = function(categoryId, sortId, count, refresh){
  count = count || 18;
  if (refresh) _plRefreshNonce++;
  var nonce = _plRefreshNonce + (refresh ? Math.floor(Math.random()*1000) : 0);

  if (categoryId && categoryId !== 10000000 && categoryId !== "10000000" && categoryId !== "smart" && categoryId !== null){
    var sin = refresh ? (Math.floor(Math.random() * 8) * 20) : 0;
    return API.playlistsByTagPage(categoryId, sortId || 3, sin, Math.max(count, 24)).then(function(list){
      if (list.length) return shuffleArray(list).slice(0, count);

      return API.playlistsByTagPage(categoryId, 3, 0, count).then(function(list2){
        return shuffleArray(list2).slice(0, count);
      });
    });
  }

  var pool = shuffleArray(PL_CAT_POOL);
  var catA = pool[nonce % pool.length];
  var catB = pool[(nonce + 3) % pool.length];
  var catC = pool[(nonce + 7) % pool.length];
  var sinA = (nonce % 5) * 12;
  var sinB = ((nonce + 2) % 5) * 12;
  var sinC = ((nonce + 4) % 5) * 12;

  return Promise.all([
    API.hotRecommendPlaylists(),
    API.playlistsByTagPage(catA, 3, sinA, 16),
    API.playlistsByTagPage(catB, 3, sinB, 16),
    API.playlistsByTagPage(catC, 3, sinC, 16)
  ]).then(function(parts){
    var mixed = dedupePlaylists([].concat(parts[0]||[], parts[1]||[], parts[2]||[], parts[3]||[]));

    mixed = shuffleArray(mixed);
    if (mixed.length >= count) return mixed.slice(0, count);

    return API.playlistsByTagPage(10000000, 3, (nonce % 6) * 18, 30).then(function(more){
      return shuffleArray(dedupePlaylists(mixed.concat(more || []))).slice(0, count);
    });
  }).catch(function(){
    return API.playlistsByTagPage(10000000, 3, 0, count).then(function(list){
      return shuffleArray(list).slice(0, count);
    });
  });
};

      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++){
    for (j = 3; j + 1; j--){
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? "0" : "") + b.toString(16);
    }
  }
  return result;
}

function _molanExtractUrl(obj, paths){
  if (!obj) return "";
  for (var pi = 0; pi < paths.length; pi++){
    var path = paths[pi], val = obj;
    for (var i = 0; i < path.length; i++){
      if (val == null){ val = undefined; break; }
      val = val[path[i]];
    }
    if (Array.isArray(val)) val = val[0];
    if (typeof val === "string"){
      if (val.indexOf("http://") === 0 || val.indexOf("https://") === 0) return val;
      if (val.indexOf("//") === 0) return "https:" + val;
    }
  }
  return "";
}
function _molanNormUrl(u){
  if (!u || typeof u !== "string") return null;
  u = String(u).trim().replace(/^["']|["']$/g, "").replace(/\\u0026/gi, "&").replace(/\\&/g, "&");
  if (u.indexOf("//") === 0) u = "https:" + u;
  if (u.indexOf("http") !== 0) return null;
  u = u.replace(/^http:/, "https:");
  if (_isPreviewPlayUrl && _isPreviewPlayUrl(u)) return null;
  return u;
}
function _molanQuality(){
  var q = (state && state.quality) || "HQ";
  if (q === "ZQ" || q === "flac") return "flac";
  if (q === "SQ" || q === "320k") return "320k";
  return "128k";
}
function _molanWyLevel(quality){
  var m = { "128k":"standard", "320k":"exhigh", "flac":"lossless", "flac24bit":"hires", "hires":"hires", "atmos":"sky", "master":"jymaster" };
  return m[quality] || "standard";
}
function _molanReq(url, opts){
  opts = opts || {};
  return ADAPTER_request(url, {
    method: opts.method || "GET",
    headers: opts.headers || { "User-Agent": (typeof QQ_HEADERS !== "undefined" && QQ_HEADERS["User-Agent"]) || "Mozilla/5.0", "Accept": "application/json, text/plain, */*" },
    body: opts.body,
    timeout: opts.timeout || 10,
    credentials: "omit"
  }).then(function(txt){
    if (txt == null) return null;
    if (typeof txt === "object") return txt;
    var s = String(txt).trim();
    if (!s) return null;
    if (s.indexOf("http://") === 0 || s.indexOf("https://") === 0) return s;
    try { return JSON.parse(s); } catch(e){}
    try { return (typeof jsonp_safeParse === "function") ? jsonp_safeParse(s) : null; } catch(e2){ return null; }
  }).catch(function(){ return null; });
}

API.molanSongId = function(song){
  if (!song) return "";
  var src = song.source || "";
  if (src === "netease" || /^ne_/.test(String(song.songmid || ""))){
    return String(song.neteaseId || song.hash || String(song.songmid || "").replace(/^ne_/, "")).replace(/\D/g, "") || String(song.neteaseId || "");
  }
  if (src === "kugou"){
    return String(song.hash || song.kgHash || String(song.songmid || "").replace(/^kg_/, ""));
  }
  if (src === "migu"){
    return String(song.miguId || song.hash || song.copyrightId || String(song.songmid || "").replace(/^mg_/, ""));
  }
  return String(song.songmid || song.hash || song.id || "");
};

API.molanUrl = function(song){
  if (!song) return Promise.resolve(null);
  var src = song.source || "";
  if (src === "netease" || song.neteaseId || /^ne_/.test(String(song.songmid || ""))) src = "netease";
  else if (src === "kugou") src = "kugou";
  else if (src === "migu") src = "migu";
  else return Promise.resolve(null);

  var id = API.molanSongId(Object.assign({}, song, { source: src }));
  if (!id) return Promise.resolve(null);
  var quality = _molanQuality();
  var backends = src === "netease" ? MOLAN_WY_BACKENDS : (src === "kugou" ? MOLAN_KG_BACKENDS : MOLAN_MG_BACKENDS);

  var chain = Promise.resolve(null);
  backends.forEach(function(backend){
    chain = chain.then(function(got){
      if (got) return got;
      return backend.fetch(id, quality, song).then(function(u){
        if (u) return u;
        return null;
      }).catch(function(){ return null; });
    });
  });
  return chain;
};

function _miguHttps(u){
  if (!u) return "";
  u = String(u);
  if (u.indexOf("//") === 0) u = "https:" + u;
  return u.replace(/^http:/, "https:");
}
function _miguPickImg(items){
  if (!items) return "";
  if (!Array.isArray(items)) items = [items];
  if (!items.length) return "";
  var prefer = ["03", "02", "01"];
  for (var p = 0; p < prefer.length; p++){
    for (var i = 0; i < items.length; i++){
      var it = items[i];
      if (!it) continue;
      if (String(it.imgSizeType || "") === prefer[p] && (it.img || it.imgOri || it.webpImg)){
        return _miguHttps(it.img || it.imgOri || it.webpImg);
      }
    }
  }
  var last = items[items.length - 1] || items[0];
  return _miguHttps((last && (last.img || last.imgOri || last.webpImg)) || "");
}
function _miguParseDuration(s){
  if (!s) return 0;
  var len = s.length || s.songTime || s.durationStr || "";
  if (typeof len === "string" && len.indexOf(":") >= 0){
    var parts = len.split(":").map(function(x){ return parseInt(x, 10) || 0; });
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    if (parts.length === 2) return parts[0] * 60 + parts[1];
  }
  var raw = Number(s.duration || s.songTime || s.time || s.interval || 0) || 0;
  if (raw > 10000) return Math.round(raw / 1000);
  if (raw > 0) return Math.round(raw);
  var formats = s.newRateFormats || s.rateFormats || [];
  var brMap = { LQ: 48, PQ: 128, HQ: 320, SQ: 900, ZQ: 1500, FLAC: 900 };
  for (var i = 0; i < formats.length; i++){
    var f = formats[i] || {};
    var size = Number(f.size) || 0;
    var br = brMap[String(f.formatType || "").toUpperCase()] || 0;
    if (!br && /flac/i.test(f.fileType || f.format || "")) br = 900;
    if (size > 2000 && br > 0){
      var sec = Math.round((size * 8) / (br * 1000));
      if (sec > 15 && sec < 3600) return sec;
    }
  }
  return 0;
}
function _miguMapSong(s){
  if (!s) return null;
  var id = s.copyrightId || s.contentId || s.songId || s.id || "";
  if (!id) return null;
  var artists = "";
  try {
    if (Array.isArray(s.artists) && s.artists.length){
      artists = s.artists.map(function(a){ return a.name || a.singerName || a.artistName || ""; }).filter(Boolean).join("/");
    }
    if (!artists){
      artists = (s.singerList || s.singers || []).map(function(a){
        return (typeof a === "string") ? a : (a.name || a.singerName || "");
      }).filter(Boolean).join("/") || (s.singer || s.singerName || "");
    }
  } catch(eA) { artists = s.singer || s.singerName || ""; }
  var cover = "";
  try {
    cover = _miguPickImg(s.imgItems || s.imgItem || s.albumImgs || s.albumImgItems) ||
      _miguHttps(s.imgUrl || s.cover || s.albumImg || s.singerImg || "");
  } catch(eC) {}
  var albumname = "";
  try {
    if (Array.isArray(s.albums) && s.albums[0]) albumname = s.albums[0].name || "";
    if (!albumname) albumname = s.album || s.albumName || "";
  } catch(eAl) {}
  var albumId = "";
  try {
    if (Array.isArray(s.albums) && s.albums[0]) albumId = s.albums[0].id || "";
    if (!albumId) albumId = s.albumId || "";
  } catch(eAi) {}
  var vip = !!(s.vip || s.vipFlag || s.vipType ||
    (s.toneControl && String(s.toneControl) === "1100") ||
    (s.chargeAuditions && String(s.chargeAuditions) !== "0"));
  return {
    songmid: "mg_" + id,
    media_mid: String(id),
    miguId: String(id),
    copyrightId: String(s.copyrightId || id),
    contentId: String(s.contentId || ""),
    name: s.name || s.songName || "",
    singer: artists,
    albumname: albumname,
    albummid: String(albumId),
    cover: cover,
    interval: _miguParseDuration(s),
    isVip: vip,
    playUrl: "",
    source: "migu"
  };
}

API.miguAlbumSongs = function(albumId, page, pageSize){
  albumId = String(albumId || "").replace(/^mg_al_/i, "");
  if (!albumId) return Promise.resolve({ songs: [], hasMore: false });
  page = Math.max(1, page || 1);
  pageSize = pageSize || 50;
  var hdr = {
    "User-Agent": (typeof QQ_HEADERS !== "undefined" && QQ_HEADERS["User-Agent"]) || "Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/122.0.0.0 Mobile Safari/537.36",
    "Referer": "https://music.migu.cn/",
    "Accept": "application/json, text/plain, */*"
  };
  function mapRawSongs(arr){
    var out = [];
    (arr || []).forEach(function(s){
      if (!s) return;
      // 兼容 songList / songItems 两种结构
      var normalized = Object.assign({}, s, {
        copyrightId: s.copyrightId || s.contentId || s.songId || s.id,
        contentId: s.contentId || "",
        name: s.songName || s.name || "",
        songName: s.songName || s.name || "",
        artists: s.singerList || s.singers || s.artists ||
          (s.singer ? [{ name: s.singer }] : []),
        albums: s.albumId ? [{ id: s.albumId, name: s.album || s.albumName || "" }] : (s.albums || []),
        album: s.album || s.albumName || "",
        albumName: s.album || s.albumName || "",
        imgItems: s.albumImgs || s.imgItems || s.imgItem || [],
        imgUrl: s.img1 || s.img2 || s.img3 || s.imgUrl || "",
        duration: s.duration || s.songTime || 0
      });
      var mapped = _miguMapSong(normalized);
      if (mapped) out.push(mapped);
    });
    return out;
  }
  function tryAlbumSongV2(){
    var urls = [
      "https://app.c.nf.migu.cn/MIGUM3.0/resource/album/song/v2.0?albumId=" + encodeURIComponent(albumId) + "&pageNo=" + page + "&pageSize=" + pageSize,
      "https://app.pd.nf.migu.cn/MIGUM3.0/resource/album/song/v2.0?albumId=" + encodeURIComponent(albumId) + "&pageNo=" + page + "&pageSize=" + pageSize
    ];
    var i = 0;
    function next(){
      if (i >= urls.length) return Promise.resolve(null);
      var u = urls[i++];
      return ADAPTER_request(u, { headers: hdr, timeout: 12, credentials: "omit" }).then(function(txt){
        var d = null;
        try { d = typeof txt === "string" ? JSON.parse(txt) : txt; } catch(e){ d = (typeof jsonp_safeParse === "function") ? jsonp_safeParse(txt) : null; }
        var list = (d && d.data && d.data.songList) || (d && d.songList) || (d && d.data && d.data.list) || [];
        if (!list.length) return next();
        var songs = mapRawSongs(list);
        if (!songs.length) return next();
        var total = Number((d && d.data && (d.data.totalCount || d.data.total)) || 0) || 0;
        var hasMore = songs.length >= pageSize && (total ? (page * pageSize < total) : true);
        return { songs: songs, hasMore: hasMore, total: total || songs.length };
      }).catch(function(){ return next(); });
    }
    return next();
  }
  function tryResourceInfo(){
    // 普通专辑 resourceType=2003；数字专辑/专栏常用 5
    var types = ["2003", "5"];
    var hosts = [
      "https://app.c.nf.migu.cn/MIGUM2.0/v1.0/content/resourceinfo.do",
      "https://c.musicapp.migu.cn/MIGUM2.0/v1.0/content/resourceinfo.do",
      "https://pd.musicapp.migu.cn/MIGUM3.0/v1.0/content/resourceinfo.do"
    ];
    var jobs = [];
    types.forEach(function(rt){
      hosts.forEach(function(h){
        jobs.push(h + "?needSimple=01&resourceType=" + rt + "&resourceId=" + encodeURIComponent(albumId));
      });
    });
    var i = 0;
    function next(){
      if (i >= jobs.length) return Promise.resolve(null);
      var u = jobs[i++];
      return ADAPTER_request(u, { headers: hdr, timeout: 12, credentials: "omit" }).then(function(txt){
        var d = null;
        try { d = typeof txt === "string" ? JSON.parse(txt) : txt; } catch(e){ d = (typeof jsonp_safeParse === "function") ? jsonp_safeParse(txt) : null; }
        var resource = (d && d.resource && d.resource[0]) || null;
        if (!resource) return next();
        var songList = resource.songItems || resource.songList || resource.songs || [];
        if (!songList.length) return next();
        var songs = mapRawSongs(songList);
        if (!songs.length) return next();
        // 客户端分页
        var start = (page - 1) * pageSize;
        var slice = songs.slice(start, start + pageSize);
        return {
          songs: slice,
          hasMore: start + pageSize < songs.length,
          total: songs.length,
          info: {
            title: resource.title || resource.albumName || resource.name || "",
            cover: _miguPickImg(resource.imgItems || resource.imgItem || resource.imgs) ||
              _miguHttps(resource.imgUrl || resource.cover || "")
          }
        };
      }).catch(function(){ return next(); });
    }
    return next();
  }
  // 优先 album/song v2，失败再 resourceinfo（兼容数字专辑 resourceType=5）
  return tryAlbumSongV2().then(function(res){
    if (res && res.songs && res.songs.length) return res;
    return tryResourceInfo().then(function(res2){
      return res2 || { songs: [], hasMore: false };
    });
  }).catch(function(){
    return tryResourceInfo().catch(function(){ return { songs: [], hasMore: false }; });
  });
};

API.changqingLevel = function(){
  var q = state.quality || "HQ";
  if (q === "ZQ" || q === "flac") return "lossless";
  if (q === "SQ" || q === "320k") return "exhigh";
  if (q === "HQ" || q === "128k") return "standard";
  return CHANGQING.qualityMap[q] || "exhigh";
};
// 长青镜像对 level 字段不统一：有的要 standard/exhigh，有的要 128k/320k/flac
API.changqingLevelCandidates = function(){
  var q = state.quality || "HQ";
  if (q === "ZQ" || q === "flac" || q === "flac24bit"){
    return ["flac", "lossless", "ZQ", "exhigh", "320k"];
  }
  if (q === "SQ" || q === "320k"){
    return ["320k", "exhigh", "SQ", "128k", "standard"];
  }
  return ["128k", "standard", "HQ", "320k", "exhigh"];
};
API.changqingSongId = function(song){
  if (!song) return "";
  var src = song.source || "qq";
  if (src === "kugou"){
    return String(song.hash || song.kgHash || song.songmid || "").replace(/^kg_/, "");
  }
  if (src === "kuwo"){
    return String(song.rid || song.hash || String(song.songmid || "").replace(/^kw_/, "")).replace(/^MUSIC_/i, "");
  }
  if (src === "netease"){
    return String(song.neteaseId || song.hash || String(song.songmid || "").replace(/^ne_/, ""));
  }
  if (src === "migu"){
    return String(song.miguId || song.hash || song.songmid || "");
  }

  return String(song.songmid || song.media_mid || song.strMediaMid || song.hash || "");
};

API.changqingUrl = function(song){
  // 注意：长青 .php 常直接返回音频流。禁止用 ADAPTER_request 拉 body（会卡死页面）。
  // 与原插件一致：直接返回接口 URL，交给播放器拉流。
  if (!song) return Promise.resolve(null);
  var src = song.source || "qq";
  var epKey = src === "qq" ? "qq" : src;
  var bases = CHANGQING.endpoints[epKey];
  if (!bases) return Promise.resolve(null);
  if (typeof bases === "string") bases = [bases];
  var id = API.changqingSongId(song);
  if (!id) return Promise.resolve(null);
  var level = API.changqingLevel();
  var base = String(bases[0] || "").replace(/\/$/, "");
  if (!base) return Promise.resolve(null);
  var url = base + (base.indexOf("?") >= 0 ? "&" : "?") +
    "type=mp3&id=" + encodeURIComponent(id) + "&level=" + encodeURIComponent(level);
  return Promise.resolve(url);
};

API.cqOrLxUrl = function(song){
  // 网易/酷狗/咪咕禁止走这里（走墨澜）
  try {
    var src = (song && song.source) || "";
    if (src === "netease" || src === "kugou" || src === "migu" ||
        (song && song.neteaseId) ||
        (song && /^ne_/.test(String(song.songmid || ""))) ||
        (song && /^kg_/.test(String(song.songmid || ""))) ||
        (song && /^mg_/.test(String(song.songmid || "")))){
      return Promise.resolve(null);
    }
  } catch(eBlock) {}

  var songSrc = "";
  try { songSrc = (song && song.source) || ""; } catch(eS) {}

  // 酷我：保持原逻辑，不接入长青
  if (songSrc === "kuwo"){
    return API.lxUrl(song).catch(function(){ return null; }).then(function(u){
      if (u && !(typeof _isPreviewPlayUrl === "function" && _isPreviewPlayUrl(u))) return u;
      return null;
    });
  }

  // ========== QQ：念心 + 长青（零请求取址，避免下载音频二进制卡死页面）==========
  // 两个源都与洛雪插件一样：把接口 URL 直接交给 audio，由播放器去拉流。
  // 绝不能 ADAPTER_request 这些 .php —— 它们常直接吐 mp3，responseType=text 会把整首歌读进内存卡死主线程。
  var songId = "";
  try {
    songId = (typeof API.changqingSongId === "function")
      ? API.changqingSongId(song)
      : String((song && (song.songmid || song.media_mid || song.strMediaMid || song.hash)) || "");
  } catch(eId) {
    songId = String((song && (song.songmid || "")) || "");
  }
  if (!songId) return Promise.resolve(null);

  var q = (state && state.quality) || "HQ";
  var levelMap = {
    "128k": "standard", "HQ": "standard",
    "320k": "exhigh", "SQ": "exhigh",
    "flac": "lossless", "ZQ": "lossless", "flac24bit": "lossless"
  };
  var level = levelMap[q] || "exhigh";

  // 念心（主）
  var nxUrl = "https://mcp.nianxinxz.com/share/ceshi/tx.php?id=" + encodeURIComponent(songId) +
    "&level=" + encodeURIComponent(level) + "&type=mp3";

  // 长青镜像接口（并行候选，不预请求）
  var cqUrls = [];
  try {
    var bases = ((CHANGQING && CHANGQING.endpoints && CHANGQING.endpoints.qq) || []).slice(0, 2);
    bases.forEach(function(base){
      var b = String(base).replace(/\/$/, "");
      cqUrls.push(b + (b.indexOf("?") >= 0 ? "&" : "?") +
        "type=mp3&id=" + encodeURIComponent(songId) + "&level=" + encodeURIComponent(level));
    });
  } catch(eC) {}

  // 挂到歌曲上，供 loadCurrent 候选切换；本次返回念心为主
  try {
    var fb = [];
    if (level !== "standard"){
      fb.push("https://mcp.nianxinxz.com/share/ceshi/tx.php?id=" + encodeURIComponent(songId) +
        "&level=standard&type=mp3");
    }
    cqUrls.forEach(function(u){ if (u && fb.indexOf(u) < 0) fb.push(u); });
    song._qqmPlayFallbacks = fb;
  } catch(eF) {}

  return Promise.resolve(nxUrl);
};

API.cqOrLxUrlMulti = function(song){
  return API.cqOrLxUrl(song).then(function(url){
    if (url) return url;
    // QQ：不再回落洛雪；其它源（酷我等）保留原 lxUrlMulti 兜底
    var src = "";
    try { src = (song && song.source) || ""; } catch(e) {}
    if (src === "qq" || src === "tx" || !src){
      // 无 source 时也按 QQ 处理（默认源）
      if (src === "qq" || src === "tx") return null;
      // 空 source 且带 songmid 的一般是 QQ 曲
      if (song && song.songmid && !/^kw_|^ne_|^kg_|^mg_|^yt_|^xm_/.test(String(song.songmid))) return null;
    }
    return API.lxUrlMulti(song);
  });
};
