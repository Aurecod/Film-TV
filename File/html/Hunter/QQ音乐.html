API.lxUrl = function(song){
  var source = API.lxSourceOf(song);
  var songId = API.lxSongId(song);
  if (!songId) return Promise.resolve(null);
  var quals = API.lxQuality();

  function parseBody(txt){
    if (!txt) return null;
    if (typeof txt === "string" && /^\s*</.test(txt)) return null;
    var d = null;
    try { d = typeof txt === "string" ? JSON.parse(txt) : txt; } catch(e){ d = jsonp_safeParse(txt); }
    if (!d) return null;

    if (Number(d.code) === 0 || d.code === 200 || d.code === "200"){
      var u = d.url || d.data || (d.data && d.data.url) || "";
      if (typeof u === "string" && /^https?:\/\//i.test(u)) return u.replace(/^http:/, "https:");
    }

    if (d.data && typeof d.data.url === "string" && /^https?:\/\//i.test(d.data.url)){
      return String(d.data.url).replace(/^http:/, "https:");
    }
    return null;
  }

  function tryOne(url, key){
    var isSlowMirror = /onrender\.com/i.test(url);
    return ADAPTER_request(url, {
      headers: {
        "Content-Type": "application/json",
        "User-Agent": "lx-music-mobile/1.4.3",
        "X-Request-Key": key || LX_API.key,
        "Accept": "application/json, text/plain, */*"
      },
      // 死节点快速失败，尽快进入并行备用竞速
      timeout: isSlowMirror ? 4 : 6,
      credentials: "omit"
    }).then(parseBody).catch(function(){ return null; });
  }

  var chain = Promise.resolve(null);
  var mirrors = (LX_API.mirrors && LX_API.mirrors.length) ? LX_API.mirrors : [
    { base: LX_API.base, key: LX_API.key }
  ];

  // 1) 优先可用的 88.lxmusic 签名 v4
  mirrors.forEach(function(m){
    if (!m.signed && String(m.base || "").indexOf("88.lxmusic") === -1) return;
    quals.forEach(function(q){
      chain = chain.then(function(got){
        if (got) return got;
        var path = "/lxmusicv4/url/" + encodeURIComponent(source) + "/" + encodeURIComponent(songId) + "/" + encodeURIComponent(q);
        var sign = _lxSign(path);
        return tryOne(String(m.base).replace(/\/$/, "") + path + "?sign=" + sign, m.key || LX_API.key);
      });
    });
  });

  // 2) 各镜像 v3 兜底
  mirrors.forEach(function(m){
    quals.forEach(function(q){
      chain = chain.then(function(got){
        if (got) return got;
        var path = "/lxmusicv3/url/" + encodeURIComponent(source) + "/" + encodeURIComponent(songId) + "/" + encodeURIComponent(q);
        return tryOne(String(m.base).replace(/\/$/, "") + path, m.key || LX_API.key);
      });
    });
  });

  // 3) 无签名 /url/ 路径（含 onrender 备用）
  mirrors.forEach(function(m){
    if (m.signed) return;
    quals.forEach(function(q){
      chain = chain.then(function(got){
        if (got) return got;
        var path = "/url/" + encodeURIComponent(source) + "/" + encodeURIComponent(songId) + "/" + encodeURIComponent(q);
        return tryOne(String(m.base).replace(/\/$/, "") + path, m.key);
      });
    });
  });

  // 洛雪公共节点(88.lxmusic) 当前常 404，VIP 再走同生态可用节点自动切换
  function pickUrl(txt){
    if (!txt) return null;
    if (typeof txt === "string"){
      var s = txt.trim();
      if (/^https?:\/\//i.test(s) && s.indexOf("<") === -1) return s.replace(/^http:/, "https:");
      try { txt = JSON.parse(s); } catch(e){
        try { txt = (typeof jsonp_safeParse === "function") ? jsonp_safeParse(s) : null; } catch(e2){ return null; }
      }
    }
    if (!txt || typeof txt !== "object") return null;
    var u = txt.url || (txt.data && (typeof txt.data === "string" ? txt.data : (txt.data.url || (txt.data[0] && txt.data[0].url)))) ||
      (txt.code === 200 && txt.data) || "";
    if (typeof u === "string" && /^https?:\/\//i.test(u)) return u.replace(/^http:/, "https:");
    return parseBody(txt);
  }
  function tryGet(url, hdr, timeout){
    return ADAPTER_request(url, {
      headers: hdr || { "User-Agent": "Mozilla/5.0", "Accept": "application/json" },
      timeout: timeout || 10,
      credentials: "omit"
    }).then(pickUrl).catch(function(){ return null; });
  }

  // 并行竞速：谁先返回可用直链用谁，避免串行等死导致「第一首失败、第二首秒开」
  function raceFirst(fns){
    return new Promise(function(resolve){
      if (!fns || !fns.length){ resolve(null); return; }
      var left = fns.length, done = false;
      fns.forEach(function(fn){
        Promise.resolve().then(fn).then(function(u){
          if (done) return;
          if (u){ done = true; resolve(u); return; }
          left--;
          if (left <= 0) resolve(null);
        }).catch(function(){
          if (done) return;
          left--;
          if (left <= 0) resolve(null);
        });
      });
    });
  }

  if (source === "tx"){
    chain = chain.then(function(got){
      if (got) return got;
      var q = (quals && quals[0]) || "128k";
      // 念心音源 quality: 128k->standard, 320k->exhigh, flac->lossless
      var levelMap = { "128k": "standard", "320k": "exhigh", "flac": "lossless", "flac24bit": "lossless" };
      var level = levelMap[q] || "standard";
      var nxUrl = "https://mcp.nianxinxz.com/share/ceshi/tx.php?id=" + encodeURIComponent(songId) + "&level=" + encodeURIComponent(level) + "&type=mp3";
      // 念心返回直链音频，直接作为播放地址；失败时再试标准档
      return raceFirst([
        function(){ return Promise.resolve(nxUrl); },
        function(){
          if (level === "standard") return null;
          return Promise.resolve("https://mcp.nianxinxz.com/share/ceshi/tx.php?id=" + encodeURIComponent(songId) + "&level=standard&type=mp3");
        },
        function(){
          if (level === "exhigh" || level === "standard") return null;
          return Promise.resolve("https://mcp.nianxinxz.com/share/ceshi/tx.php?id=" + encodeURIComponent(songId) + "&level=exhigh&type=mp3");
        }
      ]);
    });
  }

  if (source === "kw"){
    chain = chain.then(function(got){
      if (got) return got;
      var q = (quals && quals[0]) || "128k";
      // 酷我手机接口 QUALITY_MAP
      var brMap = { "128k": "128kmp3", "320k": "320kmp3", "flac": "2000kflac", "flac24bit": "4000kflac" };
      var br = brMap[q] || "320kmp3";
      var rid = String(songId).replace(/^MUSIC_/i, "").replace(/^kw_/i, "");
      function kwMobile(brVal){
        var url = "http://nmobi.kuwo.cn/mobi.s?f=web&user=0&source=kwplayerhd_ar_4.3.0.8_tianbao_T1A_qirui.apk&type=convert_url_with_sign&rid=" + encodeURIComponent(rid) + "&br=" + encodeURIComponent(brVal);
        return ADAPTER_request(url, {
          method: "GET",
          headers: { "User-Agent": "Mozilla/5.0 (Linux; Android) AppleWebKit/537.36", "Accept": "application/json" },
          timeout: 12,
          credentials: "omit"
        }).then(function(txt){
          try {
            var data = typeof txt === "string" ? JSON.parse(txt) : txt;
            if (data && data.code === 200 && data.data && data.data.url && String(data.data.url).indexOf("http") === 0){
              return String(data.data.url).replace(/^http:/, "https:");
            }
          } catch(e) {}
          return pickUrl(txt);
        }).catch(function(){ return null; });
      }
      return raceFirst([
        function(){ return kwMobile(br); },
        function(){ return br !== "320kmp3" ? kwMobile("320kmp3") : null; },
        function(){ return br !== "128kmp3" ? kwMobile("128kmp3") : null; }
      ]);
    });
  }

  return chain;
};

API.lxUrlMulti = function(song){
  if (!song) return Promise.resolve(null);

  return API.lxUrl(song).then(function(url){
    if (url) return url;

    var name = (song.name || "").trim();
    var singer = ((song.singer || "").split(/[\/、,&]/)[0] || "").trim();
    if (!name) return null;
    var kw = (name + " " + singer).trim();
    var primary = API.lxSourceOf(song);

    function scorePick(list, mapItem){
      var best = null, bestScore = -1;
      (list || []).forEach(function(it){
        var n = mapItem ? mapItem(it) : it;
        if (!n || !n.name) return;
        var score = 0;
        if (n.name === name) score += 5;
        else if (name && n.name.indexOf(name) >= 0) score += 3;
        if (singer && n.singer && n.singer.indexOf(singer) >= 0) score += 3;
        if (score > bestScore){ bestScore = score; best = n; }
      });
      if (!best || bestScore < 2){
        if (best && bestScore >= 1) return best;
        return null;
      }
      return best;
    }

    function trySearchThenLx(searchFn, srcTag){
      if (srcTag === primary) return Promise.resolve(null);
      return searchFn(kw, 1).then(function(res){
        var list = (res && res.list) || [];
        if (!list.length) return null;
        var best = scorePick(list, null);
        if (!best) return null;
        best.source = srcTag === "tx" ? "qq" : (srcTag === "kw" ? "kuwo" : (srcTag === "wy" ? "netease" : (srcTag === "kg" ? "kugou" : srcTag)));
        return API.cqOrLxUrl(best);
      }).catch(function(){ return null; });
    }

    function tryQQSearchThenLx(){
      if (primary === "tx") return Promise.resolve(null);
      return API._searchByType(kw, 0, 1, 6).then(function(songRes){
        var list = (((songRes || {}).data || {}).song || {}).list || [];
        if (!list.length) return null;
        var best = scorePick(list, normalizeSongFromSearch);
        if (!best || !best.songmid) return null;
        best.source = "qq";
        return API.cqOrLxUrl(best);
      }).catch(function(){ return null; });
    }

    function firstUrl(promises){
      return new Promise(function(resolve){
        if (!promises || !promises.length){ resolve(null); return; }
        var left = promises.length;
        var settled = false;
        promises.forEach(function(p){
          Promise.resolve(p).then(function(v){
            if (settled) return;
            if (v){ settled = true; resolve(v); return; }
            left--;
            if (left <= 0) resolve(null);
          }).catch(function(){
            if (settled) return;
            left--;
            if (left <= 0) resolve(null);
          });
        });
      });
    }

    return firstUrl([
      trySearchThenLx(API.kuwoSearch, "kw"),
      trySearchThenLx(API.neteaseSearch, "wy"),
      trySearchThenLx(API.kugouSearch, "kg"),
      tryQQSearchThenLx()
    ]);
  });
};

function mapMvSearchItem(m){
  if (!m) return null;

  var vid = m.v_id || m.vid || m.mv_id || m.id || (m.doc && (m.doc.vid || m.doc.v_id)) || "";
  if (vid && typeof vid === "object") vid = vid.vid || vid.v_id || "";
  vid = String(vid || "").trim();
  if (!vid || vid === "0" || vid === "undefined" || vid === "null") return null;
  var singers = m.singer_list || m.singers || m.singer || [];
  var singerName = m.singer_name || m.singerName || "";
  if (!singerName && Array.isArray(singers)){
    singerName = singers.map(function(s){
      if (typeof s === "string") return s;
      return (s && (s.name || s.singer_name || s.title)) || "";
    }).filter(Boolean).join("/");
  } else if (!singerName && typeof singers === "string"){
    singerName = singers;
  }
  var cover = m.mv_pic_url || m.pic || m.picurl || m.cover_pic || m.cover || m.pic_url ||
    (m.doc && (m.doc.pic || m.doc.mv_pic_url)) || "";
  return {
    vid: vid,
    title: m.mv_name || m.title || m.name || (m.doc && m.doc.title) || "",
    singer: singerName,
    cover: fixCover(cover),
    duration: Number(m.duration || m.play_duration || m.interval || 0) || 0,
    playCount: Number(m.play_count || m.playcnt || m.listen_num || 0) || 0
  };
}
function pickMvStreamUrl(info){
  if (!info) return null;
  function normUrl(u, vkey){
    if (!u) return "";
    u = String(u).trim();
    if (!u) return "";
    if (u.indexOf("//") === 0) u = "https:" + u;
    u = u.replace(/^http:/i, "https:");

    if (vkey && u.indexOf("vkey=") < 0 && u.indexOf("vkey%3D") < 0){
      u += (u.indexOf("?") >= 0 ? "&" : "?") + "vkey=" + encodeURIComponent(vkey);
    }
    return u;
  }
  function pushUrl(out, u, size, filetype){
    u = normUrl(u, "");
    if (!u || !/^https?:\/\//i.test(u)) return;

    if (/\/0$|\.ts$/i.test(u) && u.indexOf("m3u8") < 0) return;
    out.push({ u: u, size: Number(size) || 0, ft: Number(filetype) || 0 });
  }
  function collect(arr, out){
    (arr || []).forEach(function(x){

function pickMvStreamUrls(info, limit){

  var seen = {};

    if (!u || seen[u]) return;

  }

function switchView(name, params, push){
  params = params || {};
  var prev = state.view;

  if (prev && prev !== name) saveViewScroll(prev);
  state.view = name;
  state.viewParams = params;

  // 回主页（或离开搜索去主 tab）时清空搜索框
  if (name === "home"){
    clearSearchInput();
  }

  VIEWS.forEach(function(v){
    var node = $("#view-"+v);
    if (node) node.classList.toggle("active", v === name);
  });
  $all(".nav-item").forEach(function(n){
    n.classList.toggle("active", n.dataset.view === name);
  });

  if (push !== false && (name === "detail" || name === "singerDetail")){
    _viewScrollPos[name] = 0;
  }

  if (push !== false){
    var url = hashFor(name, params);

    var keepOv = null;
    try {
      var ovNow = isOverlayOpen();
      if (ovNow === "player" || ovNow === "lyrics") keepOv = ovNow;
      else if (history.state && (history.state.overlay === "player" || history.state.overlay === "lyrics")) {
        var fp0 = $("#fullPlayer");
        if (fp0 && fp0.classList.contains("show")) keepOv = history.state.overlay;
      }
    } catch(eOv) {}
    var st = currentHistoryState({view:name, params:params, overlay: keepOv});
    try {
      if (name === "home"){

        history.replaceState(st, "", url);
      } else if (MAIN_TABS.indexOf(name) > -1){
        if (prev === "home") history.pushState(st, "", url);
        else history.replaceState(st, "", url);
      } else {
        history.pushState(st, "", url);
      }
    } catch(e) {}
  }

  setSubviewChrome(name !== "home" || !!isOverlayOpen());
  try {
    var wasDetail = document.documentElement.classList.contains("detail-mode");
    document.documentElement.classList.toggle("detail-mode", name === "detail");
    if (name !== "detail" && wasDetail){
      try { clearDetailCoverAmbient(); } catch(eClr) {}
      try { detailWallClear(); } catch(eW) {}
    }
  } catch(eDm) {}
  renderView(name, params);
  restoreViewScroll(name);
  syncAppUnderlay();
}

function tryCloseOverlay(fromPopstate){
  var kind = isOverlayOpen();
  if (!kind) return false;

  var hadHistory = false;
  try {
    hadHistory = !!(history.state && history.state.overlay === kind) ||
      (kind === "player" && _fpHistoryPushed) ||
      (kind === "lyrics" && _lyricsFocusPushed) ||
      (kind === "player" && history.state && history.state.overlay === "lyrics");
  } catch(eH) {
    hadHistory = (kind === "player" && _fpHistoryPushed) || (kind === "lyrics" && _lyricsFocusPushed);
  }

  if (kind === "login") closeLoginView(true);
  else if (kind === "mv") closeMv(true);
  else if (kind === "lyrics"){
    exitLyricsFocus(true);
  }
  else if (kind === "player"){
    _fpHistoryPushed = false;
    _lyricsFocusPushed = false;
    _fpClosing = false;
    closeFullPlayer(true);
  }

  setSubviewChrome(state.view !== "home");
  syncAppUnderlay();

  if (!fromPopstate){
    if (hadHistory){
      _overlayNavLock = true;
      _ignorePop = 1;
      try { history.back(); } catch(e) {}
      setTimeout(function(){
        _overlayNavLock = false;
        if (_ignorePop > 0) _ignorePop = 0;

        try {
          var fp = $("#fullPlayer");
          var stillOpen = fp && fp.classList.contains("show") && !_fpClosing;
          if (!stillOpen && history.state && (history.state.overlay === "player" || history.state.overlay === "lyrics")){
            history.replaceState(currentHistoryState({ overlay: null }), "", location.href);
            _fpHistoryPushed = false;
            _lyricsFocusPushed = false;
          }
        } catch(e3) {}
      }, 360);
    } else {

      try {
        history.replaceState(currentHistoryState({ overlay: null }), "", location.href);
      } catch(e2) {}
      _fpHistoryPushed = false;
      _lyricsFocusPushed = false;
    }
  }
  return true;
}

function forceGoHome(){

  try { tryCloseOverlay(true); } catch(e) {}
  try { tryCloseOverlay(true); } catch(e) {}

  state.view = "home";
  state.viewParams = {};
  VIEWS.forEach(function(v){
    var node = $("#view-" + v);

}

function handleBack(){
  var qs = $("#queueSheet");
  if (qs && qs.classList.contains("show")){
    closeQueueSheet();
    return true;
  }

  if (isOverlayOpen()){
    tryCloseOverlay(false);
    return true;
  }

  try {
    var fpB = $("#fullPlayer");
    if (fpB && fpB.classList.contains("show")){
      closeFullPlayer(false);
      return true;
    }
  } catch(eB) {}

  if (state.view !== "home"){

    var canPop = false;
    try {
      canPop = history.length > 1 && !!(history.state && history.state.qqm);
    } catch(e) {}

    if (canPop) {
      try {
        history.back();
        return true;
      } catch(e) {
        canPop = false;
      }
    }

    forceGoHome();
    return true;
  }

  return false;
}

window.addEventListener("popstate", function(e){
  if (_overlayExpected || _ignorePop > 0){
    if (_ignorePop > 0) _ignorePop--;
    _overlayNavLock = false;
    _overlayExpected = null;
    try {
      var sIgn = e.state;
      var openIgn = isOverlayOpen();
      if (openIgn && !(sIgn && sIgn.overlay)){
        if (openIgn === "player" || openIgn === "lyrics"){
          _fpHistoryPushed = false;
          _lyricsFocusPushed = false;
          _fpClosing = false;
          closeOverlayUI(openIgn === "lyrics" ? "player" : openIgn);
        }
      }
    } catch(eIgn) {}
    setSubviewChrome(state.view !== "home" || !!isOverlayOpen());
    syncAppUnderlay();
    return;
  }

  var s = e.state || { view: "home", params: {}, qqm: 1 };
  var open = isOverlayOpen();

  if (open && !(s && s.overlay === open)){

    if (open === "lyrics" && s && s.overlay === "player"){
      exitLyricsFocus(true);
      _fpHistoryPushed = true;
      setSubviewChrome(true);
      syncAppUnderlay();
      return;
    }
    if (open === "player") _fpHistoryPushed = false;
    if (open === "lyrics") _lyricsFocusPushed = false;
    _fpClosing = false;
    if (open === "lyrics") closeOverlayUI("player");
    else closeOverlayUI(open);

    try {
      var fpChk = $("#fullPlayer");
      if (fpChk && fpChk.classList.contains("show") && !(s && (s.overlay === "player" || s.overlay === "lyrics"))){
        _fpClosing = false;
        closeFullPlayer(true);
      }
    } catch(eChk) {}
    var targetView = (s && s.view && VIEWS.indexOf(s.view) > -1) ? s.view : state.view;
    if (targetView === state.view && !(s && s.overlay)){
      setSubviewChrome(state.view !== "home");
      syncAppUnderlay();
      return;
    }
  }

  if (s && s.overlay){
    if (s.overlay === "player"){
      _fpHistoryPushed = true;
      showFullPlayerUI();
      exitLyricsFocus(true);
    } else if (s.overlay === "lyrics"){
      _fpHistoryPushed = true;
      _lyricsFocusPushed = true;
      showFullPlayerUI();
      enterLyricsFocus(true);
    } else if (s.overlay === "login"){
      var login = $("#loginView");
      if (login) login.classList.remove("hidden");
    }
    setSubviewChrome(true);
    syncAppUnderlay();
    return;
  }

  try {
    var fpLeft = $("#fullPlayer");
    if (fpLeft && fpLeft.classList.contains("show")){
      _fpHistoryPushed = false;
      _lyricsFocusPushed = false;
      closeFullPlayer(true);
    }
  } catch(eFp) {}

  var view = (s && s.view && VIEWS.indexOf(s.view) > -1) ? s.view : "home";
  var params = (s && s.params) || {};
  if (view !== state.view || JSON.stringify(params) !== JSON.stringify(state.viewParams||{})){
    switchView(view, params, false);
  } else {
    setSubviewChrome(view !== "home");
    syncAppUnderlay();
  }
});

function setImgSrc(el, src, fallbackSrc){
  if (!el) return;
  var primary = src ? mediaUrl(fixCover(src)) : "";
  var fallback = fallbackSrc ? mediaUrl(fixCover(fallbackSrc)) : "";

  if (primary && el.dataset.curSrc === primary && !el.classList.contains("img-err")) return;
  el.onerror = function(){
    if (fallback && this.dataset.tried !== "1"){
      this.dataset.tried = "1";
      this.src = fallback;
      this.dataset.curSrc = fallback;
      return;
    }
    this.onerror = null;
    this.classList.add("img-err");

  };
  el.dataset.tried = "0";
  if (!primary){
    el.classList.add("img-err");
    return;
  }
  el.classList.remove("img-err");
  el.dataset.curSrc = primary;
  el.src = primary;
}

function getDailyPeriodInfo(){
  var now = new Date();
  var h = now.getHours();
  // 早上 QQ绿（5–10点）/ 10点后转蓝 / 16点起夕阳橙 / 晚上 紫 / 半夜 黑灰
  var period =
    (h >= 5 && h < 10) ? "morning" :
    (h >= 10 && h < 16) ? "noon" :
    (h >= 16 && h < 18) ? "afternoon" :
    (h >= 18 && h < 24) ? "evening" :
    "night"; // 0-4 半夜
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1);
  if (m.length < 2) m = "0" + m;
  var d = String(now.getDate());
  if (d.length < 2) d = "0" + d;
  var day = y + "-" + m + "-" + d;
  var labels = {
    morning:   { short: "早上", title: "晨间推荐", subRec: "清晨好时光<br>来点儿音乐提提神吧~", sub30: "KTV热歌频道<br>每次都不一样" },
    noon:      { short: "中午", title: "午间推荐", subRec: "午后小憩<br>换首好歌继续听~", sub30: "KTV热歌频道<br>每次都不一样" },
    afternoon: { short: "下午", title: "午后推荐", subRec: "夕阳渐近<br>放一首歌慢慢听~", sub30: "KTV热歌频道<br>每次都不一样" },
    evening:   { short: "晚上", title: "晚间推荐", subRec: "夜色正好<br>沉浸在音乐里吧~", sub30: "KTV热歌频道<br>每次都不一样" },
    night:     { short: "半夜", title: "深夜推荐", subRec: "夜深了<br>轻声陪你到天亮~", sub30: "KTV热歌频道<br>每次都不一样" }
  };
  var meta = labels[period] || labels.evening;
  return {
    key: day + "-" + period,

var _voiceCache = { free: null, trial: null, xm: null, all: null };

function mergeVoiceLists(free, trial, xm){
  var seen = {}, out = [];
  function push(list, defTrial){
    (list || []).forEach(function(x){
      if (!x || !x.id || seen[x.id]) return;
      seen[x.id] = 1;
      var item = Object.assign({}, x);
      if (item.trial == null) item.trial = !!defTrial;
      out.push(item);
    });
  }

  var xmFunny = [], xmOther = [];
  (xm || []).forEach(function(x){
    if (!x) return;
    if (x.badgeCls === "funny" || /相声|评书|段子|娱乐/.test(String(x.badge || x.category || ""))) xmFunny.push(x);
    else xmOther.push(x);
  });
  push(xmFunny, false);
  push(free, false);
  push(trial, true);
  push(xmOther, false);
  return out;
}

function ensureVoiceCache(){
  if (_voiceCache.all) return Promise.resolve(_voiceCache.all);
  var freeP = _voiceCache.free
    ? Promise.resolve(_voiceCache.free)
    : API.neteaseVoiceFree().then(function(list){ _voiceCache.free = list || []; return _voiceCache.free; })
        .catch(function(){ _voiceCache.free = []; return []; });
  var trialP = _voiceCache.trial
    ? Promise.resolve(_voiceCache.trial)
    : API.neteaseVoiceTrial().then(function(list){ _voiceCache.trial = list || []; return _voiceCache.trial; })
        .catch(function(){ _voiceCache.trial = []; return []; });
  var xmP = _voiceCache.xm
    ? Promise.resolve(_voiceCache.xm)
    : API.ximalayaVoiceFree().then(function(list){ _voiceCache.xm = list || []; return _voiceCache.xm; })
        .catch(function(){ _voiceCache.xm = []; return []; });
  return Promise.all([freeP, trialP, xmP]).then(function(parts){
    _voiceCache.all = mergeVoiceLists(parts[0], parts[1], parts[2]);
    return _voiceCache.all;
  });
}

function resumeVoicePlayback(songs, item, queueTag, albumTitle, albumCover){
  if (!songs || !songs.length) return;
  function findIdx(list){
    if (!item) return -1;
    for (var i = 0; i < list.length; i++){
      var s = list[i];
      if (!s) continue;
      if (item.resumeSongmid && s.songmid && String(s.songmid) === String(item.resumeSongmid)) return i;
      if (item.resumeTrackId && s.xmTrackId && String(s.xmTrackId) === String(item.resumeTrackId)) return i;
    }
    if (typeof item.resumeIndex === "number" && item.resumeIndex >= 0 && item.resumeIndex < list.length){
      return item.resumeIndex;
    }
    return -1;
  }
  var idx = findIdx(songs);
  function doPlay(list, i){
    if (i < 0) i = 0;
    var s = list[i];
    if (item && item.resumeTime > 3 && s){
      try {
        _resumeSeek = {
          key: String(s.songmid || s.xmTrackId || s.id || ""),
          time: Number(item.resumeTime) || 0,
          savedAt: Date.now()
        };
      } catch(eR) {}
    }
    try {
      state.queueTag = queueTag;
      playQueue(list, i, queueTag);

      var _dj = (item && item.dj) || (list[i] && list[i].singer) || "";
      if (_dj === "喜马拉雅" || _dj === "听书") _dj = (item && item.dj) || "";
      recordRecentVoiceBook(list[i], {
        albumTitle: albumTitle,
        title: albumTitle,
        cover: albumCover,
        time: item && item.resumeTime,
        dj: _dj
      });
    } catch(eP) {}
    if (item && (item.resumeSongmid || item.resumeTrackId) && findIdx(list) < 0){
      try { toast("已打开，未找到上次集数（可上拉加载更多）", 2200); } catch(eT) {}
    } else if (item && item.resumeName){
      try { toast("继续收听 · " + item.resumeName, 1600); } catch(eT2) {}
    }
  }
  if (idx >= 0){
    doPlay(songs, idx);
    return;
  }

  if (item && item.source === "ximalaya" && item.xmAlbumId){
    var aid = item.xmAlbumId;
    var pages = [3,4,5,6];
    Promise.all(pages.map(function(p){ return API.ximalayaAlbumTracks(aid, p, 50).catch(function(){ return { songs: [] }; }); }))
      .then(function(parts){
        var seen = {};
        songs.forEach(function(s){ if (s && s.xmTrackId) seen[s.xmTrackId] = 1; });
        parts.forEach(function(res){
          ((res && res.songs) || []).forEach(function(s){
            if (!s || !s.xmTrackId || seen[s.xmTrackId]) return;
            seen[s.xmTrackId] = 1;
            if (albumCover && !s.cover) s.cover = albumCover;
            songs.push(s);
          });
        });

        try {
          if (state.view === "detail" && state.viewParams && state.viewParams.queueTag === queueTag){
            state.viewParams.songs = songs;
            state.viewParams.voicePage = 6;
            var wrap = $("#detailSongs");
            if (wrap) renderSongList(wrap, songs, queueTag);
            try {
              var sub = document.querySelector("#view-detail .detail-sub");
              if (sub) sub.textContent = (sub.textContent || "").replace(/共\d+集/, "共" + songs.length + "集");
            } catch(eS) {}
          }
        } catch(eU) {}
        var i2 = findIdx(songs);
        doPlay(songs, i2 >= 0 ? i2 : 0);
      }).catch(function(){ doPlay(songs, 0); });
    return;
  }
  doPlay(songs, 0);
}

  var isNeCh = (ch.source === "netease") || !!ch.neCat || (_homePlSrc === "netease" && ch.neCat);

    if (!songs.length){

      return;
    }

          var t = songs[i]; songs[i] = songs[j]; songs[j] = t;

    var off = Math.floor(Math.random() * 6) * 12;
    API.neteaseHotPlaylists(neCat, 16, off).then(function(list){
      list = list || [];
      if (!list.length) return API.neteaseHotPlaylists("全部", 16, 0);
      return list;
    }).then(function(list){
      list = list || [];
      if (!list.length){ toast(ch.name + "暂无内容"); return; }

      for (var i = list.length - 1; i > 0; i--){

function bindHomePullRefresh(viewEl){
  if (!viewEl || viewEl._homePtrBound) return;
  viewEl._homePtrBound = true;
  var ptr = document.createElement("div");
  ptr.className = "home-ptr";
  ptr.innerHTML = '<div class="home-ptr-inner"><span class="home-ptr-spinner"></span><span class="home-ptr-text">下拉刷新</span></div>';

  ptr.style.position = "sticky";
  ptr.style.top = "0";
  ptr.style.marginBottom = "0";
  viewEl.insertBefore(ptr, viewEl.firstChild);

  var startY = 0, startX = 0, pulling = false, armed = false, loading = false;
  var dy = 0;
  var THRESHOLD = 64;
  var MAX = 96;
  var textEl = ptr.querySelector(".home-ptr-text");

  function setPull(px){
    dy = Math.max(0, Math.min(MAX, px));
    var show = dy > 6;
    ptr.classList.toggle("show", show);
    ptr.classList.toggle("ready", dy >= THRESHOLD);
    ptr.style.height = (show ? Math.max(28, dy * 0.55) : 0) + "px";
    if (textEl){
      textEl.textContent = loading ? "刷新中…" : (dy >= THRESHOLD ? "松开刷新" : "下拉刷新");
    }
  }
  function resetPtr(){
    pulling = false; armed = false; dy = 0;
    viewEl.classList.remove("ptr-pulling");
    if (!loading){
      ptr.classList.remove("show", "ready");
      ptr.style.height = "0px";
      if (textEl) textEl.textContent = "下拉刷新";
    }
  }
  function doRefresh(){
    if (loading) return;
    loading = true;
    ptr.classList.add("loading", "show");
    ptr.style.height = "40px";
    if (textEl) textEl.textContent = "刷新中…";
    viewEl.classList.remove("ptr-pulling");
    try {
      window.__qqmForceDaily = true;
      _dailyCache.key = "";
      _dailyCache.recSongs = [];
      _dailyCache.d30Songs = [];
      _dailyCache.loading = false;
    } catch(e0) {}
    var tasks = [];
    try { loadDailySections(true); } catch(e1) {}
    try { fillHomePlaylists(true); } catch(e2) {}
    try { fillHomeChannels(); } catch(e3) {}
    try { _voiceCache = { free: null, trial: null, xm: null, all: null }; fillHomeVoiceBooks(); } catch(eVb) {}
    try { if (typeof fillHomeToplist === "function") fillHomeToplist(); } catch(e4) {}
    try { if (typeof fillHomeThemeChannels === "function") fillHomeThemeChannels(); } catch(e5) {}
    try { if (typeof enhanceHomeChannelCovers === "function") enhanceHomeChannelCovers(); } catch(e5) {}

    setTimeout(function(){
      loading = false;
      ptr.classList.remove("loading", "ready", "show");
      ptr.style.height = "0px";
      if (textEl) textEl.textContent = "下拉刷新";
      try { toast("已刷新", 1200); } catch(eT) {}
    }, 900);
  }

  function onStart(e){
    if (loading) return;
    if (state.view && state.view !== "home") return;
    if (viewEl.scrollTop > 2) return;
    var tch = e.touches ? e.touches[0] : e;
    if (!tch) return;
    startY = tch.clientY; startX = tch.clientX;
    pulling = false; armed = true; dy = 0;
  }
  function onMove(e){
    if (!armed || loading) return;
    if (state.view && state.view !== "home") return;
    var tch = e.touches ? e.touches[0] : e;
    if (!tch) return;
    var ady = tch.clientY - startY;
    var adx = tch.clientX - startX;
    if (!pulling){
      if (viewEl.scrollTop > 2){ armed = false; return; }
      if (Math.abs(adx) > Math.abs(ady) && Math.abs(adx) > 10){ armed = false; return; }
      if (ady < 8) return;
      pulling = true;
      viewEl.classList.add("ptr-pulling");
    }
    if (!pulling) return;

    var damp = Math.pow(Math.min(ady, 180) / 180, 0.85) * MAX;
    setPull(damp);
    if (e.cancelable) e.preventDefault();
  }
  function onEnd(){
    if (!armed && !pulling) return;
    var should = pulling && dy >= THRESHOLD && !loading;
    if (should) doRefresh();
    else resetPtr();
    armed = false;
  }

  viewEl.addEventListener("touchstart", onStart, { passive: true });
  viewEl.addEventListener("touchmove", onMove, { passive: false });
  viewEl.addEventListener("touchend", onEnd, { passive: true });
  viewEl.addEventListener("touchcancel", onEnd, { passive: true });
}

var heroTimer=null, heroIdx=0, heroCount=0;
function goHero(i){
  if (!heroCount) return;
  heroIdx = (i + heroCount) % heroCount;
  var track = $("#heroTrack");
  if (track){
    track.style.transition = "transform .35s var(--ease)";
    track.style.transform = "translateX(-"+(heroIdx*100)+"%)";
  }
  $all(".hero-dot").forEach(function(d,j){ d.classList.toggle("active", j===heroIdx); });
}
function startHeroAuto(n){
  heroCount = n; heroIdx = 0;
  clearInterval(heroTimer);
  if (n <= 1) return;
  heroTimer = setInterval(function(){ goHero(heroIdx + 1); }, 5000);
}
function initHeroSwipe(n){
  var box = $("#heroBox");
  if (!box || !n) return;
  if (box._swipeBound) return;
  box._swipeBound = true;
  startHeroAuto(n);
  var startX=0, startY=0, dx=0, dragging=false, locked=false;
  function onStart(e){
    if (!heroCount) return;
    var t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; dx = 0; dragging = true; locked = false;
    clearInterval(heroTimer);
    var track = $("#heroTrack");
    if (track) track.style.transition = "none";
  }
  function onMove(e){
    if (!dragging) return;
    var t = e.touches ? e.touches[0] : e;
    var adx = t.clientX - startX, ady = t.clientY - startY;
    if (!locked){
      if (Math.abs(ady) > Math.abs(adx) && Math.abs(ady) > 8){ dragging = false; return; }
      if (Math.abs(adx) > 8) locked = true;
    }
    if (!locked) return;
    dx = adx;
    var track = $("#heroTrack");
    if (track){
      var pct = heroIdx * 100 - (dx / box.clientWidth * 100);
      track.style.transform = "translateX(-"+pct+"%)";
    }
    if (e.cancelable) e.preventDefault();
  }
  function onEnd(){
    if (!dragging && !locked){ startHeroAuto(heroCount); return; }
    dragging = false;
    if (Math.abs(dx) > box.clientWidth * 0.18) goHero(heroIdx + (dx < 0 ? 1 : -1));
    else goHero(heroIdx);
    startHeroAuto(heroCount);
  }
  box.addEventListener("touchstart", onStart, { passive: true });
  box.addEventListener("touchmove", onMove, { passive: false });
  box.addEventListener("touchend", onEnd, { passive: true });
  box.addEventListener("touchcancel", onEnd, { passive: true });

  box.addEventListener("click", function(e){
    var dot = e.target.closest(".hero-dot");
    if (!dot) return;
    var dots = $all(".hero-dot");
    var i = dots.indexOf(dot);
    if (i >= 0){ clearInterval(heroTimer); goHero(i); startHeroAuto(heroCount); }
  });
}

API.qqPlaylistCategories = function(){
  var url = "https://c.y.qq.com/splcloud/fcgi-bin/fcg_get_diss_tag_conf.fcg?format=json&inCharset=utf8&outCharset=utf-8&g_tk=5381&loginUin=0&hostUin=0&notice=0&platform=yqq.json&needNewCode=0";
  return ADAPTER_request(url, { headers: withCookie({ "Referer": "https://y.qq.com/" }) }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var groups = (d && d.data && d.data.categories) || [];
    var out = [];
    var seen = { "10000000": 1 };

    var prefer = ["流派", "主题", "语种", "心情", "场景"];
    var ordered = [];
    prefer.forEach(function(name){
      groups.forEach(function(g){
        if (g && g.categoryGroupName === name) ordered.push(g);
      });
    });
    groups.forEach(function(g){
      if (ordered.indexOf(g) < 0) ordered.push(g);
    });
    ordered.forEach(function(g){
      if (!g || g.categoryGroupName === "热门") return;
      (g.items || []).forEach(function(it){
        var id = it && it.categoryId;
        if (id == null || seen[String(id)]) return;

        if (it.usable === 0 && Number(id) !== 10000000) return;
        seen[String(id)] = 1;
        var name = String(it.categoryName || "").replace(/&amp;/g, "&").replace(/&#38;/g, "&").trim();
        if (!name) return;
        out.push({ id: id, name: name });
      });
    });
    return out;
  }).catch(function(){ return []; });
};

      }

      var t = (e.changedTouches && e.changedTouches[0]) || e;
      if (!t){ axis = null; return; }
      var dx = t.clientX - sx;
      var dy = t.clientY - sy;
      axis = null;

      if (Math.abs(dx) < 56) return;
      if (Math.abs(dx) < Math.abs(dy) * 1.2) return;
      if (plState.loading) return;
      var idx = currentPlTabIndex();

      if (dx < 0){
        if (idx >= tabs.length - 1){
          try { toast("已是最后一个分类", 900); } catch(eT) {}
          return;
        }
        locked = true;
        activatePlTab(idx + 1, { smooth: true });
      } else {
        if (idx <= 0){
          try { toast("已是第一个分类", 900); } catch(eT2) {}
          return;
        }
        locked = true;
        activatePlTab(idx - 1, { smooth: true });
      }
      setTimeout(function(){ locked = false; }, 320);
    }
    v._plSwipeStart = onStart;
    v._plSwipeMove = onMove;
    v._plSwipeEnd = onEnd;
    v.addEventListener("touchstart", onStart, { passive: true });
    v.addEventListener("touchmove", onMove, { passive: false });
    v.addEventListener("touchend", onEnd, { passive: true });
    v.addEventListener("touchcancel", onEnd, { passive: true });
    v._plSwipeBound = true;
  })();

  try {
    var actTab = $("#plTabs .sr-tab.active");
    if (actTab && actTab.scrollIntoView) actTab.scrollIntoView({ inline: "center", block: "nearest", behavior: "instant" });
  } catch(eSc) {}

  load(currentCat, false, false);

  if (!isNe){
    try {
      ensurePlTabs().then(function(){
        if (state.view !== "playlists") return;
        var next = buildTabsList();
        var idx = resolveInitIdx(next);

        for (var i = 0; i < next.length; i++){
          if (String(next[i].id) === String(currentCat)){ idx = i; break; }
        }
        paintTabs(next, idx);
      });
    } catch(eEt) {}
  }
}

function renderSingerDetail(params){
  var v = $("#view-singerDetail");
  var mid = params.mid || "";
  var name = params.name || "";
  var src = params.source || "qq";
  v.innerHTML = '<div class="skeleton" style="height:120px;border-radius:20px;margin-top:16px"></div>';

  function loadParts(){

    if (src === "qq" || (!params.source && mid && !/^(kg_|kw_|ne_|yt_)/i.test(mid))){
      return Promise.all([
        API.singerSongs(mid),
        API.singerAlbums(mid)
      ]).then(function(parts){
        return {
          songs: (parts[0] && parts[0].songs) || [],
          total: (parts[0] && parts[0].total) || 0,
          info: (parts[0] && parts[0].info) || {},
          albums: parts[1] || [],
          albumSongLoader: function(a){ return API.albumSongs(a.mid); }
        };
      });
    }

    var searchFn = src === "kuwo" ? API.kuwoSearch
      : src === "netease" ? API.neteaseSearch
      : src === "kugou" ? API.kugouSearch
      : src === "migu" ? API.miguSearch
      : src === "ytmusic" ? API.ytmusicSearch
      : null;
    var albumFn = src === "kuwo" ? API.kuwoSearchAlbums
      : src === "netease" ? API.neteaseSearchAlbums
      : src === "kugou" ? API.kugouSearchAlbums
      : src === "migu" ? API.miguSearchAlbums
      : null;
    var albumSongFn = src === "kuwo" ? API.kuwoAlbumSongs
      : src === "netease" ? API.neteaseAlbumSongs
      : src === "kugou" ? API.kugouAlbumSongs
      : src === "migu" ? API.miguAlbumSongs
      : null;

    var q = name || mid;
    return Promise.all([
      searchFn ? searchFn(q, 1) : Promise.resolve({ list: [] }),
      albumFn ? albumFn(q) : Promise.resolve([])
    ]).then(function(parts){
      var res = parts[0] || { list: [] };
      var albums = parts[1] || [];
      var songs = res.list || [];

      songs = songs.slice().sort(function(a,b){
        var sa = (a.singer && name && a.singer.indexOf(name) >= 0) ? 1 : 0;
        var sb = (b.singer && name && b.singer.indexOf(name) >= 0) ? 1 : 0;
        return sb - sa;
      });

      albums = (albums || []).filter(function(a){
        if (!name) return true;
        var sn = (a.singer || "").toLowerCase();
        var an = (a.name || "").toLowerCase();
        var nm = String(name).toLowerCase();
        if (sn && (sn.indexOf(nm) >= 0 || nm.indexOf(sn.split(/[\/、,&]/)[0]) >= 0)) return true;
        if (an && (an.indexOf(nm) >= 0 || nm.indexOf(an) >= 0)) return true;
        return false;
      });

      // 过滤过严时回退到搜索原始专辑列表（酷狗/咪咕常见）
      if (albums.length < 2 && (parts[1] || []).length){
        albums = parts[1];
      }
      var cover = (res.singers && res.singers[0] && res.singers[0].cover) || (songs[0] && songs[0].cover) || (albums[0] && albums[0].cover) || "";
      return {
        songs: songs,
        total: songs.length,
        info: { name: name, cover: cover },
        albums: albums,
                albumSongLoader: function(a){
          if (!albumSongFn) return Promise.resolve({ songs: [] });
          var aid = (a && (a.albumId || a.mid || a.id)) || "";
          aid = String(aid).replace(/^kg_al_/i, "");
          if (!/^\d+$/.test(aid)){
            var mm = String(aid).match(/(\d{5,})/);
            aid = mm ? mm[1] : aid;
          }
          function bySearch(){
            // 兜底：用专辑名+歌手再搜，按专辑名过滤
            if (src !== "kugou" || !searchFn) return Promise.resolve({ songs: [] });
            var q = ((a && a.name) ? (a.name + " " + (name || "")) : (name || "")).trim();
            if (!q) return Promise.resolve({ songs: [] });
            return searchFn(q, 1).then(function(res){
              var list = (res && res.list) || [];
              var an = ((a && a.name) || "").toLowerCase();
              if (an){
                var filtered = list.filter(function(s){
                  return (s.albumname || "").toLowerCase().indexOf(an) >= 0 || an.indexOf((s.albumname || "").toLowerCase()) >= 0;
                });
                if (filtered.length) list = filtered;
              }
              return { songs: list };
            }).catch(function(){ return { songs: [] }; });
          }
          if (!aid) return bySearch();
          return albumSongFn(aid, 1, 80).then(function(res){
            if (res && res.songs && res.songs.length) return res;
            return bySearch();
          }).catch(function(){ return bySearch(); });
        }      };
    });
  }

  loadParts().then(function(parts){
    parts = parts || {};
    var songRes = { songs: parts.songs || [], total: parts.total || 0, info: parts.info || {} };
    var albums = parts.albums || [];
    var songs = songRes.songs || [];
    var albumSongLoader = parts.albumSongLoader || function(a){ return API.albumSongs(a.mid); };
    var cover = (songRes.info && songRes.info.cover) || (src === "qq" ? coverUrl(mid, "singer") : "") || (songs[0] && songs[0].cover) || "";
    var displayName = name || (songRes.info && songRes.info.name) || "歌手";

    v.innerHTML =
      '<div class="sec-head" style="margin-top:8px"><button type="button" id="singerBackBtn" style="padding:6px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px">‹ 返回</button></div>'+
      '<div class="mine-header">'+
        '<div class="mine-avatar" style="border-radius:50%">'+safeImg(cover)+'</div>'+
        '<div><div class="mine-name">'+esc(displayName)+'</div>'+
        '<div class="mine-uin">'+(songRes.total || songs.length)+' 首热门 · '+albums.length+' 张专辑</div></div>'+
        '<button class="hero-play" id="playAllSinger" style="margin-left:auto"><svg><use href="#i-play"/></svg>播放全部</button>'+
      '</div>'+
      '<div class="sr-tabs" id="singerTabs" style="margin:12px 0;gap:10px">'+
        '<div class="sr-tab active" data-tab="hot">热门歌曲</div>'+
        '<div class="sr-tab" data-tab="album">专辑</div>'+
      '</div>'+
      '<div id="singerBody"></div>';

    var body = $("#singerBody");
    function showHot(){
      if (!songs.length){
        body.innerHTML = emptyHtml("暂无热门歌曲", "可切换到「专辑」浏览");
        return;
      }
      body.innerHTML = '<div class="song-list" id="singerSongs"></div>';
      renderSongList($("#singerSongs"), songs);
    }
    function showAlbums(){
      if (!albums.length){
        body.innerHTML = emptyHtml("暂无专辑", "");
        return;
      }

      body.innerHTML = albums.map(function(a, i){
        return '<div class="album-block" data-i="'+i+'">'+
          '<div class="song-row singer-album" data-i="'+i+'">'+
            '<div class="song-cover">'+safeImg(a.cover)+'</div>'+
            '<div class="song-meta">'+
              '<div class="song-title">'+esc(a.name)+'</div>'+
              '<div class="song-sub">'+(a.pubTime ? esc(String(a.pubTime).slice(0,10)) : "专辑")+(a.company && a.company !== "未确定" ? " · "+esc(a.company) : "")+'</div>'+
            '</div>'+
            '<span class="album-chevron" style="color:var(--text-2);font-size:16px;padding-right:8px;transition:transform .2s">›</span>'+
          '</div>'+
          '<div class="album-panel" data-i="'+i+'" style="display:none;padding:0 0 8px 12px;border-left:2px solid rgba(var(--accent-rgb),.35);margin:0 12px 6px 18px"></div>'+
        '</div>';
      }).join("");

      $all(".singer-album", body).forEach(function(row){
        row.onclick = function(){
          var i = Number(row.dataset.i);
          var a = albums[i];
          if (!a) return;
          var block = row.closest(".album-block") || row.parentNode;
          var panel = block.querySelector(".album-panel");
          var chev = row.querySelector(".album-chevron");
          if (!panel) return;

          if (panel.style.display === "block"){
            panel.style.display = "none";
            panel.innerHTML = "";
            row.style.background = "";
            if (chev) chev.style.transform = "";
            return;
          }

          $all(".album-panel", body).forEach(function(p){
            if (p !== panel){ p.style.display = "none"; p.innerHTML = ""; }
          });
          $all(".singer-album", body).forEach(function(x){ x.style.background = ""; });
          $all(".album-chevron", body).forEach(function(c){ c.style.transform = ""; });

          row.style.background = "rgba(var(--accent-rgb),.1)";
          if (chev) chev.style.transform = "rotate(90deg)";
          panel.style.display = "block";
          panel.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 4px 4px">'+
              '<span style="font-size:12px;color:var(--text-2)">加载中…</span>'+
              '<button type="button" class="play-album-btn sec-more" style="border:none;background:none;font-size:13px">播放专辑</button>'+
            '</div>'+
            '<div class="song-list album-song-list">'+skeletonRows(4)+'</div>';

          albumSongLoader(a).then(function(res){

            if (panel.style.display !== "block") return;
            var list = (res && res.songs) || [];
            var head = panel.querySelector("span");
            var wrap = panel.querySelector(".album-song-list");
            var pb = panel.querySelector(".play-album-btn");
            if (head) head.textContent = list.length ? (list.length + " 首") : "暂无歌曲";
            if (!wrap) return;
            if (!list.length){ wrap.innerHTML = emptyHtml("专辑暂无歌曲",""); return; }

            list.forEach(function(s){ if (!s.source) s.source = src; });
            renderSongList(wrap, list);
            if (pb) pb.onclick = function(e){ e.stopPropagation(); playQueue(list, 0); };
          });
        };
      });
    }

    showHot();
    $all("#singerTabs .sr-tab").forEach(function(t){
      t.onclick = function(){
        $all("#singerTabs .sr-tab").forEach(function(x){ x.classList.remove("active"); });
        t.classList.add("active");
        if (t.dataset.tab === "album") showAlbums();
        else showHot();
      };
    });
    var playAll = $("#playAllSinger");
    if (playAll) playAll.onclick = function(){ if (songs.length) playQueue(songs, 0); else toast("暂无可播放歌曲"); };
    var sb = $("#singerBackBtn");
    if (sb) sb.onclick = function(){ handleBack(); };
  }).catch(function(){
    v.innerHTML = emptyHtml("加载歌手失败", "请返回重试");
  });
}

function getGtk(){
  try {
    var ck = (state.user && state.user.cookie) || "";
    var map = typeof parseCookieStr === "function" ? parseCookieStr(ck) : {};
    var skey = map.p_skey || map.skey || map.qqmusic_key || map.qm_keyst || "";
    var hash = 5381;
    for (var i = 0; i < skey.length; i++){
      hash += (hash << 5) + skey.charCodeAt(i);
      hash = hash & hash;
    }
    return hash & 0x7fffffff;
  } catch(e) { return 5381; }
}

API.qqCloudFavSongs = function(begin, num){
  if (!state.user || !state.user.uin) return Promise.resolve({ songs: [], total: 0 });
  begin = Math.max(0, begin || 0);
  num = num || 200;
  var uin = String(state.user.uin).replace(/^o0*/, "");
  var gtk = getGtk();
  var authst = state.user.qqmusic_key || state.user.qm_keyst || "";
  var hdr = withCookie({
    "Content-Type": "application/json",
    "Referer": "https://y.qq.com/",
    "Origin": "https://y.qq.com"
  });

  function mapTrack(it){
    if (!it) return null;
    try {
      var track = it.songInfo || it.track || it.song || it;
      if (track && track.track) track = track.track;

      if (track.base) track = Object.assign({}, track, track.base);
      var n = null;
      try { n = normalizeSongFromPlaylist(track); } catch(e0) {}
      if (!n || !n.songmid){
        try { n = normalizeSongFromSearch(track); } catch(e1) {}
      }
      if (!n || !n.songmid){
        var mid = track.mid || track.songmid || track.song_mid || track.songMid || it.mid || it.songmid || "";
        if (!mid) return null;
        var singers = track.singer || track.singer_list || [];
        var singer = Array.isArray(singers)
          ? singers.map(function(a){ return (a && (a.name || a.title || a.singer_name)) || ""; }).filter(Boolean).join("/")
          : (track.singername || track.singer_name || track.singerName || "");
        var album = track.album || {};
        n = {
          songmid: String(mid),
          media_mid: (track.file && (track.file.media_mid || track.file.mediaMid)) || track.media_mid || track.strMediaMid || mid,
          name: track.name || track.title || track.songname || track.song_name || mid,
          singer: singer || "未知",
          albummid: album.mid || album.pmid || track.albummid || track.albumMid || "",
          albumname: album.name || track.albumname || track.album_name || "",
          interval: Number(track.interval || track.time || track.pay_time || 0) || 0,
          cover: "",
          isVip: !!(track.pay && (track.pay.pay_play || track.pay.pay_month)),
          source: "qq"
        };
      }
      n.source = "qq";
      if (!n.cover && n.albummid) n.cover = coverUrl(n.albummid);
      return n;
    } catch(e) { return null; }
  }
  function mapList(list){
    return (list || []).map(mapTrack).filter(function(s){ return s && s.songmid; });
  }
  function pickSongs(data){
    if (!data) return { songs: [], total: 0 };
    var list = data.songlist || data.songList || data.tracks || data.list ||
      data.song_list || data.v_songinfo || data.songInfoList || [];

    if (!list.length && data.detail){
      list = data.detail.songlist || data.detail.songList || [];
    }
    var total = data.total_song_num || data.totalNum || data.songNum || data.total ||
      data.songlist_size || data.song_num || list.length || 0;
    return { songs: mapList(list), total: Number(total) || list.length };
  }

  function viaCgiGetDiss(){
    var body = JSON.stringify({
      comm: {
        uin: Number(uin) || 0,
        format: "json",
        ct: 24,
        cv: 0,
        g_tk: gtk,
        authst: authst
      },
      req_0: {
        module: "music.srfDissInfo.DissInfo",
        method: "CgiGetDiss",
        param: {
          disstid: 0,
          dirid: 201,
          song_begin: begin,
          song_num: num,
          song_order: 0,
          userinfo: 1,
          tag: 1,
          orderlist: 1,
          onlysonglist: 0,
          enc_host_uin: ""
        }
      }
    });

    var body2 = JSON.stringify({
      comm: { uin: Number(uin) || 0, format: "json", ct: 24, cv: 0, g_tk: gtk, authst: authst },
      req_0: {
        module: "srf_diss_info.DissInfoServer",
        method: "CgiGetDiss",
        param: {
          disstid: 0,
          dir_id: 201,
          dirid: 201,
          song_begin: begin,
          song_num: num,
          num: num,
          page_no: 0,
          orderlist: 1,
          onlysonglist: 0,
          enc_host_uin: ""
        }
      }
    });
    function post(b){
      return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
        method: "POST", headers: hdr, body: b, credentials: "include", timeout: 20
      }).then(function(txt){
        var d = jsonp_safeParse(txt);
        var data = d && d.req_0 && d.req_0.data;
        var code = d && d.req_0 && d.req_0.code;
        if (code !== 0 && code !== undefined && code !== null && Number(code) !== 0) return null;
        var r = pickSongs(data);
        return r.songs.length ? r : null;
      }).catch(function(){ return null; });
    }
    return post(body).then(function(r){ return r || post(body2); });
  }

  function viaPlaylistDetailRead(){
    var body = JSON.stringify({
      comm: { uin: Number(uin) || 0, format: "json", ct: 24, cv: 0, g_tk: gtk, authst: authst },
      req_0: {
        module: "music.musicasset.PlaylistDetailRead",
        method: "GetPlaylistDetail",
        param: { dirId: 201, tid: 0, songBegin: begin, songNum: num, order: 0 }
      }
    });
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST", headers: hdr, body: body, credentials: "include", timeout: 20
    }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var data = d && d.req_0 && d.req_0.data;
      var r = pickSongs(data);
      return r.songs.length ? r : null;
    }).catch(function(){ return null; });
  }

  function viaMyLikeTid(){
    var createdUrl = "https://c.y.qq.com/rsc/fcgi-bin/fcg_user_created_diss?" +
      "hostUin=0&format=json&inCharset=utf8&outCharset=utf-8&notice=0&platform=yqq.json&needNewCode=0" +
      "&cid=205360838&g_tk=" + gtk + "&uin=" + encodeURIComponent(uin) + "&loginUin=" + encodeURIComponent(uin);
    return ADAPTER_request(createdUrl, {
      headers: withCookie({ "Referer": "https://y.qq.com/" }),
      credentials: "include",
      timeout: 15
    }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var list = (d && d.data && (d.data.disslist || d.data.list)) || [];
      var hit = null;
      for (var i = 0; i < list.length; i++){
        var p = list[i] || {};
        var dirId = Number(p.dirid || p.dirId || p.dir_id || 0);
        var name = p.dissname || p.title || p.name || "";
        if (dirId === 201 || /我喜欢/.test(name)){
          hit = p;
          break;
        }
      }
      if (!hit) return null;
      var tid = String(hit.dissid || hit.disstid || hit.tid || "").replace(/\D/g, "") || hit.dissid;
      if (!tid) return null;

      return API.playlistDetail(tid, 0, Math.min(num, 200)).then(function(res){
        var songs = (res && res.songs) || [];
        if (!songs.length) return null;
        return { songs: songs, total: (res.info && res.info.songCount) || songs.length };
      });
    }).catch(function(){ return null; });
  }

  function viaOldFav(){
    var url = "https://c.y.qq.com/splcloud/fcgi-bin/fcg_music_custom_get_fav_songlist.fcg?" +
      "g_tk=" + gtk + "&uin=" + encodeURIComponent(uin) + "&loginUin=" + encodeURIComponent(uin) +
      "&hostUin=0&format=json&inCharset=utf8&outCharset=utf-8&notice=0&platform=yqq.json&needNewCode=0" +
      "&cid=205361558&reqtype=1&dirid=201&from=1&song_begin=" + begin + "&song_num=" + num;
    return ADAPTER_request(url, {
      headers: withCookie({ "Referer": "https://y.qq.com/" }),
      credentials: "include",
      timeout: 15
    }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var data = (d && d.data) || d;
      var r = pickSongs(data);
      if (!r.songs.length && data && data.songlist) r = pickSongs({ songlist: data.songlist, total: data.total_song_num });
      return r.songs.length ? r : null;
    }).catch(function(){ return null; });
  }

  return viaCgiGetDiss().then(function(r){
    if (r && r.songs.length) return r;
    return viaPlaylistDetailRead();
  }).then(function(r){
    if (r && r.songs.length) return r;
    return viaMyLikeTid();
  }).then(function(r){
    if (r && r.songs.length) return r;
    return viaOldFav();
  }).then(function(r){
    return r || { songs: [], total: 0 };
  });
};

function syncQQCloudFavorites(){
  if (!state.user || !state.user.uin) return Promise.resolve(false);
  return API.qqCloudFavSongs(0, 300).then(function(res){
    var remote = (res && res.songs) || [];
    if (!remote.length){
      return false;
    }

    var localExtra = (state.favorites || []).filter(function(it){
      var src = (typeof it === "object" && it.source) ? it.source : "qq";
      var mid = favMidOf(it);
      if (!mid) return false;
      if (src && src !== "qq") return true;

      return false;
    }).map(function(it){ return typeof it === "object" ? it : { songmid: it, source: "qq" }; });

    var cloud = remote.map(function(s){
      return slimSong(s) || s;
    });

    var seen = {};
    var merged = [];
    cloud.forEach(function(s){
      if (!s || !s.songmid || seen[s.songmid]) return;
      seen[s.songmid] = 1;
      merged.push(s);
    });
    localExtra.forEach(function(s){
      var m = favMidOf(s);
      if (!m || seen[m]) return;
      seen[m] = 1;
      merged.push(s);
    });
    state.favorites = merged;
    storeSet("favorites", state.favorites);
    return true;
  }).catch(function(e){
    return false;
  });
}

API.qqCloudPlaylists = function(){
  if (!state.user || !state.user.uin) return Promise.resolve({ created: [], collected: [] });
  var uin = String(state.user.uin).replace(/^o0*/, "");
  var gtk = getGtk();
  var hdr = withCookie({
    "Referer": "https://y.qq.com/",
    "Origin": "https://y.qq.com"
  });

  function normPl(p, kind){
    if (!p) return null;
    var id = String(
      p.dissid || p.disstid || p.tid || p.content_id || p.id || p.dirId || ""
    ).replace(/\D/g, "") || String(p.dissid || p.disstid || p.tid || "");
    if (!id || id === "0") return null;
    var title = p.dissname || p.title || p.name || p.dirName || "未命名歌单";

    if (kind === "created" && (Number(p.dirId) === 201 || /我喜欢/.test(title))) {

    }
    var cover = p.logo || p.picurl || p.pic || p.cover || p.dir_pic_url2 || p.pic_url || "";
    return {
      dissid: id,
      title: title,
      cover: fixCover(cover),
      songCount: Number(p.songnum || p.song_cnt || p.songNum || p.num0 || p.diss_song_num || 0) || 0,
      creator: p.nickname || p.hostname || p.creator || (state.user.nickname || ""),
      kind: kind || "created"
    };
  }

  var createdUrl = "https://c.y.qq.com/rsc/fcgi-bin/fcg_user_created_diss?" +
    "hostUin=0&format=json&inCharset=utf8&outCharset=utf-8&notice=0&platform=yqq.json&needNewCode=0" +
    "&cid=205360838&g_tk=" + gtk + "&uin=" + encodeURIComponent(uin) + "&loginUin=" + encodeURIComponent(uin);

  var collectedUrl = "https://c.y.qq.com/fav/fcgi-bin/fcg_get_profile_order_asset.fcg?" +
    "loginUin=" + encodeURIComponent(uin) + "&hostUin=0&format=json&inCharset=utf8&outCharset=utf-8" +
    "&notice=0&platform=yqq.json&needNewCode=0&ct=20&cid=205360956&userid=" + encodeURIComponent(uin) +
    "&reqtype=3&sin=0&ein=49&g_tk=" + gtk;

  var bodyMu = JSON.stringify({
    comm: { uin: Number(uin) || 0, format: "json", ct: 24, cv: 0 },
    req_0: {
      module: "music.playlist.PlaylistSquare",
      method: "GetSelfCreatedPlaylist",
      param: { uin: uin, offset: 0, size: 50 }
    },
    req_1: {
      module: "music.playlist.PlaylistSquare",
      method: "GetSelfCollectedPlaylist",
      param: { uin: uin, offset: 0, size: 50 }
    }
  });

  var pCreated = ADAPTER_request(createdUrl, { headers: hdr, credentials: "include", timeout: 15 }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var list = (d && d.data && (d.data.disslist || d.data.list)) || (d && d.disslist) || [];
    return (list || []).map(function(p){ return normPl(p, "created"); }).filter(Boolean);
  }).catch(function(){ return []; });

  var pCollected = ADAPTER_request(collectedUrl, { headers: hdr, credentials: "include", timeout: 15 }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var list = (d && d.data && (d.data.cdlist || d.data.list || d.data.mymusic || d.data.disslist)) || [];
    if (!list.length && d && d.data && d.data.orderlist) list = d.data.orderlist;
    return (list || []).map(function(p){ return normPl(p, "collected"); }).filter(Boolean);
  }).catch(function(){ return []; });

  var pMu = ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
    method: "POST",
    headers: withCookie({ "Content-Type": "application/json", "Referer": "https://y.qq.com/" }),
    body: bodyMu,
    credentials: "include",
    timeout: 15
  }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var c0 = (d && d.req_0 && d.req_0.data && (d.req_0.data.v_playlist || d.req_0.data.list || d.req_0.data.disslist)) || [];
    var c1 = (d && d.req_1 && d.req_1.data && (d.req_1.data.v_playlist || d.req_1.data.list || d.req_1.data.disslist)) || [];
    return {
      created: (c0 || []).map(function(p){ return normPl(p, "created"); }).filter(Boolean),
      collected: (c1 || []).map(function(p){ return normPl(p, "collected"); }).filter(Boolean)
    };
  }).catch(function(){ return { created: [], collected: [] }; });

  return Promise.all([pCreated, pCollected, pMu]).then(function(parts){
    var created = parts[0] || [];
    var collected = parts[1] || [];
    if (!created.length && parts[2] && parts[2].created) created = parts[2].created;
    if (!collected.length && parts[2] && parts[2].collected) collected = parts[2].collected;

    function dedupe(arr){
      var seen = {};
      return (arr || []).filter(function(p){
        if (!p || !p.dissid || seen[p.dissid]) return false;
        seen[p.dissid] = 1;
        return true;
      });
    }
    return { created: dedupe(created), collected: dedupe(collected) };
  });
};

function isFavPlaylist(meta){
  if (!meta) return false;
  var src = String(meta.source || "qq");
  if (src !== "qq") return false;
  var id = String(meta.id || meta.dissid || "").replace(/\D/g, "");
  if (!id) return false;
  var cache = ensureQQCollectedCache();
  if (cache[id]) return true;
  // 兼容旧本地缓存
  var list = state.favPlaylists || [];
  for (var i = 0; i < list.length; i++){
    if (String(list[i].id || list[i].dissid || "").replace(/\D/g, "") === id && String(list[i].source || "qq") === "qq") return true;
  }
  return false;
}
function setQQCollectedLocal(id, on, meta){
  id = String(id || "").replace(/\D/g, "");
  if (!id) return;
  var cache = ensureQQCollectedCache();
  if (on) cache[id] = 1; else delete cache[id];
  if (!state.favPlaylists) state.favPlaylists = [];
  var idx = -1;
  for (var i = 0; i < state.favPlaylists.length; i++){
    if (String(state.favPlaylists[i].id || state.favPlaylists[i].dissid || "").replace(/\D/g, "") === id){
      idx = i; break;
    }
  }
  if (on){
    if (idx < 0){
      state.favPlaylists.unshift({
        id: id, dissid: id, source: "qq",
        title: (meta && meta.title) || "",
        cover: (meta && meta.cover) || "",
        creator: (meta && meta.creator) || ""
      });
    }
  } else if (idx > -1){
    state.favPlaylists.splice(idx, 1);
  }
  try { storeSet("favPlaylists", state.favPlaylists); } catch(e) {}
  try { storeSet("qqCollectedIds", cache); } catch(e) {}
}
function syncQQCollectedFromCloud(){

  }).catch(function(){ return false; });
}

API.qqCollectPlaylist = function(dissid, collect){
  if (!state.user || !state.user.uin) return Promise.reject(new Error("need_login"));
  var id = String(dissid || "").replace(/\D/g, "");
  if (!id) return Promise.reject(new Error("bad_id"));
  var uin = String(state.user.uin).replace(/^o0*/, "");
  var gtk = (typeof getGtk === "function") ? getGtk() : 5381;
  var hdr = withCookie({
    "Referer": "https://y.qq.com/n/yqq/playlist/" + id + ".html",
    "Origin": "https://y.qq.com"
  });
  var tidNum = Number(id) || 0;

  function okResult(d){
    if (!d || typeof d !== "object") return false;
    // 顶层成功
    if (d.code === 0 || d.retcode === 0) return true;
    // musicu 包一层
    if (d.req_0){
      if (d.req_0.code === 0) return true;
      if (d.req_0.data && (d.req_0.data.code === 0 || d.req_0.data.retcode === 0)) return true;
    }
    if (d.data && (d.data.code === 0 || d.data.retcode === 0)) return true;
    return false;
  }

  // 1) 经典 order_diss：cmd 1=收藏 2=取消
  function viaOrderDiss(){
    var url = "https://c.y.qq.com/folder/fcgi-bin/fcg_qm_order_diss.fcg?" +
      "loginUin=" + encodeURIComponent(uin) +
      "&hostUin=0&format=json&inCharset=utf8&outCharset=utf-8&notice=0" +
      "&platform=yqq.json&needNewCode=0&g_tk=" + gtk +
      "&uin=" + encodeURIComponent(uin) +
      "&dissid=" + encodeURIComponent(id) +
      "&cmd=" + (collect ? "1" : "2");
    return ADAPTER_request(url, { headers: hdr, credentials: "include", timeout: 12 }).then(function(txt){
      var d = jsonp_safeParse(txt);
      if (okResult(d)) return true;
      // 有些节点成功回 code=0 在字符串里
      if (typeof txt === "string" && /"code"\s*:\s*0/.test(txt) && !/"code"\s*:\s*[1-9]/.test(txt.replace(/"code"\s*:\s*0/, ""))) return true;
      return false;
    }).catch(function(){ return false; });
  }

  // 2) musicu FavAdd / FavDel
  function viaMusicu(){
    var body = JSON.stringify({
      comm: { uin: Number(uin) || 0, format: "json", ct: 24, cv: 0, g_tk: gtk },
      req_0: {
        module: "music.musicasset.PlaylistFavWrite",
        method: collect ? "FavAddPlaylist" : "FavDelPlaylist",
        param: { tidList: tidNum ? [tidNum] : [id] }
      }
    });
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST",
      headers: withCookie({ "Content-Type": "application/json", "Referer": "https://y.qq.com/" }),
      body: body,
      credentials: "include",
      timeout: 12
    }).then(function(txt){
      return okResult(jsonp_safeParse(txt));
    }).catch(function(){ return false; });
  }

  // 3) 另一组 method 名
  function viaMusicu2(){
    var body = JSON.stringify({
      comm: { uin: Number(uin) || 0, format: "json", ct: 24, cv: 0, g_tk: gtk },
      req_0: {
        module: "music.musicasset.PlaylistFavWrite",
        method: collect ? "AddPlaylist" : "DelPlaylist",
        param: { v_tid: tidNum ? [tidNum] : [id], uin: Number(uin) || 0 }
      }
    });
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST",
      headers: withCookie({ "Content-Type": "application/json", "Referer": "https://y.qq.com/" }),
      body: body,
      credentials: "include",
      timeout: 12
    }).then(function(txt){
      return okResult(jsonp_safeParse(txt));
    }).catch(function(){ return false; });
  }

  // 4) custom_order
  function viaCustomOrder(){
    var url = "https://c.y.qq.com/splcloud/fcgi-bin/fcg_music_custom_order.fcg?" +
      "g_tk=" + gtk + "&loginUin=" + encodeURIComponent(uin) + "&hostUin=0&format=json" +
      "&inCharset=utf8&outCharset=utf-8&notice=0&platform=yqq.json&needNewCode=0" +
      "&cmd=" + (collect ? "add" : "delete") +
      "&dissid=" + encodeURIComponent(id);
    return ADAPTER_request(url, { headers: hdr, credentials: "include", timeout: 12 }).then(function(txt){
      return okResult(jsonp_safeParse(txt));
    }).catch(function(){ return false; });
  }

  // 串行尝试，任一成功即返回
  return viaOrderDiss().then(function(ok){
    if (ok) return true;
    return viaMusicu();
  }).then(function(ok){
    if (ok) return true;
    return viaMusicu2();
  }).then(function(ok){
    if (ok) return true;
    return viaCustomOrder();
  }).then(function(ok){
    if (ok) return true;
    throw new Error("collect_failed");
  });
};

function updateDetailFavBtnUI(on){
  var btn = $("#detailFavBtn");
  if (!btn) return;
  btn.classList.toggle("on", !!on);
  var use = btn.querySelector("use");
  if (use) use.setAttribute("href", on ? "#i-heart-fill" : "#i-heart");
  var lab = btn.querySelector(".df-label");
  if (lab) lab.textContent = on ? "已收藏" : "收藏";
}

function toggleFavPlaylist(meta){
  if (!meta) return;
  var src = String(meta.source || "qq");
  if (src !== "qq") return;
  if (!state.user || !state.user.uin){
    toast("请先登录 QQ 账号");
    return;
  }
  var id = String(meta.id || meta.dissid || "").replace(/\D/g, "");
  if (!id){ toast("无法识别歌单"); return; }
  var btn = $("#detailFavBtn");
  if (btn && btn.classList.contains("busy")) return;
  var on = isFavPlaylist(meta);
  var next = !on;
  if (btn) btn.classList.add("busy");
  // 乐观更新 UI
  setQQCollectedLocal(id, next, meta);
  updateDetailFavBtnUI(next);
  API.qqCollectPlaylist(id, next).then(function(){
    if (btn) btn.classList.remove("busy");
    toast(next ? "已收藏到账号" : "已取消收藏");
    // 延迟刷新云端，避免立刻拉回旧状态；取消时以本地为准先稳住 UI
    setTimeout(function(){
      try {
        syncQQCollectedFromCloud().then(function(){
          // 以本地操作为准：云端若仍滞后，不覆盖刚取消的状态
          if (!next) setQQCollectedLocal(id, false, meta);
          if (next) setQQCollectedLocal(id, true, meta);
          updateDetailFavBtnUI(next);
        });
      } catch(e) {}
    }, next ? 600 : 1200);
  }).catch(function(err){
    setQQCollectedLocal(id, on, meta);
    updateDetailFavBtnUI(on);
    if (btn) btn.classList.remove("busy");
    if (err && String(err.message || err) === "need_login") toast("请先登录 QQ 账号");
    else toast(next ? "收藏失败" : "取消收藏失败");
  });
}
